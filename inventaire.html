<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon inventaire</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0; --line: #2c2c2e;
    --commun: #8d8d8d; --normal: #5ddd7a; --rare: #4a9fd8; --epique: #a855f7; --legendaire: #f2c230;
    /* Code couleur par stat — identique à codex.html/calculateur.html/stats.html, pour reconnaître
       une stat d'un coup d'œil sur tout le site. */
    --atk: #ff5e3a; --def: #3b82f6; --pv: #ca2972; --spd: #FFCC00; --luck: #00ffaa; --esquive: #22d3ee;
    --negatif: #ff6b6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 40px 20px; }
h1, h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
.page { max-width: 980px; margin: 0 auto; }

.entete { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 3px solid var(--yellow); margin-bottom: 26px; }
.entete img.avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--yellow); flex-shrink: 0; }
.entete-texte h1 { font-size: 26px; font-weight: 700; }
.entete-texte h1 span { color: var(--yellow); }
.entete-texte p { color: var(--paper-dim); font-size: 13.5px; margin-top: 4px; }


/* ===== ENCARTS DE RESSOURCES =====
   Toujours affiches, meme a zero : voir "0 ticket de reset" apprend qu'ils
   existent et ou les obtenir, alors qu'un bloc qui n'apparait que si on en a
   deja n'apprend rien a celles et ceux qui n'en ont jamais eu. */
.encarts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.encart {
    position: relative; background: var(--bg-panel); border: 1px solid var(--line);
    border-top: 3px solid var(--accent); border-radius: 6px; padding: 13px 15px 15px;
}
.encart-tete { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.encart-label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase; color: var(--paper-dim);
}
.encart-valeur {
    font-family: 'Oswald', sans-serif; font-size: 30px; font-weight: 700;
    color: var(--accent); line-height: 1;
}
/* A zero, le chiffre s'efface : on distingue d'un coup d'oeil ce qu'on possede
   de ce qu'on ne possede pas, sans avoir a lire. */
.encart.vide .encart-valeur { color: #4a4a4a; }
.encart-sous { font-size: 12px; color: var(--paper-dim); margin-top: 5px; min-height: 16px; }
.encart-sous a { color: var(--accent); text-decoration: none; font-weight: 600; }
.encart-sous a:hover { text-decoration: underline; }

.encart-info {
    margin-left: auto; width: 18px; height: 18px; flex: 0 0 auto; padding: 0;
    background: none; border: 1px solid var(--line); border-radius: 50%;
    color: var(--paper-dim); font-family: 'Oswald', sans-serif; font-size: 11px;
    line-height: 1; cursor: pointer;
}
.encart-info:hover, .encart-info[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.encart-info:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bulle {
    display: none; position: absolute; top: calc(100% - 4px); left: 0; right: 0; z-index: 30;
    background: #17171a; border: 1px solid var(--accent); border-radius: 6px;
    padding: 12px 14px; font-size: 12.5px; line-height: 1.5; color: var(--paper);
    box-shadow: 0 10px 26px rgba(0,0,0,.65); min-width: 230px;
}
/* Survol (bureau) ou clic/tap (mobile) : les deux ouvrent l'infobulle. */
.encart:hover .bulle, .encart.ouvert .bulle { display: block; }
.bulle p { margin: 0 0 8px; }
.bulle p:last-child { margin-bottom: 0; }
.bulle .cmd {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--accent);
    background: rgba(0,0,0,.4); padding: 1px 7px; border-radius: 3px; white-space: nowrap;
}

@media (max-width: 900px) { .encarts { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px) { .encarts { grid-template-columns: 1fr; } }

.titre-section {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--paper-dim); margin: 24px 0 10px;
}

.emplacements { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 10px; }
.emplacement { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; text-align: center; position: relative; }
.emplacement-niveau {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    font-size: 11px; font-weight: 900; color: var(--yellow);
    border: 1.5px solid var(--yellow); border-radius: 4px; padding: 1px 5px;
    background: rgba(242,194,48,0.12);
}
.emplacement .label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px; color: var(--paper-dim); text-transform: uppercase; margin-bottom: 8px; }
.emplacement .icone { font-size: 28px; margin-bottom: 6px; }
.icone-img { width: 44px; height: 44px; object-fit: contain; }
.emplacement .nom { font-size: 12.5px; font-weight: 600; }
.emplacement.vide .nom { color: var(--paper-dim); font-style: italic; }

.categorie { margin-bottom: 34px; }
.categorie-titre { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.categorie-titre h2 { font-size: 17px; font-weight: 600; }
.categorie-titre::after { content: ''; flex: 1; height: 1px; background: var(--line); }
/* Grille : même technique d'alignement inter-cartes que codex.html — chaque carte réserve
   TOUJOURS 6 pistes de ligne (portrait, en-tête, scaling, bonus, passif, commande) via CSS
   subgrid, alignant Scaling/Bonus/Passif au même niveau d'une carte à l'autre. */
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); grid-auto-rows: minmax(0, min-content); gap: 16px; align-items: start; }

.carte {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative;
    display: grid; grid-template-rows: subgrid; grid-row: span 6; row-gap: 0; cursor: pointer;
}
.carte:hover { filter: brightness(1.05); }
.carte.normal { border-color: rgba(93,221,122,0.35); }
.carte.rare { border-color: rgba(74,159,216,0.35); }
.carte.epique { border-color: rgba(168,85,247,0.4); }
.carte.legendaire { border-color: rgba(242,194,48,0.45); }
.carte.equipe { background: rgba(242,194,48,0.08); }
.carte.dans-loadout { outline: 2px solid var(--yellow); outline-offset: -1px; }

/* ============ PORTRAIT (haut de carte façon "carte à collectionner", repris de codex.html) ============ */
.carte-portrait {
    position: relative; height: 132px; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}
.carte.commun .carte-portrait { background: color-mix(in srgb, var(--commun) 55%, #101012); }
.carte.normal .carte-portrait { background: color-mix(in srgb, var(--normal) 45%, #101012); }
.carte.rare .carte-portrait { background: color-mix(in srgb, var(--rare) 48%, #101012); }
.carte.epique .carte-portrait { background: color-mix(in srgb, var(--epique) 50%, #101012); }
.carte.legendaire .carte-portrait { background: color-mix(in srgb, var(--legendaire) 55%, #101012); }
/* Effet "holo" façon Pokémon, réservé aux légendaires — identique à codex.html. */
.carte.legendaire::after {
    content: ''; position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.09) 47%, rgba(242,194,48,0.15) 50%, rgba(255,255,255,0.09) 53%, transparent 62%);
    background-size: 260% 260%;
    animation: carteHoloVague 7s ease-in-out infinite;
}
@keyframes carteHoloVague {
    0%, 100% { background-position: 15% 0%; }
    50% { background-position: 85% 100%; }
}

.carte-badge-rarete {
    position: absolute; top: 8px; left: 8px; z-index: 3; font-family: 'Barlow Condensed', sans-serif;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: #000; border-radius: 4px; padding: 2px 8px; border: 1px solid rgba(0,0,0,0.35);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}
.carte.commun .carte-badge-rarete { background: var(--commun); }
.carte.normal .carte-badge-rarete { background: var(--normal); }
.carte.rare .carte-badge-rarete { background: var(--rare); color: #fff; }
.carte.epique .carte-badge-rarete { background: var(--epique); color: #fff; }
.carte.legendaire .carte-badge-rarete { background: var(--legendaire); }

/* Niveau réellement possédé (doublons appliqués) — "+N" tant que la stat peut encore monter,
   "MAX ×N" une fois le plafond de rareté atteint (NIVEAU_MAX_PAR_RARETE) : les doublons au-delà
   ne font plus rien progresser, le badge le dit explicitement plutôt que de laisser croire que
   chaque nouvel exemplaire compte encore. Même famille visuelle que codex.html (etat-max = même
   traitement doré/mis en valeur que son badge Base/MAX). */
.carte-etat-niveau {
    position: absolute; top: 8px; right: 8px; z-index: 3; font-family: 'Barlow Condensed', sans-serif;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--paper-dim); background: rgba(0,0,0,0.4); border-radius: 4px; padding: 2px 8px;
}
.carte-etat-niveau.etat-max {
    color: #000; background: var(--yellow); font-weight: 800; font-size: 11px;
    box-shadow: 0 1px 6px rgba(242,194,48,0.55);
}

.carte-icone-zone { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.carte-icone-zone .carte-icon { max-width: 78%; max-height: 84%; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45)); }
.carte-icone-zone .carte-icon-emoji { font-size: 54px; line-height: 1; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45)); }

/* .carte-corps aplati (display:contents) : voir codex.html — évite un résidu de ~16px sur une
   piste de sous-grille pourtant vide dans Chromium quand il y a un niveau de subgrid imbriqué. */
.carte-corps { display: contents; }
.fila-header { grid-row: 2; grid-column: 1; min-height: 0; padding: 10px 14px 0; }
.fila-scaling { grid-row: 3; grid-column: 1; min-height: 0; padding-left: 14px; padding-right: 14px; }
.fila-bonus { grid-row: 4; grid-column: 1; min-height: 0; padding-left: 14px; padding-right: 14px; }
.fila-passif { grid-row: 5; grid-column: 1; min-height: 0; padding-left: 14px; padding-right: 14px; }
.fila-footer { grid-row: 6; grid-column: 1; min-height: 0; padding: 10px 14px 14px; }

/* En-tête : nom à gauche, case de sélection loadout à droite sur la même ligne (contrairement à
   codex.html, qui centre le nom — ici la case doit rester un contrôle facilement repérable). */
.carte-nom-ligne { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.carte-nom { font-size: 15px; font-weight: 600; }
/* Nom coloré dans la teinte PURE de la rareté (comme les section-titre) — cohérent avec codex.html. */
.carte.commun .carte-nom, .carte.commun .section-titre { color: var(--commun); }
.carte.normal .carte-nom, .carte.normal .section-titre { color: var(--normal); }
.carte.rare .carte-nom, .carte.rare .section-titre { color: var(--rare); }
.carte.epique .carte-nom, .carte.epique .section-titre { color: var(--epique); }
.carte.legendaire .carte-nom, .carte.legendaire .section-titre { color: var(--legendaire); }
.carte-contributeur { font-size: 10.5px; color: var(--paper-dim); font-style: italic; margin-top: 2px; }

.carte-select { cursor: pointer; z-index: 2; flex: 0 0 auto; }
.carte-select input { accent-color: var(--yellow); width: 18px; height: 18px; cursor: pointer; display: block; }

.stat-ligne { font-size: 13px; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stat-ligne .gauche { display: flex; align-items: baseline; gap: 6px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
.stat-ligne .label { color: var(--paper-dim); font-weight: 600; }
.stat-ligne .valeur-neutre { color: var(--paper); font-weight: 700; }
/* Bonus de stat coloré par la stat elle-même — cohérent avec codex.html. Un malus reste évident
   grâce au badge à bordure rouge, pas seulement à la teinte (lisible même en cas de daltonisme). */
.stat-valeur-badge { font-weight: 700; }
.stat-valeur-badge.malus {
    border: 1px solid var(--negatif); border-radius: 4px; padding: 0px 6px;
    background: rgba(255,107,107,0.1);
}
.bloc-passif { display: flex; flex-direction: column; gap: 4px; }
.passif-ligne { font-size: 12.5px; color: var(--paper-dim); line-height: 1.4; }
.passif-ligne b { color: var(--paper); font-weight: 600; }

/* :empty = piste réservée par la sous-grille mais sans contenu pour CET objet — voir codex.html
   pour l'explication du height:0 (résidu Chromium sur une piste de subgrid vide). */
.bloc-section { margin-top: 6px; padding-top: 6px; border-top: 1px solid #2a2a2a; }
.bloc-section:empty { margin-top: 0; padding-top: 0; border-top: none; height: 0; }
.section-titre {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    color: var(--yellow); opacity: 0.85; margin-bottom: 3px;
}
.scaling-grille { display: flex; flex-wrap: wrap; gap: 4px; }
.scaling-item { display: flex; flex-direction: column; align-items: center; min-width: 26px; }
.scaling-item .scaling-label { font-size: 9px; color: var(--paper-dim); margin-bottom: 2px; }
.scaling-item .scaling-lettre { font-size: 15px; font-weight: 800; }
.scaling-degats { font-size: 13px; color: var(--paper-dim); margin-top: 6px; }
.scaling-degats b { color: var(--paper); font-weight: 700; }

/* ============ CARTE À CHANGEMENT DE STANCE (reprend la technique de codex.html) ============ */
.carte-stance { position: relative; }
.stance-indicateur {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
    color: #000; background: var(--yellow); border-radius: 999px; padding: 4px 40px; z-index: 3;
}
.stance-vue-2 { display: none; }
.carte-stance:hover .stance-vue-1 { display: none; }
.carte-stance:hover .stance-vue-2 { display: block; }
.carte-icone-zone .stance-vue { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.carte-icone-zone .stance-vue-2 { display: none; }
.carte-stance:hover .carte-icone-zone .stance-vue-1 { display: none; }
.carte-stance:hover .carte-icone-zone .stance-vue-2 { display: flex; }
.carte-stance:hover { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow); }
.carte-stance:hover .stance-indicateur { background: var(--paper); }
.stance-etiquette {
    display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; color: #000; background: var(--rare);
    border-radius: 4px; padding: 1px 6px; vertical-align: middle; margin-left: 4px;
}
.stance-etiquette-2 { background: var(--legendaire); }

.carte-cmd { font-family: 'Barlow Condensed', sans-serif; font-size: 12.5px; color: var(--paper-dim); background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 3px; display: inline-block; }
.carte.equipe .carte-cmd { color: var(--yellow); }

.barre-loadout {
    position: sticky; bottom: 16px; margin-top: 30px;
    background: var(--bg-panel); border: 1px solid var(--yellow); border-radius: 8px;
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6); flex-wrap: wrap;
}
.barre-loadout .resume { font-size: 13px; color: var(--paper-dim); flex: 1; min-width: 200px; }
.barre-loadout .resume b { color: var(--paper); }
.bouton-loadout {
    background: var(--yellow); color: #000; border: none;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 10px 18px; border-radius: 5px; cursor: pointer; white-space: nowrap;
}
.bouton-loadout.copie { background: #7dffc4; }

.message-erreur {
    background: rgba(168,39,31,0.15); border: 1px solid var(--red); color: #ff9d9d;
    padding: 10px 16px; border-radius: 6px; font-size: 13px; margin-top: 10px;
    animation: apparitionErreur 0.2s ease-out;
}
@keyframes apparitionErreur { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.vide-message { text-align: center; padding: 80px 20px; color: var(--paper-dim); }

@media (max-width: 640px) {
    body { padding: 20px 12px; }
    .entete-texte h1 { font-size: 20px; }
    .entete img.avatar { width: 44px; height: 44px; }
    .entete-texte p { font-size: 12px; }
    .emplacements { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .emplacement { padding: 10px; }
    .grille { grid-template-columns: 1fr; }
    .categorie-titre h2 { font-size: 15px; }
}
</style>
</head>
<body>
<div class="page">
    <div class="entete">
        <img class="avatar" id="avatarViewer" src="" alt="" style="display:none;">
        <div class="entete-texte">
            <h1 id="titreInventaire">MON <span>INVENTAIRE</span></h1>
            <p>Sélectionnez plusieurs équipements à équiper afin d'avoir la commande à copier/coller directement dans le chat Twitch. Mis à jour toutes les 5-10 minutes.</p>
        </div>
    </div>
    <div id="encarts" class="encarts"></div>
    <div class="titre-section">Loadout actuel</div>
    <div id="emplacements" class="emplacements"></div>
    <div id="grille"></div>
</div>

<script>
    const LABELS_SLOT = { weapon: "Arme", offhand: "Off-hand", torso: "Armure", strategeme: "Stratagème" };
    const LABELS_CATEGORIE = {
        weapon_1h: "Armes à une main", weapon_2h: "Armes à deux mains",
        offhand: "Off-hand", torso: "Armure", strategeme: "Stratagème",
    };
    function categorieAffichage(item) {
        if (item.slot === "weapon") return item.hand === "two_handed" ? "weapon_2h" : "weapon_1h";
        return item.slot;
    }
    const LABELS_STAT = { atk: "ATK", def: "DEF", pv: "PDV", esquive: "Esquive", spd: "Vitesse", luck: "LUCK" };
    // Suffixe à ajouter après la valeur d'une stat — seule l'esquive est un pourcentage.
    const SUFFIXE_STAT = { esquive: "%" };
    const suffixeStat = (stat) => SUFFIXE_STAT[stat] || "";
    // Rareté en toutes lettres (même table que codex.html) — l'info existait déjà (couleur de la
    // carte), simplement rendue lisible explicitement plutôt que par un code couleur seul.
    const LABELS_RARETE = { commun: "Commun", normal: "Normal", rare: "Rare", epique: "Épique", legendaire: "Légendaire" };
    // Couleur associée à chaque stat pour les lignes de "Bonus" — mêmes teintes que codex.html.
    const COULEUR_STAT = { atk: "var(--atk)", def: "var(--def)", pv: "var(--pv)", spd: "var(--spd)", luck: "var(--luck)", esquive: "var(--esquive)" };

    // Affiche "base" si l'objet n'a pas encore de niveau (ou que cette stat ne grossit pas du
    // tout), ou "base → actuel" sinon — pour visualiser d'un coup d'œil le gain déjà obtenu
    // grâce aux doublons possédés. `formatteur` reçoit une valeur numérique brute et rend la
    // chaîne finale (signe, suffixe %, etc.), pour rester cohérent avec l'affichage existant.
    function formatEvolution(base, actuel, formatteur) {
        if (actuel === base) return formatteur(base);
        return `${formatteur(base)} → <b>${formatteur(actuel)}</b>`;
    }

    // ==========================================================
    // PLAFOND DE NIVEAU PAR RARETÉ (NIVEAU_MAX_PAR_RARETE, moteur-combat.cs) — même mirror JS que
    // codex.html. Le niveau BRUT stocké dans players.json n'est JAMAIS plafonné (le compteur de
    // doublons continue de monter indéfiniment), seul le calcul des stats doit être plafonné :
    // au-delà, un doublon supplémentaire ne fait plus rien progresser (voir AppliquerAmelioration
    // côté moteur). D'où niveauEffectif = min(niveau brut, plafond) utilisé pour TOUT calcul de
    // stat ci-dessous, tandis que le niveau brut reste affiché tel quel dans le badge "×N".
    // ⚠️ Garder synchronisé si la formule change côté moteur.
    const NIVEAU_MAX_PAR_RARETE = { commun: 25, normal: 20, rare: 15, epique: 10, legendaire: 5 };
    function niveauMaxPourRarete(rarete) {
        return NIVEAU_MAX_PAR_RARETE[rarete] !== undefined ? NIVEAU_MAX_PAR_RARETE[rarete] : NIVEAU_MAX_PAR_RARETE.commun;
    }
    // Badge "état du niveau" d'un objet possédé : "+N" tant qu'il reste de la marge avant le
    // plafond de sa rareté, "MAX ×N" une fois atteint — N = nombre total d'exemplaires possédés
    // (niveau + 1), pour que les doublons excédentaires restent visibles même s'ils ne font plus
    // progresser aucune stat. Rien du tout à niveau 0 (un premier exemplaire tout juste obtenu).
    function texteBadgeNiveau(niveauBrut, rarete) {
        const plafond = niveauMaxPourRarete(rarete);
        if (niveauBrut >= plafond) return { texte: `MAX ×${niveauBrut + 1}`, max: true };
        if (niveauBrut > 0) return { texte: `+${niveauBrut}`, max: false };
        return null;
    }

    const GABARITS_PASSIF = {
        Lifesteal: (v, s) => `Vol de vie : <b>${v}%</b> des dégâts infligés sont rendus en PV.`,
        PoisonDegats: (v, s) => `Poison : inflige <b>${v}</b> dégâts au tour suivant, puis <b>${Math.max(0, v - 1)}</b>, <b>${Math.max(0, v - 2)}</b>... jusqu'à 0 (s'additionne si réappliqué).`,
        EtourdissementChance: (v, s) => `<b>${v}%</b> de chance d'étourdir la cible (saute son tour suivant).`,
        ExecutionBonus: (v, s) => `Sous <b>${s.executionSeuil}%</b> de PV, inflige <b>+${v}%</b> de dégâts.`,
        Precision: (v, s) => `<b>+${v}</b> précision — réduit l'esquive adverse.`,
        Blocage: (v, s) => `<b>${v}%</b> de chance de bloquer, réduit alors les dégâts de <b>${s.blocageReduction}%</b>.`,
        Reflection: (v, s) => `Renvoie <b>${v}%</b> des dégâts subis à l'attaquant.`,
        ResistancePoison: (v, s) => `<b>${v}%</b> de résistance au poison.`,
        ResistanceFeu: (v, s) => `Réduit de <b>${v}%</b> les dégâts subis de type feu (Brûlure).`,
        Regeneration: (v, s) => `Régénère <b>${v}%</b> des PV max à chaque tour.`,
        ResistanceCrit: (v, s) => `<b>-${v}</b> points de chance d'être touché par un critique.`,
        ReductionDegatsTir: (v, s) => `Réduit de -<b>${v}%</b> les dégâts subis d'une arme de tir à une ou deux mains.`,
        SoinDirect: (v, s) => `Soigne <b>${v} PV</b>, <b>${s.usagesParCombat}</b> usages/combat (recharge ${s.cooldownTours} tours), si des PV manquent.`,
        Penetration: (v, s) => `Pénétration : Ignore <b>${v}%</b> de l'armure adverse.`,
        SaignementDegats: (v, s) => `Saignement : <b>${v}</b> dégâts/stack par tour (perd 1 stack/tour).`,
        BrulureDegats: (v, s) => `Brûlure : inflige <b>${v}</b> dégâts par tour pendant <b>${s.brulureDuree}</b> tours, ignore l'armure adverse.`,
        AntiHealPourcentage: (v, s) => `Réduit les soins reçus par la cible de <b>${v}%</b> pendant <b>${s.antiHealDuree}</b> tours.`,
        ShieldMontant: (v, s) => `Accorde un bouclier de <b>${v} PV</b> en début de combat.`,
        RageBonusMax: (v, s) => `Dégâts jusqu'à <b>+${v}%</b> quand tes PV descendent vers <b>${s.rageSeuilMin}%</b>.`,
        MarqueDegatsPourcentage: (v, s) => `Marque la cible touchée : <b>+${v}%</b> dégâts reçus pendant <b>${s.marqueDuree}</b> tours.`,
        ParadeChance: (v, s) => `<b>${v}%</b> de chance d'annuler un coup reçu et de riposter immédiatement.`,
        TenaciteChance: (v, s) => `<b>${v}%</b> de chance de résister à un étourdissement.`,
        DernierSouffleActif: () => `Une fois par combat, survit à <b>1 PV</b> au lieu de mourir.`,
        FrenesieBonusSpd: (v, s) => `Un critique accorde <b>+${v}</b> Vitesse pendant <b>${s.frenesieDuree}</b> tours.`,
    };
    const CHAMP_PAR_STAT_PRINCIPALE = {
        Lifesteal: "lifesteal", PoisonDegats: "poisonDegats", EtourdissementChance: "etourdissementChance",  Penetration: "penetration",
        ExecutionBonus: "executionBonus", Precision: "precision", Blocage: "blocage", Reflection: "reflection",
        ResistancePoison: "resistancePoison", ResistanceFeu: "resistanceFeu", Regeneration: "regeneration", ResistanceCrit: "resistanceCrit", ReductionDegatsTir: "reductionDegatsTir",
        SoinDirect: "soinDirect", SaignementDegats: "saignementDegats", BrulureDegats: "brulureDegats",
        AntiHealPourcentage: "antiHealPourcentage", ShieldMontant: "shieldMontant", RageBonusMax: "rageBonusMax",
        MarqueDegatsPourcentage: "marqueDegatsPourcentage", ParadeChance: "paradeChance", TenaciteChance: "tenaciteChance",
        DernierSouffleActif: "dernierSouffleActif", FrenesieBonusSpd: "frenesieBonusSpd",
    };

    const params = new URLSearchParams(window.location.search);
    const pseudo = params.get('user');

    // Rempli une fois players.json chargé (voir tout en bas) — reste vide tant que ce n'est pas le cas.
    let equipeParSlot = { weapon: 0, offhand: 0, torso: 0, strategeme: 0 };
    let possedesParam = [];
    let nbLootbox = 0;

    const iconeOuImage = (ref, classeImg) => ref.image
        ? `<img src="${ref.image}" alt="" class="${classeImg}">`
        : `<span class="${classeImg}-emoji">${ref.icone}</span>`;

    // Construit TOUS les passifs actifs sur l'objet (n'importe quel effet non-nul), pas
    // seulement celui pointé par StatPrincipale. Seul le champ qui correspond VRAIMENT à
    // StatPrincipale reçoit la mise à l'échelle par niveau — les autres s'affichent à leur
    // valeur fixe. C'est ce qui permet d'avoir un passif totalement indépendant du système
    // d'amélioration par doublon.
    // ⚠️ EXTENSION : cherche si "nomStat" est le champ ciblé par une entrée de passifsExtra (2e,
    // 3e passif...), symétrique à statPrincipale/incrementPassif mais répétable.
    function trouverIncrementPassifExtra(s, nomStat) {
        if (!s.passifsExtra) return 0;
        const entree = s.passifsExtra.find(p => p.champ === nomStat);
        return entree ? entree.incrementPassif : 0;
    }

    // `niveau` reçu ici doit déjà être le niveau EFFECTIF (plafonné) — voir texteBadgeNiveau /
    // niveauMaxPourRarete plus haut : les appelants passent Math.min(niveau brut, plafond).
    function construirePassifs(s, niveau, exclureChamp, exclusionsSupplementaires) {
        const passifs = [];
        const exclusions = new Set([exclureChamp, ...(exclusionsSupplementaires || [])]);
        for (const nomStat in CHAMP_PAR_STAT_PRINCIPALE) {
            if (exclusions.has(nomStat)) continue;
            const champ = CHAMP_PAR_STAT_PRINCIPALE[nomStat];
            const base = s[champ];
            const estActif = typeof base === 'boolean' ? base : base > 0;
            if (!estActif) continue;
            const incrementDepuisExtra = trouverIncrementPassifExtra(s, nomStat);
            const scaleAvecNiveau = s.statPrincipale === nomStat || incrementDepuisExtra > 0;
            const incrementEffectif = s.statPrincipale === nomStat ? s.incrementPassif : incrementDepuisExtra;
            const actuel = typeof base === 'boolean' ? base : (scaleAvecNiveau ? base + niveau * incrementEffectif : base);
            passifs.push(`<div class="passif-ligne">${GABARITS_PASSIF[nomStat](actuel, s)}</div>`);
        }
        return passifs;
    }

    // Dégradé cohérent du meilleur (S, or) au plus faible (E, gris) — chaud vers froid.
    const COULEUR_LETTRE_SCALING = { S: "#f2c230", A: "#e8934a", B: "#d65f5f", C: "#a878c9", D: "#6a9bc3", E: "#8d8d8d" };
    const STATS_SCALABLES = ["atk", "def", "pv", "spd", "crit"];
    const LABELS_SCALING = { atk: "ATK", def: "DEF", pv: "PV", spd: "SPD", crit: "CRIT" };

    // Rangée de badges de scaling (ATK/DEF/PV/SPD/CRIT) — seulement pour une arme qui en définit.
    // Un tiret long remplace la lettre pour toute stat sur laquelle l'arme ne scale pas.
    function blocScalingUnique(scaling1Stat, scaling1Lettre, scaling2Stat, scaling2Lettre, baseMin, baseMax, incrementBaseDegats, niveau) {
        const badges = STATS_SCALABLES.map(stat => {
            let lettre = null;
            if (scaling1Stat === stat) lettre = scaling1Lettre;
            else if (scaling2Stat === stat) lettre = scaling2Lettre;
            const couleur = lettre ? (COULEUR_LETTRE_SCALING[lettre] || "#8d8d8d") : "#555";
            return `<div class="scaling-item"><span class="scaling-label">${LABELS_SCALING[stat]}</span><span class="scaling-lettre" style="color:${couleur}">${lettre || "—"}</span></div>`;
        }).join("");

        const texteFourchette = (min, max) => `${Math.round(min)} - ${Math.round(max)}`;
        const actuelMin = baseMin + niveau * incrementBaseDegats;
        const actuelMax = baseMax + niveau * incrementBaseDegats;
        const texteDegats = (niveau > 0 && incrementBaseDegats !== 0)
            ? `${texteFourchette(baseMin, baseMax)} → <b>${texteFourchette(actuelMin, actuelMax)}</b>`
            : `<b>${texteFourchette(baseMin, baseMax)}</b>`;
        const ligneDegats = `<div class="scaling-degats">Dégâts : ${texteDegats}</div>`;

        return `<div class="scaling-grille">${badges}</div>${ligneDegats}`;
    }

    function construireScaling(s, niveau) {
        if (!s.scaling1Stat) return null;
        return blocScalingUnique(s.scaling1Stat, s.scaling1Lettre, s.scaling2Stat, s.scaling2Lettre, s.baseDegatsMin, s.baseDegatsMax, s.incrementBaseDegats, niveau);
    }

    // colorer=true -> ligne de "Bonus" de stat (ATK/DEF/PV/SPD/LUCK/Esquive) : teintée de la
    // couleur propre à cette stat (voir COULEUR_STAT), avec un badge à bordure rouge pour les
    // valeurs négatives — le badge reste visible même en cas de daltonisme.
    function rendreLigneStat({ label, valeur, colorer, stat, negatif }) {
        if (!colorer) return `<div class="stat-ligne"><span class="gauche"><span class="label">${label}</span><span class="valeur-neutre">${valeur}</span></span></div>`;
        const couleur = COULEUR_STAT[stat] || 'var(--paper)';
        const classeBadge = negatif ? 'stat-valeur-badge malus' : 'stat-valeur-badge';
        return `<div class="stat-ligne"><span class="gauche"><span class="label">${label}</span><span class="${classeBadge}" style="color:${couleur}">${valeur}</span></span></div>`;
    }

    // Lignes de stat génériques niveau-ajustées, pour n'importe quel triplet stat/bonus/increment
    // — réutilisée pour la stance 1 (stat/bonus/increment) ET la stance 2 (stance2Stat/...).
    function construireLignesStatGenerique(stat, bonus, increment, stat2, bonus2, increment2, stat3, bonus3, increment3, niveau, statsExtra) {
        const lignes = [];
        if (stat) {
            const actuel = bonus + niveau * increment;
            const formatteur = (v) => (v >= 0 ? "+" : "") + v + suffixeStat(stat);
            lignes.push({ label: LABELS_STAT[stat] || stat, valeur: formatEvolution(bonus, actuel, formatteur), colorer: true, stat, negatif: actuel < 0 });
        }
        if (stat2) {
            const actuel2 = bonus2 + niveau * increment2;
            const formatteur2 = (v) => (v >= 0 ? "+" : "") + v + suffixeStat(stat2);
            lignes.push({ label: LABELS_STAT[stat2] || stat2, valeur: formatEvolution(bonus2, actuel2, formatteur2), colorer: true, stat: stat2, negatif: actuel2 < 0 });
        }
        if (stat3) {
            const actuel3 = bonus3 + niveau * increment3;
            const formatteur3 = (v) => (v >= 0 ? "+" : "") + v + suffixeStat(stat3);
            lignes.push({ label: LABELS_STAT[stat3] || stat3, valeur: formatEvolution(bonus3, actuel3, formatteur3), colorer: true, stat: stat3, negatif: actuel3 < 0 });
        }
        // ⚠️ EXTENSION : 4e stat, 5e stat... -- statsExtra absent (tous les objets existants) ne
        // change rien à l'affichage par rapport à l'ancien comportement.
        (statsExtra || []).forEach(slot => {
            const actuel = slot.bonus + niveau * slot.increment;
            const formatteur = (v) => (v >= 0 ? "+" : "") + v + suffixeStat(slot.nom);
            lignes.push({ label: LABELS_STAT[slot.nom] || slot.nom, valeur: formatEvolution(slot.bonus, actuel, formatteur), colorer: true, stat: slot.nom, negatif: actuel < 0 });
        });
        return lignes;
    }

    // Carte dédiée aux armes à changement de stance (même principe que codex.html) : la partie
    // "état de l'objet" (checkbox, niveau, équipé) reste COMMUNE aux deux stances, seule la vue
    // image+scaling+bonus bascule au survol. `niveau` reçu = déjà plafonné (voir call site).
    function construireCorpsCarteStance(item, niveau) {
        const s = item;
        const imageStance1 = iconeOuImage(s, 'carte-icon');
        const imageStance2 = iconeOuImage({ image: s.stance2ImageUrl || s.image, icone: s.icone }, 'carte-icon');
        const scaling1 = blocScalingUnique(s.scaling1Stat, s.scaling1Lettre, s.scaling2Stat, s.scaling2Lettre, s.baseDegatsMin, s.baseDegatsMax, s.incrementBaseDegats, niveau);
        const scaling2 = blocScalingUnique(s.stance2Scaling1Stat, s.stance2Scaling1Lettre, s.stance2Scaling2Stat, s.stance2Scaling2Lettre, s.stance2BaseDegatsMin, s.stance2BaseDegatsMax, s.stance2IncrementBaseDegats, niveau);
        const stats1 = construireLignesStatGenerique(s.stat, s.bonus, s.increment, s.stat2, s.bonus2, s.increment2, s.stat3, s.bonus3, s.increment3, niveau, s.statsExtra).map(rendreLigneStat).join('');
        const stats2 = construireLignesStatGenerique(s.stance2Stat, s.stance2Bonus, s.stance2IncrementBonus, s.stance2Stat2, s.stance2Bonus2, s.stance2IncrementBonus2, s.stance2Stat3, s.stance2Bonus3, s.stance2IncrementBonus3, niveau).map(rendreLigneStat).join('');

        return {
            portraitExtra: `
                <div class="stance-indicateur">⇄</div>
                <div class="stance-vue stance-vue-1">${imageStance1}</div>
                <div class="stance-vue stance-vue-2">${imageStance2}</div>
            `,
            header: `
                <div class="carte-nom-ligne stance-vue stance-vue-1">
                    <span class="carte-nom">${s.nom}<span class="stance-etiquette">Stance 1</span></span>
                </div>
                <div class="carte-nom-ligne stance-vue stance-vue-2">
                    <span class="carte-nom">${s.nom}<span class="stance-etiquette stance-etiquette-2">Stance 2</span></span>
                </div>
                ${s.contributeur ? `<div class="carte-contributeur">— ${s.contributeur}</div>` : ''}
            `,
            scaling: `
                <div class="stance-vue stance-vue-1"><div class="section-titre">Scaling</div>${scaling1}</div>
                <div class="stance-vue stance-vue-2"><div class="section-titre">Scaling</div>${scaling2}</div>
            `,
            bonus: `
                ${stats1 ? `<div class="stance-vue stance-vue-1"><div class="section-titre">Bonus</div>${stats1}</div>` : ''}
                ${stats2 ? `<div class="stance-vue stance-vue-2"><div class="section-titre">Bonus</div>${stats2}</div>` : ''}
            `,
            passif: `<div class="section-titre">Passif</div><div class="bloc-passif"><div class="passif-ligne">Alterne de stance toutes les <b>${s.dureeStance}</b> tours du porteur. Le retour à la Stance 1 purge le poison et la brûlure sur le porteur lui-même.</div></div>`,
        };
    }

    // `niveau` reçu ici doit déjà être le niveau EFFECTIF (plafonné) — voir call site (afficherTout).
    function construireDetails(numero, niveau, estStrategeme) {
        const s = STATS[numero];
        if (!s) return { scalingHtml: null, lignesStat: [], passifTexte: "" };

        // Soin actif (Stimulant et similaires) : montant/utilisations/cooldown en clair, plutôt
        // qu'une phrase de passif — quel que soit le slot de l'objet.
        if (s.soinDirect > 0 || s.statPrincipale === "SoinDirect") {
            const actuel = s.statPrincipale === "SoinDirect" ? s.soinDirect + niveau * s.incrementPassif : s.soinDirect;
            const lignesStat = [{ label: "Montant soigné", valeur: formatEvolution(s.soinDirect, actuel, (v) => v), colorer: false }];
            if (s.usagesParCombat > 0) lignesStat.push({ label: "Utilisations", valeur: s.usagesParCombat, colorer: false });
            if (s.cooldownTours > 0) lignesStat.push({ label: "Cooldown", valeur: s.cooldownTours + " tours", colorer: false });
            return { scalingHtml: null, lignesStat, passifTexte: construirePassifs(s, niveau, "SoinDirect").join("") };
        }

        if (estStrategeme) {
            const lignesStat = [];

            if (s.degatsDirects > 0 || s.statPrincipale === "DegatsDirects") {
                // Deux scalings possibles et indépendants désormais : via StatPrincipale (ancien
                // système, 4 objets existants) ET/OU via incrementDegatsDirects (nouveau système
                // indépendant, ex: Souffle Draconique qui fait plutôt monter sa Brûlure en
                // StatPrincipale). Les deux s'additionnent si jamais un objet cumulait les deux.
                const viaStatPrincipale = s.statPrincipale === "DegatsDirects" ? niveau * s.incrementPassif : 0;
                const viaIncrementDedie = niveau * (s.incrementDegatsDirects || 0);
                const actuel = s.degatsDirects + viaStatPrincipale + viaIncrementDedie;
                const coups = s.coupsParUsage > 1 ? ` x ${s.coupsParUsage}` : "";
                lignesStat.push({ label: "Dégâts", valeur: formatEvolution(s.degatsDirects, actuel, (v) => v) + coups, colorer: false });
            }
            // Poison affiché comme stat ET conservé en passif (qui détaille la dégression) —
            // les deux se complètent, contrairement au Bouclier ci-dessous.
            if (s.poisonDegats > 0 || s.statPrincipale === "PoisonDegats") {
                const actuel = s.statPrincipale === "PoisonDegats" ? s.poisonDegats + niveau * s.incrementPassif : s.poisonDegats;
                lignesStat.push({ label: "Poison", valeur: formatEvolution(s.poisonDegats, actuel, (v) => v) + " stacks", colorer: false });
            }
            // Brûlure : même traitement que le Poison ci-dessus (stat ET passif) — le montant PAR
            // TOUR scale par doublon, la durée (3 tours) reste fixe.
            if (s.brulureDegats > 0 || s.statPrincipale === "BrulureDegats") {
                const actuel = s.statPrincipale === "BrulureDegats" ? s.brulureDegats + niveau * s.incrementPassif : s.brulureDegats;
                lignesStat.push({ label: "Brûlure", valeur: formatEvolution(s.brulureDegats, actuel, (v) => v) + "/tour", colorer: false });
            }
            // Bouclier : affiché comme stat CLAIRE, exclu du passif générique juste après (son
            // ancien libellé "en début de combat" ne serait plus exact pour un Stratagème, qui
            // l'accorde désormais à chaque déclenchement réel).
            if (s.shieldMontant > 0 || s.statPrincipale === "ShieldMontant") {
                const actuel = s.statPrincipale === "ShieldMontant" ? s.shieldMontant + niveau * s.incrementPassif : s.shieldMontant;
                lignesStat.push({ label: "Bouclier", valeur: formatEvolution(s.shieldMontant, actuel, (v) => v), colorer: false });
            }
            if (s.usagesParCombat > 0) lignesStat.push({ label: "Utilisations", valeur: s.usagesParCombat, colorer: false });
            if (s.cooldownTours > 0) lignesStat.push({ label: "Cooldown", valeur: s.cooldownTours + " tours", colorer: false });

            const passifs = construirePassifs(s, niveau, "DegatsDirects", ["ShieldMontant"]);
            // Déclenchement différé (Solo Silo) : explique le principe directement, la personne
            // adapte le libellé exact de ses objets comme elle le souhaite par la suite.
            if (s.delaiTours > 0) passifs.push(`<div class="passif-ligne">Lancé immédiatement, atterrit après <b>${s.delaiTours}</b> tour${s.delaiTours > 1 ? "s" : ""}.</div>`);
            return { scalingHtml: null, lignesStat, passifTexte: passifs.join("") };
        }

        // Bonus (Stat/Stat2/Stat3) : les 3 emplacements montent TOUJOURS avec leur PROPRE
        // incrément, indépendamment de StatPrincipale (voir 11_Duel.cs) — la valeur "actuelle"
        // doit donc toujours appliquer niveau × increment, jamais seulement pour StatPrincipale.
        const lignesStat = construireLignesStatGenerique(s.stat, s.bonus, s.increment, s.stat2, s.bonus2, s.increment2, s.stat3, s.bonus3, s.increment3, niveau, s.statsExtra);
        const passifTexte = construirePassifs(s, niveau, "Bonus").join("");

        return { scalingHtml: construireScaling(s, niveau), lignesStat, passifTexte };
    }

    function afficherTout() {
        if (possedesParam.length === 0) {
            document.getElementById('emplacements').style.display = 'none';
            document.getElementById('grille').innerHTML = '<div class="vide-message">Aucun objet pour le moment.</div>';
            return;
        }

        const emplacementsEl = document.getElementById('emplacements');
        Object.keys(LABELS_SLOT).forEach(slot => {
            const numero = equipeParSlot[slot];
            const ref = numero > 0 ? STATS[numero] : null;
            const possede = ref ? possedesParam.find(p => p.numero === numero) : null;
            const niveau = possede ? possede.niveau : 0;
            const badge = ref ? texteBadgeNiveau(niveau, ref.rarete || 'commun') : null;
            const div = document.createElement('div');
            div.className = 'emplacement' + (ref ? '' : ' vide');
            div.innerHTML = `${badge ? `<span class="emplacement-niveau">${badge.texte}</span>` : ''}
                              <div class="label">${LABELS_SLOT[slot]}</div>
                              <div class="icone">${ref ? iconeOuImage(ref, 'icone-img') : '—'}</div>
                              <div class="nom">${ref ? ref.nom : 'Aucun'}</div>`;
            emplacementsEl.appendChild(div);
        });

        const parCategorie = { weapon_1h: [], weapon_2h: [], offhand: [], torso: [], strategeme: [] };
        possedesParam.forEach(({ numero, niveau }) => {
            const ref = STATS[numero];
            if (!ref) return;
            const item = { numero, niveau, ...ref };
            const cat = categorieAffichage(item);
            if (!parCategorie[cat]) {
                // Le "slot" de cet objet dans catalogue_stats.json ne correspond à aucune catégorie
                // connue (vide, mal orthographié, mauvaise casse...) — on l'ignore plutôt que de
                // faire planter tout l'affichage, et on le signale clairement en console.
                console.warn(`Objet #${numero} ("${item.nom || '?'}") ignoré : slot inconnu = "${item.slot}"`);
                return;
            }
            parCategorie[cat].push(item);
        });

        const conteneur = document.getElementById('grille');
        Object.keys(LABELS_CATEGORIE).forEach(cat => {
            const items = parCategorie[cat];
            if (items.length === 0) return;

            const bloc = document.createElement('div');
            bloc.className = 'categorie';
            bloc.innerHTML = `<div class="categorie-titre"><h2>${LABELS_CATEGORIE[cat]}</h2></div><div class="grille"></div>`;
            const grilleInterne = bloc.querySelector('.grille');

            items.forEach(item => {
                const estEquipe = equipeParSlot[item.slot] === item.numero;
                const estStrategeme = item.slot === 'strategeme';
                const rarete = item.rarete || 'commun';
                // Niveau EFFECTIF (plafonné à NIVEAU_MAX_PAR_RARETE) : c'est celui qui pilote tout
                // calcul de stat affiché (formatEvolution etc.), fidèle à ce que fait réellement
                // le moteur de combat au-delà du plafond. item.niveau (brut) reste utilisé
                // uniquement pour le badge "+N"/"MAX ×N" ci-dessous.
                const plafond = niveauMaxPourRarete(rarete);
                const niveauEffectif = Math.min(item.niveau, plafond);
                const badge = texteBadgeNiveau(item.niveau, rarete);

                const carte = document.createElement('div');
                carte.className = 'carte ' + rarete + (estEquipe ? ' equipe' : '') + (item.dureeStance > 0 ? ' carte-stance' : '');

                let portraitExtra = '', headerHtml, scalingHtml, bonusHtml, passifHtml;
                if (item.dureeStance > 0) {
                    const c = construireCorpsCarteStance(item, niveauEffectif);
                    portraitExtra = c.portraitExtra;
                    headerHtml = c.header;
                    scalingHtml = c.scaling;
                    bonusHtml = c.bonus;
                    passifHtml = c.passif;
                } else {
                    const { scalingHtml: sc, lignesStat, passifTexte } = construireDetails(item.numero, niveauEffectif, estStrategeme);
                    headerHtml = `
                        <div class="carte-nom-ligne">
                            <span class="carte-nom">${item.nom}</span>
                            <label class="carte-select"><input type="checkbox" data-numero="${item.numero}" data-slot="${item.slot}" data-hand="${item.hand || ''}"></label>
                        </div>
                        ${item.contributeur ? `<div class="carte-contributeur">— ${item.contributeur}</div>` : ''}
                    `;
                    scalingHtml = sc ? `<div class="section-titre">Scaling</div>${sc}` : '';
                    bonusHtml = lignesStat.length > 0 ? `<div class="section-titre">${estStrategeme ? 'Statistiques' : 'Bonus'}</div>${lignesStat.map(rendreLigneStat).join('')}` : '';
                    passifHtml = passifTexte ? `<div class="section-titre">Passif</div><div class="bloc-passif">${passifTexte}</div>` : '';
                }

                carte.innerHTML = `
                    <div class="carte-portrait">
                        <span class="carte-badge-rarete" title="${LABELS_RARETE[rarete] || rarete}">${LABELS_RARETE[rarete] || rarete}</span>
                        ${badge ? `<span class="carte-etat-niveau${badge.max ? ' etat-max' : ''}">${badge.texte}</span>` : ''}
                        <div class="carte-icone-zone">${item.dureeStance > 0 ? portraitExtra : iconeOuImage(item, 'carte-icon')}</div>
                    </div>
                    <div class="carte-corps">
                        <div class="carte-cabecera fila-header">${headerHtml}</div>
                        <div class="bloc-section fila-scaling">${scalingHtml}</div>
                        <div class="bloc-section fila-bonus">${bonusHtml}</div>
                        <div class="bloc-section fila-passif">${passifHtml}</div>
                        <div class="fila-footer">${estEquipe ? `<span class="carte-cmd">✓ Équipé</span>` : `<span class="carte-cmd">!equip ${item.numero}</span>`}</div>
                    </div>
                `;
                // Case de sélection absente sur une carte à stance (portrait dédoublé au survol) —
                // pas de checkbox ici dans construireCorpsCarteStance, on l'ajoute ci-dessous pour
                // rester cohérent avec les cartes classiques (même contrôle, même comportement).
                if (item.dureeStance > 0) {
                    const headerEl = carte.querySelector('.fila-header .carte-nom-ligne.stance-vue-1');
                    if (headerEl) {
                        const label = document.createElement('label');
                        label.className = 'carte-select';
                        label.innerHTML = `<input type="checkbox" data-numero="${item.numero}" data-slot="${item.slot}" data-hand="${item.hand || ''}">`;
                        headerEl.appendChild(label);
                    }
                }
                grilleInterne.appendChild(carte);
            });

            conteneur.appendChild(bloc);
        });

        // Clic n'importe où sur la carte = coche/décoche la sélection pour le loadout groupé
        // (le clic direct sur la case elle-même reste géré nativement, on évite juste le double-toggle).
        conteneur.querySelectorAll('.carte').forEach(carte => {
            carte.addEventListener('click', (e) => {
                if (e.target.tagName === 'INPUT') return;
                const input = carte.querySelector('.carte-select input');
                if (!input) return;
                input.checked = !input.checked;
                input.dispatchEvent(new Event('change'));
            });
        });

        const selectionLoadout = {};

        function afficherErreurSelection(message) {
            let barre = document.getElementById('barreLoadout');
            if (!barre) { barre = document.createElement('div'); barre.id = 'barreLoadout'; document.querySelector('.page').appendChild(barre); }
            const ancienneErreur = barre.querySelector('.message-erreur');
            if (ancienneErreur) ancienneErreur.remove();
            const div = document.createElement('div');
            div.className = 'message-erreur';
            div.textContent = message;
            barre.appendChild(div);
            setTimeout(() => div.remove(), 3500);
        }

        function majBarreLoadout() {
            let barre = document.getElementById('barreLoadout');
            if (!barre) { barre = document.createElement('div'); barre.id = 'barreLoadout'; document.querySelector('.page').appendChild(barre); }
            const numeros = Object.values(selectionLoadout);
            if (numeros.length === 0) { barre.innerHTML = ''; return; }
            const noms = Object.keys(selectionLoadout).map(slot => STATS[selectionLoadout[slot]].nom).join(', ');
            const commande = '!equip ' + numeros.join(',');
            barre.innerHTML = `
                <div class="barre-loadout">
                    <div class="resume">Loadout sélectionné (<b>${numeros.length}</b>) : ${noms}</div>
                    <button class="bouton-loadout" id="btnCopierLoadout">📋 Copier "${commande}"</button>
                </div>
            `;
            document.getElementById('btnCopierLoadout').addEventListener('click', (e) => {
                navigator.clipboard.writeText(commande).then(() => {
                    const btn = e.target;
                    const texteOriginal = btn.textContent;
                    btn.textContent = '✓ Copié !';
                    btn.classList.add('copie');
                    setTimeout(() => { btn.textContent = texteOriginal; btn.classList.remove('copie'); }, 1500);
                });
            });
        }

        conteneur.querySelectorAll('.carte-select input').forEach(input => {
            input.addEventListener('change', () => {
                const slot = input.dataset.slot;
                const hand = input.dataset.hand;
                const numero = parseInt(input.dataset.numero, 10);

                if (input.checked) {
                    if (slot === 'weapon' && hand === 'two_handed' && selectionLoadout.offhand !== undefined) {
                        input.checked = false;
                        afficherErreurSelection("Impossible : une arme à deux mains ne peut pas être combinée avec un off-hand. Désélectionne d'abord l'un des deux.");
                        return;
                    }
                    if (slot === 'offhand') {
                        const numeroArme = selectionLoadout.weapon;
                        const armeEst2Mains = numeroArme !== undefined && STATS[numeroArme]?.hand === 'two_handed';
                        if (armeEst2Mains) {
                            input.checked = false;
                            afficherErreurSelection("Impossible : un off-hand ne peut pas être combiné avec une arme à deux mains. Désélectionne d'abord l'un des deux.");
                            return;
                        }
                    }

                    conteneur.querySelectorAll(`.carte-select input[data-slot="${slot}"]`).forEach(autre => {
                        if (autre !== input) { autre.checked = false; autre.closest('.carte').classList.remove('dans-loadout'); }
                    });
                    selectionLoadout[slot] = numero;
                    input.closest('.carte').classList.add('dans-loadout');
                } else {
                    delete selectionLoadout[slot];
                    input.closest('.carte').classList.remove('dans-loadout');
                }
                majBarreLoadout();
            });
        });
    }

    // Quatre encarts de ressources, TOUJOURS affichés — y compris à zéro. Un bloc
    // qui n'apparaît que lorsqu'on possède déjà la ressource n'apprend rien à
    // celles et ceux qui n'en ont jamais eu ; ici chaque infobulle explique quoi
    // taper pour s'en servir, ou comment en obtenir.
    function construireEncarts(r) {
        const lienShop = `shop.html?user=${encodeURIComponent(pseudo)}`;
        const encarts = [
            {
                label: 'Médailles', accent: '#f2c230', icone: '🏅', valeur: r.medailles,
                sous: `<a href="${lienShop}">Aller à la boutique</a>`,
                bulle: `<p>La monnaie gagnée en combat. Elle s'échange chez le marchand contre
                        des objets ou un ticket de reset.</p>
                        <p>Revends ce dont tu ne te sers pas avec <span class="cmd">!vendre</span>,
                        achète avec <span class="cmd">!acheter</span> — la page Boutique te prépare
                        les commandes toutes faites.</p>`,
            },
            {
                label: 'Tickets de duel', accent: '#FF8040', icone: '🎟️', valeur: r.tickets,
                sous: r.tickets > 0 ? 'Prêt à combattre' : 'Aucun duel disponible',
                bulle: `<p><span class="cmd">!ticketduel</span> engage un duel contre la personne
                        de ton choix : c'est toi qui désignes la cible.</p>
                        <p><span class="cmd">!ticketauto</span> lance un combat automatique contre
                        un adversaire tiré au sort dans ta tranche de puissance.</p>`,
            },
            {
                label: 'Lootbox', accent: '#5ddd7a', icone: '🎁', valeur: r.lootbox,
                sous: r.lootbox > 0 ? 'À ouvrir' : 'Aucune en attente',
                bulle: `<p><span class="cmd">!lootbox</span> ouvre une boîte et te donne un objet
                        au hasard.</p>
                        <p>Si tu possèdes déjà l'objet tiré, le doublon le fait monter d'un niveau
                        au lieu d'être perdu.</p>`,
            },
            {
                label: 'Tickets de reset', accent: '#4a9fd8', icone: '♻️', valeur: r.ticketsReset,
                // Les points en attente priment sur tout le reste : c'est une action
                // à faire, pas une simple information.
                sous: r.creditsReset > 0
                    ? `<b style="color:#4a9fd8">${r.creditsReset} point(s) à placer</b>`
                    : (r.ticketsReset > 0 ? 'Prêt à réinitialiser' : 'S\'achète en boutique'),
                bulle: `<p><span class="cmd">!reset</span> remet toutes tes statistiques à zéro et
                        te rend la totalité des points investis.</p>
                        <p>Tu les replaces ensuite où tu veux avec
                        <span class="cmd">!ameliorer atk 5</span> (ou def, pv, vit, chance).</p>
                        <p>Un ticket s'achète en boutique pour 60 médailles.</p>`,
            },
        ];

        document.getElementById('encarts').innerHTML = encarts.map((e, i) => `
            <div class="encart${e.valeur > 0 ? '' : ' vide'}" style="--accent:${e.accent}">
                <div class="encart-tete">
                    <span class="encart-label">${e.icone} ${e.label}</span>
                    <button type="button" class="encart-info" data-i="${i}"
                            aria-expanded="false" aria-label="Aide : ${e.label}">i</button>
                </div>
                <div class="encart-valeur">${e.valeur.toLocaleString('fr-FR')}</div>
                <div class="encart-sous">${e.sous}</div>
                <div class="bulle" role="tooltip">${e.bulle}</div>
            </div>
        `).join('');

        // Le survol suffit sur ordinateur (CSS), mais pas au doigt : le clic ouvre
        // et ferme l'infobulle, et une seule reste ouverte à la fois.
        document.querySelectorAll('.encart-info').forEach(btn => {
            btn.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const carte = btn.closest('.encart');
                const etaitOuvert = carte.classList.contains('ouvert');
                document.querySelectorAll('.encart.ouvert').forEach(c => {
                    c.classList.remove('ouvert');
                    c.querySelector('.encart-info').setAttribute('aria-expanded', 'false');
                });
                if (!etaitOuvert) {
                    carte.classList.add('ouvert');
                    btn.setAttribute('aria-expanded', 'true');
                }
            });
        });
        document.addEventListener('click', () => {
            document.querySelectorAll('.encart.ouvert').forEach(c => {
                c.classList.remove('ouvert');
                c.querySelector('.encart-info').setAttribute('aria-expanded', 'false');
            });
        });
    }

    function afficherJoueurIntrouvable() {
        document.getElementById('titreInventaire').innerHTML = pseudo ? `INVENTAIRE DE <span>${pseudo}</span>` : 'MON <span>INVENTAIRE</span>';
        document.getElementById('emplacements').style.display = 'none';
        document.getElementById('grille').innerHTML =
            '<div class="vide-message">Pas encore de données pour ce joueur — la prochaine synchronisation (toutes les 5 à 10 minutes) les fera apparaître après un premier achat de stat, d\'objet ou un premier combat.</div>';
    }

    let STATS = {};
    if (!pseudo) {
        afficherJoueurIntrouvable();
    } else {
        // "?v=" + horodatage : force le navigateur (et le CDN de GitHub Pages) à toujours récupérer
        // la version la plus fraîche, au lieu de servir une copie mise en cache.
        Promise.all([
            fetch('catalogue_stats.json?v=' + Date.now()).then(r => r.json()),
            fetch('players.json?v=' + Date.now()).then(r => r.json()),
        ]).then(([catalogue, joueurs]) => {
            STATS = catalogue;
            const joueur = joueurs[pseudo];
            if (!joueur) { afficherJoueurIntrouvable(); return; }

            document.getElementById('titreInventaire').innerHTML = `INVENTAIRE DE <span>${joueur.nomAffichage}</span>`;
            if (joueur.avatar) {
                const img = document.getElementById('avatarViewer');
                img.src = joueur.avatar;
                img.style.display = 'block';
            }

            // ⚠️ players.json (17_Publier_Snapshot_Joueurs.cs) utilise "arme"/"armure" pour le
            // loadout, alors que catalogue_stats.json (et donc tout le reste de cette page) parle
            // en "weapon"/"torso" — recalé ici plutôt que dans les 2 autres fichiers, qui
            // fonctionnent déjà tels quels avec ces noms.
            equipeParSlot = {
                weapon: joueur.loadout.arme, offhand: joueur.loadout.offhand,
                torso: joueur.loadout.armure, strategeme: joueur.loadout.strategeme,
            };
            possedesParam = joueur.inventaire || [];
            nbLootbox = joueur.lootbox || 0;

            construireEncarts({
                medailles:    joueur.medailles    || 0,
                tickets:      joueur.tickets      || 0,
                lootbox:      nbLootbox,
                ticketsReset: joueur.ticketsReset || 0,
                creditsReset: joueur.creditsReset || 0,
            });

            try {
                afficherTout();
            } catch (erreurAffichage) {
                console.error('Erreur pendant l\'affichage de l\'inventaire :', erreurAffichage);
                document.getElementById('grille').innerHTML =
                    '<div class="vide-message">Données chargées, mais une erreur est survenue pendant l\'affichage : '
                    + erreurAffichage.message + ' (détail complet dans la console du navigateur, F12).</div>';
            }
        }).catch((erreurChargement) => {
            console.error('Erreur de chargement :', erreurChargement);
            document.getElementById('grille').innerHTML =
                '<div class="vide-message">Impossible de charger catalogue_stats.json ou players.json — vérifie qu\'ils sont bien présents à côté de cette page.</div>';
        });
    }
</script>
<script src="nav.js" defer></script>
</body>
</html>
