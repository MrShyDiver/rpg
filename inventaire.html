<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon inventaire</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0;
    --commun: #8d8d8d; --rare: #4a9fd8; --legendaire: #f2c230; --line: #2c2c2e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 40px 20px; }
h1, h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
.page { max-width: 900px; margin: 0 auto; }
.entete { padding-bottom: 20px; border-bottom: 3px solid var(--yellow); margin-bottom: 26px; }
.entete h1 { font-size: 30px; font-weight: 700; }
.entete h1 span { color: var(--yellow); }
.entete p { color: var(--paper-dim); font-size: 14px; margin-top: 6px; }

.bloc-lootbox {
    background: rgba(242,194,48,0.1); border: 1px solid var(--yellow); border-radius: 6px;
    padding: 14px 18px; margin-bottom: 26px; font-size: 15px; color: var(--paper);
}
.bloc-lootbox .cmd {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--yellow);
    background: rgba(0,0,0,0.35); padding: 2px 8px; border-radius: 3px;
}

.emplacements { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 36px; }
.emplacement { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; text-align: center; }
.emplacement .label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px; color: var(--paper-dim); text-transform: uppercase; margin-bottom: 8px; }
.emplacement .icone { font-size: 28px; margin-bottom: 6px; }
.icone-img { width: 34px; height: 34px; object-fit: contain; }
.emplacement .nom { font-size: 12.5px; font-weight: 600; }
.emplacement.vide .nom { color: var(--paper-dim); font-style: italic; }

.categorie { margin-bottom: 30px; }
.categorie-titre { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.categorie-titre h2 { font-size: 17px; font-weight: 600; }
.categorie-titre::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }

.carte { background: var(--bg-panel); border: 1px solid var(--line); border-left: 4px solid var(--commun); border-radius: 4px; padding: 14px; position: relative; }
.carte.rare { border-left-color: var(--rare); }
.carte.legendaire { border-left-color: var(--legendaire); }
.carte.equipe { background: rgba(242,194,48,0.08); }
.carte-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.carte-icon { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
.carte-icon-emoji { font-size: 24px; flex-shrink: 0; }
.carte-nom { font-size: 14px; font-weight: 600; flex: 1; }
.carte-niveau {
    font-size: 12px; font-weight: 900; color: var(--yellow);
    border: 1.5px solid var(--yellow); border-radius: 4px; padding: 1px 6px;
    background: rgba(242,194,48,0.12); flex-shrink: 0;
}
.carte-stat { font-size: 12.5px; color: var(--paper-dim); margin-bottom: 6px; }
.carte-stat b { color: var(--paper); font-weight: 600; }
.carte-stat .fleche { color: var(--yellow); margin: 0 3px; }
.carte-passif { font-size: 12.5px; color: var(--paper-dim); line-height: 1.4; margin-bottom: 10px; }
.carte-passif::before { content: "Passif — "; color: var(--yellow); font-weight: 700; }
.carte-passif b { color: var(--paper); font-weight: 600; }
.carte-cmd { font-family: 'Barlow Condensed', sans-serif; font-size: 12.5px; color: var(--paper-dim); background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 3px; display: inline-block; }
.carte.equipe .carte-cmd { color: var(--yellow); }
.carte-cmd.cliquable { cursor: pointer; border: 1px solid var(--line); transition: all 0.15s ease; }
.carte-cmd.cliquable:hover { border-color: var(--yellow); color: var(--yellow); }
.carte-cmd.copie { color: var(--yellow); border-color: var(--yellow); }

.carte-select {
    display: flex; align-items: center; gap: 6px; margin-top: 8px;
    font-size: 11.5px; color: var(--paper-dim); cursor: pointer; user-select: none;
}
.carte-select input { accent-color: var(--yellow); width: 15px; height: 15px; cursor: pointer; }
.carte.dans-loadout { outline: 2px solid var(--yellow); outline-offset: -1px; }

.barre-loadout {
    position: sticky; bottom: 16px; margin-top: 30px;
    background: var(--bg-panel); border: 1px solid var(--yellow); border-radius: 8px;
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6); flex-wrap: wrap;
}
.barre-loadout .resume { font-size: 13px; color: var(--paper-dim); flex: 1; min-width: 200px; }
.barre-loadout .resume b { color: var(--paper); }
.bouton-loadout {
    background: var(--yellow); color: #000; border: none;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 10px 18px; border-radius: 5px; cursor: pointer; white-space: nowrap;
}
.bouton-loadout:disabled { opacity: 0.4; cursor: not-allowed; }
.bouton-loadout.copie { background: #7dffc4; }

.vide-message { text-align: center; padding: 80px 20px; color: var(--paper-dim); }

/* ===== Mobile ===== */
@media (max-width: 640px) {
    body { padding: 20px 12px; }
    .entete h1 { font-size: 24px; }
    .entete p { font-size: 13px; }
    .bloc-lootbox { font-size: 13.5px; padding: 12px 14px; }
    .emplacements { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 26px; }
    .emplacement { padding: 10px; }
    .grille { grid-template-columns: 1fr; gap: 10px; }
    .categorie-titre h2 { font-size: 15px; }
    .carte-cmd.cliquable { padding: 8px 12px; } /* cible tactile plus confortable au doigt */
}
</style>
</head>
<body>
<div class="page">
    <div class="entete">
        <h1>MON <span>INVENTAIRE</span></h1>
        <p>Clique sur la commande d'un objet pour la copier, puis colle-la (Ctrl+V) dans le chat Twitch.</p>
    </div>
    <div id="zoneLootbox"></div>
    <div id="emplacements" class="emplacements"></div>
    <div id="grille"></div>
    <div id="barreLoadout"></div>
</div>

<script>
    // ==========================================================
    // RÉFÉRENCE STATIQUE — nom/icône/emplacement par numéro. Ne change presque jamais
    // (uniquement quand tu ajoutes un TOUT NOUVEL objet ou renommes/déplaces un objet existant).
    // Toutes les VALEURS de stats et passifs viennent de catalogue_stats.json à côté, généré par
    // 0_Catalogue_Init.cs — plus rien à écrire à la main pour ça.
    // ==========================================================
    const REFERENCE = {
        1:  { nom: "Épée rouillée",           icone: "🗡️", image: "gear/machete-democratique.png", slot: "weapon", hand: "one_handed" },
        2:  { nom: "Épée à énergie",          icone: "⚡", image: "",                               slot: "weapon", hand: "one_handed" },
        3:  { nom: "Lame vampirique",         icone: "🩸", image: "gear/lame-vampirique.png",        slot: "weapon", hand: "one_handed" },
        4:  { nom: "Dague empoisonnée",       icone: "🐍", image: "gear/dague_empoisonnee.png",      slot: "weapon", hand: "one_handed" },
        5:  { nom: "Marteau de la Liberté",   icone: "🔨", image: "gear/marteau-democratique.png",   slot: "weapon", hand: "two_handed" },
        6:  { nom: "Hache du Bourreau",       icone: "🪓", image: "gear/hache-lourde.png",           slot: "weapon", hand: "two_handed" },
        7:  { nom: "Bouclier de Super-Terre", icone: "🔷", image: "",                               slot: "offhand" },
        8:  { nom: "Bouclier Aegis",          icone: "🛡️", image: "",                               slot: "offhand" },
        9:  { nom: "Bouclier épineux",        icone: "🌵", image: "gear/bouclier_epineux.png",       slot: "offhand" },
        10: { nom: "Amulette de pureté",      icone: "🔮", image: "",                               slot: "offhand" },
        11: { nom: "Stimulant",               icone: "💉", image: "gear/stim.png",                   slot: "offhand" },
        12: { nom: "Armure légère (agile)",   icone: "🦺", image: "gear/armure-legere.png",          slot: "torso" },
        13: { nom: "Armure lourde",           icone: "🥋", image: "gear/armure-lourde.png",          slot: "torso" },
        14: { nom: "Exo-squelette Titan",     icone: "🤖", image: "",                               slot: "torso" },
        15: { nom: "Plastron régénérant",     icone: "💚", image: "gear/armure-regenerante.png",     slot: "torso" },
        16: { nom: "Armure furtive",          icone: "💨", image: "gear/armure-esquive.png",         slot: "torso" },
        17: { nom: "Armure épineuse",         icone: "🦔", image: "",                               slot: "torso" },
        18: { nom: "Armure stoïque",          icone: "🗿", image: "",                               slot: "torso" },
        19: { nom: "Frappe 500kg",            icone: "🚀", image: "gear/eagle_500kg.png",            slot: "strategeme" },
        20: { nom: "Gros Bâton",              icone: "🗡️", image: "gear/gros_baton.png",             slot: "weapon", hand: "two_handed" },
    };
    // La RARETÉ n'a pas d'impact sur les stats, mais sert au liseré de couleur — un objet sans
    // entrée ici reste affichable, juste sans couleur de rareté distincte (gris par défaut).
    const RARETES = {
        1:"commun", 2:"rare", 3:"rare", 4:"rare", 5:"rare", 6:"legendaire",
        7:"commun", 8:"rare", 9:"rare", 10:"commun", 11:"rare",
        12:"commun", 13:"commun", 14:"legendaire", 15:"rare", 16:"rare", 17:"rare", 18:"legendaire",
        19:"legendaire", 20:"commun",
    };
    const LABELS_SLOT = { weapon: "Arme", offhand: "Off-hand", torso: "Armure", strategeme: "Stratagème" };
    // Catégories d'AFFICHAGE dans la grille — distinctes du "slot" de jeu utilisé pour
    // l'équipement (une arme 1-main et une arme 2-mains occupent le même emplacement "weapon").
    const LABELS_CATEGORIE = {
        weapon_1h: "Armes à une main", weapon_2h: "Armes à deux mains",
        offhand: "Off-hand", torso: "Armure", strategeme: "Stratagème",
    };
    function categorieAffichage(item) {
        if (item.slot === "weapon") return item.hand === "two_handed" ? "weapon_2h" : "weapon_1h";
        return item.slot;
    }
    const LABELS_STAT = { atk: "ATK", def: "DEF", pv: "PV", esquive: "Esquive", spd: "Vitesse" };

    // ==========================================================
    // GABARITS DE PASSIF — un seul par TYPE d'effet (pas par objet). Le seul endroit à
    // compléter si tu inventes un TOUT NOUVEAU type de mécanique un jour.
    // (v = valeur actuelle du passif, déjà avec le niveau appliqué ; s = reste des stats brutes)
    // ==========================================================
    const GABARITS_PASSIF = {
        Lifesteal: (v, s) => `Vol de vie : <b>${v}%</b> des dégâts infligés sont rendus en PV.`,
        PoisonDegats: (v, s) => `Poison : <b>${v}</b> dégâts/tour pendant <b>${s.poisonDuree}</b> tours.`,
        EtourdissementChance: (v, s) => `<b>${v}%</b> de chance d'étourdir la cible (saute son tour suivant).`,
        ExecutionBonus: (v, s) => `Sous <b>${s.executionSeuil}%</b> de PV, inflige <b>+${v}%</b> de dégâts.`,
        Precision: (v, s) => `<b>+${v}</b> précision — réduit l'esquive adverse.`,
        Blocage: (v, s) => `<b>${v}%</b> de chance de bloquer, réduit alors les dégâts de <b>${s.blocageReduction}%</b>.`,
        Reflection: (v, s) => `Renvoie <b>${v}%</b> des dégâts subis à l'attaquant.`,
        ResistancePoison: (v, s) => `<b>${v}%</b> de résistance au poison.`,
        Regeneration: (v, s) => `Régénère <b>${v}%</b> des PV max à chaque tour.`,
        ResistanceCrit: (v, s) => `<b>-${v}</b> points de chance d'être touché par un critique.`,
        SoinDirect: (v, s) => `Soigne <b>${v} PV</b>, <b>${s.usagesParCombat}</b> usages/combat (recharge ${s.cooldownTours} tours), si des PV manquent.`,
        DegatsDirects: (v, s) => `Frappe directe de <b>${v}</b> dégâts (pénétration ${s.penetration}%), <b>${s.usagesParCombat}</b> usages, recharge ${s.cooldownTours} tours.`,
        SaignementDegats: (v, s) => `Saignement : <b>${v}</b> dégâts/stack par tour (perd 1 stack/tour).`,
        AntiHealPourcentage: (v, s) => `Réduit les soins reçus par la cible de <b>${v}%</b> pendant <b>${s.antiHealDuree}</b> tours.`,
        ShieldMontant: (v, s) => `Accorde un bouclier de <b>${v} PV</b> en début de combat.`,
        RageBonusMax: (v, s) => `Dégâts jusqu'à <b>+${v}%</b> quand tes PV descendent vers <b>${s.rageSeuilMin}%</b>.`,
        MarqueDegatsPourcentage: (v, s) => `Marque la cible touchée : <b>+${v}%</b> dégâts reçus pendant <b>${s.marqueDuree}</b> tours.`,
        ParadeChance: (v, s) => `<b>${v}%</b> de chance d'annuler un coup reçu et de riposter immédiatement.`,
        TenaciteChance: (v, s) => `<b>${v}%</b> de chance de résister à un étourdissement.`,
        DernierSouffleActif: () => `Une fois par combat, survit à <b>1 PV</b> au lieu de mourir.`,
        FrenesieBonusSpd: (v, s) => `Un critique accorde <b>+${v}</b> Vitesse pendant <b>${s.frenesieDuree}</b> tours.`,
    };
    // Fait le lien entre le nom du StatPrincipale et le nom du champ correspondant dans le JSON
    const CHAMP_PAR_STAT_PRINCIPALE = {
        Lifesteal: "lifesteal", PoisonDegats: "poisonDegats", EtourdissementChance: "etourdissementChance",
        ExecutionBonus: "executionBonus", Precision: "precision", Blocage: "blocage", Reflection: "reflection",
        ResistancePoison: "resistancePoison", Regeneration: "regeneration", ResistanceCrit: "resistanceCrit",
        SoinDirect: "soinDirect", DegatsDirects: "degatsDirects", SaignementDegats: "saignementDegats",
        AntiHealPourcentage: "antiHealPourcentage", ShieldMontant: "shieldMontant", RageBonusMax: "rageBonusMax",
        MarqueDegatsPourcentage: "marqueDegatsPourcentage", ParadeChance: "paradeChance", TenaciteChance: "tenaciteChance",
        DernierSouffleActif: "dernierSouffleActif", FrenesieBonusSpd: "frenesieBonusSpd",
    };

    const params = new URLSearchParams(window.location.search);
    const depuisBase36 = (str) => parseInt(str, 36) || 0;

    const equipStr = params.get('e') || '00000000';
    const numEquipArme = depuisBase36(equipStr.slice(0, 2));
    const numEquipOffhand = depuisBase36(equipStr.slice(2, 4));
    const numEquipTorso = depuisBase36(equipStr.slice(4, 6));
    const numEquipStrat = depuisBase36(equipStr.slice(6, 8));
    const equipeParSlot = { weapon: numEquipArme, offhand: numEquipOffhand, torso: numEquipTorso, strategeme: numEquipStrat };

    const oStr = params.get('o') || '';
    const possedesParam = [];
    for (let i = 0; i < oStr.length; i += 4) {
        possedesParam.push({ numero: depuisBase36(oStr.slice(i, i + 2)), niveau: depuisBase36(oStr.slice(i + 2, i + 4)) });
    }

    const nbLootbox = depuisBase36(params.get('l') || '00');
    if (nbLootbox > 0) {
        document.getElementById('zoneLootbox').innerHTML =
            `<div class="bloc-lootbox">🎁 Tu as <strong>${nbLootbox}</strong> lootbox en attente — tape <span class="cmd">!lootbox</span> dans le chat pour l'ouvrir !</div>`;
    }

    const iconeOuImage = (ref, classeImg) => ref.image
        ? `<img src="${ref.image}" alt="" class="${classeImg}">`
        : `<span class="${classeImg}-emoji">${ref.icone}</span>`;

    // Construit le texte de stat de base ("+7 ATK") et de passif à partir des données brutes
    function construireDetails(numero, niveau) {
        const s = STATS[numero];
        if (!s) return { statTexte: '', passifTexte: '' };

        let statTexte = '';
        if (s.stat) {
            const label = LABELS_STAT[s.stat] || s.stat;
            if (s.statPrincipale === 'Bonus') {
                const actuel = s.bonus + niveau * s.increment;
                statTexte = niveau > 0
                    ? `<b>+${s.bonus}</b> ${label} de base <span class="fleche">→</span> <b>+${actuel}</b> ${label} actuel`
                    : `<b>+${s.bonus}</b> ${label}`;
            } else {
                statTexte = `<b>+${s.bonus}</b> ${label}`;
            }
        }

        let passifTexte = '';
        if (s.statPrincipale && s.statPrincipale !== 'Bonus' && GABARITS_PASSIF[s.statPrincipale]) {
            const champ = CHAMP_PAR_STAT_PRINCIPALE[s.statPrincipale];
            const base = s[champ];
            const actuel = typeof base === 'boolean' ? base : base + niveau * s.increment;
            passifTexte = GABARITS_PASSIF[s.statPrincipale](actuel, s);
        }

        return { statTexte, passifTexte };
    }

    function afficherTout() {
        if (possedesParam.length === 0) {
            document.getElementById('emplacements').style.display = 'none';
            document.getElementById('grille').innerHTML = '<div class="vide-message">Aucun objet pour le moment.</div>';
            return;
        }

        const emplacementsEl = document.getElementById('emplacements');
        Object.keys(LABELS_SLOT).forEach(slot => {
            const numero = equipeParSlot[slot];
            const ref = numero > 0 ? REFERENCE[numero] : null;
            const div = document.createElement('div');
            div.className = 'emplacement' + (ref ? '' : ' vide');
            div.innerHTML = `<div class="label">${LABELS_SLOT[slot]}</div>
                              <div class="icone">${ref ? iconeOuImage(ref, 'icone-img') : '—'}</div>
                              <div class="nom">${ref ? ref.nom : 'Aucun'}</div>`;
            emplacementsEl.appendChild(div);
        });

        const parCategorie = { weapon_1h: [], weapon_2h: [], offhand: [], torso: [], strategeme: [] };
        possedesParam.forEach(({ numero, niveau }) => {
            const ref = REFERENCE[numero];
            if (!ref) return;
            const item = { numero, niveau, ...ref };
            parCategorie[categorieAffichage(item)].push(item);
        });

        const conteneur = document.getElementById('grille');
        Object.keys(LABELS_CATEGORIE).forEach(cat => {
            const items = parCategorie[cat];
            if (items.length === 0) return;

            const bloc = document.createElement('div');
            bloc.className = 'categorie';
            bloc.innerHTML = `<div class="categorie-titre"><h2>${LABELS_CATEGORIE[cat]}</h2></div><div class="grille"></div>`;
            const grilleInterne = bloc.querySelector('.grille');

            items.forEach(item => {
                const estEquipe = equipeParSlot[item.slot] === item.numero;
                const { statTexte, passifTexte } = construireDetails(item.numero, item.niveau);
                const rarete = RARETES[item.numero] || 'commun';
                const carte = document.createElement('div');
                carte.className = 'carte ' + rarete + (estEquipe ? ' equipe' : '');
                carte.innerHTML = `
                    <div class="carte-head">
                        ${iconeOuImage(item, 'carte-icon')}
                        <span class="carte-nom">${item.nom}</span>
                        ${item.niveau > 0 ? `<span class="carte-niveau">+${item.niveau}</span>` : ''}
                    </div>
                    ${statTexte ? `<div class="carte-stat">${statTexte}</div>` : ''}
                    ${passifTexte ? `<div class="carte-passif">${passifTexte}</div>` : ''}
                    ${estEquipe
                        ? `<span class="carte-cmd">✓ Équipé</span>`
                        : `<span class="carte-cmd cliquable" data-cmd="!equip ${item.numero}">📋 !equip ${item.numero}</span>`}
                    <label class="carte-select">
                        <input type="checkbox" data-numero="${item.numero}" data-slot="${item.slot}" data-hand="${item.hand || ''}">
                        Ajouter au loadout groupé
                    </label>
                `;
                grilleInterne.appendChild(carte);
            });

            conteneur.appendChild(bloc);
        });

        // Clic sur une commande "!equip X" = copie directe dans le presse-papier, plus qu'à
        // coller (Ctrl+V) dans le chat Twitch et valider.
        conteneur.querySelectorAll('.carte-cmd.cliquable').forEach(el => {
            el.addEventListener('click', () => {
                const commande = el.dataset.cmd;
                navigator.clipboard.writeText(commande).then(() => {
                    const texteOriginal = el.textContent;
                    el.textContent = '✓ Copié !';
                    el.classList.add('copie');
                    setTimeout(() => {
                        el.textContent = texteOriginal;
                        el.classList.remove('copie');
                    }, 1500);
                });
            });
        });

        // --- Sélection multiple : un seul objet coché par emplacement, pour composer un
        // loadout entier et générer une seule commande groupée (!equip 4,6,9,11). ---
        const selectionLoadout = {}; // slot -> numero

        function majBarreLoadout() {
            const barre = document.getElementById('barreLoadout');
            const numeros = Object.values(selectionLoadout);
            if (numeros.length === 0) {
                barre.innerHTML = '';
                return;
            }
            const noms = Object.keys(selectionLoadout).map(slot => REFERENCE[selectionLoadout[slot]].nom).join(', ');
            const commande = '!equip ' + numeros.join(',');
            barre.innerHTML = `
                <div class="barre-loadout">
                    <div class="resume">Loadout sélectionné (<b>${numeros.length}</b>) : ${noms}</div>
                    <button class="bouton-loadout" id="btnCopierLoadout">📋 Copier "${commande}"</button>
                </div>
            `;
            document.getElementById('btnCopierLoadout').addEventListener('click', (e) => {
                navigator.clipboard.writeText(commande).then(() => {
                    const btn = e.target;
                    const texteOriginal = btn.textContent;
                    btn.textContent = '✓ Copié !';
                    btn.classList.add('copie');
                    setTimeout(() => { btn.textContent = texteOriginal; btn.classList.remove('copie'); }, 1500);
                });
            });
        }

        // Décoche une case déjà cochée pour un autre objet, sans redéclencher cette même logique
        function decocherSelection(slotCible) {
            const numeroActuel = selectionLoadout[slotCible];
            if (numeroActuel === undefined) return;
            delete selectionLoadout[slotCible];
            const checkbox = conteneur.querySelector(`.carte-select input[data-slot="${slotCible}"][data-numero="${numeroActuel}"]`);
            if (checkbox) { checkbox.checked = false; checkbox.closest('.carte').classList.remove('dans-loadout'); }
        }

        // Une arme à 2 mains et un off-hand ne peuvent jamais être sélectionnés ensemble
        // (exactement la même règle que le jeu applique à l'équipement réel).
        function appliquerIncompatibiliteArme2Mains(slotModifie) {
            if (slotModifie === 'weapon') {
                const numeroArme = selectionLoadout.weapon;
                const armeEst2Mains = numeroArme !== undefined && REFERENCE[numeroArme]?.hand === 'two_handed';
                if (armeEst2Mains && selectionLoadout.offhand !== undefined) decocherSelection('offhand');
            } else if (slotModifie === 'offhand') {
                const numeroArme = selectionLoadout.weapon;
                const armeEst2Mains = numeroArme !== undefined && REFERENCE[numeroArme]?.hand === 'two_handed';
                if (armeEst2Mains && selectionLoadout.offhand !== undefined) decocherSelection('weapon');
            }
        }

        conteneur.querySelectorAll('.carte-select input').forEach(input => {
            input.addEventListener('change', () => {
                const slot = input.dataset.slot;
                const numero = parseInt(input.dataset.numero, 10);
                if (input.checked) {
                    // Un seul objet sélectionné par emplacement : décoche les autres du même slot
                    conteneur.querySelectorAll(`.carte-select input[data-slot="${slot}"]`).forEach(autre => {
                        if (autre !== input) {
                            autre.checked = false;
                            autre.closest('.carte').classList.remove('dans-loadout');
                        }
                    });
                    selectionLoadout[slot] = numero;
                    input.closest('.carte').classList.add('dans-loadout');
                    appliquerIncompatibiliteArme2Mains(slot);
                } else {
                    delete selectionLoadout[slot];
                    input.closest('.carte').classList.remove('dans-loadout');
                }
                majBarreLoadout();
            });
        });
    }

    // Charge les valeurs de stats/passifs depuis le fichier généré par 0_Catalogue_Init.cs
    let STATS = {};
    fetch('catalogue_stats.json')
        .then(r => r.json())
        .then(data => { STATS = data; afficherTout(); })
        .catch(() => {
            document.getElementById('grille').innerHTML =
                '<div class="vide-message">Impossible de charger catalogue_stats.json — vérifie qu\'il est bien présent à côté de cette page.</div>';
        });
</script>
</body>
</html>
