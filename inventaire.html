<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon inventaire</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0;
    --commun: #8d8d8d; --normal: #5ddd7a; --rare: #4a9fd8; --legendaire: #f2c230; --line: #2c2c2e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 40px 20px; }
h1, h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
.page { max-width: 980px; margin: 0 auto; }

.entete { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 3px solid var(--yellow); margin-bottom: 26px; }
.entete img.avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--yellow); flex-shrink: 0; }
.entete-texte h1 { font-size: 26px; font-weight: 700; }
.entete-texte h1 span { color: var(--yellow); }
.entete-texte p { color: var(--paper-dim); font-size: 13.5px; margin-top: 4px; }

.bloc-lootbox {
    background: rgba(242,194,48,0.1); border: 1px solid var(--yellow); border-radius: 6px;
    padding: 14px 18px; margin-bottom: 20px; font-size: 15px; color: var(--paper);
}
.bloc-lootbox .cmd {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; color: var(--yellow);
    background: rgba(0,0,0,0.35); padding: 2px 8px; border-radius: 3px;
}

.titre-section {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--paper-dim); margin: 24px 0 10px;
}

.emplacements { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 10px; }
.emplacement { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; text-align: center; }
.emplacement .label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px; color: var(--paper-dim); text-transform: uppercase; margin-bottom: 8px; }
.emplacement .icone { font-size: 28px; margin-bottom: 6px; }
.icone-img { width: 44px; height: 44px; object-fit: contain; }
.emplacement .nom { font-size: 12.5px; font-weight: 600; }
.emplacement.vide .nom { color: var(--paper-dim); font-style: italic; }

.categorie { margin-bottom: 30px; }
.categorie-titre { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.categorie-titre h2 { font-size: 17px; font-weight: 600; }
.categorie-titre::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }

.carte { background: var(--bg-panel); border: 1px solid var(--line); border-left: 4px solid var(--commun); border-radius: 4px; padding: 14px; position: relative; display: flex; flex-direction: column; height: 100%; }
.carte.normal { border-left-color: var(--normal); }
.carte.rare { border-left-color: var(--rare); }
.carte.legendaire { border-left-color: var(--legendaire); }
.carte.equipe { background: rgba(242,194,48,0.08); }

.carte-select { position: absolute; top: 10px; right: 10px; cursor: pointer; z-index: 2; }
.carte-select input { accent-color: var(--yellow); width: 18px; height: 18px; cursor: pointer; }
.carte.dans-loadout { outline: 2px solid var(--yellow); outline-offset: -1px; }

.carte-image-zone { display: flex; justify-content: center; margin-bottom: 10px; }
.carte-icon { max-width: 150px; width: 100%; height: auto; max-height: 120px; object-fit: contain; }
.carte-icon-emoji { font-size: 64px; line-height: 1; }

.carte-nom-ligne { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.carte-nom { font-size: 15px; font-weight: 600; }
.carte-niveau {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-size: 12px; font-weight: 900; color: var(--yellow);
    border: 1.5px solid var(--yellow); border-radius: 4px; padding: 1px 6px;
    background: rgba(242,194,48,0.12);
}

.carte-bloc-stats { font-size: 12.5px; color: var(--paper-dim); margin-bottom: 8px; line-height: 1.5; }
.carte-bloc-stats .titre-bloc { color: var(--yellow); font-weight: 700; }
.carte-bloc-stats b { color: var(--paper); font-weight: 600; }
.carte-bloc-stats .malus { color: #ff8080; font-weight: 600; }

.stat-ligne { font-size: 13px; margin-bottom: 4px; }
.stat-ligne .label { color: var(--paper-dim); font-weight: 600; margin-right: 5px; }
.stat-ligne .valeur-positive { color: #5ddd7a; font-weight: 700; }
.stat-ligne .valeur-negative { color: #ff6b6b; font-weight: 700; }
.stat-ligne .valeur-neutre { color: var(--paper); font-weight: 700; }
.bloc-passif { font-size: 12.5px; color: var(--paper-dim); line-height: 1.45; }
.bloc-passif b { color: var(--paper); font-weight: 600; }

/* Sections de carte clairement séparées : Scaling / Bonus (ou Statistiques) / Passif */
.bloc-section { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a2a2a; }
.bloc-section:first-of-type { border-top: none; margin-top: 6px; padding-top: 0; }
.section-titre {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    color: var(--yellow); opacity: 0.85; margin-bottom: 5px;
}
.scaling-grille { display: flex; flex-wrap: wrap; gap: 4px; }
.scaling-item { display: flex; flex-direction: column; align-items: center; min-width: 26px; }
.scaling-item .scaling-label { font-size: 9px; color: var(--paper-dim); margin-bottom: 2px; }
.scaling-item .scaling-lettre { font-size: 15px; font-weight: 800; }
.scaling-degats { font-size: 13px; color: var(--paper-dim); margin-top: 6px; }
.scaling-degats b { color: var(--paper); font-weight: 700; }
.scaling-degats b { color: var(--paper); font-weight: 700; }

.carte { cursor: pointer; }
.carte:hover { border-color: #444; }

.carte-cmd { font-family: 'Barlow Condensed', sans-serif; font-size: 12.5px; color: var(--paper-dim); background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 3px; display: inline-block; margin-top: auto; align-self: flex-start; }
.carte.equipe .carte-cmd { color: var(--yellow); }
.carte-cmd.cliquable { cursor: pointer; border: 1px solid var(--line); transition: all 0.15s ease; }
.carte-cmd.cliquable:hover { border-color: var(--yellow); color: var(--yellow); }
.carte-cmd.copie { color: var(--yellow); border-color: var(--yellow); }

.barre-loadout {
    position: sticky; bottom: 16px; margin-top: 30px;
    background: var(--bg-panel); border: 1px solid var(--yellow); border-radius: 8px;
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6); flex-wrap: wrap;
}
.barre-loadout .resume { font-size: 13px; color: var(--paper-dim); flex: 1; min-width: 200px; }
.barre-loadout .resume b { color: var(--paper); }
.bouton-loadout {
    background: var(--yellow); color: #000; border: none;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 10px 18px; border-radius: 5px; cursor: pointer; white-space: nowrap;
}
.bouton-loadout.copie { background: #7dffc4; }

.message-erreur {
    background: rgba(168,39,31,0.15); border: 1px solid var(--red); color: #ff9d9d;
    padding: 10px 16px; border-radius: 6px; font-size: 13px; margin-top: 10px;
    animation: apparitionErreur 0.2s ease-out;
}
@keyframes apparitionErreur { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.vide-message { text-align: center; padding: 80px 20px; color: var(--paper-dim); }

@media (max-width: 640px) {
    body { padding: 20px 12px; }
    .entete-texte h1 { font-size: 20px; }
    .entete img.avatar { width: 44px; height: 44px; }
    .entete-texte p { font-size: 12px; }
    .bloc-lootbox { font-size: 13.5px; padding: 12px 14px; }
    .emplacements { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .emplacement { padding: 10px; }
    .grille { grid-template-columns: 1fr; gap: 10px; }
    .categorie-titre h2 { font-size: 15px; }
    .carte-cmd.cliquable { padding: 8px 12px; }
    .carte-icon { max-height: 110px; }
}
</style>
</head>
<body>
<div class="page">
    <div class="entete">
        <img class="avatar" id="avatarViewer" src="" alt="" style="display:none;">
        <div class="entete-texte">
            <h1 id="titreInventaire">MON <span>INVENTAIRE</span></h1>
            <p>Sélectionnez plusieurs équipements à équiper afin d'avoir la commande à copier/coller directement dans le chat Twitch. Mis à jour toutes les 5-10 minutes.</p>
        </div>
    </div>
    <div id="zoneLootbox"></div>
    <div class="titre-section">Loadout actuel</div>
    <div id="emplacements" class="emplacements"></div>
    <div id="grille"></div>
</div>

<script>
    const LABELS_SLOT = { weapon: "Arme", offhand: "Off-hand", torso: "Armure", strategeme: "Stratagème" };
    const LABELS_CATEGORIE = {
        weapon_1h: "Armes à une main", weapon_2h: "Armes à deux mains",
        offhand: "Off-hand", torso: "Armure", strategeme: "Stratagème",
    };
    function categorieAffichage(item) {
        if (item.slot === "weapon") return item.hand === "two_handed" ? "weapon_2h" : "weapon_1h";
        return item.slot;
    }
    const LABELS_STAT = { atk: "ATK", def: "DEF", pv: "PDV", esquive: "Esquive", spd: "Vitesse" };
    // Suffixe à ajouter après la valeur d'une stat — seule l'esquive est un pourcentage.
    const SUFFIXE_STAT = { esquive: "%" };
    const suffixeStat = (stat) => SUFFIXE_STAT[stat] || "";

    // Affiche "base" si l'objet n'a pas encore de niveau (ou que cette stat ne grossit pas du
    // tout), ou "base → actuel" sinon — pour visualiser d'un coup d'œil le gain déjà obtenu
    // grâce aux doublons possédés. `formatteur` reçoit une valeur numérique brute et rend la
    // chaîne finale (signe, suffixe %, etc.), pour rester cohérent avec l'affichage existant.
    function formatEvolution(base, actuel, formatteur) {
        if (actuel === base) return formatteur(base);
        return `${formatteur(base)} → <b>${formatteur(actuel)}</b>`;
    }


    // Dégradé cohérent du meilleur (S, or) au plus faible (E, gris) — chaud vers froid.
    const COULEUR_LETTRE_SCALING = { S: "#f2c230", A: "#e8934a", B: "#d65f5f", C: "#a878c9", D: "#6a9bc3", E: "#8d8d8d" };
    const STATS_SCALABLES = ["atk", "def", "pv", "spd", "crit"];
    const LABELS_SCALING = { atk: "ATK", def: "DEF", pv: "PV", spd: "SPD", crit: "CRIT" };


    const GABARITS_PASSIF = {
        Lifesteal: (v, s) => `Vol de vie : <b>${v}%</b> des dégâts infligés sont rendus en PV.`,
        PoisonDegats: (v, s) => `Poison : inflige <b>${v}</b> dégâts au tour suivant, puis <b>${Math.max(0, v - 1)}</b>, <b>${Math.max(0, v - 2)}</b>... jusqu'à 0 (s'additionne si réappliqué).`,
        EtourdissementChance: (v, s) => `<b>${v}%</b> de chance d'étourdir la cible (saute son tour suivant).`,
        ExecutionBonus: (v, s) => `Sous <b>${s.executionSeuil}%</b> de PV, inflige <b>+${v}%</b> de dégâts.`,
        Precision: (v, s) => `<b>+${v}</b> précision — réduit l'esquive adverse.`,
        Blocage: (v, s) => `<b>${v}%</b> de chance de bloquer, réduit alors les dégâts de <b>${s.blocageReduction}%</b>.`,
        Reflection: (v, s) => `Renvoie <b>${v}%</b> des dégâts subis à l'attaquant.`,
        ResistancePoison: (v, s) => `<b>${v}%</b> de résistance au poison.`,
        Regeneration: (v, s) => `Régénère <b>${v}%</b> des PV max à chaque tour.`,
        ResistanceCrit: (v, s) => `<b>-${v}</b> points de chance d'être touché par un critique.`,
        SoinDirect: (v, s) => `Soigne <b>${v} PV</b>, <b>${s.usagesParCombat}</b> usages/combat (recharge ${s.cooldownTours} tours), si des PV manquent.`,
        SaignementDegats: (v, s) => `Saignement : <b>${v}</b> dégâts/stack par tour (perd 1 stack/tour).`,
        AntiHealPourcentage: (v, s) => `Réduit les soins reçus par la cible de <b>${v}%</b> pendant <b>${s.antiHealDuree}</b> tours.`,
        ShieldMontant: (v, s) => `Accorde un bouclier de <b>${v} PV</b> en début de combat.`,
        RageBonusMax: (v, s) => `Dégâts jusqu'à <b>+${v}%</b> quand tes PV descendent vers <b>${s.rageSeuilMin}%</b>.`,
        MarqueDegatsPourcentage: (v, s) => `Marque la cible touchée : <b>+${v}%</b> dégâts reçus pendant <b>${s.marqueDuree}</b> tours.`,
        ParadeChance: (v, s) => `<b>${v}%</b> de chance d'annuler un coup reçu et de riposter immédiatement.`,
        TenaciteChance: (v, s) => `<b>${v}%</b> de chance de résister à un étourdissement.`,
        DernierSouffleActif: () => `Une fois par combat, survit à <b>1 PV</b> au lieu de mourir.`,
        FrenesieBonusSpd: (v, s) => `Un critique accorde <b>+${v}</b> Vitesse pendant <b>${s.frenesieDuree}</b> tours.`,
    };
    const CHAMP_PAR_STAT_PRINCIPALE = {
        Lifesteal: "lifesteal", PoisonDegats: "poisonDegats", EtourdissementChance: "etourdissementChance",
        ExecutionBonus: "executionBonus", Precision: "precision", Blocage: "blocage", Reflection: "reflection",
        ResistancePoison: "resistancePoison", Regeneration: "regeneration", ResistanceCrit: "resistanceCrit",
        SoinDirect: "soinDirect", SaignementDegats: "saignementDegats",
        AntiHealPourcentage: "antiHealPourcentage", ShieldMontant: "shieldMontant", RageBonusMax: "rageBonusMax",
        MarqueDegatsPourcentage: "marqueDegatsPourcentage", ParadeChance: "paradeChance", TenaciteChance: "tenaciteChance",
        DernierSouffleActif: "dernierSouffleActif", FrenesieBonusSpd: "frenesieBonusSpd",
    };

    const params = new URLSearchParams(window.location.search);
    const pseudo = params.get('user');

    // Rempli une fois players.json chargé (voir tout en bas) — reste vide tant que ce n'est pas le cas.
    let equipeParSlot = { weapon: 0, offhand: 0, torso: 0, strategeme: 0 };
    let possedesParam = [];
    let nbLootbox = 0;

    const iconeOuImage = (ref, classeImg) => ref.image
        ? `<img src="${ref.image}" alt="" class="${classeImg}">`
        : `<span class="${classeImg}-emoji">${ref.icone}</span>`;

    // Construit TOUS les passifs actifs sur l'objet (n'importe quel effet non-nul), pas
    // seulement celui pointé par StatPrincipale. Seul le champ qui correspond VRAIMENT à
    // StatPrincipale reçoit la mise à l'échelle par niveau — les autres s'affichent à leur
    // valeur fixe. C'est ce qui permet d'avoir un passif totalement indépendant du système
    // d'amélioration par doublon.
    function construirePassifs(s, niveau, exclureChamp, exclusionsSupplementaires) {
        const passifs = [];
        const exclusions = new Set([exclureChamp, ...(exclusionsSupplementaires || [])]);
        for (const nomStat in CHAMP_PAR_STAT_PRINCIPALE) {
            if (exclusions.has(nomStat)) continue;
            const champ = CHAMP_PAR_STAT_PRINCIPALE[nomStat];
            const base = s[champ];
            const estActif = typeof base === 'boolean' ? base : base > 0;
            if (!estActif) continue;
            const scaleAvecNiveau = s.statPrincipale === nomStat;
            const actuel = typeof base === 'boolean' ? base : (scaleAvecNiveau ? base + niveau * s.incrementPassif : base);
            passifs.push(GABARITS_PASSIF[nomStat](actuel, s));
        }
        return passifs;
    }

    // Rangée de badges de scaling (ATK/DEF/PV/SPD/CRIT) — seulement pour une arme qui en définit.
    // Un tiret long remplace la lettre pour toute stat sur laquelle l'arme ne scale pas.
    function construireScaling(s, niveau) {
        if (!s.scaling1Stat) return null;
        const badges = STATS_SCALABLES.map(stat => {
            let lettre = null;
            if (s.scaling1Stat === stat) lettre = s.scaling1Lettre;
            else if (s.scaling2Stat === stat) lettre = s.scaling2Lettre;
            const couleur = lettre ? (COULEUR_LETTRE_SCALING[lettre] || "#8d8d8d") : "#555";
            return `<div class="scaling-item"><span class="scaling-label">${LABELS_SCALING[stat]}</span><span class="scaling-lettre" style="color:${couleur}">${lettre || "—"}</span></div>`;
        }).join("");

        // Fourchette de dégâts de base — affiche la progression base → actuelle si l'objet a
        // un niveau ET que sa fourchette grossit effectivement avec (IncrementBaseDegats).
        const texteFourchette = (min, max) => `${Math.round(min)} - ${Math.round(max)}`;
        const baseMin = s.baseDegatsMin, baseMax = s.baseDegatsMax;
        const actuelMin = baseMin + niveau * s.incrementBaseDegats;
        const actuelMax = baseMax + niveau * s.incrementBaseDegats;
        const texteDegats = (niveau > 0 && s.incrementBaseDegats !== 0)
            ? `${texteFourchette(baseMin, baseMax)} → <b>${texteFourchette(actuelMin, actuelMax)}</b>`
            : `<b>${texteFourchette(baseMin, baseMax)}</b>`;
        const ligneDegats = `<div class="scaling-degats">Dégâts : ${texteDegats}</div>`;

        return `<div class="scaling-grille">${badges}</div>${ligneDegats}`;
    }

    function construireDetails(numero, niveau, estStrategeme) {
        const s = STATS[numero];
        if (!s) return { scalingHtml: null, lignesStat: [], passifTexte: "" };

        // Soin actif (Stimulant et similaires) : montant/utilisations/cooldown en clair, plutôt
        // qu'une phrase de passif — quel que soit le slot de l'objet.
        if (s.soinDirect > 0 || s.statPrincipale === "SoinDirect") {
            const actuel = s.statPrincipale === "SoinDirect" ? s.soinDirect + niveau * s.incrementPassif : s.soinDirect;
            const lignesStat = [{ label: "Montant soigné", valeur: formatEvolution(s.soinDirect, actuel, (v) => v), colorer: false }];
            if (s.usagesParCombat > 0) lignesStat.push({ label: "Utilisations", valeur: s.usagesParCombat, colorer: false });
            if (s.cooldownTours > 0) lignesStat.push({ label: "Cooldown", valeur: s.cooldownTours + " tours", colorer: false });
            return { scalingHtml: null, lignesStat, passifTexte: construirePassifs(s, niveau, "SoinDirect").join(" ") };
        }

        if (estStrategeme) {
            const lignesStat = [];

            if (s.degatsDirects > 0 || s.statPrincipale === "DegatsDirects") {
                const actuel = s.statPrincipale === "DegatsDirects" ? s.degatsDirects + niveau * s.incrementPassif : s.degatsDirects;
                const coups = s.coupsParUsage > 1 ? ` x ${s.coupsParUsage}` : "";
                lignesStat.push({ label: "Dégâts", valeur: formatEvolution(s.degatsDirects, actuel, (v) => v) + coups, colorer: false });
            }
            // Poison affiché comme stat ET conservé en passif (qui détaille la dégression) —
            // les deux se complètent, contrairement au Bouclier ci-dessous.
            if (s.poisonDegats > 0 || s.statPrincipale === "PoisonDegats") {
                const actuel = s.statPrincipale === "PoisonDegats" ? s.poisonDegats + niveau * s.incrementPassif : s.poisonDegats;
                lignesStat.push({ label: "Poison", valeur: formatEvolution(s.poisonDegats, actuel, (v) => v) + " stacks", colorer: false });
            }
            // Bouclier : affiché comme stat CLAIRE, exclu du passif générique juste après (son
            // ancien libellé "en début de combat" ne serait plus exact pour un Stratagème, qui
            // l'accorde désormais à chaque déclenchement réel).
            if (s.shieldMontant > 0 || s.statPrincipale === "ShieldMontant") {
                const actuel = s.statPrincipale === "ShieldMontant" ? s.shieldMontant + niveau * s.incrementPassif : s.shieldMontant;
                lignesStat.push({ label: "Bouclier", valeur: formatEvolution(s.shieldMontant, actuel, (v) => v), colorer: false });
            }
            if (s.usagesParCombat > 0) lignesStat.push({ label: "Utilisations", valeur: s.usagesParCombat, colorer: false });
            if (s.cooldownTours > 0) lignesStat.push({ label: "Cooldown", valeur: s.cooldownTours + " tours", colorer: false });

            const passifs = construirePassifs(s, niveau, "DegatsDirects", ["ShieldMontant"]);
            if (s.penetration > 0) passifs.push(`Pénétration : <b>${s.penetration}%</b>`);
            // Déclenchement différé (Solo Silo) : explique le principe directement, la personne
            // adapte le libellé exact de ses objets comme elle le souhaite par la suite.
            if (s.delaiTours > 0) passifs.push(`Lancé immédiatement, atterrit après <b>${s.delaiTours}</b> tour${s.delaiTours > 1 ? "s" : ""}.`);
            return { scalingHtml: null, lignesStat, passifTexte: passifs.join(" ") };
        }

        // Bonus (Stat/Stat2/Stat3) : les 3 emplacements montent TOUJOURS avec leur PROPRE
        // incrément, indépendamment de StatPrincipale (voir 11_Duel.cs) — la valeur "actuelle"
        // doit donc toujours appliquer niveau × increment, jamais seulement pour StatPrincipale.
        const lignesStat = [];
        if (s.stat) {
            const label = LABELS_STAT[s.stat] || s.stat;
            const actuel = s.bonus + niveau * s.increment;
            const formatteur = (v) => (v >= 0 ? "+" : "") + v + suffixeStat(s.stat);
            lignesStat.push({ label, valeur: formatEvolution(s.bonus, actuel, formatteur), colorer: true });
        }
        if (s.stat2) {
            const label2 = LABELS_STAT[s.stat2] || s.stat2;
            const actuel2 = s.bonus2 + niveau * s.increment2;
            const formatteur2 = (v) => (v >= 0 ? "+" : "") + v + suffixeStat(s.stat2);
            lignesStat.push({ label: label2, valeur: formatEvolution(s.bonus2, actuel2, formatteur2), colorer: true });
        }
        if (s.stat3) {
            const label3 = LABELS_STAT[s.stat3] || s.stat3;
            const actuel3 = s.bonus3 + niveau * s.increment3;
            const formatteur3 = (v) => (v >= 0 ? "+" : "") + v + suffixeStat(s.stat3);
            lignesStat.push({ label: label3, valeur: formatEvolution(s.bonus3, actuel3, formatteur3), colorer: true });
        }

        const passifTexte = construirePassifs(s, niveau, "Bonus").join(" ");

        return { scalingHtml: construireScaling(s, niveau), lignesStat, passifTexte };
    }


    function rendreLigneStat({ label, valeur, colorer }) {
        let classe = 'valeur-neutre';
        if (colorer) classe = parseFloat(valeur) < 0 ? 'valeur-negative' : 'valeur-positive';
        return `<div class="stat-ligne"><span class="label">${label}</span><span class="${classe}">${valeur}</span></div>`;
    }

    function afficherTout() {
        if (possedesParam.length === 0) {
            document.getElementById('emplacements').style.display = 'none';
            document.getElementById('grille').innerHTML = '<div class="vide-message">Aucun objet pour le moment.</div>';
            return;
        }

        const emplacementsEl = document.getElementById('emplacements');
        Object.keys(LABELS_SLOT).forEach(slot => {
            const numero = equipeParSlot[slot];
            const ref = numero > 0 ? STATS[numero] : null;
            const div = document.createElement('div');
            div.className = 'emplacement' + (ref ? '' : ' vide');
            div.innerHTML = `<div class="label">${LABELS_SLOT[slot]}</div>
                              <div class="icone">${ref ? iconeOuImage(ref, 'icone-img') : '—'}</div>
                              <div class="nom">${ref ? ref.nom : 'Aucun'}</div>`;
            emplacementsEl.appendChild(div);
        });

        const parCategorie = { weapon_1h: [], weapon_2h: [], offhand: [], torso: [], strategeme: [] };
        possedesParam.forEach(({ numero, niveau }) => {
            const ref = STATS[numero];
            if (!ref) return;
            const item = { numero, niveau, ...ref };
            const cat = categorieAffichage(item);
            if (!parCategorie[cat]) {
                // Le "slot" de cet objet dans catalogue_stats.json ne correspond à aucune catégorie
                // connue (vide, mal orthographié, mauvaise casse...) — on l'ignore plutôt que de
                // faire planter tout l'affichage, et on le signale clairement en console.
                console.warn(`Objet #${numero} ("${item.nom || '?'}") ignoré : slot inconnu = "${item.slot}"`);
                return;
            }
            parCategorie[cat].push(item);
        });

        const conteneur = document.getElementById('grille');
        Object.keys(LABELS_CATEGORIE).forEach(cat => {
            const items = parCategorie[cat];
            if (items.length === 0) return;

            const bloc = document.createElement('div');
            bloc.className = 'categorie';
            bloc.innerHTML = `<div class="categorie-titre"><h2>${LABELS_CATEGORIE[cat]}</h2></div><div class="grille"></div>`;
            const grilleInterne = bloc.querySelector('.grille');

            items.forEach(item => {
                const estEquipe = equipeParSlot[item.slot] === item.numero;
                const estStrategeme = item.slot === 'strategeme';
                const { scalingHtml, lignesStat, passifTexte } = construireDetails(item.numero, item.niveau, estStrategeme);
                const rarete = item.rarete || 'commun';
                const carte = document.createElement('div');
                carte.className = 'carte ' + rarete + (estEquipe ? ' equipe' : '');
                carte.innerHTML = `
                    ${item.niveau > 0 ? `<span class="carte-niveau">+${item.niveau}</span>` : ''}
                    <label class="carte-select">
                        <input type="checkbox" data-numero="${item.numero}" data-slot="${item.slot}" data-hand="${item.hand || ''}">
                    </label>
                    <div class="carte-image-zone">${iconeOuImage(item, 'carte-icon')}</div>
                    <div class="carte-nom-ligne">
                        <span class="carte-nom">${item.nom}</span>
                    </div>
                    ${scalingHtml ? `<div class="bloc-section"><div class="section-titre">Scaling</div>${scalingHtml}</div>` : ''}
                    ${lignesStat.length > 0 ? `<div class="bloc-section"><div class="section-titre">${estStrategeme ? 'Statistiques' : 'Bonus'}</div>${lignesStat.map(rendreLigneStat).join('')}</div>` : ''}
                    ${passifTexte ? `<div class="bloc-section"><div class="section-titre">Passif</div><div class="bloc-passif">${passifTexte}</div></div>` : ''}
                    ${estEquipe ? `<span class="carte-cmd">✓ Équipé</span>` : `<span class="carte-cmd">!equip ${item.numero}</span>`}
                `;
                grilleInterne.appendChild(carte);
            });

            conteneur.appendChild(bloc);
        });

        // Clic n'importe où sur la carte = coche/décoche la sélection pour le loadout groupé
        // (le clic direct sur la case elle-même reste géré nativement, on évite juste le double-toggle).
        conteneur.querySelectorAll('.carte').forEach(carte => {
            carte.addEventListener('click', (e) => {
                if (e.target.tagName === 'INPUT') return;
                const input = carte.querySelector('.carte-select input');
                input.checked = !input.checked;
                input.dispatchEvent(new Event('change'));
            });
        });

        const selectionLoadout = {};

        function afficherErreurSelection(message) {
            let barre = document.getElementById('barreLoadout');
            if (!barre) { barre = document.createElement('div'); barre.id = 'barreLoadout'; document.querySelector('.page').appendChild(barre); }
            const ancienneErreur = barre.querySelector('.message-erreur');
            if (ancienneErreur) ancienneErreur.remove();
            const div = document.createElement('div');
            div.className = 'message-erreur';
            div.textContent = message;
            barre.appendChild(div);
            setTimeout(() => div.remove(), 3500);
        }

        function majBarreLoadout() {
            let barre = document.getElementById('barreLoadout');
            if (!barre) { barre = document.createElement('div'); barre.id = 'barreLoadout'; document.querySelector('.page').appendChild(barre); }
            const numeros = Object.values(selectionLoadout);
            if (numeros.length === 0) { barre.innerHTML = ''; return; }
            const noms = Object.keys(selectionLoadout).map(slot => STATS[selectionLoadout[slot]].nom).join(', ');
            const commande = '!equip ' + numeros.join(',');
            barre.innerHTML = `
                <div class="barre-loadout">
                    <div class="resume">Loadout sélectionné (<b>${numeros.length}</b>) : ${noms}</div>
                    <button class="bouton-loadout" id="btnCopierLoadout">📋 Copier "${commande}"</button>
                </div>
            `;
            document.getElementById('btnCopierLoadout').addEventListener('click', (e) => {
                navigator.clipboard.writeText(commande).then(() => {
                    const btn = e.target;
                    const texteOriginal = btn.textContent;
                    btn.textContent = '✓ Copié !';
                    btn.classList.add('copie');
                    setTimeout(() => { btn.textContent = texteOriginal; btn.classList.remove('copie'); }, 1500);
                });
            });
        }

        conteneur.querySelectorAll('.carte-select input').forEach(input => {
            input.addEventListener('change', () => {
                const slot = input.dataset.slot;
                const hand = input.dataset.hand;
                const numero = parseInt(input.dataset.numero, 10);

                if (input.checked) {
                    if (slot === 'weapon' && hand === 'two_handed' && selectionLoadout.offhand !== undefined) {
                        input.checked = false;
                        afficherErreurSelection("Impossible : une arme à deux mains ne peut pas être combinée avec un off-hand. Désélectionne d'abord l'un des deux.");
                        return;
                    }
                    if (slot === 'offhand') {
                        const numeroArme = selectionLoadout.weapon;
                        const armeEst2Mains = numeroArme !== undefined && STATS[numeroArme]?.hand === 'two_handed';
                        if (armeEst2Mains) {
                            input.checked = false;
                            afficherErreurSelection("Impossible : un off-hand ne peut pas être combiné avec une arme à deux mains. Désélectionne d'abord l'un des deux.");
                            return;
                        }
                    }

                    conteneur.querySelectorAll(`.carte-select input[data-slot="${slot}"]`).forEach(autre => {
                        if (autre !== input) { autre.checked = false; autre.closest('.carte').classList.remove('dans-loadout'); }
                    });
                    selectionLoadout[slot] = numero;
                    input.closest('.carte').classList.add('dans-loadout');
                } else {
                    delete selectionLoadout[slot];
                    input.closest('.carte').classList.remove('dans-loadout');
                }
                majBarreLoadout();
            });
        });
    }

    function afficherJoueurIntrouvable() {
        document.getElementById('titreInventaire').innerHTML = pseudo ? `INVENTAIRE DE <span>${pseudo}</span>` : 'MON <span>INVENTAIRE</span>';
        document.getElementById('emplacements').style.display = 'none';
        document.getElementById('grille').innerHTML =
            '<div class="vide-message">Pas encore de données pour ce joueur — la prochaine synchronisation (toutes les 5 à 10 minutes) les fera apparaître après un premier achat de stat, d\'objet ou un premier combat.</div>';
    }

    let STATS = {};
    if (!pseudo) {
        afficherJoueurIntrouvable();
    } else {
        // "?v=" + horodatage : force le navigateur (et le CDN de GitHub Pages) à toujours récupérer
        // la version la plus fraîche, au lieu de servir une copie mise en cache.
        Promise.all([
            fetch('catalogue_stats.json?v=' + Date.now()).then(r => r.json()),
            fetch('players.json?v=' + Date.now()).then(r => r.json()),
        ]).then(([catalogue, joueurs]) => {
            STATS = catalogue;
            const joueur = joueurs[pseudo];
            if (!joueur) { afficherJoueurIntrouvable(); return; }

            document.getElementById('titreInventaire').innerHTML = `INVENTAIRE DE <span>${joueur.nomAffichage}</span>`;
            if (joueur.avatar) {
                const img = document.getElementById('avatarViewer');
                img.src = joueur.avatar;
                img.style.display = 'block';
            }

            // ⚠️ players.json (17_Publier_Snapshot_Joueurs.cs) utilise "arme"/"armure" pour le
            // loadout, alors que catalogue_stats.json (et donc tout le reste de cette page) parle
            // en "weapon"/"torso" — recalé ici plutôt que dans les 2 autres fichiers, qui
            // fonctionnent déjà tels quels avec ces noms.
            equipeParSlot = {
                weapon: joueur.loadout.arme, offhand: joueur.loadout.offhand,
                torso: joueur.loadout.armure, strategeme: joueur.loadout.strategeme,
            };
            possedesParam = joueur.inventaire || [];
            nbLootbox = joueur.lootbox || 0;

            if (nbLootbox > 0) {
                document.getElementById('zoneLootbox').innerHTML =
                    `<div class="bloc-lootbox">🎁 Tu as <strong>${nbLootbox}</strong> lootbox en attente — tape <span class="cmd">!lootbox</span> dans le chat pour l'ouvrir !</div>`;
            }

            try {
                afficherTout();
            } catch (erreurAffichage) {
                console.error('Erreur pendant l\'affichage de l\'inventaire :', erreurAffichage);
                document.getElementById('grille').innerHTML =
                    '<div class="vide-message">Données chargées, mais une erreur est survenue pendant l\'affichage : '
                    + erreurAffichage.message + ' (détail complet dans la console du navigateur, F12).</div>';
            }
        }).catch((erreurChargement) => {
            console.error('Erreur de chargement :', erreurChargement);
            document.getElementById('grille').innerHTML =
                '<div class="vide-message">Impossible de charger catalogue_stats.json ou players.json — vérifie qu\'ils sont bien présents à côté de cette page.</div>';
        });
    }
</script>

</html>
