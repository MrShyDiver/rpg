<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitch RPG — Cibles</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0; --line: #2c2c2e;
    --equitable: #5ddd7a; --dessus: #4a9fd8; --dessous: #8d8d8d; --negatif: #ff6b6b;
}
* { box-sizing: border-box; }
body {
    background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif;
    margin: 0; padding: 28px 18px 60px; line-height: 1.5;
}
h1, h2, h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; margin: 0; }
.page { max-width: 1040px; margin: 0 auto; }

.entete { padding-bottom: 14px; border-bottom: 3px solid var(--yellow); margin-bottom: 24px; }
.entete h1 { font-size: 28px; font-weight: 700; }
.entete h1 span { color: var(--yellow); }
.entete p { color: var(--paper-dim); font-size: 14px; margin: 7px 0 0; max-width: 68ch; }

.solde-barre {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: rgba(242,194,48,.08); border: 1px solid var(--yellow); border-radius: 6px;
    padding: 13px 18px; margin-bottom: 28px;
}
.solde-barre .qui { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; }
.solde-barre .pl { margin-left: auto; font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--yellow); }
.solde-barre .pl span { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--paper-dim); margin-left: 6px; }

.message { color: var(--paper-dim); font-size: 14px; padding: 40px 2px; text-align: center; }
.message b { color: var(--paper); }

/* ===== Sections de tranche ===== */
.tranche-section { margin-bottom: 34px; }
.tranche-tete {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
}
.tranche-tete h2 { font-size: 18px; font-weight: 600; }
.tranche-tete .compte {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--paper-dim); letter-spacing: .5px;
}
.tranche-tete p { color: var(--paper-dim); font-size: 13px; margin: 0; flex-basis: 100%; }
.tranche-section.equitable .tranche-tete h2 { color: var(--equitable); }
.tranche-section.dessus .tranche-tete h2 { color: var(--dessus); }
.tranche-section.dessous .tranche-tete h2 { color: var(--dessous); }

/* ===== Lignes cible ===== */
.cibles { display: flex; flex-direction: column; gap: 8px; }
.cible {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--bg-panel); border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 6px; padding: 12px 16px;
}
.tranche-section.equitable .cible { border-left-color: var(--equitable); }
.tranche-section.dessus .cible { border-left-color: var(--dessus); }
.tranche-section.dessous .cible { border-left-color: var(--dessous); }

.cible-avatar {
    width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
    background: #232326; border: 1px solid var(--line); display: flex;
    align-items: center; justify-content: center; font-family: 'Oswald', sans-serif;
    font-size: 15px; color: var(--paper-dim);
}
.cible-ident { min-width: 150px; flex: 1 1 150px; }
.cible-nom { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; }
.cible-detail { font-size: 12px; color: var(--paper-dim); }
.cible-detail b { color: var(--paper); }
.cible-ecart { font-weight: 700; }
.tranche-section.equitable .cible-ecart { color: var(--equitable); }
.tranche-section.dessus .cible-ecart { color: var(--dessus); }
.tranche-section.dessous .cible-ecart { color: var(--dessous); }

/* ===== Estimation de victoire (simulation) ===== */
/* Volontairement qualitative (voir libelleTauxVictoire dans le JS) : le pourcentage réel n'est
   jamais affiché, seulement un palier textuel, pour ne pas transformer le choix de cible en
   calcul d'optimisation. */
.simu { text-align: center; flex: 0 0 auto; min-width: 96px; }
.simu .label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--paper-dim); margin-bottom: 2px;
}
.simu .val { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: .01em; }
.simu.favorable .val { color: var(--equitable); }
.simu.neutre .val { color: var(--paper); }
.simu.defavorable .val { color: var(--negatif); }
.simu.attenue .val { opacity: .72; }

.issues { display: flex; gap: 16px; flex: 0 0 auto; }
.issue { text-align: center; min-width: 56px; }
.issue .label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--paper-dim); margin-bottom: 2px;
}
.issue .val { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; }
.issue.victoire .val { color: var(--yellow); }
.issue.defaite .val { color: var(--paper-dim); }
.issue.egalite .val { color: var(--paper); }

.cible-action { flex: 0 0 auto; }
.cible-action button {
    font-family: 'Oswald', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--paper-dim); background: none;
    border: 1px solid var(--line); border-radius: 5px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.cible-action button:hover { color: var(--yellow); border-color: var(--yellow); }
.cible-action button.copie { color: var(--yellow); border-color: var(--yellow); }

/* ===== Panneau de comparaison (équipement + stats) ===== */
.cible-compare-toggle {
    font-family: 'Oswald', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--paper-dim); background: none;
    border: 1px solid var(--line); border-radius: 5px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.cible-compare-toggle:hover { color: var(--paper); border-color: var(--paper-dim); }
.cible-compare-toggle.ouvert { color: var(--yellow); border-color: var(--yellow); }

.cible-compare-panel {
    flex-basis: 100%; margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
}
@media (max-width: 640px) { .cible-compare-panel { grid-template-columns: 1fr; } }

.compare-equip-titre, .compare-stats-titre {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .8px;
    text-transform: uppercase; color: var(--paper-dim); margin-bottom: 8px;
}
.compare-equip-liste { display: flex; flex-direction: column; gap: 6px; }
.compare-equip-item { display: flex; align-items: center; gap: 10px; }
.compare-equip-icone {
    width: 30px; height: 30px; border-radius: 5px; background: #1c1c1f; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 15px; overflow: hidden;
}
.compare-equip-icone img { width: 100%; height: 100%; object-fit: contain; }
.compare-equip-nom { font-size: 13px; }
.compare-equip-vide { color: var(--paper-dim); font-size: 12.5px; font-style: italic; }

.compare-stats-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.compare-stats-table td { padding: 3px 0; }
.compare-stats-table td:first-child { color: var(--paper-dim); }
.compare-stats-table td:nth-child(2), .compare-stats-table td:nth-child(4) { text-align: right; font-family: 'Oswald', sans-serif; font-weight: 600; width: 30%; }
.compare-stats-table td:nth-child(3) { text-align: center; color: var(--paper-dim); width: 20px; font-size: 11px; }
.stat-toi-superieur { color: var(--equitable); }
.stat-cible-superieur { color: var(--dessus); }
@media (max-width: 640px) {
    .cible { padding: 11px 13px; }
    .simu { order: 2; min-width: 78px; }
    .issues { width: 100%; justify-content: space-between; order: 3; }
    .cible-action { width: 100%; order: 4; }
    .cible-action button { width: 100%; }
}
</style>
</head>
<body>
<div class="page">

    <div class="entete">
        <h1>Choisir sa <span>cible</span></h1>
        <p>Toutes les personnes à ta portée, classées par tranche de PowerLevel, avec les médailles que
           rapporterait un duel contre chacune — victoire, défaite ou égalité.</p>
    </div>

    <div id="zoneSolde"></div>
    <div id="zoneContenu">
        <div class="message">Cherche ton pseudo dans le menu en haut de la page pour voir tes cibles.</div>
    </div>

</div>

<script src="formule-combat.js"></script>
<script>
/* =====================================================================
   ESTIMATION DE VICTOIRE PAR SIMULATION — port fidèle de ResoudreCombatInterne
   (moteur-combat.cs / 11_Duel.cs), pas une approximation : système d'AP par
   vitesse (celui qui accumule le plus vite agit le plus souvent), fatigue/corde
   partagée, parade+riposte, blocage, exécution, marque, frénésie, ténacité vs
   étourdissement, dernier souffle, anti-heal, reflection, saignement, missiles
   à délai. Contrairement au %d'écart de PowerLevel, ça capture les contres
   directs (anti-crit qui neutralise un build crit, bouclier qui se recharge
   en plein combat...) qu'aucun score agrégé ne peut voir.
   Seule différence assumée avec le vrai moteur : "protectionActive" (une
   mécanique de duel dont je n'ai pas pu vérifier le sens exact du côté "cible"
   dans le code source) est toujours considérée à false ici -- elle ne
   s'applique de toute façon qu'à des cas de duel spécifiques, pas à
   l'équipement d'un build.
   ===================================================================== */
const N_SIMULATIONS = 400;

// Constantes propres au VRAI combat coup par coup, absentes de formule-combat.js
// (qui ne sert qu'à l'estimation de PowerLevel) -- copiées de moteur-combat.cs.
const DUEL_CST = { AP_THRESHOLD: 100.0, FATIGUE_BASE: 10, PROTECTION_REDUCTION: 0.20 };

function preparerCombattant(stacksBrut, equipementBrut) {
    const equipement = nivelerEquipement(equipementBrut);
    const stats = calculerStatsEffectives(stacksBrut, equipement);
    return {
        stats, arme: equipement.arme, offhand: equipement.offhand, torso: equipement.torso, strat: equipement.strat,
        luck: stats.luckLineaire, esquive: CST.BASE_ESQUIVE + (stats.esquiveGear || 0),
        pvMax: stats.pv,
    };
}

// État mutable d'un combattant pour UN combat simulé -- recréé à chaque simulation (restaurerCombattant
// ne suffit plus vu le nombre d'états à réinitialiser, plus simple et plus sûr de repartir de zéro).
function nouvelEtatCombat(prep) {
    const arme = prep.arme, offhand = prep.offhand, torso = prep.torso, strat = prep.strat;
    return {
        stats: { ...prep.stats }, arme, offhand, torso, strat, luck: prep.luck, esquive: prep.esquive,
        pv: prep.pvMax, pvMax: prep.pvMax,
        ap: 0, actionsPropres: 0,
        usagesRestants: strat ? (strat.usagesParCombat || 0) : 0, prochainUsageAction: 0,
        missileActionCible: -1, missileEnVol: null,
        usagesSoinRestants: (offhand && offhand.soinDirect > 0) ? (offhand.usagesParCombat || 0) : 0, prochainSoinAction: 0,
        poisonStack: 0,
        shield: (arme?.shieldMontant || 0) + (offhand?.shieldMontant || 0) + (torso?.shieldMontant || 0),
        saignementStacks: 0, saignementDegatsParStack: 0,
        antiHealPourcentage: 0, antiHealDuree: 0,
        brulureDegats: 0, brulureDuree: 0,
        stanceActuelle: 0, tourDansStance: 0,
        marqueDegats: 0, marqueDuree: 0,
        dernierSouffleDispo: !!((arme && arme.dernierSouffleActif) || (offhand && offhand.dernierSouffleActif) || (torso && torso.dernierSouffleActif)),
        frenesieBonusSpd: 0, frenesieDuree: 0,
        etourdi: false,
    };
}

function appliquerDegatsAvecShield(cible, degats) {
    const absorbe = Math.min(cible.shield, degats);
    cible.shield -= absorbe;
    cible.pv -= (degats - absorbe);
}

function verifierDernierSouffle(c) {
    if (c.pv <= 0 && c.dernierSouffleDispo) { c.pv = 1; c.dernierSouffleDispo = false; }
}

// Port fidèle de CalculerDegatsBaseArme (moteur-combat.cs) -- l'arme reçue est déjà "vue selon la
// stance" (vueArmeSelonStance, formule-combat.js), donc ses champs de dégâts/scaling sont les bons.
function calculerDegatsBaseArme(arme, statsFrappeur, diviseurCoups) {
    if (!arme || !arme.scaling1Stat) return { valeur: statsFrappeur.atk / diviseurCoups, nouveauSysteme: false };
    const baseMin = (arme.baseDegatsMin || 0) / diviseurCoups;
    const baseMax = (arme.baseDegatsMax || 0) / diviseurCoups;
    let total = baseMin + Math.random() * (baseMax - baseMin);
    let atkDejaCompte = false;
    const appliquer = (nomStat, lettre) => {
        if (!nomStat) return;
        const coef = CST.COEF_LETTRE_SCALING[lettre] || 0;
        const valeur = valeurStat(statsFrappeur, nomStat) / diviseurCoups;
        if (nomStat === 'atk') { total += valeur * coef; atkDejaCompte = true; }
        else total += valeur * coef * CST.PENALITE_HORS_ATK;
    };
    appliquer(arme.scaling1Stat, arme.scaling1Lettre);
    appliquer(arme.scaling2Stat, arme.scaling2Lettre);
    if (!atkDejaCompte) total += (statsFrappeur.atk / diviseurCoups) * CST.COEF_ATK_BASE;
    return { valeur: total, nouveauSysteme: true };
}

function declencherSoinActif(porteur, objet) {
    const montantBrut = objet.soinDirect * (1.0 - Math.min(1.0, porteur.antiHealPourcentage / 100.0));
    porteur.pv = Math.min(porteur.pvMax, porteur.pv + montantBrut);
}

function declencherUsageStrategeme(porteur, cible, strategeme) {
    if (strategeme.shieldMontant > 0) { porteur.shield += strategeme.shieldMontant; return; }
    const mitigationStrat = mitigation(cible.stats.def * (1.0 - Math.min(1.0, (strategeme.penetration || 0) / 100.0)));
    const coupsParUsage = Math.max(1, strategeme.coupsParUsage || 1);
    let degatsTotal = 0;
    for (let coup = 0; coup < coupsParUsage; coup++) {
        if (strategeme.degatsDirects > 0) {
            const variance = 0.9 + Math.random() * 0.20;
            degatsTotal += Math.max(0.1, strategeme.degatsDirects * (1.0 - mitigationStrat)) * variance;
        }
    }
    appliquerDegatsAvecShield(cible, degatsTotal);
    if (strategeme.poisonDegats > 0) cible.poisonStack += strategeme.poisonDegats;
    if (strategeme.brulureDegats > 0 && strategeme.brulureDuree > 0) {
        cible.brulureDegats = strategeme.brulureDegats;
        cible.brulureDuree = strategeme.brulureDuree;
    }
}

// Une seule "action propre" de l'acteur : régen, arrivée de missile, activation de stratagème/soin
// actif, poison/saignement/brûlure DE L'ACTEUR SEULEMENT, décomptes de durées (anti-heal/marque/
// frénésie) DES DEUX CÔTÉS, changement de stance -- reproduit l'ordre exact du moteur réel.
function resoudreEffetsDeTour(acteur, adversaire, A, B) {
    const regen = (acteur.torso?.regeneration || 0) + (acteur.offhand?.regeneration || 0);
    if (regen > 0) {
        const montantBrut = acteur.pvMax * regen / 100.0 * (1.0 - Math.min(1.0, acteur.antiHealPourcentage / 100.0));
        acteur.pv = Math.min(acteur.pvMax, acteur.pv + montantBrut);
    }

    if (acteur.missileActionCible === acteur.actionsPropres) {
        declencherUsageStrategeme(acteur, adversaire, acteur.missileEnVol);
        acteur.missileActionCible = -1; acteur.missileEnVol = null;
    }

    if (acteur.strat && acteur.usagesRestants > 0 && acteur.actionsPropres >= acteur.prochainUsageAction) {
        if (acteur.strat.delaiTours > 0) {
            acteur.missileActionCible = acteur.actionsPropres + acteur.strat.delaiTours;
            acteur.missileEnVol = acteur.strat;
        } else {
            declencherUsageStrategeme(acteur, adversaire, acteur.strat);
        }
        acteur.usagesRestants--;
        acteur.prochainUsageAction = acteur.actionsPropres + 1 + (acteur.strat.cooldownTours || 0);
    }

    if (acteur.offhand && acteur.offhand.soinDirect > 0 && acteur.usagesSoinRestants > 0 && acteur.actionsPropres >= acteur.prochainSoinAction && acteur.pv < acteur.pvMax) {
        declencherSoinActif(acteur, acteur.offhand);
        acteur.usagesSoinRestants--;
        acteur.prochainSoinAction = acteur.actionsPropres + 1 + (acteur.offhand.cooldownTours || 0);
    }

    if (acteur.pv <= 0 || adversaire.pv <= 0) return;

    if (acteur.poisonStack > 0) {
        const resistance = (acteur.torso?.resistancePoison || 0) + (acteur.offhand?.resistancePoison || 0);
        acteur.pv -= acteur.poisonStack * (1.0 - Math.min(1.0, resistance / 100.0));
        acteur.poisonStack = Math.max(0, acteur.poisonStack - 1);
    }
    if (acteur.saignementStacks > 0) {
        acteur.pv -= acteur.saignementDegatsParStack * acteur.saignementStacks;
        acteur.saignementStacks--;
    }
    if (acteur.brulureDuree > 0) {
        const resistanceFeu = (acteur.torso?.resistanceFeu || 0) + (acteur.offhand?.resistanceFeu || 0);
        appliquerDegatsAvecShield(acteur, acteur.brulureDegats * (1.0 - Math.min(1.0, resistanceFeu / 100.0)));
        acteur.brulureDuree--;
    }

    // Décomptes de durées : les DEUX côtés, à chaque action (pas seulement l'acteur) -- fidèle au moteur.
    [A, B].forEach(c => {
        if (c.antiHealDuree > 0) { c.antiHealDuree--; if (c.antiHealDuree <= 0) c.antiHealPourcentage = 0; }
        if (c.marqueDuree > 0) { c.marqueDuree--; if (c.marqueDuree <= 0) c.marqueDegats = 0; }
        if (c.frenesieDuree > 0) { c.frenesieDuree--; if (c.frenesieDuree <= 0) c.frenesieBonusSpd = 0; }
    });

    if (acteur.arme && acteur.arme.dureeStance > 0) {
        acteur.tourDansStance++;
        if (acteur.tourDansStance >= acteur.arme.dureeStance) {
            acteur.tourDansStance = 0;
            appliquerBonusArmeStance(acteur.stats, acteur.arme, acteur.stanceActuelle, -1.0);
            acteur.stanceActuelle = 1 - acteur.stanceActuelle;
            appliquerBonusArmeStance(acteur.stats, acteur.arme, acteur.stanceActuelle, 1.0);
            if (acteur.stanceActuelle === 0) { acteur.poisonStack = 0; acteur.brulureDuree = 0; acteur.brulureDegats = 0; }
        }
    }
}

// L'attaque proprement dite : hitchance, parade+riposte, crit, dégâts (avec exécution/marque/rage/
// blocage/réduction tir), vol de vie, reflection, application poison/saignement/anti-heal/marque/
// étourdissement (résisté par ténacité).
function resoudreAttaque(acteur, adversaire) {
    let esquiveCible = adversaire.esquive;
    const armeFrappeur = vueArmeSelonStance(acteur.arme, acteur.stanceActuelle);
    if (armeFrappeur && armeFrappeur.precision > 0) esquiveCible = Math.max(0, esquiveCible - armeFrappeur.precision);
    const hitChance = Math.max(0, Math.min(100, 100 - esquiveCible));
    let touche = Math.random() * 100.0 < hitChance;

    if (touche) {
        const paradeCible = (adversaire.torso?.paradeChance || 0) + (adversaire.offhand?.paradeChance || 0);
        if (paradeCible > 0 && Math.random() * 100.0 < paradeCible) {
            touche = false;
            const mitRiposte = mitigation(acteur.stats.def);
            const degatsRipostee = Math.max(0.1, adversaire.stats.atk * (1.0 - mitRiposte)) * (0.9 + Math.random() * 0.2);
            appliquerDegatsAvecShield(acteur, degatsRipostee);
            verifierDernierSouffle(acteur);
        }
    }

    if (!touche) return;

    const nbCoupsArme = armeFrappeur ? Math.max(1, armeFrappeur.coupsParUsage || 1) : 1;
    const penetration = armeFrappeur ? (armeFrappeur.penetration || 0) : 0;
    const defEffective = adversaire.stats.def * (1.0 - Math.min(1.0, penetration / 100.0));
    const mitig = mitigation(defEffective);
    const resistanceCrit = adversaire.torso ? (adversaire.torso.resistanceCrit || 0) : 0;
    const critChance = Math.max(0, CST.BASE_CRIT + CST.LUCK_CRIT_MAX * Math.tanh(acteur.luck / CST.K_LUCK) + (armeFrappeur ? (armeFrappeur.critBonus || 0) : 0) - resistanceCrit);
    const executionActive = !!(armeFrappeur && armeFrappeur.executionSeuil > 0 && (adversaire.pv / adversaire.pvMax * 100.0) <= armeFrappeur.executionSeuil);

    let degatsTotal = 0;
    for (let coupN = 0; coupN < nbCoupsArme; coupN++) {
        const critCoup = Math.random() * 100.0 < Math.min(100, critChance);
        const varianceCoup = 0.85 + Math.random() * 0.30;
        const { valeur: degatsBaseParBalle, nouveauSysteme } = calculerDegatsBaseArme(armeFrappeur, acteur.stats, nbCoupsArme);
        let degatsBrutsCoup = nouveauSysteme
            ? Math.max(0.1, degatsBaseParBalle * (1.0 - mitig)) * (critCoup ? 2.0 : 1.0)
            : Math.max(0.1, degatsBaseParBalle * (1.0 - mitig)) * varianceCoup * (critCoup ? 2.0 : 1.0);

        if (critCoup && armeFrappeur && armeFrappeur.frenesieBonusSpd > 0 && armeFrappeur.frenesieDuree > 0) {
            acteur.frenesieBonusSpd = armeFrappeur.frenesieBonusSpd;
            acteur.frenesieDuree = armeFrappeur.frenesieDuree;
        }
        if (armeFrappeur && armeFrappeur.rageBonusMax > 0 && armeFrappeur.rageSeuilMin < 100) {
            const pvPourcentFrappeur = (acteur.pv / acteur.pvMax) * 100.0;
            const pvManquantFrappeur = 100.0 - pvPourcentFrappeur;
            const plage = 100.0 - armeFrappeur.rageSeuilMin;
            const rageBonus = Math.min(armeFrappeur.rageBonusMax, Math.max(0, (pvManquantFrappeur / plage) * armeFrappeur.rageBonusMax));
            degatsBrutsCoup *= (1.0 + rageBonus / 100.0);
        }
        if (adversaire.marqueDegats > 0) degatsBrutsCoup *= (1.0 + adversaire.marqueDegats / 100.0);
        if (executionActive) degatsBrutsCoup *= (1.0 + armeFrappeur.executionBonus / 100.0);
        if (adversaire.offhand && adversaire.offhand.reductionDegatsTir > 0 && armeFrappeur && armeFrappeur.anim === 'tir') {
            degatsBrutsCoup *= (1.0 - Math.min(1.0, adversaire.offhand.reductionDegatsTir / 100.0));
        }
        if (adversaire.offhand && adversaire.offhand.blocage > 0 && Math.random() * 100.0 < adversaire.offhand.blocage) {
            degatsBrutsCoup *= (1.0 - Math.min(1.0, adversaire.offhand.blocageReduction / 100.0));
        }
        degatsTotal += Math.trunc(degatsBrutsCoup);
    }

    appliquerDegatsAvecShield(adversaire, degatsTotal);
    verifierDernierSouffle(acteur); verifierDernierSouffle(adversaire);

    if (armeFrappeur && armeFrappeur.lifesteal > 0 && degatsTotal > 0) {
        acteur.pv = Math.min(acteur.pvMax, acteur.pv + Math.trunc(degatsTotal * armeFrappeur.lifesteal / 100.0));
    }
    if (degatsTotal > 0) {
        const reflectionTotale = (adversaire.torso?.reflection || 0) + (adversaire.offhand?.reflection || 0);
        if (reflectionTotale > 0) appliquerDegatsAvecShield(acteur, Math.trunc(degatsTotal * reflectionTotale / 100.0));
    }
    if (armeFrappeur && armeFrappeur.poisonDegats > 0) adversaire.poisonStack += armeFrappeur.poisonDegats;
    if (armeFrappeur && armeFrappeur.saignementDegats > 0) {
        adversaire.saignementStacks++;
        adversaire.saignementDegatsParStack = armeFrappeur.saignementDegats;
    }
    if (armeFrappeur && armeFrappeur.antiHealPourcentage > 0 && armeFrappeur.antiHealDuree > 0) {
        adversaire.antiHealPourcentage = armeFrappeur.antiHealPourcentage;
        adversaire.antiHealDuree = armeFrappeur.antiHealDuree;
    }
    if (armeFrappeur && armeFrappeur.marqueDegatsPourcentage > 0 && armeFrappeur.marqueDuree > 0) {
        adversaire.marqueDegats = armeFrappeur.marqueDegatsPourcentage;
        adversaire.marqueDuree = armeFrappeur.marqueDuree;
    }
    if (armeFrappeur && armeFrappeur.etourdissementChance > 0 && Math.random() * 100.0 < armeFrappeur.etourdissementChance) {
        const tenaciteCible = (adversaire.torso?.tenaciteChance || 0) + (adversaire.offhand?.tenaciteChance || 0);
        const resiste = tenaciteCible > 0 && Math.random() * 100.0 < tenaciteCible;
        if (!resiste) adversaire.etourdi = true;
    }
}

// Port fidèle de ResoudreCombatInterne -- système d'AP (Active Time Battle) : chacun accumule de
// l'AP proportionnellement à sa vitesse à chaque tick, agit dès qu'il atteint le seuil (peut agir
// plusieurs fois de suite s'il est bien plus rapide), et la fatigue/corde inflige des dégâts
// PARTAGÉS aux deux combattants simultanément une fois le compteur d'actions global assez avancé.
function resoudreCombatInterne(prepA, prepB) {
    const A = nouvelEtatCombat(prepA), B = nouvelEtatCombat(prepB);
    let totalActions = 0, nDeclenchementsFatigue = 0;

    while (A.pv > 0 && B.pv > 0 && totalActions < CST.MAX_ACTIONS) {
        A.ap += A.stats.spd + A.frenesieBonusSpd;
        B.ap += B.stats.spd + B.frenesieBonusSpd;

        while ((A.ap >= DUEL_CST.AP_THRESHOLD || B.ap >= DUEL_CST.AP_THRESHOLD) && A.pv > 0 && B.pv > 0 && totalActions < CST.MAX_ACTIONS) {
            // Vitesse la plus haute tranche qui agit quand les deux sont prêts en même temps.
            const aJoue = A.ap >= DUEL_CST.AP_THRESHOLD && (B.ap < DUEL_CST.AP_THRESHOLD || A.stats.spd >= B.stats.spd);
            const acteur = aJoue ? A : B, adversaire = aJoue ? B : A;

            resoudreEffetsDeTour(acteur, adversaire, A, B);
            if (A.pv <= 0 || B.pv <= 0) { totalActions++; continue; }

            if (totalActions >= CST.ROPE_START_ACTION && (totalActions - CST.ROPE_START_ACTION) % CST.ROPE_CADENCE === 0) {
                nDeclenchementsFatigue++;
                const degatsFatigue = DUEL_CST.FATIGUE_BASE * Math.pow(CST.FATIGUE_CROISSANCE, nDeclenchementsFatigue - 1);
                A.pv -= degatsFatigue; B.pv -= degatsFatigue;
            }
            verifierDernierSouffle(A); verifierDernierSouffle(B);
            if (A.pv <= 0 || B.pv <= 0) { totalActions++; continue; }

            if (acteur.etourdi) {
                acteur.etourdi = false;
                acteur.ap -= DUEL_CST.AP_THRESHOLD; acteur.actionsPropres++; totalActions++;
                continue;
            }

            resoudreAttaque(acteur, adversaire);
            acteur.ap -= DUEL_CST.AP_THRESHOLD; acteur.actionsPropres++; totalActions++;
        }
    }

    if (A.pv <= 0 && B.pv <= 0) return Math.trunc(A.pv) === Math.trunc(B.pv) ? 0 : (A.pv >= B.pv ? 1 : 2);
    if (A.pv <= 0) return 2;
    if (B.pv <= 0) return 1;
    return (A.pv / A.pvMax) >= (B.pv / B.pvMax) ? 1 : 2;
}

function estimerTauxVictoire(viewerPrep, ciblePrep) {
    let victoires = 0, defaites = 0, egalites = 0;
    for (let i = 0; i < N_SIMULATIONS; i++) {
        const r = resoudreCombatInterne(viewerPrep, ciblePrep);
        if (r === 1) victoires++; else if (r === 2) defaites++; else egalites++;
    }
    return {
        victoirePct: Math.round((victoires / N_SIMULATIONS) * 100),
        defaitePct: Math.round((defaites / N_SIMULATIONS) * 100),
        egalitePct: Math.round((egalites / N_SIMULATIONS) * 100),
    };
}

// Crit% "de build" affiché dans le panneau Comparer : même formule que le combat réel (base +
// luck via tanh + bonus de l'arme équipée), mais SANS soustraire la résistance crit de
// l'adversaire -- volontairement, pour rester une stat de build (comme Esquive/Blocage/Parade
// juste en dessous) plutôt qu'un chiffre déjà "matché" contre cet adversaire précis. Stance de
// départ (0) prise comme référence, une arme à stances pouvant changer en cours de combat.
function critChanceBuild(combat) {
    const armeVue = vueArmeSelonStance(combat.arme, 0);
    return Math.max(0, CST.BASE_CRIT + CST.LUCK_CRIT_MAX * Math.tanh(combat.luck / CST.K_LUCK) + (armeVue ? (armeVue.critBonus || 0) : 0));
}

// Reprend le même schéma que calculateur.html : objet catalogue + niveau réellement possédé,
// AppliquerAmelioration (via nivelerEquipement) fait le reste.
function gearPourSimulation(joueur, catalogue, numero) {
    if (!numero) return null;
    const info = catalogue[String(numero)];
    if (!info) return null;
    const ligne = (joueur.inventaire || []).find(l => String(l.numero) === String(numero));
    return { ...info, niveau: ligne ? (ligne.niveau || 0) : 0 };
}

function preparerDepuisJoueur(joueur, catalogue) {
    const s = joueur.stats || {};
    const stacks = { atk: s.atkStacks || 0, def: s.defStacks || 0, pv: s.pvStacks || 0, spd: s.spdStacks || 0, luck: s.luckStacks || 0 };
    const lo = joueur.loadout || {};
    const equipement = {
        arme: gearPourSimulation(joueur, catalogue, lo.arme),
        offhand: gearPourSimulation(joueur, catalogue, lo.offhand),
        torso: gearPourSimulation(joueur, catalogue, lo.armure),
        strat: gearPourSimulation(joueur, catalogue, lo.strategeme),
    };
    return preparerCombattant(stacks, equipement);
}
</script>
<script>
/* =====================================================================
   MÉDAILLES ATTENDUES — copie fidèle des constantes de duel.cs/auto-battle.cs
   (perspective ATTAQUANT, puisque c'est ce que le visiteur ferait avec
   !ticketduel). Purement informatif ici : aucune médaille n'est attribuée

   par cette page, seul le moteur de combat décide réellement du résultat.
   Si ces constantes changent côté C#, les reporter ici à l'identique.
   ===================================================================== */
var MEDAILLES = {
    equitable: { victoire: 12, defaite: 2, egalite: 5 },
    dessus:    { victoire: 20, defaite: 2, egalite: 12 },
    dessous:   { victoire: 3,  defaite: 1, egalite: 1 },
};
var SEUIL_TRANCHE = 0.30;   // ±30%, identique au seuil utilisé par le moteur de combat

// Ancrage purement visuel : le moteur calcule luckLineaire à partir de 0 luck investie (aucun
// stack, aucun gear), mais cette page affiche "10" comme point de départ commun à tout le monde,
// par convention. N'AFFECTE QUE L'AFFICHAGE de la ligne Luck du comparateur ci-dessous -- le
// calcul réel (crit, simulation de combat via critChanceBuild/resoudreCombatInterne) continue
// d'utiliser la valeur brute du moteur, sans ce +10.
var LUCK_AFFICHAGE_BASE = 10;

// Comptes exclus des classements et du matchmaking réel — ne doivent pas
// apparaître comme cibles proposées.
var EXCLUS = ['mrshydiver', 'mikumosana', 'totomaton'];

// Conservés pour que le clic sur "Comparer" (différé, après affichage) retrouve les données
// complètes sans devoir tout re-fetcher -- jamais utilisés pour le rendu initial lui-même.
var DERNIERE_LISTE_JOUEURS = [];
var DERNIER_VIEWER = null;

function echapper(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function avatarHtml(url, nom) {
    return url ? '<img class="cible-avatar" src="' + echapper(url) + '" alt="">'
               : '<div class="cible-avatar">' + echapper((nom || '?').charAt(0).toUpperCase()) + '</div>';
}

function echapperAttr(t) {
    return echapper(t).replace(/"/g, '&quot;');
}

function iconeObjet(o) {
    if (!o) return '';
    return o.image ? '<img src="' + echapperAttr(o.image) + '" alt="">' : echapper(o.icone || '📦');
}

function ligneEquipement(o) {
    if (!o) return '<div class="compare-equip-vide">Aucun</div>';
    return '<div class="compare-equip-item">' +
        '<div class="compare-equip-icone">' + iconeObjet(o) + '</div>' +
        '<div class="compare-equip-nom">' + echapper(o.nom || '?') + '</div>' +
    '</div>';
}

// Une ligne du tableau de comparaison : le camp le plus haut est colorié, l'autre reste neutre —
// jamais les deux en même temps, et aucune couleur en cas d'égalité stricte.
function ligneStat(label, valeurToi, valeurCible, decimales) {
    decimales = decimales || 0;
    var classeToi = valeurToi > valeurCible ? 'stat-toi-superieur' : '';
    var classeCible = valeurCible > valeurToi ? 'stat-cible-superieur' : '';
    return '<tr>' +
        '<td>' + label + '</td>' +
        '<td class="' + classeToi + '">' + valeurToi.toFixed(decimales) + '</td>' +
        '<td>vs</td>' +
        '<td class="' + classeCible + '">' + valeurCible.toFixed(decimales) + '</td>' +
    '</tr>';
}

function panneauComparaison(viewer, c) {
    var eq = c.equipement || {};
    if (!viewer.combat || !c.combat) {
        return '<div class="cible-compare-panel">' +
            '<div class="compare-equip-vide" style="grid-column: 1 / -1;">Comparaison indisponible pour ce profil.</div>' +
        '</div>';
    }
    var vs = viewer.combat, cs = c.combat;
    var vsParade = (vs.torso?.paradeChance || 0) + (vs.offhand?.paradeChance || 0);
    var csParade = (cs.torso?.paradeChance || 0) + (cs.offhand?.paradeChance || 0);
    var vsBlocage = vs.offhand?.blocage || 0;
    var csBlocage = cs.offhand?.blocage || 0;
    return '<div class="cible-compare-panel">' +
        '<div>' +
            '<div class="compare-equip-titre">Équipement de ' + echapper(c.nom) + '</div>' +
            '<div class="compare-equip-liste">' +
                ligneEquipement(eq.arme) + ligneEquipement(eq.offhand) + ligneEquipement(eq.armure) + ligneEquipement(eq.strategeme) +
            '</div>' +
        '</div>' +
        '<div>' +
            '<div class="compare-stats-titre">Toi vs ' + echapper(c.nom) + '</div>' +
            '<table class="compare-stats-table"><tbody>' +
                ligneStat('PowerLevel', viewer.power, c.power, 0) +
                ligneStat('ATK', vs.stats.atk || 0, cs.stats.atk || 0, 0) +
                ligneStat('DEF', vs.stats.def || 0, cs.stats.def || 0, 0) +
                ligneStat('PV', vs.stats.pv || 0, cs.stats.pv || 0, 0) +
                ligneStat('Vitesse', vs.stats.spd || 0, cs.stats.spd || 0, 1) +
                ligneStat('Luck', (vs.luck || 0) + LUCK_AFFICHAGE_BASE, (cs.luck || 0) + LUCK_AFFICHAGE_BASE, 0) +
                ligneStat('Crit %', critChanceBuild(vs), critChanceBuild(cs), 1) +
                ligneStat('Esquive %', vs.esquive || 0, cs.esquive || 0, 1) +
                ligneStat('Blocage %', vsBlocage, csBlocage, 1) +
                ligneStat('Parade %', vsParade, csParade, 1) +
            '</tbody></table>' +
        '</div>' +
    '</div>';
}

// Tranches qualitatives de l'estimation de victoire -- volontairement floues : le but est de
// donner un ressenti ("ça devrait bien se passer" / "ça va être chaud") plutôt qu'un chiffre
// exact exploitable pour trier ses cibles par pur calcul. Cinq paliers, avec un palier "atténué"
// de part et d'autre du centre pour ne pas tout compresser en trois blocs plats.
// IMPORTANT : ne jamais réintroduire c.victoirePct/defaitePct/egalitePct dans le HTML rendu ici --
// seul le label qualitatif doit apparaître à l'écran.
function libelleTauxVictoire(pct) {
    if (pct === null || pct === undefined) return { classe: 'neutre', label: '—' };
    if (pct >= 75) return { classe: 'favorable',           label: 'Favori' };
    if (pct >= 55) return { classe: 'favorable attenue',   label: 'Léger avantage' };
    if (pct >= 45) return { classe: 'neutre',              label: 'Équilibré' };
    if (pct >= 25) return { classe: 'defavorable attenue', label: 'Désavantagé' };
    return { classe: 'defavorable', label: 'Outsider' };
}

function ligneCible(c) {
    var m = MEDAILLES[c.tranche];
    var signe = c.ecart >= 0 ? '+' : '';
    var tier = libelleTauxVictoire(c.victoirePct);
    var blocSimu = '<div class="simu ' + tier.classe + '" title="Estimation basée sur l\'équipement réel des deux côtés, simulée sur ' + N_SIMULATIONS + ' combats">' +
        '<div class="label">Issue probable</div>' +
        '<div class="val">' + tier.label + '</div>' +
    '</div>';
    return '<div class="cible" data-cle="' + echapperAttr(c.cle) + '">' +
        avatarHtml(c.avatar, c.nom) +
        '<div class="cible-ident">' +
            '<div class="cible-nom">' + echapper(c.nom) + '</div>' +
            '<div class="cible-detail">PowerLevel <b>' + Math.round(c.power) + '</b> ' +
                '<span class="cible-ecart">(' + signe + c.ecart.toFixed(0) + '%)</span></div>' +
        '</div>' +
        blocSimu +
        '<div class="issues">' +
            '<div class="issue victoire"><div class="label">Victoire</div><div class="val">🏅 +' + m.victoire + '</div></div>' +
            '<div class="issue egalite"><div class="label">Égalité</div><div class="val">🏅 +' + m.egalite + '</div></div>' +
            '<div class="issue defaite"><div class="label">Défaite</div><div class="val">🏅 +' + m.defaite + '</div></div>' +
        '</div>' +
        '<div class="cible-action">' +
            '<button type="button" class="cible-compare-toggle" data-cle-compare="' + echapperAttr(c.cle) + '">Comparer</button>' +
            '<button type="button" data-pseudo="' + echapperAttr(c.cle) + '">Copier la commande</button>' +
        '</div>' +
    '</div>';
}

function sectionTranche(cle, titre, description, cibles) {
    if (!cibles.length) return '';
    return '<section class="tranche-section ' + cle + '">' +
        '<div class="tranche-tete">' +
            '<h2>' + titre + '</h2>' +
            '<span class="compte">' + cibles.length + ' personne' + (cibles.length > 1 ? 's' : '') + '</span>' +
            '<p>' + description + '</p>' +
        '</div>' +
        '<div class="cibles">' + cibles.map(ligneCible).join('') + '</div>' +
    '</section>';
}

function afficher(viewer, tousLesJoueurs) {
    DERNIER_VIEWER = viewer;
    DERNIERE_LISTE_JOUEURS = tousLesJoueurs;

    document.getElementById('zoneSolde').innerHTML =
        '<div class="solde-barre"><div class="qui">' + echapper(viewer.nom) + '</div>' +
        '<div class="pl">' + Math.round(viewer.power) + '<span>PowerLevel</span></div></div>';

    var equitables = [], dessus = [], dessous = [];
    tousLesJoueurs.forEach(function (c) {
        if (c.cle === viewer.cle) return;   // pas soi-même
        if (EXCLUS.indexOf(c.cle.toLowerCase()) !== -1) return;
        if (!viewer.power || !c.power) return;

        var ecartRatio = (c.power - viewer.power) / viewer.power;
        c.ecart = ecartRatio * 100;

        if (ecartRatio > SEUIL_TRANCHE) { c.tranche = 'dessus'; dessus.push(c); }
        else if (ecartRatio < -SEUIL_TRANCHE) { c.tranche = 'dessous'; dessous.push(c); }
        else { c.tranche = 'equitable'; equitables.push(c); }
    });

    // Dans les trois tranches : l'écart de PowerLevel le plus PETIT (le combat
    // le plus serré) apparaît en premier, qu'on soit au-dessus ou en dessous —
    // seul le sens numérique de l'écart change de signe selon le côté.
    var parEcart = function (a, b) { return Math.abs(a.ecart) - Math.abs(b.ecart); };
    equitables.sort(parEcart);
    dessus.sort(parEcart);
    dessous.sort(parEcart);

    document.getElementById('zoneContenu').innerHTML =
        sectionTranche('equitable', 'Dans ta tranche',
            'Écart de ±30% — le duel le plus prévisible, dans les deux sens.', equitables) +
        sectionTranche('dessus', 'Plus fort que toi',
            'Risqué, mais nettement plus généreux en cas de victoire. Les plus proches de toi en premier.', dessus) +
        sectionTranche('dessous', 'Plus faible que toi',
            'Peu de médailles à gagner, et un adversaire moins faible peut te faire perdre gros. Les moins faibles en premier.', dessous);

    if (!equitables.length && !dessus.length && !dessous.length) {
        document.getElementById('zoneContenu').innerHTML =
            '<div class="message">Personne d\'autre n\'est actuellement disponible comme cible.</div>';
    }
}

document.getElementById('zoneContenu').addEventListener('click', function (e) {
    var toggle = e.target.closest('button[data-cle-compare]');
    if (toggle) {
        var carte = toggle.closest('.cible');
        var panneauExistant = carte.querySelector('.cible-compare-panel');
        if (panneauExistant) {
            panneauExistant.remove();
            toggle.classList.remove('ouvert');
            toggle.textContent = 'Comparer';
            return;
        }
        var cle = toggle.getAttribute('data-cle-compare');
        var cible = DERNIERE_LISTE_JOUEURS.filter(function (j) { return j.cle === cle; })[0];
        if (!cible || !DERNIER_VIEWER) return;
        carte.insertAdjacentHTML('beforeend', panneauComparaison(DERNIER_VIEWER, cible));
        toggle.classList.add('ouvert');
        toggle.textContent = 'Masquer';
        return;
    }

    var btn = e.target.closest('button[data-pseudo]');
    if (!btn) return;
    var commande = '!ticketduel ' + btn.getAttribute('data-pseudo');
    var fini = function () {
        var avant = btn.textContent;
        btn.classList.add('copie');
        btn.textContent = 'Copié !';
        setTimeout(function () { btn.classList.remove('copie'); btn.textContent = avant; }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(commande).then(fini, fini);
    else {
        var z = document.createElement('textarea');
        z.value = commande; document.body.appendChild(z); z.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(z); fini();
    }
});

/* ===================== CHARGEMENT ===================== */
function resoudreEquipement(loadout, catalogue) {
    if (!loadout) return {};
    function resoudreSlot(numero) {
        if (!numero) return null; // 0 = rien équipé dans ce slot
        var item = catalogue[String(numero)];
        return item ? { nom: item.nom, icone: item.icone, image: item.image } : null;
    }
    return {
        arme: resoudreSlot(loadout.arme),
        offhand: resoudreSlot(loadout.offhand),
        armure: resoudreSlot(loadout.armure),
        strategeme: resoudreSlot(loadout.strategeme),
    };
}

Promise.all([
    fetch('players.json?v=' + Date.now()).then(function (r) { return r.json(); }),
    fetch('catalogue_stats.json?v=' + Date.now()).then(function (r) { return r.json(); }),
])
    .then(function (resultats) {
        var data = resultats[0], catalogue = resultats[1];
        var tous = Object.keys(data).map(function (cle) {
            var j = data[cle], s = j.stats || {};
            return {
                cle: cle, nom: j.nomAffichage || cle, avatar: j.avatar || '', power: s.powerLevel || 0,
                stats: s, equipement: resoudreEquipement(j.loadout, catalogue),
            };
        });

        var demande = new URLSearchParams(location.search).get('user');
        if (!demande || !data[demande]) return;   // le message par défaut reste affiché

        var viewer = tous.filter(function (c) { return c.cle === demande; })[0];

        // Simulation tour par tour (voir plus haut) : pour CHAQUE cible potentielle, rejoue le
        // duel réel plusieurs centaines de fois avec les objets effectivement équipés des deux
        // côtés -- contrairement à l'écart de PowerLevel, ça capture les contres directs
        // (anti-crit, bouclier qui se recharge...) propres à cette paire de personnes précise.
        // Les objets "prep" (stats déjà passées par calculerStatsEffectives -- bonus % de gear
        // inclus, pas seulement les stacks bruts) sont conservés sur chaque joueur (c.combat) pour
        // alimenter le panneau "Comparer" : ça évite de dupliquer le calcul ET corrige l'ancien
        // bug où ce panneau affichait les stats "brutes" du snapshot players.json (ex. PV avant
        // bonus % d'équipement) au lieu des stats réellement en jeu.
        var viewerPrep = preparerDepuisJoueur(data[demande], catalogue);
        viewer.combat = viewerPrep;
        tous.forEach(function (c) {
            if (c.cle === demande) return;
            try {
                var ciblePrep = preparerDepuisJoueur(data[c.cle], catalogue);
                c.combat = ciblePrep;
                var resultat = estimerTauxVictoire(viewerPrep, ciblePrep);
                c.victoirePct = resultat.victoirePct;
                c.defaitePct = resultat.defaitePct;
                c.egalitePct = resultat.egalitePct;
            } catch (e) {
                c.combat = null;
                c.victoirePct = null; c.defaitePct = null; c.egalitePct = null;
            }
        });

        afficher(viewer, tous);
    })
    .catch(function () {
        document.getElementById('zoneContenu').innerHTML =
            '<div class="message">Les données n\'ont pas pu être chargées. Réessaie dans un instant.</div>';
    });
</script>
<script src="nav.js" defer></script>
