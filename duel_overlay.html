<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700;900&family=Bangers&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
    margin: 0; overflow: hidden; font-family: 'Chakra Petch', sans-serif;
    display: flex; justify-content: center; align-items: center; height: 100vh;
    background: transparent; text-transform: uppercase; color: #d1d1d1;
}

.arena {
    width: 900px; padding: 46px 40px 22px;
    background-color: rgba(10, 14, 20, 0.97);
    border: 2px solid #333;
    box-shadow: 0 0 25px rgba(0, 170, 255, 0.2);
    position: relative; overflow: hidden;
}
.arena.shake { animation: shake 0.4s; }
@keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-8px, 4px); }
    40% { transform: translate(8px, -4px); }
    60% { transform: translate(-6px, -2px); }
    80% { transform: translate(6px, 2px); }
}

.arena.shake-light { animation: shakeLight 0.3s; }
@keyframes shakeLight {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -1px); }
    75% { transform: translate(-2px, 1px); }
}

/* Effet de bordure lumineuse continue une fois la corde (fatigue) déclenchée,
   façon "onde" qui tourne en permanence tout autour du cadre. */
.arena.rope-active {
    border-color: #ff6a00;
}

.rope-frame-wrap {
    position: absolute; inset: 0; overflow: hidden; border-radius: inherit;
    pointer-events: none; opacity: 0; transition: opacity 0.5s ease; z-index: 1;
}
.arena.rope-active .rope-frame-wrap { opacity: 1; }

.rope-frame-wrap::before {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 260%; height: 260%; margin-left: -130%; margin-top: -130%;
    background: conic-gradient(from 0deg,
        #fff3c4, #ffc84a, #ff8c1a, #ff4400, #7a1500, #ff4400, #ff8c1a, #ffc84a, #fff3c4);
    filter: blur(10px) saturate(1.3);
    animation: ropeRotation 4s linear infinite;
}

/* Masque : ne laisse dépasser le dégradé que sur une fine bande en bordure */
.rope-frame-mask {
    position: absolute; inset: 9px; background: rgba(10, 14, 20, 0.97); border-radius: inherit;
}

@keyframes ropeRotation {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

/* Effet de vague : légère pulsation d'intensité par-dessus la rotation, pour un rendu moins mécanique */
.rope-frame-wrap { animation: ropeWave 2.2s ease-in-out infinite; }
@keyframes ropeWave {
    0%, 100% { filter: brightness(0.85); }
    50% { filter: brightness(1.25); }
}

.fatigue-banner {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #ff6a00;
    text-shadow: 0 0 10px rgba(255, 106, 0, 0.8);
    opacity: 0; transition: opacity 0.5s ease; z-index: 30; pointer-events: none;
    white-space: nowrap;
}
.fatigue-banner.show { opacity: 1; animation: fatiguePulse 1.2s ease-in-out infinite alternate; }
@keyframes fatiguePulse {
    0% { text-shadow: 0 0 8px rgba(255,106,0,0.6); }
    100% { text-shadow: 0 0 18px rgba(255,60,0,1); }
}

.fighters { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; position: relative; z-index: 2; }

.fighter { width: 340px; text-align: center; position: relative; }

.matchup-status {
    font-size: 12px; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;
    padding: 3px 10px; border-radius: 4px; display: inline-block;
}
.matchup-status.equitable { color: #aaa; background: rgba(170,170,170,0.1); border: 1px solid rgba(170,170,170,0.4); }
.matchup-status.underdog { color: #00ffaa; background: rgba(0,255,170,0.1); border: 1px solid rgba(0,255,170,0.4); }
.matchup-status.topdog { color: #ff6a00; background: rgba(255,106,0,0.1); border: 1px solid rgba(255,106,0,0.4); }
.matchup-status.gain { color: #00ffaa; background: rgba(0,255,170,0.15); border: 1px solid rgba(0,255,170,0.6); font-size: 18px; text-shadow: 0 0 10px rgba(0,255,170,0.6); }
.matchup-status.perte { color: #ff5555; background: rgba(255,85,85,0.15); border: 1px solid rgba(255,85,85,0.6); font-size: 18px; text-shadow: 0 0 10px rgba(255,85,85,0.6); }
.matchup-status.egalite { color: #9aa5b1; background: rgba(154,165,177,0.15); border: 1px solid rgba(154,165,177,0.6); font-size: 18px; text-shadow: 0 0 10px rgba(154,165,177,0.6); }
.medaille-icon { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; }

.name-row { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-bottom: 8px; }
.name { font-size: 17px; font-weight: 900; color: #fff; }
.record { font-size: 12px; color: #888; letter-spacing: 1px; }
.record .v { color: #00ffaa; font-weight: 700; }
.record .d { color: #ff5555; font-weight: 700; }

.avatar {
    width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
    transition: transform 0.15s ease;
}

/* Contour dans son propre calque, transparent au centre, toujours au-dessus des fissures/quartiers */
.avatar-frame {
    position: absolute; top: 0; left: 0; width: 90px; height: 90px;
    border-radius: 50%; pointer-events: none; z-index: 20; box-sizing: border-box;
    border: 3px solid #00aaff; box-shadow: 0 0 15px rgba(0, 170, 255, 0.5);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
}
.fighter.right .avatar-frame { border-color: #ff6a00; box-shadow: 0 0 15px rgba(255, 106, 0, 0.5); }
.avatar-frame.hit-flash { transform: scale(0.9); border-color: #ff3333 !important; box-shadow: 0 0 25px rgba(255, 51, 51, 0.9) !important; }
.avatar-frame.winner-glow { border-color: #FFE800 !important; box-shadow: 0 0 30px rgba(255, 232, 0, 0.9) !important; }
.avatar-frame.egalite-glow { border-color: #9aa5b1 !important; box-shadow: 0 0 22px rgba(154, 165, 177, 0.8) !important; }
.avatar-frame.loser-fade {
    transition: border-color 0.7s ease, box-shadow 0.7s ease, opacity 0.7s ease;
    border-color: #2a2a2a !important; box-shadow: none !important; opacity: 0.5;
}
/* Anneau doré pulsant tant que le Shield est actif — persiste jusqu'à ce qu'il retombe à 0 */
.avatar-frame.shield-actif {
    border-color: #ffcf40 !important; box-shadow: 0 0 18px rgba(255, 207, 64, 0.8) !important;
    animation: pulseBouclier 1.6s ease-in-out infinite;
}
@keyframes pulseBouclier {
    0%, 100% { box-shadow: 0 0 14px rgba(255, 207, 64, 0.6); }
    50% { box-shadow: 0 0 26px rgba(255, 207, 64, 1); }
}

.avatar.hit-flash { transform: scale(0.9); }

/* Fissures qui se révèlent progressivement à mesure que les PV chutent, jusqu'à un portrait
   entièrement craquelé à 0 PV. Découpées en cercle pour rester dans les limites du portrait. */
.avatar-cracks {
    position: absolute; top: 0; left: 0; width: 90px; height: 90px;
    border-radius: 50%; pointer-events: none; z-index: 12;
}
.avatar-cracks path {
    opacity: 0;
    transition: opacity 0.4s ease;
    fill: none; stroke: #050505; stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round;
}

.avatar-quartier {
    position: absolute; top: 0; left: 0; width: 90px; height: 90px;
    background-size: cover; background-repeat: no-repeat; background-position: center;
    z-index: 11; pointer-events: none;
    transition: transform 0.5s ease;
}
.quartiers-mask {
    position: absolute; top: 0; left: 0; width: 90px; height: 90px;
    border-radius: 50%; overflow: hidden; z-index: 11; pointer-events: none;
}

/* Explosion en éclats du perdant à la révélation finale */
.avatar-shard {
    position: absolute; z-index: 30; pointer-events: none;
    background-repeat: no-repeat;
    filter: grayscale(1) brightness(0.75);
    animation: shardFly 1s cubic-bezier(0.15, 0.7, 0.35, 1) forwards;
}
@keyframes shardFly {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.4); opacity: 0; }
}
.avatar-shard.shard-reste {
    animation: shardCasse 0.5s cubic-bezier(0.25, 0.6, 0.4, 1) forwards;
    filter: brightness(0.8) contrast(1.1);
}
@keyframes shardCasse {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0.75; }
}
.death-flash {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, #fff, rgba(255,255,255,0.4) 50%, transparent 75%);
    z-index: 29; opacity: 0; pointer-events: none;
    animation: deathFlashAnim 0.35s ease-out forwards;
}
@keyframes deathFlashAnim {
    0% { opacity: 0; transform: scale(0.6); }
    30% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(1.6); }
}

.ko-tampon {
    position: absolute; top: 50%; left: 50%; z-index: 32;
    font-family: 'Chakra Petch', sans-serif; font-weight: 900; font-size: 26px; letter-spacing: 1px;
    color: #ff2222; -webkit-text-stroke: 1.5px #3a0000;
    border: 4px solid #ff2222; border-radius: 6px; padding: 2px 10px;
    text-shadow: 1px 1px 0 #000;
    transform: translate(-50%, -50%) rotate(-18deg) scale(2.5);
    opacity: 0; pointer-events: none;
    animation: koSlam 0.4s cubic-bezier(0.2, 0.8, 0.3, 1.3) forwards;
}
@keyframes koSlam {
    0%   { opacity: 0; transform: translate(-50%, -50%) rotate(-18deg) scale(2.5); }
    60%  { opacity: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(0.85); }
    100% { opacity: 1; transform: translate(-50%, -50%) rotate(-16deg) scale(1); }
}

/* ==========================================================
   LOADOUT — 4 emplacements distincts encadrant le portrait,
   façon inventaire Diablo. Chaque case affiche l'icône de
   l'objet équipé, ou reste vide (pointillés) si rien n'est équipé.
   ========================================================== */

.avatar-row { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 10px; }
.avatar-wrap { position: relative; width: 90px; height: 90px; margin: 0; flex-shrink: 0; }

.slot-grid {
    display: grid; grid-template-columns: repeat(2, 52px); grid-template-rows: repeat(2, 52px);
    gap: 10px; padding: 12px;
    border: 1px solid #3a3a3a; border-radius: 8px;
    background: rgba(0, 0, 0, 0.25);
    flex-shrink: 0;
}

.slot {
    width: 52px; height: 52px;
    background: rgba(0, 0, 0, 0.5);
    border: 2px solid #444;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    position: relative;
}
.slot.filled { border-color: #7fa8c9; background: rgba(20, 35, 50, 0.7); }
.slot img { width: 42px; height: 42px; object-fit: contain; }
.slot .empty-mark { color: #555; font-size: 24px; font-weight: 900; }

/* Case barrée : slot indisponible (ex: off-hand avec une arme à 2 mains équipée) */
.slot.barred { background: rgba(60, 15, 15, 0.35); border-color: #5a2a2a; }
.slot.barred::after {
    content: ''; position: absolute; width: 140%; height: 2px;
    background: #aa4444; top: 50%; left: -20%; transform: rotate(45deg);
}

/* Halo bref sur l'arme au moment où elle frappe */
.slot.glow { animation: slotGlow 0.5s ease-out; }
@keyframes slotGlow {
    0% { box-shadow: 0 0 0 rgba(255,255,255,0); border-color: #444; }
    30% { box-shadow: 0 0 16px 4px rgba(255,255,255,0.9); border-color: #fff; }
    100% { box-shadow: inset 0 0 6px rgba(0,0,0,0.8); border-color: #7fa8c9; }
}

/* Stratagème épuisé : grisé une fois tous ses usages consommés */
.slot.epuise { filter: grayscale(1); opacity: 0.35; }

/* Voile de recharge façon jeu vidéo : sombre au moment de l'usage, se retire progressivement
   au fil des tours (balayage conique), avec le nombre de tours restants au centre. */
.cooldown-overlay {
    position: absolute; inset: 0; border-radius: 3px;
    background: conic-gradient(transparent calc(var(--pct, 0) * 1%), rgba(0, 0, 0, 0.82) 0);
    pointer-events: none; z-index: 2; transition: background 0.3s linear;
}
.cooldown-number {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 15px; font-family: 'Chakra Petch', sans-serif;
    text-shadow: 0 1px 3px #000, 0 0 5px #000; pointer-events: none; z-index: 3;
}

.hp-bar-outer { width: 100%; height: 18px; background: rgba(0,0,0,0.6); border: 1px solid #444; overflow: hidden; position: relative; }
.hp-bar-inner { height: 100%; background: linear-gradient(90deg, #00ffaa, #00aaff); width: 100%; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
.fighter.right .hp-bar-inner { background: linear-gradient(90deg, #ff6a00, #ff3333); }
/* Shield : overbar jaune par-dessus la barre de vie, proportionnelle à pv_max comme les PV eux-mêmes */
.shield-bar {
    position: absolute; top: 0; left: 0; height: 100%; width: 0%;
    background: repeating-linear-gradient(135deg, #ffe14a, #ffe14a 6px, #f2c230 6px, #f2c230 12px);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
    border-right: 2px solid #fff8d6;
    transition: width 0.5s ease;
    z-index: 1;
}
.shield-montant { color: #ffe14a; font-weight: 900; margin-left: 6px; }
.hp-text { font-size: 12px; color: #aaa; margin-top: 5px; }

/* ==========================================================
   BARRE DE STATUTS — un badge par effet actif (poison, exécution,
   résistance au crit, renvoi de dégâts, régénération, précision...).
   Générique : n'importe quel nouvel effet peut réutiliser ce système.
   ========================================================== */
.status-bar { display: flex; justify-content: center; gap: 6px; margin-top: 8px; min-height: 26px; flex-wrap: wrap; }
.badge-statut {
    display: flex; align-items: center; gap: 4px;
    background: rgba(0,0,0,0.5); border: 1px solid #444; border-radius: 5px;
    padding: 3px 7px; font-size: 12px; font-weight: 700; color: #ddd;
    animation: badgePop 0.25s ease-out;
}
.badge-statut img { width: 15px; height: 15px; object-fit: contain; }
.badge-statut .valeur { font-family: 'Chakra Petch', sans-serif; }
.badge-statut.poison { border-color: #6ad14a; color: #9dffb0; }
.badge-statut.brulure { border-color: #ff7a1f; color: #ffb17a; }
.badge-statut.execution { border-color: #ff3333; color: #ff8888; }
.badge-statut.resistance_crit { border-color: #b98cff; color: #d4b8ff; }
.badge-statut.reflection { border-color: #ff8c1a; color: #ffbb77; }
.badge-statut.regeneration { border-color: #00ffaa; color: #7dffcf; }
.badge-statut.precision { border-color: #4ac8ff; color: #a0e3ff; }
.badge-statut.saignement { border-color: #c92c2c; color: #ff9d9d; }
.badge-statut.anti_heal { border-color: #8a8a8a; color: #ccc; }
.badge-statut.rage { border-color: #ff4400; color: #ffaa77; }
.badge-statut.marque { border-color: #ff2266; color: #ff88aa; }
.badge-statut.tenacite { border-color: #66ccff; color: #b3e5ff; }
.badge-statut.frenesie { border-color: #33ffcc; color: #99ffe6; }

.fx-dernier-souffle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
    font-family: 'Chakra Petch', sans-serif; font-weight: 900; font-size: 16px; letter-spacing: 1px;
    color: #fff8d6; -webkit-text-stroke: 1px #7a6a00; text-shadow: 0 0 14px rgba(255,232,150,0.9), 1px 1px 0 #000;
    white-space: nowrap; z-index: 31; opacity: 0; pointer-events: none;
    animation: dernierSouffleAnim 1.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
}
@keyframes dernierSouffleAnim {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    30%  { transform: translate(-50%, -50%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1) translateY(-10px); }
}
@keyframes badgePop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}


.vs {
    font-size: 26px; font-weight: 900; color: #ff3333; text-shadow: 0 0 15px rgba(255,51,51,0.6);
    flex-shrink: 0; margin-top: 180px;
    transform: translateY(-110px); /* position de départ : 70px de marge (180 - 110) */
    transition: transform 0.4s cubic-bezier(0.3, 0.7, 0.4, 1);
}
.vs.descendu { transform: translateY(0); }

/* Popup de dégâts façon "fontaine" : jaillit, retombe avec la gravité, police impact dédiée */
.damage-popup {
    position: absolute; top: 10%; left: 50%;
    font-family: 'Bangers', 'Chakra Petch', sans-serif;
    font-size: 34px; letter-spacing: 1px; color: #ff4444; opacity: 0;
    -webkit-text-stroke: 2px #2a0000;
    text-shadow: 0 0 10px rgba(255,68,68,0.7), 2px 2px 0 #000;
    z-index: 25; pointer-events: none; white-space: nowrap;
    display: flex; align-items: center; gap: 4px;
    animation: fontaine 1s linear forwards;
}
.damage-popup img.popup-weapon-icon {
    width: 24px; height: 24px; object-fit: contain;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
}
.damage-popup .popup-emoji-icon {
    font-size: 22px; filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
}
.damage-popup.crit {
    color: #FFE800; font-size: 40px; -webkit-text-stroke: 2.5px #4a2f00;
    text-shadow: 0 0 18px rgba(255,232,0,0.9), 2px 2px 0 #000;
    animation: fontaineCrit 1.1s linear forwards;
}
.damage-popup.miss {
    color: #ccc; font-size: 24px; -webkit-text-stroke: 1.5px #333;
    text-shadow: 1px 1px 0 #000; font-style: italic;
}
.damage-popup.parade {
    color: #dfe8ff; font-size: 27px; -webkit-text-stroke: 2px #2a3a5c;
    text-shadow: 0 0 12px rgba(150,180,255,0.9), 2px 2px 0 #000;
}
.damage-popup.fatigue {
    color: #ff8c1a; font-size: 30px; -webkit-text-stroke: 2px #4a2400;
    text-shadow: 0 0 12px rgba(255, 140, 26, 0.8), 2px 2px 0 #000;
}
.damage-popup.poison {
    color: #8cff5a; font-size: 26px; -webkit-text-stroke: 1.5px #1a4a00;
    text-shadow: 0 0 10px rgba(140, 255, 90, 0.8), 2px 2px 0 #000;
}
.damage-popup.brulure {
    color: #ff8a3d; font-size: 26px; -webkit-text-stroke: 1.5px #6b1f00;
    text-shadow: 0 0 10px rgba(255, 138, 61, 0.85), 2px 2px 0 #000;
}
.damage-popup.lifesteal {
    color: #3ee87a; font-size: 24px; -webkit-text-stroke: 1.5px #054a20;
    text-shadow: 0 0 10px rgba(62, 232, 122, 0.8), 2px 2px 0 #000;
}
.damage-popup.paralysie {
    color: #d9b3ff; font-size: 26px; -webkit-text-stroke: 1.5px #3a1a5c;
    text-shadow: 0 0 12px rgba(217, 179, 255, 0.9), 2px 2px 0 #000;
    font-style: italic;
}
.damage-popup.shield-gain {
    color: #ffcf40; font-size: 28px; -webkit-text-stroke: 1.5px #6b4a00;
    text-shadow: 0 0 12px rgba(255, 207, 64, 0.8), 2px 2px 0 #000;
}

/* Étourdissement façon cartoon : étoiles qui tournent au-dessus de la tête + texte "STUN" */
.fx-stun {
    position: absolute; top: -14px; left: 50%; width: 0; height: 0;
    z-index: 26; pointer-events: none;
    animation: stunOrbite 0.9s linear infinite;
}
.fx-stun .etoile {
    position: absolute; top: -8px; left: -8px; font-size: 15px; color: #ffd93d;
    text-shadow: 0 0 3px #000, 0 1px 1px #000;
}
@keyframes stunOrbite {
    from { transform: translateX(-50%) rotate(0deg); }
    to   { transform: translateX(-50%) rotate(360deg); }
}
.fx-stun-texte {
    position: absolute; top: -38px; left: 50%; transform: translateX(-50%) scale(0.5);
    font-family: 'Chakra Petch', sans-serif; font-weight: 900; font-size: 24px; letter-spacing: 1px;
    color: #ffd93d; -webkit-text-stroke: 1.5px #4a3a00; text-shadow: 1px 1px 0 #000;
    z-index: 27; opacity: 0; pointer-events: none;
    animation: stunTextePop 0.9s cubic-bezier(0.3, 1.6, 0.4, 1) forwards;
}
@keyframes stunTextePop {
    0%   { opacity: 0; transform: translateX(-50%) scale(0.4); }
    70%  { opacity: 1; transform: translateX(-50%) scale(1.15); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
}

.damage-popup.heal {
    color: #00ff66; -webkit-text-stroke: 2px #003d16;
    text-shadow: 0 0 14px rgba(0, 255, 102, 0.9), 2px 2px 0 #000;
}

.heal-particle {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle, #d4ffdf, #00ff66 60%, transparent);
    box-shadow: 0 0 5px rgba(0, 255, 102, 0.8);
    left: 50%; bottom: 6%; opacity: 0; pointer-events: none; z-index: 22;
    animation: healRise 1.1s ease-out forwards;
}
@keyframes healRise {
    0%   { transform: translate(-50%, 0) translateX(0) scale(0.5); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translate(-50%, -90px) translateX(var(--dx, 10px)) scale(1); opacity: 0; }
}

/* Anneau lumineux au sol du portrait */
.heal-ring {
    position: absolute; left: 50%; bottom: 2%; width: 74px; height: 22px;
    transform: translateX(-50%) scale(0.4); pointer-events: none; z-index: 21;
    border: 2px solid #00ff66; border-radius: 50%;
    box-shadow: 0 0 14px rgba(0, 255, 102, 0.85), inset 0 0 12px rgba(0, 255, 102, 0.5);
    opacity: 0;
    animation: healRingPulse 1.3s ease-out forwards;
}
@keyframes healRingPulse {
    0%   { transform: translateX(-50%) scale(0.35); opacity: 0; }
    22%  { opacity: 1; }
    100% { transform: translateX(-50%) scale(1.35); opacity: 0; }
}

/* Faisceaux verticaux qui montent */
.heal-beam {
    position: absolute; bottom: 4%; width: 5px; height: 92px;
    background: linear-gradient(to top, rgba(0, 255, 102, 0.95), rgba(0, 255, 102, 0.25) 45%, transparent 85%);
    filter: blur(1px); pointer-events: none; z-index: 21;
    opacity: 0; transform-origin: bottom center;
    animation: healBeamRise 1.1s ease-out forwards;
}
@keyframes healBeamRise {
    0%   { opacity: 0; transform: scaleY(0.25); }
    25%  { opacity: 0.9; }
    100% { opacity: 0; transform: scaleY(1.15); }
}

/* Petites croix lumineuses qui montent, comme un soin de RPG */
.heal-cross {
    position: absolute; bottom: 10%; left: 50%; width: 13px; height: 13px;
    opacity: 0; pointer-events: none; z-index: 23;
    animation: healCrossRise 1.5s ease-out forwards;
}
.heal-cross::before, .heal-cross::after {
    content: ''; position: absolute; background: #9dffc4; border-radius: 1px;
    box-shadow: 0 0 6px #00ff66, 0 0 12px rgba(0, 255, 102, 0.8);
}
.heal-cross::before { width: 100%; height: 32%; top: 34%; left: 0; }
.heal-cross::after  { width: 32%; height: 100%; left: 34%; top: 0; }
@keyframes healCrossRise {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.4) rotate(var(--rot, 0deg)); }
    18%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -95px) scale(1) rotate(var(--rot, 0deg)); }
}

/* Trajectoire en arc : jaillit vers le haut, ralentit, puis retombe comme une fontaine */
@keyframes fontaine {
    0%   { opacity: 0; transform: translate(-50%, -15px) scale(0.6) rotate(var(--tilt, 0deg)); }
    8%   { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), -13px) scale(1.1) rotate(var(--tilt, 0deg)); }
    30%  { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), -3px) scale(1.03) rotate(var(--tilt, 0deg)); }
    55%  { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), 15px) scale(0.98) rotate(var(--tilt, 0deg)); }
    80%  { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), 38px) scale(0.92) rotate(var(--tilt, 0deg)); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--drift, 0px)), 62px) scale(0.85) rotate(var(--tilt, 0deg)); }
}
@keyframes fontaineCrit {
    0%   { opacity: 0; transform: translate(-50%, -18px) scale(0.5) rotate(var(--tilt, 0deg)); }
    8%   { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), -15px) scale(1.35) rotate(var(--tilt, 0deg)); }
    30%  { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), -4px) scale(1.15) rotate(var(--tilt, 0deg)); }
    55%  { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), 17px) scale(1.06) rotate(var(--tilt, 0deg)); }
    80%  { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), 42px) scale(0.98) rotate(var(--tilt, 0deg)); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--drift, 0px)), 68px) scale(0.9) rotate(var(--tilt, 0deg)); }
}
@keyframes fontaineMiss {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    20%  { opacity: 1; transform: translate(calc(-50% + var(--drift, 0px)), -20px) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--drift, 0px)), -10px) scale(0.95); }
}
.damage-popup.miss { animation: fontaineMiss 1s ease-out forwards; }

/* --- Animations d'armes --- */
.fx-slash {
    position: absolute; top: 50%; left: 50%; width: 130px; height: 8px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    transform: translate(-50%, -50%) rotate(-35deg) scaleX(0);
    box-shadow: 0 0 12px #fff; z-index: 15; opacity: 0;
    animation: slashAnim 0.35s ease-out forwards;
}
.fx-slash.energy { background: linear-gradient(90deg, transparent, #b100ff, transparent); box-shadow: 0 0 16px #b100ff; }
@keyframes slashAnim {
    0% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(0); opacity: 0; }
    30% { opacity: 1; }
    60% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(1); opacity: 0; }
}

/* Balle en vol : positionnée dans .arena (position: relative), voyage en ligne droite mais avec
   un point de départ/arrivée légèrement aléatoire à chaque tir, pour une salve qui varie. */
.fx-balle {
    position: absolute; width: 7px; height: 3px; background: #fff2a8; border-radius: 2px;
    box-shadow: 0 0 7px 2px rgba(255, 210, 110, 0.85); z-index: 25; pointer-events: none;
    transform: translate(-50%, -50%);
    animation: balleVol 0.2s linear forwards;
}
@keyframes balleVol {
    from { transform: translate(-50%, -50%) translate(0, 0); opacity: 1; }
    to   { transform: translate(-50%, -50%) translate(var(--dx), var(--dy)); opacity: 1; }
}
/* Impact de balle : positionné DANS le wrap de la cible (comme fx-slash/fx-smash), donc relatif
   à elle et non à l'arène entière. */
.fx-impact-balle {
    position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
    background: radial-gradient(circle, rgba(255,225,140,0.95) 0%, rgba(255,140,40,0.7) 45%, transparent 72%);
    border-radius: 50%; z-index: 26; pointer-events: none;
    animation: impactBalleAnim 0.3s ease-out forwards;
}
.fx-impact-balle.crit {
    width: 26px; height: 26px;
    background: radial-gradient(circle, rgba(255,255,180,1) 0%, rgba(255,232,0,0.85) 40%, transparent 75%);
    animation: impactBalleAnim 0.4s ease-out forwards;
}
@keyframes impactBalleAnim {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
}

/* Nuage de poison : une bouffée centrale + quelques petites bouffées décalées, pour un effet
   plus organique qu'une simple explosion ronde. Teinte verte toxique. */
.fx-poison-nuage {
    position: absolute; top: 50%; left: 50%; width: 26px; height: 26px;
    background: radial-gradient(circle, rgba(150,255,90,0.9) 0%, rgba(90,190,60,0.65) 45%, transparent 75%);
    border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; pointer-events: none;
    filter: blur(1px);
    animation: poisonNuageAnim 0.9s ease-out forwards;
}
.fx-poison-nuage.petit { width: 16px; height: 16px; }
@keyframes poisonNuageAnim {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; }
    35%  { opacity: 0.85; }
    100% { transform: translate(-50%, -50%) scale(3.4); opacity: 0; }
}

/* Brûlure : effet LÉGER pour chaque tick (contrairement au nuage de poison, plus discret et plus
   rapide) — un simple flicker orangé sur l'avatar touché, pas de nuage qui grossit. */
.fx-brulure-tick {
    position: absolute; top: 50%; left: 50%; width: 34px; height: 34px;
    background: radial-gradient(circle, rgba(255,140,20,0.85) 0%, rgba(255,60,0,0.5) 50%, transparent 75%);
    border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; pointer-events: none;
    filter: blur(1.5px);
    animation: brulureTickAnim 0.5s ease-out forwards;
}
@keyframes brulureTickAnim {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0.9; }
    50%  { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
}

.fx-smash {
    position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
    border: 4px solid #ffcc00; border-radius: 50%; transform: translate(-50%, -50%);
    z-index: 15; opacity: 0; animation: smashAnim 0.5s ease-out forwards;
}
@keyframes smashAnim {
    0% { width: 10px; height: 10px; opacity: 1; border-width: 8px; }
    100% { width: 140px; height: 140px; opacity: 0; border-width: 1px; }
}

/* Charge à chaque échange : tout le cercle du frappeur (photo + contour + fissures) se jette
   vers sa cible, puis revient — le loadout, le nom et la barre de vie restent immobiles. */
.avatar-wrap.charge-aller {
    transition: transform 0.15s cubic-bezier(0.55, 0, 0.85, 0.35);
}
.avatar-wrap.charge-retour {
    transition: transform 0.22s cubic-bezier(0.2, 0.85, 0.3, 1);
}

.fx-punch-impact {
    position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
    transform: translate(-50%, -50%) scale(0.3); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,220,150,0.5) 45%, transparent 72%);
    z-index: 18; opacity: 0; pointer-events: none;
    animation: punchImpact 0.35s ease-out forwards;
}
@keyframes punchImpact {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.25); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
}

.fx-explosion {
    position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
    background: radial-gradient(circle, #fff, #ff9900, transparent);
    border-radius: 50%; transform: translate(-50%, -50%);
    z-index: 16; opacity: 0; animation: explosionAnim 0.6s ease-out forwards;
}
@keyframes explosionAnim {
    0% { width: 10px; height: 10px; opacity: 1; }
    50% { opacity: 1; }
    100% { width: 220px; height: 220px; opacity: 0; }
}

</style>
</head>
<body>
<div class="arena" id="arena">
    <div class="rope-frame-wrap"><div class="rope-frame-mask"></div></div>
    <div class="fatigue-banner" id="fatigueBanner">🔥 FATIGUE — LE COMBAT S'ÉTERNISE 🔥</div>

            <div class="hp-text"><span id="hpTextA">100</span> / <span id="hpMaxA">100</span> PV<span class="shield-montant" id="shieldTextA"></span></div>
            <div class="status-bar" id="statusBarA"></div>
        </div>

        <div class="vs">VS</div>

        <div class="fighter right" id="fighterB">

                <div class="avatar-wrap" id="avatarWrapB">
                    <img class="avatar" id="avatarB" src="" alt="">
                    <svg class="avatar-cracks" id="cracksB" viewBox="0 0 90 90"></svg>

                </div>
                <div class="slot-grid right">

            </div>

            <div class="hp-text"><span id="hpTextB">100</span> / <span id="hpMaxB">100</span> PV<span class="shield-montant" id="shieldTextB"></span></div>
            <div class="status-bar" id="statusBarB"></div>
        </div>
    </div>

</div>

<!-- ⚠️ CORRECTIF (URL trop longue sur les combats longs) : les données du duel n'arrivent plus
     encodées dans l'URL du browser source — duel.cs les écrit maintenant dans ce petit fichier
     JS local, déposé dans le MÊME dossier que cette page. L'URL envoyée par Streamer.bot à OBS
     redevient minuscule et de longueur FIXE (juste un jeton pour forcer le rechargement), quelle
     que soit la durée du combat. Si ce fichier n'existe pas encore (avant le tout premier duel),
     le chargement échoue silencieusement (juste une 404 dans la console) et la page retombe sur
     les données de test ci-dessous — rien de grave. -->
<script src="duel_data.js"></script>
<script type="module">
    const params = new URLSearchParams(window.location.search);
    const rawData = params.get('data');
    const replayId = params.get('replay');

    // Variables de test
    let data = {
        attaquant: "TEST_ATTAQUANT", defenseur: "TEST_DEFENSEUR",
        avatar_attaquant: "https://static-cdn.jtvnw.net/user-default-pictures-uv/default-avatar_1-70x70.png",
        avatar_defenseur: "https://static-cdn.jtvnw.net/user-default-pictures-uv/default-avatar_1-70x70.png",
        pv_max_attaquant: 130, pv_max_defenseur: 110,
        gear_attaquant: ["🚀", "🤖"], gear_defenseur: ["🗡️", "🔷", "🦺"],
        arme_attaquant_icon: "🚀", arme_attaquant_anim: "missile", arme_attaquant_image: "",
        offhand_attaquant_icon: "", offhand_attaquant_image: "",
        torso_attaquant_icon: "🤖", torso_attaquant_couleur: "#FFE800", torso_attaquant_image: "",
        arme_defenseur_icon: "🗡️", arme_defenseur_anim: "slash", arme_defenseur_image: "",
        offhand_defenseur_icon: "🔷", offhand_defenseur_image: "",
        torso_defenseur_icon: "🦺", torso_defenseur_couleur: "#aaaaaa", torso_defenseur_image: "",
        vainqueur: "TEST_ATTAQUANT", mise: 250, consommable_utilise: "",
        statut_attaquant: "Outsider", statut_defenseur: "Favori",
        victoires_attaquant: 4, defaites_attaquant: 2, victoires_defenseur: 9, defaites_defenseur: 1,
        points_attaquant: 1500, points_defenseur: -500, round_debut_fatigue: 4,
        medailles_attaquant: 20, medailles_defenseur: 2,
        rounds: [
            { round: 1, frappeur: "TEST_ATTAQUANT", cible: "TEST_DEFENSEUR", touche: true, crit: false, degats: 24, pv_attaquant_apres: 130, pv_defenseur_apres: 86 },
            { round: 2, frappeur: "TEST_DEFENSEUR", cible: "TEST_ATTAQUANT", touche: true, crit: false, degats: 12, pv_attaquant_apres: 118, pv_defenseur_apres: 86 },
            { round: 3, frappeur: "TEST_ATTAQUANT", cible: "TEST_DEFENSEUR", touche: true, crit: true, degats: 44, pv_attaquant_apres: 118, pv_defenseur_apres: 42 },
            { round: 4, frappeur: "TEST_DEFENSEUR", cible: "TEST_ATTAQUANT", touche: false, crit: false, degats: 0, pv_attaquant_apres: 118, pv_defenseur_apres: 42 },
            { round: 5, frappeur: "TEST_ATTAQUANT", cible: "TEST_DEFENSEUR", touche: true, crit: false, degats: 42, pv_attaquant_apres: 118, pv_defenseur_apres: 0 }
        ]
    };

    if (replayId) {
        // Mode replay : revoir un duel de l'historique. Les détails de chaque duel sont publiés
        // par snapshot-vers-github.cs sous duels/<id>.json (même dossier que cette page).
        try {
            const reponse = await fetch('duels/' + encodeURIComponent(replayId) + '.json');
            data = await reponse.json();
        } catch (e) { console.error("Erreur de chargement du replay", e); }
    } else if (rawData) {
        // Mode test manuel : ouvrir le fichier avec ?data=... dans l'URL pour prévisualiser un
        // duel précis sans passer par Streamer.bot.
        try { data = JSON.parse(decodeURIComponent(rawData)); }
        catch (e) { console.error("Erreur de décodage JSON", e); }
    } else if (typeof window.dernierDuel !== 'undefined') {
        // Mode production : les vraies données, déposées par duel.cs dans duel_data.js et
        // chargées juste au-dessus via <script src="duel_data.js">.
        data = window.dernierDuel;
    }

    document.getElementById('nameA').innerText = data.attaquant;
    document.getElementById('nameB').innerText = data.defenseur;
    document.getElementById('avatarA').src = data.avatar_attaquant;
    document.getElementById('avatarB').src = data.avatar_defenseur;
    document.getElementById('hpMaxA').innerText = data.pv_max_attaquant;
    document.getElementById('hpMaxB').innerText = data.pv_max_defenseur;
    document.getElementById('hpTextA').innerText = data.pv_max_attaquant;
    document.getElementById('hpTextB').innerText = data.pv_max_defenseur;

    // Statut de combat (équitable / underdog / topdog)
    function appliquerStatut(elId, texte) {
        const el = document.getElementById(elId);
        el.innerText = texte;
        const classe = texte === 'Outsider' ? 'underdog' : (texte === 'Favori' ? 'topdog' : 'equitable');
        el.className = 'matchup-status ' + classe;
    }
    appliquerStatut('statusA', data.statut_attaquant || 'Combat équitable');
    appliquerStatut('statusB', data.statut_defenseur || 'Combat équitable');

    // Palmarès victoires/défaites
    document.getElementById('recordA').innerHTML = `<span class="v">${data.victoires_attaquant || 0}V</span> / <span class="d">${data.defaites_attaquant || 0}D</span>`;
    document.getElementById('recordB').innerHTML = `<span class="v">${data.victoires_defenseur || 0}V</span> / <span class="d">${data.defaites_defenseur || 0}D</span>`;

    // Remplit une case de loadout : icône si équipé, croix si vide, barré si indisponible (arme 2 mains).
    function appliquerCase(slotId, image, barre) {
        const el = document.getElementById(slotId);
        el.classList.remove('filled', 'barred');
        if (barre) {
            el.innerHTML = '';
            el.classList.add('barred');
        } else if (image) {
            el.innerHTML = `<img src="${image}" alt="">`;
            el.classList.add('filled');
        } else {
            el.innerHTML = '<span class="empty-mark">✕</span>';
        }
    }

    // Chemin de l'image du poing — affichée dans la case Arme quand rien n'est équipé (combat à mains nues)
    const IMAGE_POING = 'gear/poing.png';

    // ==========================================================
    // BARRE DE STATUTS — configure ici l'icône de chaque effet. Laisse "image": ""
    // pour garder le symbole par défaut, ou mets un chemin (ex: "images/poison.png")
    // pour le remplacer par ton propre visuel. Pour ajouter un futur effet, il suffit
    // d'ajouter une entrée ici + un appel à definirBadge() au bon endroit plus bas.
    // ==========================================================
    const ICONES_STATUT = {
        poison:          { defaut: '☠️', image: '' },
        brulure:         { defaut: '🔥', image: '' },
        execution:       { defaut: '💀', image: '' },
        resistance_crit: { defaut: '🧿', image: '' },
        reflection:      { defaut: '🌵', image: '' },
        regeneration:    { defaut: '➕', image: '' },
        precision:       { defaut: '🎯', image: '' },
        saignement:      { defaut: '🩸', image: '' },
        anti_heal:       { defaut: '🚫', image: '' },
        rage:            { defaut: '🔥', image: '' },
        marque:          { defaut: '🔻', image: '' },
        brise_def:       { defaut: '💢', image: '' },
        parade:          { defaut: '🤺', image: '' },
        tenacite:        { defaut: '🧠', image: '' },
        dernier_souffle: { defaut: '🕊️', image: '' },
        frenesie:        { defaut: '💨', image: '' },
        protection:      { defaut: '🛡️', image: '' },
    };

    // Crée, met à jour, ou retire (si valeur vide/nulle/0) le badge d'un effet donné
    // sur le combattant "A" ou "B". Générique — sert à tous les effets de statut.
    function definirBadge(suffixe, cle, valeurTexte) {
        const bar = document.getElementById('statusBar' + suffixe);
        if (!bar) return;
        let badge = bar.querySelector('.badge-' + cle);
        if (!valeurTexte) {
            if (badge) badge.remove();
            return;
        }
        if (!badge) {
            badge = document.createElement('div');
            badge.className = 'badge-statut ' + cle + ' badge-' + cle;
            bar.appendChild(badge);
        }
        const config = ICONES_STATUT[cle] || {};
        const contenuIcone = config.image ? `<img src="${config.image}" alt="">` : (config.defaut || '');
        badge.innerHTML = `${contenuIcone}<span class="valeur">${valeurTexte}</span>`;
    }

    // Protection : état valable pour TOUT le duel (décidé une fois au début côté C#), pas
    // round par round comme les autres effets — toujours sur le défenseur, seul concerné.
    definirBadge('B', 'protection', data.protection_active ? '-20%' : 0);

    // Met à jour l'overbar jaune de Shield + le montant affiché à droite des PV.
    // pvMax sert de référence d'échelle, comme pour la barre de vie elle-même.
    function majShield(suffixe, montantShield, pvMax) {
        const barre = document.getElementById('shieldBar' + suffixe);
        const texte = document.getElementById('shieldText' + suffixe);
        const cadre = document.getElementById('frame' + suffixe);
        if (!montantShield || montantShield <= 0) {
            barre.style.width = '0%';
            texte.textContent = '';
            if (cadre) cadre.classList.remove('shield-actif');
            return;
        }
        barre.style.width = Math.min(100, (montantShield / pvMax) * 100).toFixed(1) + '%';
        texte.textContent = ' (+' + montantShield + ')';

    // Popup de gain de bouclier (icône du Stratagème + "+XX"), affiché sur le PORTEUR lui-même —

    function appliquerEquipement(suffixe, armeImage, offhandImage, torsoImage, strategemeImage, deuxMains, torsoCouleur, avatarEl) {

    function initBadgesStatiques(suffixe, precision, reflection, resistanceCrit, regen, tenacite) {

    initBadgesStatiques('A', data.attaquant_precision, data.attaquant_reflection, data.attaquant_resistance_crit, data.attaquant_regeneration, data.attaquant_tenacite);
    initBadgesStatiques('B', data.defenseur_precision, data.defenseur_reflection, data.defenseur_resistance_crit, data.defenseur_regeneration, data.defenseur_tenacite);
    majShield('A', data.attaquant_shield_max, data.pv_max_attaquant);
    majShield('B', data.defenseur_shield_max, data.pv_max_defenseur);
    const avatarA = document.getElementById('avatarA');
