    function showDamage(wrap, texte, classe, icone) {
        const popup = document.createElement('div');
        popup.className = 'damage-popup' + (classe ? ' ' + classe : '');
        if (icone && classe !== 'miss') {
            // Accepte soit un chemin d'image ("gear/xxx.png"), soit un simple emoji ("🐍") —
            // pratique pour donner une icône aux dégâts indirects (poison, fatigue...) sans
            // avoir besoin d'un fichier image dédié.
            const estImage = icone.includes('/') || icone.includes('.');
            popup.innerHTML = estImage
                ? `<img class="popup-weapon-icon" src="${icone}" alt="">`
                : `<span class="popup-emoji-icon">${icone}</span>`;
        }
        popup.appendChild(document.createTextNode(texte));
        // Jet net à gauche OU à droite (jamais un léger tremblement proche du centre), mais
        // resserré pour ne plus déborder sur les cases d'objets ou la zone centrale — l'essentiel
        // de la lisibilité vient maintenant de la CHUTE verticale (effet fontaine), pas de l'écart
        // horizontal, qui n'a plus besoin d'être aussi large.
        // Le côté n'est plus tiré au hasard : les dégâts subis partent vers le CENTRE (côté de
        // l'adversaire), les soins partent vers l'EXTÉRIEUR (à l'opposé) — pour A (à gauche de
        // l'écran) le centre est à droite, pour B (à droite) le centre est à gauche. Seule
        // l'amplitude du jet reste aléatoire, pas sa direction.
        const estGain = (classe === 'heal' || classe === 'lifesteal');
        const estWrapA = (wrap === wrapA);
        const cote = estGain
            ? (estWrapA ? -1 : 1)   // soin : vers l'extérieur (gauche pour A, droite pour B)
            : (estWrapA ? 1 : -1);  // dégâts subis : vers le centre (droite pour A, gauche pour B)
        const drift = (cote * (24 + Math.random() * 40)).toFixed(0) + 'px'; // 24 à 64px, direction fixe par côté/type
        const tilt = (cote * (3 + Math.random() * 5)).toFixed(1) + 'deg';
        const voffset = (Math.random() * 14 - 7).toFixed(0) + 'px'; // léger décalage du point de départ
        popup.style.setProperty('--drift', drift);
        popup.style.setProperty('--tilt', tilt);
        popup.style.top = `calc(10% + ${voffset})`;
        wrap.appendChild(popup);
        setTimeout(() => popup.remove(), 1500);
    }

    const playSound = (file, vol = 0.3) => { try { const a = new Audio(file); a.volume = vol; a.play(); } catch (e) {} };

    function flashAvatar(el) {
        el.classList.add('hit-flash');
        setTimeout(() => el.classList.remove('hit-flash'), 200);

        // Le flash rouge de contour se joue sur le calque de contour dédié, toujours au-dessus
        const frameEl = document.getElementById(el.id.replace('avatar', 'frame'));
        if (frameEl) {
            frameEl.classList.add('hit-flash');
            setTimeout(() => frameEl.classList.remove('hit-flash'), 200);
        }
    }

    // Sons de secours si un objet n'a pas encore de champ "Sons" configuré dans le catalogue.
    // Styles d'impact disponibles (champ "Anim" du catalogue) : slash, slash_energy, smash, missile, explosion
    const SONS_PAR_DEFAUT = {
        slash: 'sons/sword_slash.mp3',
        slash_energy: 'sons/energy_slash.mp3',
        smash: 'sons/hammer_smash.mp3',
        missile: 'sons/missile_launch.mp3',
        explosion: 'sons/explosion.mp3',
        poison: 'sons/explosion.mp3',
        heal: 'sons/heal_default.mp3'
    };
    const SON_IMPACT_GENERIQUE = 'sons/hit_impact.mp3';
    const SON_CRIT = 'sons/crit_hit.mp3';
    const SON_ESQUIVE = 'sons/dodge_woosh.mp3';
    // Joués une fois à la toute fin du combat, selon que l'ATTAQUANT (data.attaquant) remporte
    // ou perd le duel — remplace par tes propres fichiers. Plusieurs séparés par une virgule
    // ne sont PAS supportés ici (contrairement aux sons d'objets) ; un seul fichier chacun.
    const SON_VICTOIRE_ATTAQUANT = 'sons/win.mp3';
    const SON_DEFAITE_ATTAQUANT = 'sons/lose.mp3';
    // Pas de fichier dédié confirmé — remplace par ton propre son si tu en as un pour l'égalité.
    const SON_EGALITE = 'sons/shutdown.mp3';
    const SON_FATIGUE_TICK = 'sons/fatigue_tick.mp3';
    // Pas de fichier dédié confirmé dans ton dossier sons/ pour l'instant — repli sur "ticks.mp3"
    // qui existe déjà. Remplace par un fichier dédié si tu en ajoutes un.
    const SON_POISON_TICK = 'sons/ticks.mp3';
    // ⚠️ Configure ICI le son joué à CHAQUE tick de brûlure subi (Souffle Draconique et tout futur
    // objet à Brûlure) — remplace ce chemin par ton propre fichier une fois ajouté à sons/.
    const SON_BRULURE_TICK = 'sons/feu.mp3';
    // Icônes des dégâts INDIRECTS (pas d'arme/Stratagème associé au moment du tick) — pour
    // qu'on comprenne d'où vient chaque dégât affiché. Emoji par défaut, remplaçable par un
    // chemin d'image (ex: "gear/poison-icon.png") si tu préfères une vraie icône.
    const ICONE_POISON = '🐍';
    const ICONE_BRULURE = '🔥';
    const ICONE_FATIGUE = '⏱️';
    const ICONE_SAIGNEMENT = '🩸';
    const SON_STUN = 'sons/stun.mp3';
    // ⚠️ Pas de fichier dédié confirmé dans ton dossier sons/ pour l'instant — configure ICI le son
    // générique joué quand un "dernier souffle" (résurrection, ex: Manteau du Loup) se déclenche et
    // que l'objet responsable n'a pas son propre SonsDernierSouffle dans le catalogue.
    const SON_DERNIER_SOUFFLE = 'sons/dernier_souffle.mp3';

    // Pioche un son au hasard parmi la liste (séparée par des virgules) définie sur l'objet dans le catalogue.
    // Si rien n'est configuré, retombe sur le son générique associé au type d'animation.
    function sonDeLObjet(listeCsv, anim) {
        const liste = (listeCsv && listeCsv.trim()) ? listeCsv.split(',').map(s => s.trim()).filter(Boolean) : [];
        if (liste.length > 0) return 'sons/' + liste[Math.floor(Math.random() * liste.length)];
        return SONS_PAR_DEFAUT[anim] || null;
    }

    // Joue l'animation d'arme (ou de Stratagème) correspondante sur la cible.
    // sonsCoup = le champ "Sons" (CSV) de l'OBJET qui frappe réellement (arme équipée, ou Stratagème pour sa salve).
    function playWeaponAnim(anim, wrapCible, fromLeft, sonsCoup, nbCoups, degatsTotal, armeImage, degatsParBalle, critParBalle) {
        if (anim === 'slash' || anim === 'slash_energy') {
            playSound(sonDeLObjet(sonsCoup, anim), 0.3);
            const fx = document.createElement('div');
            fx.className = 'fx-slash' + (anim === 'slash_energy' ? ' energy' : '');
            wrapCible.appendChild(fx);
            setTimeout(() => fx.remove(), 400);
        } else if (anim === 'smash' || anim === 'missile') {
            playSound(sonDeLObjet(sonsCoup, anim), 0.35);
            const fx = document.createElement('div');
            fx.className = 'fx-smash';
            wrapCible.appendChild(fx);
            setTimeout(() => fx.remove(), 550);
            arena.classList.add('shake');
            setTimeout(() => arena.classList.remove('shake'), 400);
        } else if (anim === 'explosion') {
            playSound(sonDeLObjet(sonsCoup, anim), 0.4);
            const boom = document.createElement('div');
            boom.className = 'fx-explosion';
            wrapCible.appendChild(boom);
            setTimeout(() => boom.remove(), 650);
            arena.classList.add('shake');
            setTimeout(() => arena.classList.remove('shake'), 400);
        } else if (anim === 'poison') {
            playSound(sonDeLObjet(sonsCoup, anim), 0.35);
            const nuage = document.createElement('div');
            nuage.className = 'fx-poison-nuage';
            wrapCible.appendChild(nuage);
            setTimeout(() => nuage.remove(), 900);
            // Petites bouffées secondaires décalées, pour un nuage qui se déploie plutôt
            // qu'une simple boule verte unique.
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const puff = document.createElement('div');
                    puff.className = 'fx-poison-nuage petit';
                    puff.style.marginLeft = ((Math.random() - 0.5) * 46) + 'px';
                    puff.style.marginTop = ((Math.random() - 0.5) * 34) + 'px';
                    wrapCible.appendChild(puff);
                    setTimeout(() => puff.remove(), 750);
                }, i * 90);
            }
        } else if (anim === 'tir' || anim === 'bombardement') {
            // "bombardement" reprend exactement le même timing de rafale que "tir" (plusieurs
            // coups qui arrivent en rapide succession, un seul son pour toute la salve), mais
            // chaque impact déclenche une pleine explosion au lieu d'un petit point de balle —
            // pensé pour un Stratagème type frappe aérienne plutôt qu'une arme à feu.
            const estBombardement = anim === 'bombardement';
            // Arme de tir en salve : plusieurs balles partent de l'attaquant vers la cible,
            // avec un trajet légèrement aléatoire à chaque fois (mais toujours dans le bon sens).
            // Le porteur ne charge jamais pour ce type d'arme (voir le if plus haut dans le round).
            // Le son ne joue qu'UNE fois pour toute la rafale, pas par balle.
            playSound(sonDeLObjet(sonsCoup, anim), 0.3);
            const wrapSource = fromLeft ? wrapA : wrapB;
            const rectArena = arena.getBoundingClientRect();
            const rectSource = wrapSource.getBoundingClientRect();
            const rectDest = wrapCible.getBoundingClientRect();
            const xSource = rectSource.left + rectSource.width / 2 - rectArena.left;
            const ySource = rectSource.top + rectSource.height / 2 - rectArena.top;
            const xDest = rectDest.left + rectDest.width / 2 - rectArena.left;
            const yDest = rectDest.top + rectDest.height / 2 - rectArena.top;

            // Le nombre de balles suit le nombre RÉEL de tirs résolus côté combat (un jet de
            // crit/dégâts indépendant par balle) — nbCoups ne sert plus que de repli si
            // d'anciennes données sans détail par balle arrivent encore.
            const nbBalles = (degatsParBalle && degatsParBalle.length > 0) ? degatsParBalle.length : Math.max(1, nbCoups || 1);

            for (let i = 0; i < nbBalles; i++) {
                setTimeout(() => {
                    const decalageDepart = (Math.random() - 0.5) * 26;
                    const decalageArriveeX = (Math.random() - 0.5) * 44;
                    const decalageArriveeY = (Math.random() - 0.5) * 30;

                    const balle = document.createElement('div');
                    balle.className = 'fx-balle';
                    const xDepart = xSource + decalageDepart;
                    const yDepart = ySource + decalageDepart * 0.6;
                    balle.style.left = xDepart + 'px';
                    balle.style.top = yDepart + 'px';
                    balle.style.setProperty('--dx', ((xDest + decalageArriveeX) - xDepart) + 'px');
                    balle.style.setProperty('--dy', ((yDest + decalageArriveeY) - yDepart) + 'px');
                    arena.appendChild(balle);

                    setTimeout(() => {
                        balle.remove();
                        const critCetteBalle = critParBalle && critParBalle[i];

                        if (estBombardement) {
                            const boom = document.createElement('div');
                            boom.className = 'fx-explosion';
                            boom.style.marginLeft = decalageArriveeX + 'px';
                            boom.style.marginTop = decalageArriveeY + 'px';
                            wrapCible.appendChild(boom);
                            setTimeout(() => boom.remove(), 650);
                            arena.classList.add('shake');
                            setTimeout(() => arena.classList.remove('shake'), 300);
                        } else {
                            const impact = document.createElement('div');
                            impact.className = 'fx-impact-balle' + (critCetteBalle ? ' crit' : '');
                            impact.style.marginLeft = decalageArriveeX + 'px';
                            impact.style.marginTop = decalageArriveeY + 'px';
                            wrapCible.appendChild(impact);
                            setTimeout(() => impact.remove(), 300);
                        }

                        // Pluie de dégâts rapide : un chiffre par balle, avec son propre jet de crit —
                        // reflète exactement ce que le combat a résolu, plus de répartition artificielle.
                        if (degatsParBalle && degatsParBalle[i] !== undefined) {
                            const texte = critCetteBalle ? `CRIT : ${degatsParBalle[i]}!` : '-' + degatsParBalle[i];
                            showDamage(wrapCible, texte, critCetteBalle ? 'crit' : null, armeImage);
                        }
                    }, 200);
                }, i * 70); // léger décalage entre chaque balle pour bien lire la rafale
            }
        } else if (anim === 'poing') {
            // Bruit de coup de poing par défaut, quand personne n'a d'arme équipée (ATK pure).
            // Ajoute simplement un fichier ici pour varier — jamais deux fois le même son de suite.
            if (SONS_POING.length > 0) {
                let choix;
                do { choix = SONS_POING[Math.floor(Math.random() * SONS_POING.length)]; }
                while (SONS_POING.length > 1 && choix === dernierSonPoing);
                dernierSonPoing = choix;
                playSound('sons/' + choix, 0.3);
            }
            arena.classList.add('shake-light');
            setTimeout(() => arena.classList.remove('shake-light'), 300);

            const impact = document.createElement('div');
            impact.className = 'fx-punch-impact';
            wrapCible.appendChild(impact);
            setTimeout(() => impact.remove(), 400);
        }
    }

    function exploserAvatar(avatarEl, wrapEl) {
        const taille = 90;
        const cols = 6, rows = 6; // 36 éclats
        const fragW = taille / cols, fragH = taille / rows;
        const src = avatarEl.src;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const frag = document.createElement('div');
                const resteEnPlace = Math.random() < 0.4; // ~40% des éclats restent visibles, cassés mais reconnaissables
                frag.className = 'avatar-shard' + (resteEnPlace ? ' shard-reste' : '');
                frag.style.width = fragW + 'px';
                frag.style.height = fragH + 'px';
                frag.style.left = (c * fragW) + 'px';
                frag.style.top = (r * fragH) + 'px';
                frag.style.backgroundImage = `url(${src})`;
                frag.style.backgroundPosition = `-${c * fragW}px -${r * fragH}px`;
                frag.style.backgroundSize = `${taille}px ${taille}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = resteEnPlace ? (4 + Math.random() * 8) : (50 + Math.random() * 90);
                frag.style.setProperty('--dx', (Math.cos(angle) * distance).toFixed(0) + 'px');
                frag.style.setProperty('--dy', (Math.sin(angle) * distance).toFixed(0) + 'px');
                frag.style.setProperty('--rot', ((resteEnPlace ? 25 : 360) * (Math.random() * 2 - 1)).toFixed(0) + 'deg');
                frag.style.animationDelay = (Math.random() * 0.08).toFixed(2) + 's';

                wrapEl.appendChild(frag);
                if (!resteEnPlace) setTimeout(() => frag.remove(), 1300);
            }
        }

        // Flash blanc bref au moment de l'explosion ; le portrait d'origine reste visible en
        // sourdine en dessous des éclats, pour qu'on identifie encore qui vient de se faire détruire.
        const flash = document.createElement('div');
        flash.className = 'death-flash';
        wrapEl.appendChild(flash);
        setTimeout(() => flash.remove(), 350);

        avatarEl.style.transition = 'opacity 0.3s ease 0.4s, filter 0.5s ease 0.3s';
        avatarEl.style.opacity = '0.3';
        avatarEl.style.filter = 'grayscale(1) brightness(0.7)'; // la couleur "sort" du perdant

        // Le cadre du perdant s'éteint aussi (plus de couleur ni de lueur), à l'opposé du halo doré du vainqueur
        const frameEl = document.getElementById(avatarEl.id.replace('avatar', 'frame'));
        if (frameEl) frameEl.classList.add('loser-fade');

        // Les quartiers d'image (fissures) sont un calque à part — désaturés aussi, sinon ils
        // restent en pleine couleur et peuvent noyer la lisibilité du tampon K.O.
        const masqueQuartiers = wrapEl.querySelector('.quartiers-mask');
        if (masqueQuartiers) {
            masqueQuartiers.style.transition = 'filter 0.5s ease 0.3s';
            masqueQuartiers.style.filter = 'grayscale(1) brightness(0.7)';
        }

        // L'ensemble du portrait s'affaisse légèrement, comme un boxeur qui s'écroule
        wrapEl.style.transition = 'transform 0.6s cubic-bezier(0.34, 0.6, 0.4, 1) 0.15s';
        wrapEl.style.transform = 'translateY(6px) rotate(9deg)';

        // Tampon "K.O." qui s'écrase sur le portrait une fois l'explosion et l'affaissement bien amorcés
        setTimeout(() => {
            const tampon = document.createElement('div');
            tampon.className = 'ko-tampon';
            tampon.innerText = 'K.O.';
            wrapEl.appendChild(tampon);
            arena.classList.add('shake-light');
            setTimeout(() => arena.classList.remove('shake-light'), 300);
        }, 550);
    }

    let delai = 500;
    let sonFatigue = null;

    // Musique de bataille : ajoute simplement un nom de fichier ici pour l'inclure dans la rotation aléatoire.
    // Fichiers attendus dans sons/musiques/ — fondu à l'entrée, à la sortie, et enchaînement
    // automatique sur un AUTRE morceau (jamais deux fois le même à la suite) une fois le premier terminé.
    // Sons de coup de poing (quand personne n'a d'arme équipée) — ajoute/retire des fichiers librement
    const SONS_POING = ['poing_1.mp3', 'poing_2.mp3', 'poing_3.mp3', 'poing_4.mp3', 'poing_5.mp3'];
    let dernierSonPoing = null;

    const MUSIQUES_BATAILLE = ['dbz_battle_2.mp3', 'sf2-guile-theme.mp3', 'shokugeki_battle.mp3','naturo_battle_1.mp3','naturo_battle_2.mp3','renoir_battle_2.mp3'];
    const VOLUME_MUSIQUE = 0.4;
    const FADE_DUREE_MS = 1500;

    function creerLecteurMusique(liste, volumeCible, fadeMs) {
        const el = new Audio();
        let dernierChoix = null;
        let timerFade = null;
        let arrete = false;

        function fade(depart, arrivee, callback) {
            if (timerFade) clearInterval(timerFade);
            const etapes = 30;
            let etape = 0;
            timerFade = setInterval(() => {
                etape++;
                el.volume = Math.max(0, Math.min(volumeCible, depart + (arrivee - depart) * (etape / etapes)));
                if (etape >= etapes) {
                    clearInterval(timerFade);
                    timerFade = null;
                    if (callback) callback();
                }
            }, fadeMs / etapes);
        }

        function jouerUnAutre() {
            if (arrete || liste.length === 0) return;
            let choix;
            do {
                choix = liste[Math.floor(Math.random() * liste.length)];
            } while (liste.length > 1 && choix === dernierChoix);
            dernierChoix = choix;

            el.src = 'sons/musiques/' + choix;
            el.currentTime = 0;
            el.volume = 0;
            el.play().catch(() => {});
            fade(0, volumeCible, null);
        }

        // Fondu de sortie amorcé juste avant la fin naturelle du morceau, puis on enchaîne
        el.addEventListener('timeupdate', () => {
            if (!arrete && el.duration && (el.duration - el.currentTime) * 1000 <= fadeMs && el.volume > 0.001) {
                fade(el.volume, 0, null);
            }
        });
        el.addEventListener('ended', () => { if (!arrete) jouerUnAutre(); });

        jouerUnAutre();

        return {
            arreter() {
                arrete = true;
                fade(el.volume, 0, () => { el.pause(); el.currentTime = 0; });
            }
        };
    }

    const musiqueBataille = MUSIQUES_BATAILLE.length > 0 ? creerLecteurMusique(MUSIQUES_BATAILLE, VOLUME_MUSIQUE, FADE_DUREE_MS) : null;
    const PAUSE_ENTRE_ROUNDS = 1100; // Rythme entre chaque coup
    const PAUSE_TOUR_ETOURDI = 350; // Un tour étourdi ne fait rien : on ne perd pas le temps d'un coup normal

    // Détermine l'index du DERNIER round de Stratagème de chaque combattant,
    // pour griser sa case juste après ce round (tous ses usages sont alors consommés).
    let dernierStrategemeA = -1, dernierStrategemeB = -1;
    let dernierSoinActifA = -1, dernierSoinActifB = -1;
    data.rounds.forEach((r, idx) => {
        if (r.strategeme) {
            if (r.frappeur === data.attaquant) dernierStrategemeA = idx;
            else dernierStrategemeB = idx;
        }
        if (r.offhand_cooldown_tours !== undefined && r.soin_applique) {
            if (r.frappeur === data.attaquant) dernierSoinActifA = idx;
            else dernierSoinActifB = idx;
        }
    });

    // Génère un vrai motif de bris de verre : un point d'impact central (légèrement excentré),
    // des lignes principales qui rayonnent jusqu'au bord, et des branches secondaires plus fines
    // qui partent d'un point intermédiaire de chaque ligne principale — comme un pare-brise fêlé.
    function genererFissures(svgId, nbPrincipales) {
        const svg = document.getElementById(svgId);
        const centre = { x: 45 + (Math.random() * 14 - 7), y: 45 + (Math.random() * 14 - 7) };
        const rayon = 44;
        const chemins = [];

        function pointBord(angle) {
            return { x: 45 + Math.cos(angle) * rayon, y: 45 + Math.sin(angle) * rayon };
        }

        function tracerLigne(depart, arrivee, segments, epaisseur) {
            const points = [depart];
            let d = `M ${depart.x.toFixed(1)} ${depart.y.toFixed(1)}`;
            const perp = Math.atan2(arrivee.y - depart.y, arrivee.x - depart.x) + Math.PI / 2;
            for (let s = 1; s <= segments; s++) {
                const t = s / segments;
                let px = depart.x + (arrivee.x - depart.x) * t;
                let py = depart.y + (arrivee.y - depart.y) * t;
                const decalage = (Math.random() * 10 - 5) * (s < segments ? 1 : 0.2);
                px = Math.max(2, Math.min(88, px + Math.cos(perp) * decalage));
                py = Math.max(2, Math.min(88, py + Math.sin(perp) * decalage));
                d += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
                points.push({ x: px, y: py });
            }
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            path.style.strokeWidth = epaisseur.toFixed(1);
            svg.appendChild(path);
            chemins.push(path);
            return points;
        }

        const angles = [];
        for (let i = 0; i < nbPrincipales; i++) {
            const angle = (i / nbPrincipales) * Math.PI * 2 + (Math.random() * 0.4 - 0.2);
            angles.push(angle);
            const arrivee = pointBord(angle);
            const pts = tracerLigne(centre, arrivee, 3 + Math.floor(Math.random() * 2), 2.0 + Math.random() * 1.4);

            // 1 à 2 branches secondaires plus fines, partant d'un point intermédiaire de la ligne principale
            const nbBranches = Math.random() < 0.65 ? 1 : 2;
            for (let b = 0; b < nbBranches; b++) {
                const depuis = pts[1 + Math.floor(Math.random() * Math.max(1, pts.length - 2))];
                const angleBranche = angle + (Math.random() * 1.7 - 0.85);
                tracerLigne(depuis, pointBord(angleBranche), 2 + Math.floor(Math.random() * 2), 0.8 + Math.random() * 0.9);
            }
        }
        return { chemins, centre, angles };
    }
    const fissuresA = genererFissures('cracksA', 7);
    const fissuresB = genererFissures('cracksB', 7);

    // Révèle un nombre de fissures proportionnel aux PV manquants : plus les PV baissent,
    // plus il y a de traits visibles, jusqu'à un réseau complet à 0 PV.
    function majFissuresCote(chemins, pct) {
        const manquant = 100 - pct;
        const nbVisibles = Math.round((manquant / 100) * chemins.length);
        chemins.forEach((path, idx) => {
            path.style.opacity = idx < nbVisibles ? '1' : '0';
        });
        return nbVisibles;
    }

    // Découpe le portrait en quartiers partant du même point d'impact que les fissures, pour
    // pouvoir les décaler légèrement — donne l'impression que les morceaux ont vraiment bougé.
    function genererQuartiersImage(avatarEl, wrapEl, centre, angles) {
        const src = avatarEl.src;
        const centreVrai = { x: 45, y: 45 }; // le vrai centre du cercle de l'avatar — PAS le point d'impact, qui peut être décentré
        const rayonExterieur = 45; // rayon réel de l'avatar (cercle de 90px de diamètre)
        const pct = (v) => (v / 90 * 100).toFixed(1) + '%';
        const morceaux = [];

        // Conteneur circulaire dédié, pour masquer le léger dépassement quand un quartier se décale
        // vers l'extérieur — n'affecte pas les autres effets (popups, soin...) qui doivent eux sortir du cercle.
        const masque = document.createElement('div');
        masque.className = 'quartiers-mask';
        wrapEl.insertBefore(masque, avatarEl.nextSibling);

        function pointSurCercle(angle) {
            return { x: centreVrai.x + Math.cos(angle) * rayonExterieur, y: centreVrai.y + Math.sin(angle) * rayonExterieur };
        }

        for (let i = 0; i < angles.length; i++) {
            const a1 = angles[i];
            let a2 = angles[(i + 1) % angles.length];
            if (a2 <= a1) a2 += Math.PI * 2; // gère le passage de l'angle qui reboucle à 0

            // Plusieurs points le long de l'arc RÉEL entre a1 et a2 (au lieu d'une simple corde droite),
            // pour que le contour du quartier suive fidèlement le bord circulaire, sans laisser
            // de petit croissant non couvert entre deux quartiers voisins.
            const nbPointsArc = 6;
            const pointsArc = [];
            for (let k = 0; k <= nbPointsArc; k++) {
                pointsArc.push(pointSurCercle(a1 + (a2 - a1) * (k / nbPointsArc)));
            }

            const morceau = document.createElement('div');
            morceau.className = 'avatar-quartier';
            morceau.style.backgroundImage = `url(${src})`;
            const sommets = [`${pct(centre.x)} ${pct(centre.y)}`, ...pointsArc.map(p => `${pct(p.x)} ${pct(p.y)}`)];
            morceau.style.clipPath = `polygon(${sommets.join(', ')})`;

            const angleMilieu = (a1 + a2) / 2;
            morceau.dataset.dx = Math.cos(angleMilieu).toFixed(3);
            morceau.dataset.dy = Math.sin(angleMilieu).toFixed(3);
            morceau.dataset.rot = (Math.random() * 8 - 4).toFixed(1);

            masque.appendChild(morceau);
            morceaux.push(morceau);
        }
        return morceaux;
    }

    // Décale chaque quartier vers l'extérieur, mais SEULEMENT une fois plus de 4 traits visibles —
    // en dessous de ce seuil, le portrait reste intact, seules les fissures s'affichent.
    const SEUIL_TRAITS_AVANT_DECALAGE = 4;
    function majQuartiers(morceaux, nbVisibles, nbTraitsTotal) {
        let intensite = 0;
        if (nbVisibles > SEUIL_TRAITS_AVANT_DECALAGE) {
            intensite = (nbVisibles - SEUIL_TRAITS_AVANT_DECALAGE) / Math.max(1, nbTraitsTotal - SEUIL_TRAITS_AVANT_DECALAGE);
        }
        morceaux.forEach(m => {
            const dist = intensite * 5; // décalage max ~5px
            const dx = (parseFloat(m.dataset.dx) * dist).toFixed(1);
            const dy = (parseFloat(m.dataset.dy) * dist).toFixed(1);
            const rot = (parseFloat(m.dataset.rot) * intensite).toFixed(1);
            m.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
        });
    }

    const quartiersA = genererQuartiersImage(avatarA, wrapA, fissuresA.centre, fissuresA.angles);
    const quartiersB = genererQuartiersImage(avatarB, wrapB, fissuresB.centre, fissuresB.angles);

    function majFissures(pctA, pctB) {
        const nbVisiblesA = majFissuresCote(fissuresA.chemins, pctA);
        const nbVisiblesB = majFissuresCote(fissuresB.chemins, pctB);
        majQuartiers(quartiersA, nbVisiblesA, fissuresA.chemins.length);
        majQuartiers(quartiersB, nbVisiblesB, fissuresB.chemins.length);
    }

    // Charge à chaque échange : le cercle du frappeur (photo + contour + fissures + quartiers) se
    // jette jusqu'au contact réel avec le cercle de sa cible, puis revient à sa position d'origine.
    // La distance est calculée en direct (position réelle à l'écran), pas une valeur fixe devinée.
    let vsDescendu = false;
    function jouerChargePortrait(wrapFrappeur, wrapCible) {
        // Le VS descend de sa position de départ (entre les deux avatars) une seule fois, dès la 1ère charge
        if (!vsDescendu) {
            vsDescendu = true;
            document.querySelector('.vs').classList.add('descendu');
        }

        const rectF = wrapFrappeur.getBoundingClientRect();
        const rectC = wrapCible.getBoundingClientRect();
        const versLaDroite = rectF.left < rectC.left;
        // Distance jusqu'au contact, avec un léger chevauchement (10px) pour bien vendre l'impact physique
        const distance = versLaDroite ? (rectC.left - rectF.right) + 10 : (rectC.right - rectF.left) - 10;

        wrapFrappeur.classList.remove('charge-retour');
        wrapFrappeur.classList.add('charge-aller');
        wrapFrappeur.style.zIndex = '15'; // passe au premier plan le temps de la charge
        wrapFrappeur.style.transform = `translateX(${distance.toFixed(0)}px) scale(1.06)`;

        // Petit choc pile à l'instant du contact
        setTimeout(() => {
            arena.classList.add('shake-light');
            setTimeout(() => arena.classList.remove('shake-light'), 200);
        }, 150);

        // Un court temps de contact avant de repartir, pour que l'impact ait le temps de se lire
        setTimeout(() => {
            if (mortDejaDeclenchee) return; // l'effondrement du perdant a la priorité, on ne l'écrase pas
            wrapFrappeur.classList.remove('charge-aller');
            wrapFrappeur.classList.add('charge-retour');
            wrapFrappeur.style.transform = 'translateX(0) scale(1)';
            setTimeout(() => { wrapFrappeur.style.zIndex = ''; }, 220);
        }, 240);
    }

    function briller(slotId) {
        const el = document.getElementById(slotId);
        el.classList.remove('glow');
        void el.offsetWidth; // force le redémarrage de l'animation si elle est déjà en cours
        el.classList.add('glow');
    }

    // Voile sombre + décompte qui se retire d'un tour à chaque round, jusqu'à disparaître (charge dispo)
    // État de recharge par combattant, décompté sur LEURS VRAIS TOURS (pas un minuteur générique) —
    // pour rester synchronisé avec la vraie règle de recharge côté simulation (basée sur les tours propres du porteur).
    let cooldown = {
        Strategeme: { A: { restant: 0, total: 0 }, B: { restant: 0, total: 0 } },
        Offhand: { A: { restant: 0, total: 0 }, B: { restant: 0, total: 0 } }
    };

    function majCooldownVisuel(typeCase, suffixe) {
        const slotEl = document.getElementById('slot' + typeCase + suffixe);
        const etat = cooldown[typeCase][suffixe];
        let overlay = slotEl.querySelector('.cooldown-overlay');
        let nombre = slotEl.querySelector('.cooldown-number');

        if (etat.restant <= 0) {
            if (overlay) overlay.remove();
            if (nombre) nombre.remove();
            return;
        }

        if (!overlay) {
            overlay = document.createElement('div');
            overlay.className = 'cooldown-overlay';
            slotEl.appendChild(overlay);
        }
        if (!nombre) {
            nombre = document.createElement('div');
            nombre.className = 'cooldown-number';
            slotEl.appendChild(nombre);
        }
        overlay.style.setProperty('--pct', (((etat.total - etat.restant) / etat.total) * 100).toFixed(0));
        nombre.innerText = etat.restant;
    }

    function demarrerRecharge(typeCase, slotEl, suffixe, toursTotal) {
        slotEl.classList.remove('epuise');
        // +1 : la vraie règle de recharge (côté simulation) exige CooldownTours+1 tours propres
        // avant de pouvoir retirer, pas CooldownTours pile — sinon l'affichage indique "prêt"
        // un tour trop tôt par rapport au moment où ça se redéclenche réellement.
        const vraiTotal = toursTotal + 1;
        cooldown[typeCase][suffixe] = { restant: vraiTotal, total: vraiTotal };
        majCooldownVisuel(typeCase, suffixe);
    }

    // Décompte d'1 tour de recharge (Stratagème ET Off-hand actif) à chaque round où CE combattant précis vient de jouer
    function decompterCooldownSiSonTour(frappeur) {
        const suffixe = frappeur === data.attaquant ? 'A' : (frappeur === data.defenseur ? 'B' : null);
        if (!suffixe) return;
        ['Strategeme', 'Offhand'].forEach(typeCase => {
            if (cooldown[typeCase][suffixe].restant > 0) {
                cooldown[typeCase][suffixe].restant--;
                majCooldownVisuel(typeCase, suffixe);
            }
        });
    }

    // Effet dramatique quand le Dernier souffle sauve un combattant d'un coup fatal
    function afficherDernierSouffle(wrap) {
        playSound(SON_IMPACT_GENERIQUE, 0.4);
        const texte = document.createElement('div');
        texte.className = 'fx-dernier-souffle';
        texte.innerText = 'DERNIER SOUFFLE !';
        wrap.appendChild(texte);
        setTimeout(() => texte.remove(), 1800);
    }

    function afficherDegatsFatigue(degats) {
        if (!degats) return;
        showDamage(wrapA, '-' + degats, 'fatigue', ICONE_FATIGUE);
        showDamage(wrapB, '-' + degats, 'fatigue', ICONE_FATIGUE);
    }

    // Contrairement à la fatigue (symétrique, touche les deux), le poison ne tique QUE sur le
    // joueur dont c'est le tour — cibleEstAttaquant indique lequel des deux.
    function afficherDegatsPoison(degats, cibleEstAttaquant) {
        if (!degats) return;
        showDamage(cibleEstAttaquant ? wrapA : wrapB, '-' + degats, 'poison', ICONE_POISON);
    }

    // Brûlure : même principe que le poison (popup + emoji), PLUS un léger flicker orangé sur
    // l'avatar touché — plus discret et plus rapide que le nuage de poison (voir fx-brulure-tick).
    function afficherDegatsBrulure(degats, cibleEstAttaquant) {
        if (!degats) return;
        const wrapCible = cibleEstAttaquant ? wrapA : wrapB;
        showDamage(wrapCible, '-' + degats, 'brulure', ICONE_BRULURE);
        const flicker = document.createElement('div');
        flicker.className = 'fx-brulure-tick';
        wrapCible.appendChild(flicker);
        setTimeout(() => flicker.remove(), 500);
    }

    // Round de lancement d'un missile à déclenchement différé (ex: Solo Silo) : aucun dégât ce
    // tour-ci, juste le son de lancement + un petit texte pour indiquer qu'il est en approche.
    function afficherLancementMissile(wrapLanceur, sonsLancement) {
        playSound(sonDeLObjet(sonsLancement, 'missile_lance'), 0.35);
        const texte = document.createElement('div');
        texte.className = 'fx-dernier-souffle'; // réutilise le style de texte flottant déjà existant
        texte.style.color = '#ffcf5c';
        texte.innerText = '🚀 EN APPROCHE...';
        wrapLanceur.appendChild(texte);
        setTimeout(() => texte.remove(), 1800);
    }

    // Effet cartoon d'étourdissement : 3 étoiles qui tournent au-dessus de la tête + texte "STUN"
    // Démarre l'effet d'étourdissement (persiste jusqu'à ce qu'on l'arrête explicitement)
    function demarrerEtourdissement(wrap) {
        playSound(SON_STUN, 0.3);
        arreterEtourdissement(wrap); // sécurité, évite un doublon si jamais déjà présent

        const orbite = document.createElement('div');
        orbite.className = 'fx-stun';
        orbite.innerHTML = `
            <span class="etoile" style="transform: rotate(0deg) translateX(20px);">★</span>
            <span class="etoile" style="transform: rotate(120deg) translateX(20px);">★</span>
            <span class="etoile" style="transform: rotate(240deg) translateX(20px);">★</span>
        `;
        wrap.appendChild(orbite);

        const texte = document.createElement('div');
        texte.className = 'fx-stun-texte';
        texte.innerText = 'STUN !';
        wrap.appendChild(texte);
    }

    // Retire l'effet d'étourdissement, une fois le tour de la victime réellement sauté
    function arreterEtourdissement(wrap) {
        const orbite = wrap.querySelector('.fx-stun');
        if (orbite) orbite.remove();
        const texte = wrap.querySelector('.fx-stun-texte');
        if (texte) texte.remove();
    }

    function afficherSoin(wrap, montant, sonsCsv, iconeSource) {
        if (!montant) return;

        // Anneau lumineux au sol
        const ring = document.createElement('div');
        ring.className = 'heal-ring';
        wrap.appendChild(ring);
        setTimeout(() => ring.remove(), 1300);

        // 2 faisceaux verticaux, légèrement décalés de part et d'autre du centre
        [-10, 8].forEach((decalage, i) => {
            const beam = document.createElement('div');
            beam.className = 'heal-beam';
            beam.style.left = `calc(50% + ${decalage}px)`;
            beam.style.animationDelay = (i * 0.08) + 's';
            wrap.appendChild(beam);
            setTimeout(() => beam.remove(), 1200);
        });

        // 5 croix lumineuses qui montent avec une dérive et une inclinaison propres à chacune
        for (let i = 0; i < 5; i++) {
            const cross = document.createElement('div');
            cross.className = 'heal-cross';
            cross.style.setProperty('--dx', (Math.random() * 50 - 25).toFixed(0) + 'px');
            cross.style.setProperty('--rot', (Math.random() * 30 - 15).toFixed(0) + 'deg');
            cross.style.animationDelay = (i * 0.12).toFixed(2) + 's';
            wrap.appendChild(cross);
            setTimeout(() => cross.remove(), 1700);
        }

        // Quelques petites étincelles en complément
        for (let i = 0; i < 4; i++) {
            const p = document.createElement('div');
            p.className = 'heal-particle';
            p.style.setProperty('--dx', (Math.random() * 30 - 15).toFixed(0) + 'px');
            p.style.animationDelay = (i * 0.09).toFixed(2) + 's';
            wrap.appendChild(p);
            setTimeout(() => p.remove(), 1300);
        }

        showDamage(wrap, '+' + montant, 'heal', iconeSource);
        playSound(sonDeLObjet(sonsCsv, 'heal'), 0.3);
    }

    let mortDejaDeclenchee = false;
    function verifierMortEtDeclencher(pvA, pvB) {
        if (mortDejaDeclenchee) return;
        if (pvA <= 0 || pvB <= 0) {
            mortDejaDeclenchee = true;
            const perdantEstA = pvA <= 0;
            exploserAvatar(perdantEstA ? avatarA : avatarB, perdantEstA ? wrapA : wrapB);

            const SONS_MORT = ['mort_1.mp3'];
            if (SONS_MORT.length > 0) {
                playSound('sons/' + SONS_MORT[Math.floor(Math.random() * SONS_MORT.length)], 0.4);
            }
        }
    }

    data.rounds.forEach((r, idx) => {
        setTimeout(() => {
            const frappeurEstA = r.frappeur === data.attaquant;
            const wrapCible = frappeurEstA ? wrapB : wrapA;
            const avatarCible = frappeurEstA ? avatarB : avatarA;
            const armeAnim = (r.strategeme
                ? (frappeurEstA ? data.strategeme_attaquant_anim : data.strategeme_defenseur_anim)
                : (frappeurEstA ? data.arme_attaquant_anim : data.arme_defenseur_anim)) || 'poing';
            const armeImage = r.strategeme
                ? (frappeurEstA ? data.strategeme_attaquant_image : data.strategeme_defenseur_image)
                : (frappeurEstA ? data.arme_attaquant_image : data.arme_defenseur_image);
            const sonsCoup = r.sons_override || (r.strategeme
                ? (frappeurEstA ? data.strategeme_attaquant_sons : data.strategeme_defenseur_sons)
                : (frappeurEstA ? data.arme_attaquant_sons : data.arme_defenseur_sons));
            // Nombre de coups d'une salve (CoupsParUsage côté catalogue) — 1 par défaut si le
            // backend ne transmet pas encore ce champ, pour rester rétrocompatible.
            const armeCoups = (r.strategeme
                ? (frappeurEstA ? data.strategeme_attaquant_coups : data.strategeme_defenseur_coups)
                : (frappeurEstA ? data.arme_attaquant_coups : data.arme_defenseur_coups)) || 1;

            // Fait avancer la recharge d'un Stratagème d'1 tour, uniquement quand SON porteur vient
            // de jouer — garde le décompte visuel parfaitement synchronisé avec la vraie règle de
            // recharge côté simulation (basée sur les tours propres du porteur, pas le rythme global).
            if (r.frappeur) decompterCooldownSiSonTour(r.frappeur);

            // Badge de poison : mis à jour à chaque round à partir du nombre de tours restants
            // (fonctionne aussi bien sur un round normal que sur le round environnemental).
            if (r.poison_duree_attaquant !== undefined) {
                definirBadge('A', 'poison', r.poison_duree_attaquant > 0 ? r.poison_duree_attaquant : 0);
                definirBadge('B', 'poison', r.poison_duree_defenseur > 0 ? r.poison_duree_defenseur : 0);
            }

            // Badge de brûlure : même principe que le poison ci-dessus.
            if (r.brulure_duree_attaquant !== undefined) {
                definirBadge('A', 'brulure', r.brulure_duree_attaquant > 0 ? r.brulure_duree_attaquant : 0);
                definirBadge('B', 'brulure', r.brulure_duree_defenseur > 0 ? r.brulure_duree_defenseur : 0);
            }

            // ⚠️ CORRECTIF : sans ceci, une arme à changement de stance (ex: Volto-Hache) ne
            // montrait JAMAIS son image de stance 2 — la case d'arme était réglée UNE SEULE FOIS
            // au chargement (voir appliquerEquipement plus haut) et jamais remise à jour ensuite.
            // r.arme_image_override reflète la stance ACTUELLE du frappeur à CE round précis.
            if (r.arme_image_override !== undefined && r.arme_image_override !== null && r.frappeur) {
                const suffixeArme = frappeurEstA ? 'A' : 'B';
                appliquerCase('slotWeapon' + suffixeArme, r.arme_image_override || IMAGE_POING, false);
            }

            // Shield : overbar jaune mise à jour à chaque round (absorbe en silence, pas d'effet dédié)
            if (r.shield_attaquant !== undefined) {
                majShield('A', r.shield_attaquant, data.pv_max_attaquant);
                majShield('B', r.shield_defenseur, data.pv_max_defenseur);
            }

            // Saignement : badge avec le nombre de stacks restantes (perd 1 stack/tour)
            if (r.saignement_stacks_attaquant !== undefined) {
                definirBadge('A', 'saignement', r.saignement_stacks_attaquant > 0 ? r.saignement_stacks_attaquant : 0);
                definirBadge('B', 'saignement', r.saignement_stacks_defenseur > 0 ? r.saignement_stacks_defenseur : 0);
            }
            if (r.saignement_tick) { showDamage(frappeurEstA ? wrapA : wrapB, '-' + r.degats_saignement, 'fatigue', ICONE_SAIGNEMENT); }

            // Anti-heal : simple badge on/off tant que l'effet dure
            if (r.anti_heal_actif_attaquant !== undefined) {
                definirBadge('A', 'anti_heal', r.anti_heal_actif_attaquant ? 'X' : 0);
                definirBadge('B', 'anti_heal', r.anti_heal_actif_defenseur ? 'X' : 0);
            }

            // Marque de vulnérabilité : simple badge on/off tant que l'effet dure
            if (r.marque_active_attaquant !== undefined) {
                definirBadge('A', 'marque', r.marque_active_attaquant ? 'X' : 0);
                definirBadge('B', 'marque', r.marque_active_defenseur ? 'X' : 0);
            }

            // Brise-def (armure cassée, ex: Pétards Shinobi / Hache Chargée) : simple badge on/off,
            // même principe que Marque ci-dessus.
            if (r.brise_def_actif_attaquant !== undefined) {
                definirBadge('A', 'brise_def', r.brise_def_actif_attaquant ? 'X' : 0);
                definirBadge('B', 'brise_def', r.brise_def_actif_defenseur ? 'X' : 0);
            }

            // Frénésie : badge avec le bonus de Vitesse actuellement actif
            if (r.frenesie_bonus_attaquant !== undefined) {
                definirBadge('A', 'frenesie', r.frenesie_bonus_attaquant > 0 ? '+' + r.frenesie_bonus_attaquant : 0);
                definirBadge('B', 'frenesie', r.frenesie_bonus_defenseur > 0 ? '+' + r.frenesie_bonus_defenseur : 0);
            }

            // Déclenchement de la fatigue (corde) : flammes autour de l'arène, bannière, son en boucle
            // (vérifié avant le cas environnemental ci-dessous, au cas où le tout premier tic serait déjà fatal)
            if (r.round === data.round_debut_fatigue) {
                arena.classList.add('rope-active');
                document.getElementById('fatigueBanner').classList.add('show');
                sonFatigue = new Audio('sons/fatigue_loop.mp3');
                sonFatigue.loop = true;
                sonFatigue.volume = 0.25;
                sonFatigue.play().catch(() => {});
            }

            // Round "environnemental" : le poison ou la fatigue vient d'achever quelqu'un avant
            // même une action normale. Pas d'attaquant précis à animer : on se contente de mettre
            // à jour les deux barres de vie et de faire flasher les deux avatars.
            if (!r.frappeur) {
                hpBarA.style.width = Math.max(0, (r.pv_attaquant_apres / data.pv_max_attaquant) * 100) + '%';
                hpBarB.style.width = Math.max(0, (r.pv_defenseur_apres / data.pv_max_defenseur) * 100) + '%';
                majFissures(
                    Math.max(0, (r.pv_attaquant_apres / data.pv_max_attaquant) * 100),
                    Math.max(0, (r.pv_defenseur_apres / data.pv_max_defenseur) * 100)
                );
                hpTextA.innerText = r.pv_attaquant_apres;
                hpTextB.innerText = r.pv_defenseur_apres;
                verifierMortEtDeclencher(r.pv_attaquant_apres, r.pv_defenseur_apres);
                if (r.dernier_souffle_attaquant) {
                    afficherDernierSouffle(wrapA);
                    const sonDS = (r.sons_dernier_souffle_attaquant && r.sons_dernier_souffle_attaquant.trim()) ? sonDeLObjet(r.sons_dernier_souffle_attaquant, null) : SON_DERNIER_SOUFFLE;
                    playSound(sonDS, 0.4);
                }
                if (r.dernier_souffle_defenseur) {
                    afficherDernierSouffle(wrapB);
                    const sonDS2 = (r.sons_dernier_souffle_defenseur && r.sons_dernier_souffle_defenseur.trim()) ? sonDeLObjet(r.sons_dernier_souffle_defenseur, null) : SON_DERNIER_SOUFFLE;
                    playSound(sonDS2, 0.4);
                }
                flashAvatar(avatarA);
                flashAvatar(avatarB);
                if (r.fatigue_tick) { playSound(SON_FATIGUE_TICK, 0.35); afficherDegatsFatigue(r.degats_fatigue); }
                if (r.poison_tick) { playSound(SON_POISON_TICK, 0.3); afficherDegatsPoison(r.degats_poison, r.poison_tick_attaquant); }
                if (r.brulure_tick) { playSound(SON_BRULURE_TICK, 0.3); afficherDegatsBrulure(r.degats_brulure, r.brulure_tick_attaquant); }
                if (r.missile_lance) afficherLancementMissile(frappeurEstA ? wrapB : wrapA, r.sons_override);
                if (r.strategeme_bouclier) { playSound(sonDeLObjet(r.sons_override, 'shield'), 0.35); afficherGainBouclier(frappeurEstA ? wrapA : wrapB, r.montant_bouclier, armeImage); }
                return;
            }

            // La fatigue peut aussi tiquer le même cycle qu'une action normale (ou un tour étourdi) :
            // le son et l'affichage se superposent simplement à ce qui se passe déjà ce tour-là.
            if (r.fatigue_tick) { playSound(SON_FATIGUE_TICK, 0.35); afficherDegatsFatigue(r.degats_fatigue); }
                if (r.poison_tick) { playSound(SON_POISON_TICK, 0.3); afficherDegatsPoison(r.degats_poison, r.poison_tick_attaquant); }
                if (r.brulure_tick) { playSound(SON_BRULURE_TICK, 0.3); afficherDegatsBrulure(r.degats_brulure, r.brulure_tick_attaquant); }
                if (r.missile_lance) afficherLancementMissile(frappeurEstA ? wrapB : wrapA, r.sons_override);
                if (r.strategeme_bouclier) { playSound(sonDeLObjet(r.sons_override, 'shield'), 0.35); afficherGainBouclier(frappeurEstA ? wrapA : wrapB, r.montant_bouclier, armeImage); }

            // Config utilisateur (son + message configurables via catalog.cs, Eclair de Tomoe) :
            // déclenchement À L'APPLICATION de la Paralysie -- affiché sur la CIBLE qui vient de la
            // subir (wrapCible). L'autre déclenchement (chaque tour où elle bloque déjà l'arme) est
            // géré juste en dessous, dans le round "vide" qui saute le tour.
            if (r.paralysie_applique) {
                if (r.sons_paralysie) playSound(sonDeLObjet(r.sons_paralysie, null), 0.35);
                if (r.message_paralysie) showDamage(wrapCible, r.message_paralysie, 'paralysie', null);
            }

            // Tour étourdi OU paralysé (ex: passif du Marteau / Eclair de Tomoe) : le personnage ne
            // fait rien ce tour-ci -- CORRECTIF : la paralysie (arme seule bloquée) utilise le même
            // round "vide" que le stun (tout bloqué), donc il faut aussi sauter ici sur r.paralysie,
            // sinon un tour de paralysie-seule tombait dans le code d'animation d'attaque normale
            // ci-dessous alors qu'aucun coup n'a réellement eu lieu (touche/degats à 0).
            // On retire les étoiles cartoon seulement si c'était un vrai stun (la paralysie n'a
            // jamais déclenché cette animation, inchangé).
            if (r.etourdi || r.paralysie) {
                if (r.etourdi) arreterEtourdissement(frappeurEstA ? wrapA : wrapB);
                // Rejoue le même son/message à chaque tour où la Paralysie bloque encore l'arme --
                // affiché sur le FRAPPEUR bloqué cette fois (pas la cible, qui n'est pas concernée
                // par ce round "vide").
                if (r.paralysie) {
                    if (r.sons_paralysie) playSound(sonDeLObjet(r.sons_paralysie, null), 0.35);
                    if (r.message_paralysie) showDamage(frappeurEstA ? wrapA : wrapB, r.message_paralysie, 'paralysie', null);
                }
                return;
            }

            // Rounds où le porteur agit sur lui-même (soin actif, gain de bouclier) ou prépare un
            // effet différé (lancement de missile) : l'adversaire n'a jamais été visé, donc pas
            // d'esquive/charge d'attaque à jouer pour lui — MAIS le halo et le cooldown de la
            // case doivent quand même s'appliquer, exactement comme un usage normal.
            const suffixeFrappeur = frappeurEstA ? 'A' : 'B';
            const estActionSurSoiMeme = r.missile_lance || r.strategeme_bouclier || (r.soin_applique && r.frappeur === r.cible);

            if (!estActionSurSoiMeme) {
                // Charge du frappeur vers sa cible à chaque échange normal — le Stratagème et les
                // armes à distance (tir en rafale, tir explosif) gardent leur propre traitement
                // d'impact à distance, sans charge physique (le porteur ne se déplace pas pour tirer).
                // ⚠️ CORRECTIF : seul "tir" était exclu ici — une arme d'ARME (pas Stratagème) utilisant
                // "explosion" (ex. Arbalète Explosive) tombait donc dans le cas par défaut et se
                // voyait appliquer la charge de mêlée, faisant "dasher" une arme censée rester à
                // distance. "bombardement" (tir en rafale où chaque impact explose) est logiquement
                // dans le même cas et doit être exclu pour la même raison.
                if (!r.strategeme && armeAnim !== 'tir' && armeAnim !== 'explosion' && armeAnim !== 'bombardement') {
                    jouerChargePortrait(frappeurEstA ? wrapA : wrapB, frappeurEstA ? wrapB : wrapA);
                }
            }

            // Soin en début de tour (armure régénérante, stimulant en off-hand...) : s'applique
            // à celui qui JOUE ce tour (auto-soin), pas à sa cible.
            if (r.soin_applique) afficherSoin(frappeurEstA ? wrapA : wrapB, r.soin_montant, r.soin_sons, r.soin_image);

            // Halo générique arme/Stratagème — pas pour un simple soin actif d'off-hand (qui a
            // son propre halo dédié juste après), mais bien pour un vrai coup ou un usage de
            // Stratagème (y compris lancement de missile et gain de bouclier, de VRAIS usages
            // de la case Stratagème malgré l'absence d'attaque sur l'adversaire).
            if (r.strategeme || !r.soin_applique || r.frappeur !== r.cible) {
                briller('slot' + (r.strategeme ? 'Strategeme' : 'Weapon') + suffixeFrappeur);
            }

            // Recharge de l'off-hand actif (ex: Stimulant), quand le champ est présent sur ce round
            if (r.offhand_cooldown_tours !== undefined && r.soin_applique) {
                const slotOff = document.getElementById('slotOffhand' + suffixeFrappeur);
                briller('slotOffhand' + suffixeFrappeur);
                const estLeDernierSoin = (frappeurEstA && idx === dernierSoinActifA) || (!frappeurEstA && idx === dernierSoinActifB);
                if (estLeDernierSoin) {
                    slotOff.classList.add('epuise');
                } else {
                    demarrerRecharge('Offhand', slotOff, suffixeFrappeur, r.offhand_cooldown_tours || 0);
                }
            }

            if (r.strategeme) {
                const slotStrat = document.getElementById('slotStrategeme' + suffixeFrappeur);
                const estLeDernierUsage = (frappeurEstA && idx === dernierStrategemeA) || (!frappeurEstA && idx === dernierStrategemeB);

                if (estLeDernierUsage) {
                    // Plus aucune charge : grisé définitivement
                    slotStrat.classList.add('epuise');
                } else {
                    // Encore des charges : voile sombre + décompte du nombre de tours avant la prochaine charge
                    demarrerRecharge('Strategeme', slotStrat, suffixeFrappeur, r.strategeme_cooldown_tours || 0);
                }
            }

            // Le halo et le cooldown viennent d'être traités normalement ci-dessus — pour une
            // action sur soi-même (soin, bouclier, lancement de missile), il n'y a en revanche
            // aucune esquive/dégâts à résoudre sur l'adversaire : on s'arrête ici.
            if (estActionSurSoiMeme) return;

            // Barre de vie ET popup de dégâts se déclenchent au même instant précis,
            // qu'il y ait un délai d'arme (missile) ou non.
            const appliquerPV = () => {
                const pctA = Math.max(0, (r.pv_attaquant_apres / data.pv_max_attaquant) * 100);
                const pctB = Math.max(0, (r.pv_defenseur_apres / data.pv_max_defenseur) * 100);
                hpBarA.style.width = pctA + '%';
                hpBarB.style.width = pctB + '%';
                majFissures(pctA, pctB);
                hpTextA.innerText = r.pv_attaquant_apres;
                hpTextB.innerText = r.pv_defenseur_apres;
                verifierMortEtDeclencher(r.pv_attaquant_apres, r.pv_defenseur_apres);
                if (r.dernier_souffle_attaquant) {
                    afficherDernierSouffle(wrapA);
                    const sonDS = (r.sons_dernier_souffle_attaquant && r.sons_dernier_souffle_attaquant.trim()) ? sonDeLObjet(r.sons_dernier_souffle_attaquant, null) : SON_DERNIER_SOUFFLE;
                    playSound(sonDS, 0.4);
                }
                if (r.dernier_souffle_defenseur) {
                    afficherDernierSouffle(wrapB);
                    const sonDS2 = (r.sons_dernier_souffle_defenseur && r.sons_dernier_souffle_defenseur.trim()) ? sonDeLObjet(r.sons_dernier_souffle_defenseur, null) : SON_DERNIER_SOUFFLE;
                    playSound(sonDS2, 0.4);
                }
            };

            // Parade/Riposte : annule l'affichage normal du coup, montre le blocage sur la cible
            // puis la riposte immédiate sur l'attaquant d'origine. Sons dédiés configurables sur
            // l'objet responsable (SonsParade/SonsRiposte) — repli sur les sons génériques
            // d'esquive/impact si l'objet n'en définit pas.
            if (r.parade_reussie) {
                const sonParade = (r.sons_parade && r.sons_parade.trim()) ? sonDeLObjet(r.sons_parade, null) : SON_ESQUIVE;
                playSound(sonParade, 0.3);
                showDamage(wrapCible, 'PARADE !', 'parade');
                setTimeout(() => {
                    const wrapRipostee = frappeurEstA ? wrapA : wrapB;
                    flashAvatar(frappeurEstA ? avatarA : avatarB);
                    const sonRiposte = (r.sons_riposte && r.sons_riposte.trim()) ? sonDeLObjet(r.sons_riposte, null) : SON_IMPACT_GENERIQUE;
                    playSound(sonRiposte, 0.3);
                    showDamage(wrapRipostee, '-' + r.degats_ripostee, null);
                    appliquerPV();
                }, 350);
                return;
            }

            if (r.touche) {
                const jouerImpact = () => {
                    flashAvatar(avatarCible);
                    playSound(r.crit ? SON_CRIT : SON_IMPACT_GENERIQUE, 0.3);
                    // Pour une arme de tir, playWeaponAnim affiche déjà un popup par balle —
                    // le popup unique habituel serait redondant, donc on le saute pour ce cas.
                    if (armeAnim !== 'tir' && armeAnim !== 'bombardement') {
                        showDamage(wrapCible, (r.crit ? `CRIT : ${r.degats}!` : '-' + r.degats), r.crit ? 'crit' : null, armeImage);
                    }
                    appliquerPV();
                    // Vol de vie : affiché sur le PORTEUR (pas la cible), en vert, avec l'icône
                    // de son arme — comme un popup de dégâts mais à l'inverse (un gain, pas une perte).
                    if (r.vol_de_vie > 0) {
                        showDamage(frappeurEstA ? wrapA : wrapB, '+' + r.vol_de_vie, 'lifesteal', armeImage);
                    }
                    // Renvoi de dégâts : la CIBLE renvoie une partie des dégâts subis à
                    // l'attaquant, avec l'icône de l'objet responsable (Bouclier épineux en
                    // off-hand, Armure épineuse au torse...) plutôt que celle de l'arme du coup initial.
                    if (r.degats_reflechis > 0) {
                        showDamage(frappeurEstA ? wrapA : wrapB, '-' + r.degats_reflechis, null, r.reflection_image);
                    }
                    if (r.etourdi_applique) demarrerEtourdissement(wrapCible);
                    if (r.execution_active) {
                        const suffixeFrappeurExec = frappeurEstA ? 'A' : 'B';
                        definirBadge(suffixeFrappeurExec, 'execution', '+' + r.execution_bonus + '%');
                        setTimeout(() => definirBadge(suffixeFrappeurExec, 'execution', 0), 1300);
                    }
                    if (r.rage_bonus !== undefined) {
                        definirBadge(frappeurEstA ? 'A' : 'B', 'rage', r.rage_bonus > 0 ? '+' + r.rage_bonus + '%' : 0);
                    }
                };
                if (armeAnim) {
                    playWeaponAnim(armeAnim, wrapCible, frappeurEstA, sonsCoup, armeCoups, r.degats, armeImage, r.degats_par_balle, r.crit_par_balle);
                    jouerImpact();
                } else {
                    jouerImpact();
                }
            } else {
                playSound(SON_ESQUIVE, 0.25);
                showDamage(wrapCible, 'ESQUIVE', 'miss');
                appliquerPV();
            }
        }, delai);
        delai += (r.etourdi || r.paralysie) ? PAUSE_TOUR_ETOURDI : PAUSE_ENTRE_ROUNDS;
    });

    setTimeout(() => {
        // Fin du combat : on coupe le son et l'effet de fatigue s'ils étaient actifs, ainsi que la musique
        if (sonFatigue) { sonFatigue.pause(); sonFatigue.currentTime = 0; }
        if (musiqueBataille) musiqueBataille.arreter();
        arena.classList.remove('rope-active');
        document.getElementById('fatigueBanner').classList.remove('show');

        const gagnantEstA = data.vainqueur === data.attaquant;
        if (data.egalite) {
            // Égalité stricte : aucun vainqueur — anneau neutre sur LES DEUX portraits plutôt
            // que le doré réservé à une vraie victoire.
            document.getElementById('frameA').classList.add('egalite-glow');
            document.getElementById('frameB').classList.add('egalite-glow');
            playSound(SON_EGALITE, 0.4);
        } else {
            (gagnantEstA ? document.getElementById('frameA') : document.getElementById('frameB')).classList.add('winner-glow');
            // Son de fin de combat, du point de vue de l'ATTAQUANT (data.attaquant) — indépendant
            // de savoir si c'est le joueur A ou B qui occupait ce rôle dans ce duel précis.
            playSound(data.vainqueur === data.attaquant ? SON_VICTOIRE_ATTAQUANT : SON_DEFAITE_ATTAQUANT, 0.4);
        }
        // L'explosion et le son de mort du perdant se déclenchent désormais dès le coup fatal
        // (voir verifierMortEtDeclencher), plus au moment de cette révélation finale — sinon il y
        // avait un délai perceptible entre le coup qui achève et la réaction visuelle/sonore.

        // Gain/perte de points de classement : remplace le badge de statut (équitable/underdog/topdog)
        // dans l'espace au-dessus de l'avatar, une fois le résultat connu.
        // Les duels ne distribuent plus de lootbox (voir commentaire dans duel.cs) : c'est désormais
        // les médailles qui récompensent le combat, des DEUX côtés et y compris en cas d'égalité —
        // c'est pourquoi le suffixe médaille est calculé AVANT la branche égalité.
        const IMAGE_MEDAILLE = 'assets/medaille.png';

        function afficherPoints(elId, valeur, medailles) {
            const el = document.getElementById(elId);
            if (valeur === undefined || valeur === null) return;
            const suffixeMedailles = medailles > 0
                ? ` <img src="${IMAGE_MEDAILLE}" class="medaille-icon" alt="🏅" onerror="this.replaceWith('🏅')"> +${medailles}`
                : '';
            if (data.egalite) {
                el.innerHTML = 'ÉGALITÉ' + suffixeMedailles;
                el.className = 'matchup-status egalite';
                return;
            }
            const positif = valeur >= 0;
            el.innerHTML = (positif ? '+' : '') + valeur + suffixeMedailles;
            el.className = 'matchup-status ' + (positif ? 'gain' : 'perte');
        }
        afficherPoints('statusA', data.points_attaquant, data.medailles_attaquant);
        afficherPoints('statusB', data.points_defenseur, data.medailles_defenseur);
    }, delai + 500);

    setTimeout(() => {
        arena.style.transition = 'opacity 0.5s';
        arena.style.opacity = '0';
    }, delai + 4500);
</script>
</body>
</html>
