<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitch RPG — Calculateur</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0; --line: #2c2c2e;
    --commun: #8d8d8d; --normal: #5ddd7a; --rare: #4a9fd8; --legendaire: #f2c230;
    --atk: #ff5e3a; --def: #3b82f6; --pv: #ca2972; --spd: #FFCC00; --luck: #00ffaa;
    --investi: #5ddd7a; --objets: #4a9fd8;
    --positif: #5ddd7a; --negatif: #ff6b6b;
}
* { box-sizing: border-box; }
body {
    background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif;
    margin: 0; padding: 28px 18px 60px; line-height: 1.5;
}
h1, h2, h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; margin: 0; }
.page { max-width: 1080px; margin: 0 auto; }

.entete { padding-bottom: 14px; border-bottom: 3px solid var(--yellow); margin-bottom: 24px; }
.entete h1 { font-size: 28px; font-weight: 700; }
.entete h1 span { color: var(--yellow); }
.entete p { color: var(--paper-dim); font-size: 14px; margin: 7px 0 0; max-width: 68ch; }

.champ-profil { position: relative; max-width: 420px; margin-bottom: 22px; }
.champ-profil label {
    display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase; color: var(--paper-dim); margin-bottom: 6px;
}
#chercheProfil {
    width: 100%; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 15px; color: var(--paper); font-size: 15px; font-family: 'Barlow', sans-serif;
}
#chercheProfil:focus { outline: none; border-color: var(--yellow); }
.propositions {
    position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 20;
    background: var(--bg-panel); border: 1px solid var(--line); border-top: 3px solid var(--yellow);
    border-radius: 0 0 6px 6px; max-height: 300px; overflow-y: auto; display: none;
    box-shadow: 0 12px 28px rgba(0,0,0,.5);
}
.propositions.ouvert { display: block; }
.proposition { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.proposition:last-child { border-bottom: none; }
.proposition:hover { background: #1e1e21; }
.proposition img, .proposition .ini {
    width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
    background: #232326; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-size: 12px; color: var(--paper-dim);
}
.proposition span { font-size: 14px; }

.message { color: var(--paper-dim); font-size: 14px; padding: 40px 2px; text-align: center; }

/* ===== Carte profil actif ===== */
.profil-actif-carte {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: rgba(242,194,48,.08); border: 1px solid var(--yellow); border-radius: 8px;
    padding: 16px 20px; margin-bottom: 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.profil-actif-avatar {
    width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--yellow); flex: 0 0 auto; background: var(--bg-panel);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-size: 22px; color: var(--paper-dim);
}
.profil-actif-infos { display: flex; flex-direction: column; }
.profil-actif-titre {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase; color: var(--paper-dim); margin-bottom: 2px;
}
.profil-actif-nom { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--paper); line-height: 1.15; }
.profil-actif-stats { margin-left: auto; display: flex; gap: 26px; flex-wrap: wrap; }
.profil-actif-stat { display: flex; flex-direction: column; align-items: flex-end; }
.profil-actif-stat span {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--paper-dim); margin-bottom: 2px;
}
.profil-actif-stat b { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--yellow); line-height: 1; }

.section { margin-bottom: 34px; }
.section-tete { padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.section-tete h2 { font-size: 19px; font-weight: 600; }
.section-tete p { color: var(--paper-dim); font-size: 13.5px; margin: 6px 0 0; max-width: 68ch; }

/* ===== Redistribution des stats ===== */
.total-dispo {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: rgba(242,194,48,.08); border: 1px solid var(--yellow); border-radius: 6px;
    padding: 12px 18px; margin-bottom: 16px;
}
.total-dispo .chiffre { font-family: 'Oswald', sans-serif; font-size: 24px; font-weight: 700; color: var(--yellow); }
.total-dispo .reste { margin-left: auto; font-size: 13px; color: var(--paper-dim); }
.total-dispo .reste b { color: var(--paper); font-family: 'Oswald', sans-serif; font-size: 16px; }
.total-dispo .reste.negatif b { color: var(--red); }

/* 5 stats sur une seule ligne (desktop) — se replie proprement en dessous */
.stats-grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 10px; }
@media (max-width: 900px) { .stats-grille { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { .stats-grille { grid-template-columns: repeat(2, 1fr); } }

.stat-carte { background: var(--bg-panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 6px; padding: 12px 13px; }
.stat-atk { border-left-color: var(--atk); } .stat-def { border-left-color: var(--def); }
.stat-pv  { border-left-color: var(--pv); }  .stat-spd { border-left-color: var(--spd); }
.stat-luck{ border-left-color: var(--luck);}
.stat-label { display: flex; align-items: center; gap: 5px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--paper-dim); margin-bottom: 8px; }
.stat-ligne { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.stat-ligne button {
    width: 26px; height: 26px; background: none; border: 1px solid var(--line); border-radius: 5px;
    color: var(--paper); font-size: 15px; cursor: pointer; font-family: 'Oswald', sans-serif; flex: 0 0 auto;
}
.stat-ligne button:hover:not([disabled]) { border-color: var(--yellow); color: var(--yellow); }
.stat-ligne button[disabled] { opacity: .3; cursor: default; }
.stat-ligne input {
    width: 100%; text-align: center; background: rgba(0,0,0,.3); border: 1px solid var(--line);
    border-radius: 4px; color: var(--paper); font-family: 'Oswald', sans-serif; font-size: 15px;
    font-weight: 700; padding: 4px 0;
}
/* Décomposition base/investi/objets — code couleur identique à stats.html */
.stat-valeur { font-size: 20px; font-weight: 800; color: var(--paper); line-height: 1; }
.stat-detail { font-size: 11.5px; font-weight: 700; font-family: 'Oswald', sans-serif; margin-top: 3px; }
.stat-detail .base { color: var(--paper-dim); }
.stat-detail .investi { color: var(--investi); }
.stat-detail .objets { color: var(--objets); }
.stat-detail .signe { color: var(--paper-dim); font-weight: 500; margin: 0 2px; }
.stat-delta { font-size: 11px; margin-top: 6px; font-weight: 700; }
.stat-delta.positif { color: var(--positif); }
.stat-delta.negatif { color: var(--negatif); }
.stat-delta.neutre { color: var(--paper-dim); font-weight: 500; }
.legende-detail {
    display: flex; flex-wrap: wrap; gap: 16px; margin: 4px 0 18px; font-size: 11.5px; color: var(--paper-dim);
}
.legende-detail span { display: inline-flex; align-items: center; gap: 5px; }
.legende-detail .pastille { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legende-detail .pastille.base { background: var(--paper-dim); }
.legende-detail .pastille.investi { background: var(--investi); }
.legende-detail .pastille.objets { background: var(--objets); }

.btn-reinit {
    font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--paper-dim); background: none; border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 13px; cursor: pointer;
}
.btn-reinit:hover { color: var(--yellow); border-color: var(--yellow); }

/* ===== Resultats (dégâts et survie) ===== */
.resultats-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.resultat-carte {
    background: var(--bg-panel); border: 1px solid var(--line); border-top: 3px solid var(--yellow);
    border-radius: 6px; padding: 16px 18px; text-align: center;
}
.resultat-carte .valeur { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 800; color: var(--yellow); }
.resultat-carte .label { font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--paper-dim); margin-top: 4px; }
.resultat-carte.secondaire .valeur { color: var(--paper); font-size: 22px; }
.resultat-delta { font-size: 12px; margin-top: 7px; font-weight: 700; }
.resultat-delta.positif { color: var(--positif); }
.resultat-delta.negatif { color: var(--negatif); }
.resultat-delta.neutre { color: var(--paper-dim); font-weight: 500; }

/* ===== Équipement — cartes façon shop.html ===== */
.equip-bloc { margin-bottom: 24px; }
.equip-bloc-titre {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--paper-dim); margin-bottom: 10px;
}
.equip-sous-bloc-titre {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: #7a7568; margin: 12px 0 8px;
}
.grille-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 13px; }

.card {
    --accent: var(--commun);
    position: relative; background: var(--bg-panel); border: 2px solid var(--accent);
    border-radius: 10px; padding: 12px 10px 10px; display: flex; flex-direction: column;
    align-items: center; text-align: center; box-shadow: 0 0 0 0 var(--accent);
    transition: box-shadow .15s, transform .1s; cursor: pointer;
}
.card.choisi { box-shadow: 0 0 0 3px var(--accent); transform: translateY(-2px); }
.card.desactive { opacity: .35; cursor: not-allowed; }
.card.aucun { justify-content: center; }
.card.aucun .card-nom { color: var(--paper-dim); font-style: italic; min-height: 0; }

.card-verrou {
    position: absolute; top: 8px; left: 8px; font-size: 12px; line-height: 1;
    background: rgba(0,0,0,.7); border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 5px; z-index: 2;
}
.card-niveau {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 900; color: var(--yellow);
    border: 1.5px solid var(--yellow); border-radius: 4px; padding: 1px 6px;
    background: rgba(242,194,48,0.12);
}
.card-puce-rarete {
    position: absolute; top: 8px; right: 8px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 9.5px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--accent);
    background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 3px; z-index: 2;
}
.card-puce-rarete.a-gauche { left: 8px; right: auto; }
.card-image { width: 100%; height: 74px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.card-image img { max-width: 100%; max-height: 74px; object-fit: contain; }
.card-image .emoji { font-size: 42px; line-height: 1; }
.card-nom {
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; line-height: 1.25;
    min-height: 2.5em; display: flex; align-items: center; margin-bottom: 6px;
}
.card-sous { font-size: 11px; color: var(--paper-dim); margin-bottom: 6px; margin-top: -3px; }
/* Bloc ajouté (absent de shop.html) : stats de l'objet, avec le code couleur de chaque stat */
.card-stats { font-size: 11px; line-height: 1.6; width: 100%; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
.card-stats .l-atk { color: var(--atk); } .card-stats .l-def { color: var(--def); }
.card-stats .l-pv { color: var(--pv); } .card-stats .l-spd { color: var(--spd); }
.card-stats .l-luck { color: var(--luck); } .card-stats .l-esquive { color: var(--paper); }
.card-stats .l-degats { color: var(--yellow); } .card-stats .l-passif { color: var(--paper-dim); }
.card-note { font-size: 10.5px; color: var(--paper-dim); margin-top: 6px; font-style: italic; }

/* ===== Commande finale ===== */
.zone-commande { margin-top: 18px; background: #17171a; border: 1px solid var(--yellow); border-radius: 8px; padding: 18px 20px; }
.zone-commande .consigne { font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--paper-dim); margin-bottom: 8px; }
.zone-commande-ligne { display: flex; gap: 9px; align-items: stretch; }
.zone-commande-ligne code {
    flex: 1; background: #0b0b0d; border: 1px solid var(--line); border-radius: 5px; padding: 12px 15px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--yellow);
    overflow-x: auto; white-space: nowrap; display: flex; align-items: center;
}
.zone-commande-ligne button {
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: #17170f; background: var(--yellow); border: none; border-radius: 5px;
    padding: 0 20px; cursor: pointer; flex: 0 0 auto;
}
.zone-commande-ligne button:hover { background: #ffd75a; }
.zone-commande .avertissement { font-size: 12px; color: var(--paper-dim); margin-top: 10px; }

@media (max-width: 620px) {
    .zone-commande-ligne { flex-direction: column; }
    .total-dispo .reste { width: 100%; margin-left: 0; }
    .profil-actif-stats { margin-left: 0; width: 100%; justify-content: space-between; }
}
</style>
</head>
<body>
<div class="page">

    <div class="entete">
        <h1>Calculateur de <span>build</span></h1>
        <p>Choisis ta répartition de stats et ton équipement, et vois immédiatement l'effet sur tes dégâts et ta survie —
           sans rien changer pour de vrai tant que tu n'as pas collé la commande.</p>
    </div>

    <div class="champ-profil">
        <label for="chercheProfil">Qui es-tu&nbsp;?</label>
        <input type="text" id="chercheProfil" autocomplete="off" spellcheck="false" placeholder="Ton pseudo Twitch..."
               role="combobox" aria-expanded="false" aria-controls="propositions" aria-autocomplete="list">
        <div class="propositions" id="propositions" role="listbox"></div>
    </div>

    <div id="contenu">
        <div class="message">Cherche ton pseudo pour charger tes stats et ton inventaire.</div>
    </div>

</div>

<script src="formule-combat.js"></script>
<script>
const LABEL_STAT = { atk: 'Attaque', def: 'Défense', pv: 'Points de vie', spd: 'Vitesse', luck: 'Chance' };
const ICONE_STAT = { atk: '⚔️', def: '🛡️', pv: '❤️', spd: '💨', luck: '🍀' };
const CMD_STAT = { atk: 'atk', def: 'def', pv: 'pv', spd: 'vit', luck: 'chance' };
const LABEL_RARETE = { commun: 'Commun', normal: 'Normal', rare: 'Rare', legendaire: 'Légendaire' };
const LABEL_SLOT = { weapon: 'Arme', offhand: 'Main gauche', torso: 'Armure', strategeme: 'Stratagème' };
const CLE_CHOIX = { weapon: 'arme', offhand: 'offhand', torso: 'torso', strategeme: 'strat' };
const BASE_STAT_JS = { atk: 10, def: 10, pv: 100, spd: 10, luck: 0 };

let JOUEURS = {}, CATALOGUE = {}, listeJoueurs = [];
let pseudoActif = null, joueurActif = null;
let stacksOriginaux = null;   // stacks réellement investis (immuables, pour calculer "reste à placer")
let stacksChoisis = null;     // répartition en cours d'édition sur la page
let equipChoisi = { arme: null, offhand: null, torso: null, strat: null }; // numéros choisis
let statsInitiales = null;    // calculerStatsEffectives(stacksOriginaux, équipement de départ nivelé)
let resultatInitial = null;   // simulerBuild(stacksOriginaux, équipement de départ) — la vue "avant modification"

function echapper(t) {
    return String(t).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ===================== SÉLECTION DE PROFIL ===================== */
const champ = document.getElementById('chercheProfil');
const propos = document.getElementById('propositions');

function rendrePropositions() {
    const q = champ.value.trim().toLowerCase();
    let liste = listeJoueurs;
    if (q) liste = listeJoueurs.filter(p => p.nom.toLowerCase().includes(q) || p.cle.includes(q));
    liste = liste.slice(0, 8);
    if (!liste.length) { propos.innerHTML = '<div class="proposition"><span>Aucun personnage trouvé</span></div>'; propos.classList.add('ouvert'); return; }
    propos.innerHTML = liste.map(p => {
        const img = p.avatar ? `<img src="${echapper(p.avatar)}" alt="">` : `<div class="ini">${echapper(p.nom.charAt(0).toUpperCase())}</div>`;
        return `<div class="proposition" data-cle="${echapper(p.cle)}">${img}<span>${echapper(p.nom)}</span></div>`;
    }).join('');
    propos.classList.add('ouvert');
}
champ.addEventListener('focus', rendrePropositions);
champ.addEventListener('input', rendrePropositions);
propos.addEventListener('mousedown', e => {
    const o = e.target.closest('.proposition[data-cle]');
    if (o) { e.preventDefault(); choisirProfil(o.getAttribute('data-cle')); }
});
document.addEventListener('click', e => { if (!e.target.closest('.champ-profil')) propos.classList.remove('ouvert'); });

function choisirProfil(cle) {
    pseudoActif = cle;
    joueurActif = JOUEURS[cle];
    champ.value = joueurActif.nomAffichage || cle;
    propos.classList.remove('ouvert');
    const url = new URL(location.href); url.searchParams.set('user', cle); history.replaceState(null, '', url);

    const s = joueurActif.stats || {};
    stacksOriginaux = { atk: s.atkStacks||0, def: s.defStacks||0, pv: s.pvStacks||0, spd: s.spdStacks||0, luck: s.luckStacks||0 };
    stacksChoisis = { ...stacksOriginaux };

    // Reprend ce qui est RÉELLEMENT équipé (loadout), pas le premier objet venu du slot dans
    // l'inventaire.
    const lo = joueurActif.loadout || joueurActif.equipementPrefere || {};
    equipChoisi = {
        arme: lo.arme || null,
        offhand: lo.offhand || null,
        torso: lo.armure || null,
        strat: lo.strategeme || null,
    };

    // Vue "avant modification" — figée une fois pour toutes à l'arrivée sur le profil, sert de
    // référence à toutes les comparaisons (stats ET dégâts/survie/PowerLevel) pendant l'édition.
    const equipementInitialBrut = {
        arme: gearPourFormule(equipChoisi.arme), offhand: gearPourFormule(equipChoisi.offhand),
        torso: gearPourFormule(equipChoisi.torso), strat: gearPourFormule(equipChoisi.strat),
    };
    resultatInitial = simulerBuild(stacksOriginaux, equipementInitialBrut);
    statsInitiales = resultatInitial.stats;

    afficherPage();
}

function objetCatalogue(numero) { return CATALOGUE[String(numero)] || null; }

/* ===================== AFFICHAGE PRINCIPAL ===================== */
function afficherPage() {
    const totalOriginal = Object.values(stacksOriginaux).reduce((a,b) => a+b, 0);
    const avatar = joueurActif.avatar
        ? `<img class="profil-actif-avatar" src="${echapper(joueurActif.avatar)}" alt="">`
        : `<div class="profil-actif-avatar">${echapper((joueurActif.nomAffichage||pseudoActif).charAt(0).toUpperCase())}</div>`;

    document.getElementById('contenu').innerHTML = `
        <div class="profil-actif-carte">
            ${avatar}
            <div class="profil-actif-infos">
                <div class="profil-actif-titre">Build actuel</div>
                <div class="profil-actif-nom">${echapper(joueurActif.nomAffichage || pseudoActif)}</div>
            </div>
            <div class="profil-actif-stats">
                <div class="profil-actif-stat"><span>Points investis</span><b>${totalOriginal}</b></div>
            </div>
        </div>

        <section class="section">
            <div class="section-tete">
                <h2>Simuler un reset</h2>
                <p>Tu as actuellement <b style="color:var(--yellow)">${totalOriginal}</b> point(s) investi(s). Redistribue-les ci-dessous comme tu veux —
                   rien n'est appliqué pour de vrai tant que tu n'as pas collé la commande, tout en bas de page.</p>
            </div>
            <div class="total-dispo">
                <span>Points investis actuellement :</span><span class="chiffre">${totalOriginal}</span>
                <span class="reste" id="resteAPlacer"></span>
            </div>
            <div class="stats-grille" id="statsGrille"></div>
            <div class="legende-detail">
                <span><span class="pastille base"></span>Base du personnage</span>
                <span><span class="pastille investi"></span>Points investis</span>
                <span><span class="pastille objets"></span>Bonus d'objets équipés</span>
            </div>
            <button type="button" class="btn-reinit" id="btnReinit" style="display:none;">Revenir à ma répartition actuelle</button>
        </section>

        <section class="section">
            <div class="section-tete">
                <h2>Dégâts et survie</h2>
                <p>Calculés à partir de la répartition et de l'équipement choisis. Chaque valeur est comparée à ta vue
                   d'avant modification (ta répartition et ton équipement réels, tels que chargés au départ).</p>
            </div>
            <div class="resultats-grille" id="resultatsGrille"></div>
        </section>

        <section class="section">
            <div class="section-tete">
                <h2>Équipement</h2>
                <p>Clique sur un objet pour le sélectionner. Une arme à deux mains occupe aussi la main gauche —
                   la sélectionner vide automatiquement cet emplacement.</p>
            </div>
            <div id="equipGrille"></div>
        </section>

        <section class="section">
            <div class="section-tete">
                <h2>Commande</h2>
                <p>Nécessite un ticket de reset en votre possession.</p>
            </div>
            <div class="zone-commande" id="zoneCommandeReset"></div>
        </section>
    `;

    rendreStatsGrille();
    rendreEquipGrille();
    document.getElementById('btnReinit').addEventListener('click', () => { stacksChoisis = { ...stacksOriginaux }; rendreStatsGrille(); recalculer(); });
    recalculer();
}

/* ===================== DELTA "avant / après" ===================== */
function texteDelta(actuel, initial, decimales, suffixe) {
    const diff = actuel - initial;
    const seuil = Math.pow(10, -decimales) / 2;
    if (Math.abs(diff) < seuil) return `<span class="neutre">± 0${suffixe||''} vs avant</span>`;
    const classe = diff > 0 ? 'positif' : 'negatif';
    const signe = diff > 0 ? '+' : '';
    return `<span class="${classe}">${signe}${diff.toFixed(decimales)}${suffixe||''} vs avant</span>`;
}

/* ===================== STATS (répartition) ===================== */
function rendreStatsGrille() {
    const totalOriginal = Object.values(stacksOriginaux).reduce((a,b) => a+b, 0);
    const totalChoisi = Object.values(stacksChoisis).reduce((a,b) => a+b, 0);
    const reste = totalOriginal - totalChoisi;

    const resteEl = document.getElementById('resteAPlacer');
    resteEl.classList.toggle('negatif', reste < 0);
    resteEl.innerHTML = `Reste à placer : <b>${reste}</b>`;

    // Le bouton "revenir à ma répartition actuelle" ne sert que dans un seul cas : on a retiré des
    // points d'une stat et il en reste à replacer ailleurs — sinon (tout est déjà replacé, ou on
    // n'a encore rien touché) il n'apporte rien et resterait juste un bouton de plus à l'écran.
    const btnReinit = document.getElementById('btnReinit');
    if (btnReinit) btnReinit.style.display = reste > 0 ? '' : 'none';

    document.getElementById('statsGrille').innerHTML = Object.keys(LABEL_STAT).map(st => `
        <div class="stat-carte stat-${st}">
            <div class="stat-label"><span>${ICONE_STAT[st]}</span> ${LABEL_STAT[st]}</div>
            <div class="stat-ligne">
                <button type="button" data-stat="${st}" data-act="moins" ${stacksChoisis[st] <= 0 ? 'disabled' : ''}>&minus;</button>
                <input type="number" min="0" data-stat="${st}" value="${stacksChoisis[st]}">
                <button type="button" data-stat="${st}" data-act="plus" ${reste <= 0 ? 'disabled' : ''}>+</button>
            </div>
            <div id="detailStat_${st}"></div>
        </div>
    `).join('');

    document.getElementById('statsGrille').querySelectorAll('button[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
            const st = btn.getAttribute('data-stat');
            const delta = btn.getAttribute('data-act') === 'plus' ? 1 : -1;
            const totalActuel = Object.values(stacksChoisis).reduce((a,b)=>a+b,0);
            if (delta > 0 && totalActuel >= totalOriginal) return;
            stacksChoisis[st] = Math.max(0, stacksChoisis[st] + delta);
            rendreStatsGrille(); recalculer();
        });
    });
    document.getElementById('statsGrille').querySelectorAll('input[data-stat]').forEach(inp => {
        inp.addEventListener('change', () => {
            const st = inp.getAttribute('data-stat');
            let val = Math.max(0, parseInt(inp.value, 10) || 0);
            const autres = Object.keys(stacksChoisis).filter(k => k !== st).reduce((s,k) => s + stacksChoisis[k], 0);
            if (autres + val > totalOriginal) val = Math.max(0, totalOriginal - autres);
            stacksChoisis[st] = val;
            rendreStatsGrille(); recalculer();
        });
    });

    rendreCommandeFinale();
}

function rendreCommandeFinale() {
    const morceaux = Object.keys(stacksChoisis).filter(st => stacksChoisis[st] > 0).map(st => `${CMD_STAT[st]}${stacksChoisis[st]}`);
    const totalOriginal = Object.values(stacksOriginaux).reduce((a,b) => a+b, 0);
    const zone = document.getElementById('zoneCommandeReset');
    if (!zone) return;
    if (totalOriginal === 0) {
        zone.innerHTML = `<div class="avertissement">Tu n'as encore aucun point investi — rien à réinitialiser pour l'instant.</div>`;
        return;
    }
    const commande = '!reset ' + morceaux.join(' ');
    zone.innerHTML = `
        <div class="consigne">À coller dans le chat Twitch — vide ta répartition actuelle et la remplace par celle-ci en une seule commande.</div>
        <div class="zone-commande-ligne">
            <code id="cmdComplete">${echapper(commande)}</code>
            <button type="button" onclick="copier('cmdComplete', this)">Copier</button>
        </div>
    `;
}

/* ===================== SÉLECTEUR D'ÉQUIPEMENT (cartes façon shop.html) ===================== */
const LABEL_STAT_COURT = { Lifesteal: 'Vol de vie', PoisonDegats: 'Poison', ShieldMontant: 'Bouclier', SoinDirect: 'Soin',
    DegatsDirects: 'Impact', SaignementDegats: 'Saignement', BrulureDegats: 'Brûlure' };
const CLASSE_STAT = { atk: 'l-atk', def: 'l-def', pv: 'l-pv', spd: 'l-spd', luck: 'l-luck', esquive: 'l-esquive' };
const LABEL_STAT_CARTE = { atk: 'ATK', def: 'DEF', pv: 'PV', spd: 'VIT', esquive: 'Esq.', luck: 'LUCK' };

function rendreEquipGrille() {
    const inv = (joueurActif.inventaire || []).map(l => ({ ...l, info: objetCatalogue(l.numero) })).filter(l => l.info);
    const armeActuelle = objetCatalogue(equipChoisi.arme);
    const armeEstDeuxMains = armeActuelle && armeActuelle.hand === 'two_handed';

    const blocs = [];

    // --- Armes : séparées Une main / Deux mains ---
    const armes = inv.filter(l => l.info.slot === 'weapon');
    const armes1M = armes.filter(l => l.info.hand !== 'two_handed');
    const armes2M = armes.filter(l => l.info.hand === 'two_handed');
    blocs.push(`
        <div class="equip-bloc">
            <div class="equip-bloc-titre">${LABEL_SLOT.weapon}</div>
            <div class="equip-sous-bloc-titre">Une main</div>
            <div class="grille-cards">${armes1M.map(l => rendreCartePick(l, 'arme')).join('')}</div>
            <div class="equip-sous-bloc-titre">Deux mains</div>
            <div class="grille-cards">${armes2M.map(l => rendreCartePick(l, 'arme')).join('')}</div>
        </div>`);

    // --- Main gauche : verrouillée si une arme à deux mains est équipée ---
    const offhands = inv.filter(l => l.info.slot === 'offhand');
    const carteAucunOffhand = `
        <div class="card aucun ${!equipChoisi.offhand ? 'choisi' : ''}" data-slot="offhand" data-numero="">
            <div class="card-image"><div class="emoji">🚫</div></div>
            <div class="card-nom">Aucun</div>
        </div>`;
    blocs.push(`
        <div class="equip-bloc">
            <div class="equip-bloc-titre">${LABEL_SLOT.offhand}</div>
            ${armeEstDeuxMains ? `<div class="card-note" style="margin-bottom:8px;">🔒 Occupée par ton arme à deux mains — repasse sur une arme à une main pour équiper une main gauche.</div>` : ''}
            <div class="grille-cards">${carteAucunOffhand}${offhands.map(l => rendreCartePick(l, 'offhand', armeEstDeuxMains)).join('')}</div>
        </div>`);

    // --- Armure et Stratagème : classiques ---
    [['torso','torso'], ['strategeme','strat']].forEach(([slotKey, choixKey]) => {
        const options = inv.filter(l => l.info.slot === slotKey);
        const carteAucun = `
            <div class="card aucun ${!equipChoisi[choixKey] ? 'choisi' : ''}" data-slot="${choixKey}" data-numero="">
                <div class="card-image"><div class="emoji">🚫</div></div>
                <div class="card-nom">Aucun</div>
            </div>`;
        blocs.push(`
            <div class="equip-bloc">
                <div class="equip-bloc-titre">${LABEL_SLOT[slotKey]}</div>
                <div class="grille-cards">${carteAucun}${options.map(l => rendreCartePick(l, choixKey)).join('')}</div>
            </div>`);
    });

    document.getElementById('equipGrille').innerHTML = blocs.join('');

    document.getElementById('equipGrille').querySelectorAll('.card:not(.desactive)').forEach(carte => {
        carte.addEventListener('click', () => {
            const choixKey = carte.getAttribute('data-slot');
            const numero = carte.getAttribute('data-numero') || null;
            equipChoisi[choixKey] = numero;

            // Une arme à deux mains occupe la main gauche : la sélectionner vide cet emplacement.
            if (choixKey === 'arme') {
                const infoArme = objetCatalogue(numero);
                if (infoArme && infoArme.hand === 'two_handed') equipChoisi.offhand = null;
            }
            rendreEquipGrille();
            recalculer();
        });
    });
}

// Construit une carte façon shop.html (rareté en haut à gauche, niveau/×N en haut à droite, image,
// nom, sous-titre) + un bloc ajouté avec les stats DÉJÀ NIVELÉES et leur code couleur, pour que la
// carte affiche exactement ce qui entre dans le calcul de dégâts/PowerLevel.
function rendreCartePick(ligneInv, choixKey, desactivee) {
    const info = ligneInv.info;
    const niveau = ligneInv.niveau || 0;
    const nivele = appliquerAmelioration(info, niveau);
    const estChoisi = String(equipChoisi[choixKey]) === String(ligneInv.numero);
    const img = info.image
        ? `<img src="${echapper(info.image)}" alt="">`
        : `<div class="emoji">${echapper(info.icone || '❔')}</div>`;

    const lignesStat = [];
    if (nivele.stat) lignesStat.push(ligneStatCarte(nivele.stat, nivele.bonus));
    if (nivele.stat2) lignesStat.push(ligneStatCarte(nivele.stat2, nivele.bonus2));
    if (nivele.stat3) lignesStat.push(ligneStatCarte(nivele.stat3, nivele.bonus3));
    if (info.slot === 'weapon' && info.scaling1Stat) {
        lignesStat.push(`<span class="l-degats">Dégâts <b>${Math.round(nivele.baseDegatsMin)}–${Math.round(nivele.baseDegatsMax)}</b></span>`);
    }
    if (info.statPrincipale) {
        const champ = { Lifesteal:'lifesteal', PoisonDegats:'poisonDegats', ShieldMontant:'shieldMontant', SoinDirect:'soinDirect',
            DegatsDirects:'degatsDirects', SaignementDegats:'saignementDegats', BrulureDegats:'brulureDegats' }[info.statPrincipale];
        if (champ && nivele[champ]) lignesStat.push(`<span class="l-passif">${LABEL_STAT_COURT[info.statPrincipale] || info.statPrincipale} <b style="color:var(--paper)">${Math.round(nivele[champ]*10)/10}</b></span>`);
    }

    return `
        <div class="card ${estChoisi ? 'choisi' : ''} ${desactivee ? 'desactive' : ''}" data-slot="${choixKey}" data-numero="${ligneInv.numero}"
             style="--accent: var(--${info.rarete || 'commun'})">
            <div class="card-puce-rarete a-gauche">${LABEL_RARETE[info.rarete] || info.rarete}</div>
            <div class="card-niveau">×${niveau + 1}</div>
            <div class="card-image">${img}</div>
            <div class="card-nom">${echapper(info.nom)}</div>
            ${info.slot === 'weapon' ? `<div class="card-sous">${info.hand === 'two_handed' ? 'Deux mains' : 'Une main'}</div>` : ''}
            <div class="card-stats">${lignesStat.join('<br>')}</div>
        </div>`;
}
function ligneStatCarte(stat, valeur) {
    const label = LABEL_STAT_CARTE[stat] || stat;
    const classe = CLASSE_STAT[stat] || '';
    const signe = valeur >= 0 ? '+' : '';
    return `<span class="${classe}">${label} <b>${signe}${Math.round(valeur*10)/10}</b></span>`;
}

// Construit l'objet "gear" BRUT attendu par simulerBuild (catalogue_stats.json + niveau réellement
// possédé) — le nivelage (AppliquerAmelioration) est fait à l'intérieur de simulerBuild.
function gearPourFormule(numero) {
    if (!numero) return null;
    const info = objetCatalogue(numero);
    if (!info) return null;
    const ligneInv = (joueurActif.inventaire || []).find(l => String(l.numero) === String(numero));
    return { ...info, niveau: ligneInv ? (ligneInv.niveau || 0) : 0 };
}

/* ===================== RECALCUL ===================== */
function recalculer() {
    const equipementBrut = {
        arme: gearPourFormule(equipChoisi.arme),
        offhand: gearPourFormule(equipChoisi.offhand),
        torso: gearPourFormule(equipChoisi.torso),
        strat: gearPourFormule(equipChoisi.strat),
    };
    const r = simulerBuild(stacksChoisis, equipementBrut);
    afficherDetailStats(r.stats);

    document.getElementById('resultatsGrille').innerHTML = `
        <div class="resultat-carte">
            <div class="valeur">${r.dpaInflige.toFixed(1)}</div>
            <div class="label">Dégâts / attaque</div>
            <div class="resultat-delta">${texteDelta(r.dpaInflige, resultatInitial.dpaInflige, 1)}</div>
        </div>
        <div class="resultat-carte">
            <div class="valeur">${r.survieTours.toFixed(1)}</div>
            <div class="label">Tours de survie</div>
            <div class="resultat-delta">${texteDelta(r.survieTours, resultatInitial.survieTours, 1)}</div>
        </div>
        <div class="resultat-carte secondaire">
            <div class="valeur">${Math.round(r.totalDmg)}</div>
            <div class="label">Dégâts sur tout le combat</div>
            <div class="resultat-delta">${texteDelta(Math.round(r.totalDmg), Math.round(resultatInitial.totalDmg), 0)}</div>
        </div>
        <div class="resultat-carte secondaire">
            <div class="valeur">${r.powerLevel.toFixed(0)}</div>
            <div class="label">PowerLevel simulé</div>
            <div class="resultat-delta">${texteDelta(Math.round(r.powerLevel), Math.round(resultatInitial.powerLevel), 0)}</div>
        </div>
    `;
}

// Alimente le détail sous chaque stat-carte : valeur totale (avec sa décomposition base/points
// investis/objets, code couleur stats.html) + un delta vs la vue d'avant modification.
function afficherDetailStats(statsActuelles) {
    const zero = { atk: 0, def: 0, pv: 0, spd: 0, luck: 0 };
    const vide = { arme: null, offhand: null, torso: null, strat: null };
    const base = calculerStatsEffectives(zero, vide);
    const avecStacksSeuls = calculerStatsEffectives(stacksChoisis, vide);

    const rendre = (st, baseline, stack, gear, total, initial, formatteur) => {
        const el = document.getElementById('detailStat_' + st);
        if (!el) return;
        el.innerHTML = `
            <div class="stat-valeur">${formatteur(total)}</div>
            <div class="stat-detail"><span class="base">${formatteur(baseline)}</span><span class="signe">+</span><span class="investi">${formatteur(stack)}</span><span class="signe">+</span><span class="objets">${formatteur(gear)}</span></div>
            <div class="stat-delta">${texteDelta(total, initial, 1)}</div>
        `;
    };
    const f1 = v => (Math.round(v*10)/10).toString();

    rendre('atk', base.atk, avecStacksSeuls.atk - base.atk, statsActuelles.atk - avecStacksSeuls.atk, statsActuelles.atk, statsInitiales.atk, f1);
    rendre('def', base.def, avecStacksSeuls.def - base.def, statsActuelles.def - avecStacksSeuls.def, statsActuelles.def, statsInitiales.def, f1);
    rendre('pv',  base.pv,  avecStacksSeuls.pv  - base.pv,  statsActuelles.pv  - avecStacksSeuls.pv,  statsActuelles.pv,  statsInitiales.pv,  f1);
    rendre('spd', base.spd, avecStacksSeuls.spd - base.spd, statsActuelles.spd - avecStacksSeuls.spd, statsActuelles.spd, statsInitiales.spd, f1);

    // Luck : pas de champ "s.luck" direct — décomposition faite sur luckLineaire (voir
    // formule-combat.js), comparée au luckLineaire de la vue d'avant modification.
    const luckStack = stacksChoisis.luck;
    const luckGear = Math.max(0, statsActuelles.luckLineaire - luckStack);
    rendre('luck', 0, luckStack, luckGear, statsActuelles.luckLineaire, statsInitiales.luckLineaire, f1);
}

function copier(idCode, bouton) {
    const texte = document.getElementById(idCode).textContent;
    const fini = () => { const avant = bouton.textContent; bouton.textContent = 'Copié !'; setTimeout(() => bouton.textContent = avant, 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(texte).then(fini, fini);
    else {
        const z = document.createElement('textarea'); z.value = texte; document.body.appendChild(z); z.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(z); fini();
    }
}

/* ===================== CHARGEMENT ===================== */
Promise.all([
    fetch('players.json?v=' + Date.now()).then(r => r.json()),
    fetch('catalogue_stats.json?v=' + Date.now()).then(r => r.json()),
]).then(([players, catalogue]) => {
    JOUEURS = players; CATALOGUE = catalogue;
    listeJoueurs = Object.keys(JOUEURS).map(cle => ({ cle, nom: JOUEURS[cle].nomAffichage || cle, avatar: JOUEURS[cle].avatar || '' }));

    const demande = new URLSearchParams(location.search).get('user');
    if (demande && JOUEURS[demande]) choisirProfil(demande);
}).catch(() => {
    document.getElementById('contenu').innerHTML = '<div class="message">Les données n\'ont pas pu être chargées. Réessaie dans un instant.</div>';
});
</script>
