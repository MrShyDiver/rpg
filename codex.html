<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historique des Duels - L'Arène</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* === THEME HEXTECH / E-SPORT === */
:root {
    --bg-main: #010a13; 
    --bg-panel: #091428;
    --bg-hover: #1e283d;
    --hex-gold: #c8aa6e;
    --hex-gold-glow: rgba(200, 170, 110, 0.4);
    --text-main: #a09b8c;
    --text-light: #f0e6d2;
    --win-color: #0ac8b9; 
    --loss-color: #e84057; 
    --border-color: #1e2328;
    
    /* Couleurs de rareté des items */
    --rarity-commun: #8c92a0;
    --rarity-normal: #1eff00; 
    --rarity-rare: #0070dd;   
    --rarity-epic: #a335ee;   

    --font-head: 'Oswald', sans-serif;
    --font-body: 'Barlow', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body { 
    background-color: var(--bg-main); 
    background-image: radial-gradient(circle at top center, #0d1e3a 0%, var(--bg-main) 70%);
    color: var(--text-main); 
    font-family: var(--font-body); 
    min-height: 100vh; 
    padding: 40px 20px; 
}

.page { max-width: 950px; margin: 0 auto; }

/* --- EN-TÊTE --- */
.entete { text-align: center; margin-bottom: 30px; }
.entete h1 { 
    font-family: var(--font-head); font-size: 42px; 
    color: var(--hex-gold); text-transform: uppercase; letter-spacing: 3px;
    text-shadow: 0 0 15px var(--hex-gold-glow);
}
.entete p { font-size: 16px; margin-top: 10px; color: var(--text-light); opacity: 0.8; }

/* --- RECHERCHE --- */
.barre-recherche { display: flex; justify-content: center; margin-bottom: 30px; }
.barre-recherche input {
    width: 100%; max-width: 600px;
    background: rgba(9, 20, 40, 0.8); border: 1px solid var(--hex-gold); 
    border-radius: 4px; padding: 14px 20px; color: var(--text-light); 
    font-family: var(--font-body); font-size: 16px;
    box-shadow: 0 0 15px var(--hex-gold-glow) inset; transition: all 0.3s ease;
}
.barre-recherche input:focus { outline: none; box-shadow: 0 0 25px var(--hex-gold-glow) inset, 0 0 15px var(--hex-gold-glow); }

/* --- LISTE DES MATCHS --- */
.liste-duels { display: flex; flex-direction: column; gap: 12px; }
.carte-duel { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; position: relative;}
.carte-duel:hover { border-color: #323c50; }

.carte-duel.victoire-attaquant .match-indicator { background: var(--win-color); box-shadow: 0 0 10px var(--win-color); }
.carte-duel.victoire-defenseur .match-indicator { background: var(--loss-color); box-shadow: 0 0 10px var(--loss-color); }
.carte-duel.egalite .match-indicator { background: var(--text-main); }

/* --- ENCART NON DÉPLOYÉ (RÉSUMÉ) --- */
.ligne-resume { 
    display: flex; align-items: center; padding: 25px 15px 15px 15px; 
    cursor: pointer; position: relative; 
    background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, transparent 100%); 
}
.ligne-resume:hover { background: var(--bg-hover); }

.match-indicator { width: 6px; height: 100%; position: absolute; left: 0; top: 0; }
.match-time { 
    position: absolute; top: 8px; left: 15px; 
    font-size: 11px; color: var(--text-main); opacity: 0.8; letter-spacing: 0.5px;
}

.match-players { width: 100%; display: flex; align-items: center; justify-content: center; }
.player { flex: 1; display: flex; align-items: center; gap: 15px; min-width: 0; }
.player.left { justify-content: flex-end; }
.player.right { justify-content: flex-start; }

.player-avatar {
    width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border-color);
    background: #000; object-fit: cover; box-shadow: 0 0 8px rgba(0,0,0,0.5); flex-shrink: 0;
}
.player-name { 
    font-size: 18px; font-weight: 600; color: var(--text-light); 
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player.left .player-name { text-align: right; }
.player.right .player-name { text-align: left; }

.match-center { width: 80px; text-align: center; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;}
.result-text { font-family: var(--font-head); font-size: 20px; font-weight: 700; color: var(--text-light); line-height: 1;}
.rounds-badge { background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-top: 4px; border: 1px solid #1e283d;}

.match-action { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); color: var(--hex-gold); transition: transform 0.3s; }
.carte-duel.ouvert .match-action { transform: translateY(-50%) rotate(180deg); }

/* --- MENU DÉROULÉ (DÉTAILS & BUILDS FACE À FACE) --- */
.detail-duel { display: none; padding: 25px 15px; background: #050b14; border-top: 1px solid var(--border-color); }
.carte-duel.ouvert .detail-duel { display: block; animation: slideDown 0.3s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

/* Layout Arène (Joueur | VS | Joueur) */
.arena-layout { display: flex; align-items: flex-start; justify-content: center; margin-bottom: 30px; gap: 10px;}
.arena-player { flex: 1; display: flex; flex-direction: column; align-items: center; width: 45%; }
.arena-vs { 
    display: flex; flex-direction: column; justify-content: flex-start; align-items: center; 
    width: 50px; flex-shrink: 0; padding-top: 25px;
    font-family: var(--font-head); font-size: 32px; font-style: italic; color: var(--hex-gold); text-shadow: 0 0 15px var(--hex-gold-glow);
}

.arena-avatar { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--border-color); object-fit: cover; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
.arena-player.winner .arena-avatar { border-color: var(--hex-gold); box-shadow: 0 0 20px var(--hex-gold-glow); }
.arena-name { font-family: var(--font-head); font-size: 20px; color: var(--text-light); margin: 12px 0; letter-spacing: 1px; text-align: center; word-break: break-word;}

/* Grille d'items sous le joueur (2x2) */
.arena-items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; justify-items: center; }

.big-item {
    width: 56px; height: 56px; background: #000; border: 2px solid var(--border-color);
    border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s; cursor: help;
}
.big-item:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.big-item img { width: 85%; height: 85%; object-fit: contain; }
.item-badge {
    position: absolute; bottom: -6px; right: -6px; background: var(--bg-panel); color: var(--text-light);
    border: 1px solid var(--text-main); border-radius: 50%; width: 20px; height: 20px;
    font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold;
}

.big-item.rarity-commun { border-color: var(--rarity-commun); }
.big-item.rarity-normal { border-color: var(--rarity-normal); box-shadow: 0 0 8px rgba(30, 255, 0, 0.2) inset;}
.big-item.rarity-rare { border-color: var(--rarity-rare); box-shadow: 0 0 8px rgba(0, 112, 221, 0.2) inset;}
.big-item.rarity-epic { border-color: var(--rarity-epic); box-shadow: 0 0 8px rgba(163, 53, 238, 0.2) inset;}

/* Statistiques */
.comp-table { width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed #2c3545; padding-top: 20px;}
.comp-row { display: flex; align-items: center; background: rgba(255,255,255,0.02); border-radius: 4px; padding: 10px 15px; }
.comp-label { flex: 1; text-align: center; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-main); }
.comp-val { width: 70px; font-size: 18px; font-weight: 700; color: var(--text-light); }
.comp-val.left { text-align: right; }
.comp-val.right { text-align: left; }
.comp-val.win { color: var(--hex-gold); text-shadow: 0 0 8px var(--hex-gold-glow); font-size: 19px;}
.comp-val.lose { color: #5c5b57; }

/* Boutons */
.bouton-replay, .bouton-plus {
    background: transparent; border: 2px solid var(--hex-gold); color: var(--hex-gold);
    font-family: var(--font-head); font-size: 16px; text-transform: uppercase; letter-spacing: 2px;
    padding: 12px 25px; cursor: pointer; border-radius: 4px; transition: all 0.2s; display: block; text-align: center;
}
.bouton-replay { margin: 30px auto 0; width: 100%; max-width: 300px; }
.bouton-plus { margin: 30px auto 0; width: 100%; max-width: 300px; }
.bouton-replay:hover, .bouton-plus:hover { background: var(--hex-gold); color: var(--bg-main); box-shadow: 0 0 20px var(--hex-gold-glow); }

/* --- MODALE REPLAY --- */
.modale-overlay { display: none; position: fixed; inset: 0; background: rgba(1, 10, 19, 0.95); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modale-overlay.ouverte { display: flex; }
.modale-contenu { position: relative; width: 100%; max-width: 960px; border: 2px solid var(--hex-gold); border-radius: 4px; box-shadow: 0 0 40px var(--hex-gold-glow); }
.modale-fermer { position: absolute; top: -45px; right: 0; background: none; border: none; color: var(--hex-gold); font-size: 32px; cursor: pointer; transition: transform 0.2s; }
.iframe-replay { width: 100%; height: min(75vh, 720px); border: none; background: #000; display: block; }

/* --- RESPONSIVE MOBILE EXTRÊME --- */
@media (max-width: 640px) {
    body { padding: 20px 10px; }
    
    /* Encart Résumé */
    .ligne-resume { padding: 30px 10px 15px 10px; }
    .match-time { top: 6px; left: 10px; font-size: 10px; }
    .player { flex-direction: column !important; gap: 6px; }
    .player.left { align-items: center; } /* Évite le texte justifié à droite si empilé */
    .player.right { align-items: center; }
    /* On force l'image au-dessus du texte pour les deux côtés */
    .player .player-name { order: 1; text-align: center !important; font-size: 14px; white-space: normal; line-height: 1.2;}
    .player-avatar { width: 42px; height: 42px; order: 0; }
    
    .match-center { width: 60px; }
    .result-text { font-size: 16px; }
    .rounds-badge { font-size: 10px; }
    .match-action { display: none; } /* On cache la flèche pour gagner de l'espace, la carte reste cliquable */

    /* Détails Dépliés */
    .arena-avatar { width: 60px; height: 60px; }
    .arena-name { font-size: 16px; margin: 8px 0; }
    .arena-vs { font-size: 24px; width: 30px; padding-top: 15px;}
    .big-item { width: 44px; height: 44px; }
    .arena-items { gap: 6px; }
    
    .comp-row { padding: 8px 10px; }
    .comp-val { font-size: 15px; width: 45px; }
    .comp-val.win { font-size: 16px; }
    .comp-label { font-size: 11px; line-height: 1.2;}
}
</style>
</head>
<body>

<div class="page">
    <div class="entete">
        <h1>Archives de L'Arène</h1>
        <p>Revivez l'historique détaillé des combats et analysez les équipements.</p>
    </div>

    <div class="barre-recherche">
        <input type="text" id="rechercheJoueur" placeholder="Rechercher le pseudo d'un combattant...">
    </div>

    <div id="listeDuels" class="liste-duels"></div>
    <button id="boutonPlus" class="bouton-plus" style="display:none;">Charger plus de combats</button>
</div>

<div id="modaleReplay" class="modale-overlay">
    <div class="modale-contenu">
        <button id="fermerModaleReplay" class="modale-fermer" aria-label="Fermer">✕</button>
        <iframe id="iframeReplay" class="iframe-replay" src="" title="Replay du duel"></iframe>
    </div>
</div>

<script>
    const PAGE_TAILLE = 15;
    let indexComplet = [];
    let indexFiltre = [];
    let nbAffiches = 0;
    
    const detailsCache = {};
    let tousLesJoueurs = {};
    let catalogueItems = {};

    const defaultAvatar = "https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-70x70.png";

    // Initialisation
    async function initialiser() {
        try {
            const [resCat, resPlayers, resIndex] = await Promise.all([
                fetch('catalogue_stats.json?v=' + Date.now()).catch(() => null),
                fetch('players.json?v=' + Date.now()).catch(() => null),
                fetch('duels_index.json?v=' + Date.now()).catch(() => null)
            ]);

            if (resCat && resCat.ok) catalogueItems = await resCat.json();
            if (resPlayers && resPlayers.ok) tousLesJoueurs = await resPlayers.json();
            
            if (resIndex && resIndex.ok) {
                const data = await resIndex.json();
                indexComplet = data.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
                appliquerRecherche();
            } else {
                throw new Error("Index manquant");
            }
        } catch(e) {
            console.error(e);
            document.getElementById('listeDuels').innerHTML = '<div style="text-align:center; padding: 30px; color: var(--loss-color);">Erreur de connexion aux archives de l\'Arène.</div>';
        }
    }

    // Récupération Avatar
    function obtenirAvatar(pseudo) {
        if (!pseudo) return defaultAvatar;
        const lowerPseudo = pseudo.toLowerCase();
        const cleJ = Object.keys(tousLesJoueurs).find(k => k.toLowerCase() === lowerPseudo);
        
        if (cleJ && tousLesJoueurs[cleJ].avatar && tousLesJoueurs[cleJ].avatar.trim() !== "") {
            return tousLesJoueurs[cleJ].avatar;
        }
        return `https://decapi.me/twitch/avatar/${encodeURIComponent(lowerPseudo)}`;
    }

    function formatDate(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' - ' + 
               d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    function classeCarte(entree) {
        if (entree.egalite) return 'egalite';
        return (entree.vainqueur || '').toLowerCase() === (entree.attaquant || '').toLowerCase() ? 'victoire-attaquant' : 'victoire-defenseur';
    }

    // Ligne Résumée
    function rendreResume(entree) {
        let resultText = "VS";
        if (entree.egalite) resultText = "ÉGALITÉ";
        else if ((entree.vainqueur || '').toLowerCase() === (entree.attaquant || '').toLowerCase()) resultText = "VICTOIRE";
        else resultText = "DÉFAITE"; 

        return `
            <div class="ligne-resume">
                <div class="match-indicator"></div>
                <div class="match-time">${formatDate(entree.date)}</div>
                
                <div class="match-players">
                    <div class="player left">
                        <span class="player-name">${entree.attaquant}</span>
                        <img src="${obtenirAvatar(entree.attaquant)}" class="player-avatar" alt="${entree.attaquant}" onerror="this.src='${defaultAvatar}';">
                    </div>
                    
                    <div class="match-center">
                        <div class="result-text">${resultText}</div>
                        <div class="rounds-badge">${entree.rounds} Rounds</div>
                    </div>
                    
                    <div class="player right">
                        <img src="${obtenirAvatar(entree.defenseur)}" class="player-avatar" alt="${entree.defenseur}" onerror="this.src='${defaultAvatar}';">
                        <span class="player-name">${entree.defenseur}</span>
                    </div>
                </div>

                <div class="match-action">▼</div>
            </div>
            <div class="detail-duel"><div style="text-align:center; padding: 20px; color: var(--text-main);">Analyse tactique en cours...</div></div>
        `;
    }

    function rendreStatFaceAFace(label, valA, valB) {
        let classeA = "comp-val left";
        let classeB = "comp-val right";

        if (typeof valA === 'number' && typeof valB === 'number') {
            if (valA > valB) { classeA += " win"; classeB += " lose"; }
            else if (valB > valA) { classeB += " win"; classeA += " lose"; }
        }

        return `
            <div class="comp-row">
                <div class="${classeA}">${valA}</div>
                <div class="comp-label">${label}</div>
                <div class="${classeB}">${valB}</div>
            </div>
        `;
    }

    function rendreBigItem(itemData) {
        if (!itemData || !itemData.nom) return `<div class="big-item rarity-commun" title="Vide"></div>`;
        let catItem = Object.values(catalogueItems).find(c => c.nom.toLowerCase() === itemData.nom.toLowerCase());
        
        let imageSrc = catItem && catItem.image ? catItem.image : ''; 
        let rarete = catItem && catItem.rarete ? catItem.rarete.toLowerCase() : 'commun';
        let fullTitle = `${itemData.nom} ${catItem && catItem.rarete ? '('+catItem.rarete+')' : ''}`;

        return `
            <div class="big-item rarity-${rarete}" title="${fullTitle}">
                ${imageSrc ? `<img src="${imageSrc}" alt="${itemData.nom}" onerror="this.style.display='none'">` : `<span style="font-size:10px;text-align:center;">${itemData.nom.substring(0,4)}</span>`}
                ${itemData.niveau > 0 ? `<div class="item-badge">+${itemData.niveau}</div>` : ''}
            </div>
        `;
    }

    // Intérieur carte (Arena face-à-face)
    function rendreDetail(entree, detail) {
        const buildA = detail.build_attaquant || {};
        const buildB = detail.build_defenseur || {};
        const estVictoireA = (entree.vainqueur || '').toLowerCase() === (entree.attaquant || '').toLowerCase();
        const estVictoireB = (entree.vainqueur || '').toLowerCase() === (entree.defenseur || '').toLowerCase();

        return `
            <!-- FACE A FACE BUILDS -->
            <div class="arena-layout">
                <div class="arena-player ${estVictoireA ? 'winner' : ''}">
                    <img src="${obtenirAvatar(entree.attaquant)}" class="arena-avatar" onerror="this.src='${defaultAvatar}';">
                    <h3 class="arena-name">${entree.attaquant}</h3>
                    <div class="arena-items">
                        ${rendreBigItem(buildA.arme)}
                        ${rendreBigItem(buildA.offhand)}
                        ${rendreBigItem(buildA.torso)}
                        ${rendreBigItem(buildA.strategeme)}
                    </div>
                </div>
                
                <div class="arena-vs">VS</div>

                <div class="arena-player ${estVictoireB ? 'winner' : ''}">
                    <img src="${obtenirAvatar(entree.defenseur)}" class="arena-avatar" onerror="this.src='${defaultAvatar}';">
                    <h3 class="arena-name">${entree.defenseur}</h3>
                    <div class="arena-items">
                        ${rendreBigItem(buildB.arme)}
                        ${rendreBigItem(buildB.offhand)}
                        ${rendreBigItem(buildB.torso)}
                        ${rendreBigItem(buildB.strategeme)}
                    </div>
                </div>
            </div>

            <!-- STATS -->
            <div class="comp-table">
                ${rendreStatFaceAFace("Power Level", Math.round(detail.power_attaquant || entree.power_attaquant || 0), Math.round(detail.power_defenseur || entree.power_defenseur || 0))}
                ${rendreStatFaceAFace("Dégâts Infligés", detail.degats_infliges_attaquant || 0, detail.degats_infliges_defenseur || 0)}
                ${rendreStatFaceAFace("Plus gros coup", detail.plus_gros_coup_attaquant || 0, detail.plus_gros_coup_defenseur || 0)}
            </div>
            
            <button class="bouton-replay" data-id="${entree.id}">Visionner le Replay</button>
        `;
    }

    // Mécanique de dépliage
    function basculerDuel(carte, entree) {
        const dejaOuvert = carte.classList.contains('ouvert');
        if (dejaOuvert) { carte.classList.remove('ouvert'); return; }
        
        carte.classList.add('ouvert');
        const zoneDetail = carte.querySelector('.detail-duel');
        
        if (detailsCache[entree.id]) {
            zoneDetail.innerHTML = rendreDetail(entree, detailsCache[entree.id]);
            return;
        }
        
        fetch(`duels/${encodeURIComponent(entree.id)}.json?v=${Date.now()}`)
            .then(r => r.json())
            .then(detail => {
                detailsCache[entree.id] = detail;
                zoneDetail.innerHTML = rendreDetail(entree, detail);
            })
            .catch(() => {
                zoneDetail.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--loss-color);">Rapport de combat introuvable ou corrompu.</div>';
            });
    }

    // Affichage
    function afficherLot() {
        const zone = document.getElementById('listeDuels');
        const lot = indexFiltre.slice(nbAffiches, nbAffiches + PAGE_TAILLE);
        
        lot.forEach(entree => {
            const carte = document.createElement('div');
            carte.className = `carte-duel ${classeCarte(entree)}`;
            carte.innerHTML = rendreResume(entree);
            carte.querySelector('.ligne-resume').addEventListener('click', () => basculerDuel(carte, entree));
            zone.appendChild(carte);
        });
        
        nbAffiches += lot.length;
        document.getElementById('boutonPlus').style.display = nbAffiches < indexFiltre.length ? 'block' : 'none';
    }

    function appliquerRecherche() {
        const terme = document.getElementById('rechercheJoueur').value.trim().toLowerCase();
        indexFiltre = terme
            ? indexComplet.filter(e => (e.attaquant || '').toLowerCase().includes(terme) || (e.defenseur || '').toLowerCase().includes(terme))
            : indexComplet;
        nbAffiches = 0;
        document.getElementById('listeDuels').innerHTML = '';
        
        if (indexFiltre.length === 0) {
            document.getElementById('listeDuels').innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-main);">Aucun affrontement trouvé dans les archives.</div>';
            document.getElementById('boutonPlus').style.display = 'none';
            return;
        }
        afficherLot();
    }

    // Modale Replay
    const modaleReplay = document.getElementById('modaleReplay');
    const iframeReplay = document.getElementById('iframeReplay');
    function ouvrirReplay(id) {
        iframeReplay.src = `duel_overlay.html?replay=${encodeURIComponent(id)}`;
        modaleReplay.classList.add('ouverte');
    }
    function fermerReplay() {
        modaleReplay.classList.remove('ouverte');
        iframeReplay.src = '';
    }
    document.getElementById('fermerModaleReplay').addEventListener('click', fermerReplay);
    modaleReplay.addEventListener('click', (e) => { if (e.target === modaleReplay) fermerReplay(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermerReplay(); });
    document.getElementById('listeDuels').addEventListener('click', (e) => {
        const bouton = e.target.closest('.bouton-replay');
        if (bouton) { e.stopPropagation(); ouvrirReplay(bouton.dataset.id); }
    });

    document.getElementById('rechercheJoueur').addEventListener('input', appliquerRecherche);
    document.getElementById('boutonPlus').addEventListener('click', afficherLot);
    
    initialiser();

</script>
</body>
</html>
