<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Général Foudroyé — Classement</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0; --line: #2c2c2e;
    --or: #e5cc80; --argent: #c7cdd6; --bronze: #cd8b5c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 28px 18px 60px; }
h1, h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
.page { max-width: 1100px; margin: 0 auto; }

.entete { padding-bottom: 18px; border-bottom: 3px solid var(--yellow); margin-bottom: 22px; }
.entete h1 { font-size: 26px; font-weight: 700; }
.entete h1 span { color: var(--yellow); }
.entete p { color: var(--paper-dim); font-size: 13.5px; margin-top: 4px; }

/* ============ RECHERCHE D'UNE PERSONNE ============ */
.barre-recherche-personne { margin-bottom: 18px; }
.barre-recherche-personne input {
    width: 100%; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 14px; color: var(--paper); font-size: 14px; font-family: 'Barlow', sans-serif;
}
.barre-recherche-personne input::placeholder { color: var(--paper-dim); }
.barre-recherche-personne input:focus { outline: none; border-color: var(--yellow); }

/* ============ ANCRES ============ */
.ancres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
.ancre {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; color: var(--paper-dim);
    background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; text-decoration: none; transition: all 0.15s ease;
}
.ancre:hover { color: var(--yellow); border-color: var(--yellow); }

/* ============ GRILLE DE CLASSEMENTS ============ */
.grille-classements { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.classement-carte { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; scroll-margin-top: 16px; }
.classement-titre { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.classement-soustitre { font-size: 12px; color: var(--paper-dim); margin-bottom: 14px; }

.ligne-classement {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05); border-radius: 5px;
}
.ligne-classement:last-child { border-bottom: none; }
.ligne-classement.ligne-surlignee { background: rgba(242,194,48,0.12); outline: 1px solid var(--yellow); }
.rang {
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; width: 26px; text-align: center;
    color: var(--paper-dim); flex-shrink: 0;
}
.rang.or { color: var(--or); font-size: 17px; }
.rang.argent { color: var(--argent); font-size: 16px; }
.rang.bronze { color: var(--bronze); font-size: 15px; }
.pseudo-classement { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.valeur-classement { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--yellow); white-space: nowrap; flex-shrink: 0; }
.separateur-recherche { text-align: center; color: var(--paper-dim); font-size: 12px; padding: 2px 0; letter-spacing: 3px; }

.vide-classement { color: var(--paper-dim); font-style: italic; font-size: 13px; padding: 10px 0; }

@media (max-width: 640px) {
    body { padding: 20px 12px 50px; }
    .entete h1 { font-size: 20px; }
    .grille-classements { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">
    <div class="entete">
        <h1>LE GÉNÉRAL FOUDROYÉ — <span>CLASSEMENT</span></h1>
        <p>Le top 10 de chaque statistique du combat contre le boss — mis à jour toutes les 15 secondes.</p>
    </div>

    <div class="barre-recherche-personne">
        <input type="text" id="champRecherchePersonne" placeholder="Rechercher un pseudo — le fait apparaître dans chaque classement même hors du top 10...">
    </div>

    <div class="ancres" id="ancres"></div>
    <div id="vues"></div>
</div>

<script>
// ==========================================================
// CONTRAT DE DONNEES ATTENDU -- publié par claude/boss-recompenses-finales.cs (déclenchement
// manuel, une fois le boss vaincu) :
//
// boss_classements.json :
// { "efficacite": [{"pseudo":"...","valeur":12.4}, ...], "attaques": [...], "rounds": [...], "degats": [...],
//   "ratioDegatsHp": [...], "degatsSubis": [...], "soins": [...], "meilleurCritique": [...] }
//
// Pas de partie "boss_status.json" pour l'instant (retirée à la demande -- "pour l'instant pas de
// partie haute, juste les classements, on décorera la page plus tard") : ce fichier n'a jamais été
// publié par aucun script, le message d'erreur qu'affichait l'ancienne version de cette page
// ("boss_status.json introuvable") était donc normal, pas un bug -- rien ne l'a jamais généré.
// ==========================================================
const CHEMIN_CLASSEMENTS = 'boss_classements.json';

const CLASSEMENTS_DEF = [
    { cle: 'efficacite',      titre: 'Efficacité',            sous: 'Dégâts totaux ÷ PowerLevel — Top 3 : +5 / +3 / +1 lootbox légendaire', decimales: 2 },
    { cle: 'attaques',        titre: "Nombre d'attaques",     sous: 'Total de coups portés au boss — Top 3 : +5 / +3 / +1 lootbox légendaire', decimales: 0 },
    { cle: 'rounds',          titre: 'Rounds effectués',      sous: 'Total de rounds joués — Top 3 : +5 / +3 / +1 lootbox légendaire', decimales: 0 },
    { cle: 'degats',          titre: 'Dégâts totaux',         sous: 'Cumul de tous les combats — Top 3 : +5 / +3 / +1 lootbox légendaire', decimales: 0 },
    { cle: 'ratioDegatsHp',   titre: 'Ratio Dégâts/HP',       sous: 'Meilleur ratio dégâts infligés / PV de la phase, en un seul combat', decimales: 2 },
    { cle: 'degatsSubis',     titre: 'Dégâts subis',          sous: 'Total encaissé depuis le boss', decimales: 0 },
    { cle: 'soins',           titre: 'Soins prodigués',       sous: "Cumul des soins actifs déclenchés", decimales: 0 },
    { cle: 'meilleurCritique', titre: 'Meilleur Critique',    sous: 'Le plus gros coup critique porté au boss', decimales: 0 },
];

function formatNombre(n, decimales) {
    return Number(n).toLocaleString('fr-FR', { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
}

async function chargerJson(chemin) {
    try {
        const res = await fetch(chemin + '?t=' + Date.now());
        return res.ok ? await res.json() : null;
    } catch (e) { return null; }
}

let classementsData = {};
let personneRecherchee = '';

function classeRang(rang) {
    if (rang === 1) return 'or';
    if (rang === 2) return 'argent';
    if (rang === 3) return 'bronze';
    return '';
}

function construireLigne(rang, pseudo, valeurFormatee, surligne) {
    return `
        <div class="ligne-classement${surligne ? ' ligne-surlignee' : ''}">
            <div class="rang ${classeRang(rang)}">${rang}</div>
            <div class="pseudo-classement">${pseudo}</div>
            <div class="valeur-classement">${valeurFormatee}</div>
        </div>
    `;
}

function construireCarteClassement(def) {
    const lignes = (classementsData[def.cle] || []).slice().sort((a, b) => b.valeur - a.valeur);
    const top10 = lignes.slice(0, 10);

    let lignesHtml = top10.length > 0
        ? top10.map((l, i) => construireLigne(i + 1, l.pseudo, formatNombre(l.valeur, def.decimales), l.pseudo.toLowerCase() === personneRecherchee)).join('')
        : '<div class="vide-classement">Pas encore assez de données pour ce classement.</div>';

    // Recherche active ET la personne existe dans CE classement, mais hors du top 10 déjà affiché :
    // on calcule son vrai rang et on l'ajoute à la suite, séparé visuellement -- même logique que
    // ranking.html, pour "la trouver plus rapidement" même quand elle n'est pas dans le haut.
    if (personneRecherchee) {
        const indexComplet = lignes.findIndex(l => l.pseudo.toLowerCase() === personneRecherchee);
        if (indexComplet >= 10) {
            const l = lignes[indexComplet];
            lignesHtml += `<div class="separateur-recherche">···</div>` + construireLigne(indexComplet + 1, l.pseudo, formatNombre(l.valeur, def.decimales), true);
        }
    }

    return `
        <div class="classement-carte" id="classement-${def.cle}">
            <div class="classement-titre">${def.titre}</div>
            <div class="classement-soustitre">${def.sous}</div>
            ${lignesHtml}
        </div>
    `;
}

function construirePage() {
    document.getElementById('ancres').innerHTML = CLASSEMENTS_DEF.map(d => `<a class="ancre" href="#classement-${d.cle}">${d.titre}</a>`).join('');
    document.getElementById('vues').innerHTML = `<div class="grille-classements">${CLASSEMENTS_DEF.map(construireCarteClassement).join('')}</div>`;
}

document.getElementById('champRecherchePersonne').addEventListener('input', (e) => {
    personneRecherchee = e.target.value.trim().toLowerCase();
    construirePage();
});

async function init() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('joueur')) {
        document.getElementById('champRecherchePersonne').value = params.get('joueur');
        personneRecherchee = params.get('joueur').trim().toLowerCase();
    }

    classementsData = (await chargerJson(CHEMIN_CLASSEMENTS)) || {};
    construirePage();

    // Actualisation régulière -- classement vivant tant que le boss n'a pas été vaincu.
    setInterval(async () => {
        classementsData = (await chargerJson(CHEMIN_CLASSEMENTS)) || {};
        construirePage();
    }, 15000);
}

init();
</script>
<script src="nav.js" defer></script>
</body>
</html>
