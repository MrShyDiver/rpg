<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historique des Duels - Arène</title>
<link href="https://fonts.googleapis.com/css2?family=Beaufort+for+LOL:wght@400;700&family=Spiegel:wght@400;600&family=Oswald:wght@500;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 
  Palette inspirée de l'univers "Hextech" (League of Legends)
*/
:root {
    --bg-main: #010a13; /* Bleu très sombre */
    --bg-panel: #091428;
    --bg-hover: #1e283d;
    --hextech-gold: #c8aa6e;
    --hextech-gold-hover: #f0e6d2;
    --text-main: #a09b8c;
    --text-light: #f0e6d2;
    --win-color: #0ac8b9; /* Cyan */
    --loss-color: #e84057; /* Rouge */
    --draw-color: #8c92a0; /* Gris */
    --border-color: #1e2328;
    --font-heading: 'Oswald', sans-serif;
    --font-body: 'Barlow', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body { 
    background-color: var(--bg-main); 
    background-image: radial-gradient(circle at top, #0d1e3a 0%, var(--bg-main) 60%);
    color: var(--text-main); 
    font-family: var(--font-body); 
    min-height: 100vh; 
    padding: 40px 20px; 
}

.page { max-width: 900px; margin: 0 auto; }

/* --- EN-TÊTE --- */
.entete { 
    text-align: center;
    padding-bottom: 30px; 
    margin-bottom: 30px; 
}
.entete h1 { 
    font-family: var(--font-heading); 
    font-size: 36px; 
    color: var(--hextech-gold);
    text-transform: uppercase; 
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(200, 170, 110, 0.3);
}
.entete p { 
    font-size: 15px; 
    margin-top: 8px; 
}

/* --- RECHERCHE --- */
.barre-recherche { 
    display: flex; 
    justify-content: center;
    margin-bottom: 30px; 
}
.barre-recherche input {
    width: 100%;
    max-width: 500px;
    background: rgba(9, 20, 40, 0.8); 
    border: 1px solid var(--hextech-gold); 
    border-radius: 4px;
    padding: 12px 20px; 
    color: var(--text-light); 
    font-family: var(--font-body); 
    font-size: 16px;
    box-shadow: 0 0 15px rgba(200, 170, 110, 0.1) inset;
    transition: all 0.3s ease;
}
.barre-recherche input:focus { 
    outline: none; 
    box-shadow: 0 0 20px rgba(200, 170, 110, 0.4) inset, 0 0 10px rgba(200, 170, 110, 0.2); 
}
.barre-recherche input::placeholder { color: #5c5b57; }

/* --- LISTE DES DUELS --- */
.liste-duels { display: flex; flex-direction: column; gap: 10px; }

.carte-duel { 
    background: var(--bg-panel); 
    border: 1px solid var(--border-color); 
    border-radius: 4px; 
    overflow: hidden; 
    transition: transform 0.2s;
}
.carte-duel:hover { border-color: #323c50; }

/* Couleurs selon le résultat */
.carte-duel.victoire-attaquant .match-indicator { background: var(--win-color); box-shadow: 0 0 10px var(--win-color); }
.carte-duel.victoire-attaquant .result-text { color: var(--win-color); }

.carte-duel.victoire-defenseur .match-indicator { background: var(--loss-color); box-shadow: 0 0 10px var(--loss-color); }
.carte-duel.victoire-defenseur .result-text { color: var(--loss-color); }

.carte-duel.egalite .match-indicator { background: var(--draw-color); }
.carte-duel.egalite .result-text { color: var(--draw-color); }

/* --- RESUME DU MATCH (Ligne principale) --- */
.ligne-resume {
    display: flex; 
    align-items: center; 
    padding: 10px; 
    cursor: pointer;
    position: relative;
    background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, transparent 100%);
}
.ligne-resume:hover { background: var(--bg-hover); }

.match-indicator {
    width: 6px;
    height: 100%;
    position: absolute;
    left: 0;
    top: 0;
}

.match-time { 
    width: 80px; 
    padding-left: 15px;
    font-size: 12px; 
    color: var(--text-main);
    text-align: left;
}

.match-players {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
}

.player {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 150px;
}
.player.reverse { flex-direction: row-reverse; text-align: right; }

.player-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--border-color);
    background: #000;
}
.player-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-light);
}

.match-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100px;
}
.result-text {
    font-family: var(--font-heading);
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.match-type {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-main);
    margin-top: 4px;
}

.match-action {
    width: 50px;
    text-align: right;
    padding-right: 15px;
}
.chevron {
    display: inline-block;
    transition: transform 0.3s;
    color: var(--hextech-gold);
}
.carte-duel.ouvert .chevron { transform: rotate(180deg); }

/* --- DETAILS DU MATCH (Déplié) --- */
.detail-duel { 
    display: none; 
    padding: 20px; 
    background: #050b14;
    border-top: 1px solid var(--border-color);
}
.carte-duel.ouvert .detail-duel { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

/* Grille de stats façon tableau des scores */
.scoreboard {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 20px;
}
.team-stats {
    flex: 1;
    background: rgba(9, 20, 40, 0.5);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 15px;
}
.team-title {
    font-family: var(--font-heading);
    color: var(--hextech-gold);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px;
    margin-bottom: 12px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
}
.stat-label { color: var(--text-main); }
.stat-value { color: var(--text-light); font-weight: 600; }

/* Builds (Items) */
.build-container {
    display: flex;
    gap: 8px;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px dashed var(--border-color);
}
.item-slot {
    width: 40px;
    height: 40px;
    background: #111;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--text-main);
    text-align: center;
    position: relative;
}
.item-slot.has-item { border-color: var(--hextech-gold); background: #1a1a1a; }
.item-level {
    position: absolute;
    bottom: -6px;
    right: -6px;
    background: var(--bg-main);
    color: var(--hextech-gold);
    border: 1px solid var(--hextech-gold);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* Boutons */
.bouton-replay, .bouton-plus {
    background: transparent;
    border: 2px solid var(--hextech-gold);
    color: var(--hextech-gold);
    font-family: var(--font-heading);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    display: block;
    text-align: center;
}
.bouton-replay { margin: 20px auto 0; width: 250px; }
.bouton-plus { margin: 30px auto 0; width: 100%; max-width: 300px; }

.bouton-replay:hover, .bouton-plus:hover {
    background: var(--hextech-gold);
    color: var(--bg-main);
    box-shadow: 0 0 15px rgba(200, 170, 110, 0.4);
}

/* --- MODALE REPLAY --- */
.modale-overlay {
    display: none; position: fixed; inset: 0; background: rgba(1, 10, 19, 0.9); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(5px);
}
.modale-overlay.ouverte { display: flex; }
.modale-contenu { position: relative; width: 100%; max-width: 960px; border: 2px solid var(--hextech-gold); border-radius: 4px; box-shadow: 0 0 30px rgba(200, 170, 110, 0.2); }
.modale-fermer {
    position: absolute; top: -40px; right: 0; background: none; border: none; color: var(--hextech-gold);
    font-size: 28px; cursor: pointer; transition: transform 0.2s;
}
.modale-fermer:hover { transform: scale(1.1); color: var(--hextech-gold-hover); }
.iframe-replay { width: 100%; height: min(75vh, 720px); border: none; background: #000; display: block; }

/* Responsive */
@media (max-width: 768px) {
    .match-players { gap: 10px; }
    .player-name { display: none; } /* On cache les noms sur mobile pour laisser les avatars */
    .player { width: auto; }
    .scoreboard { flex-direction: column; }
    .match-time { width: 60px; font-size: 11px; padding-left: 10px; }
}
</style>
</head>
<body>

<div class="page">
    <div class="entete">
        <h1>Historique de l'Arène</h1>
        <p>Revivez les affrontements en pixel art du stream.</p>
    </div>

    <div class="barre-recherche">
        <input type="text" id="rechercheJoueur" placeholder="Rechercher un champion...">
    </div>

    <div id="listeDuels" class="liste-duels"></div>
    <button id="boutonPlus" class="bouton-plus" style="display:none;">Charger plus de matchs</button>
</div>

<div id="modaleReplay" class="modale-overlay">
    <div class="modale-contenu">
        <button id="fermerModaleReplay" class="modale-fermer" aria-label="Fermer">✕</button>
        <iframe id="iframeReplay" class="iframe-replay" src="" title="Replay du duel"></iframe>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const idCible = params.get('id');
    const joueurInitial = params.get('joueur') || '';

    const PAGE_TAILLE = 20;
    let indexComplet = [];
    let indexFiltre = [];
    let nbAffiches = 0;
    const detailsCache = {};

    function formatDate(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + '<br>' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    const LABELS_TRANCHE = { au_dessus: 'Outsider', dans_tranche: 'Équilibré', en_dessous: 'Favori' };

    // Générateur d'avatar pixel art via DiceBear
    function getAvatar(name) {
        return `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(name)}`;
    }

    function classeCarte(entree) {
        if (entree.egalite) return 'egalite';
        return (entree.vainqueur || '').toLowerCase() === (entree.attaquant || '').toLowerCase() ? 'victoire-attaquant' : 'victoire-defenseur';
    }

    function rendreResume(entree) {
        let resultText = "VS";
        if (entree.egalite) resultText = "ÉGALITÉ";
        else if ((entree.vainqueur || '').toLowerCase() === (entree.attaquant || '').toLowerCase()) resultText = "VICTOIRE";
        else resultText = "DÉFAITE"; // Du point de vue de l'attaquant

        return `
            <div class="ligne-resume">
                <div class="match-indicator"></div>
                
                <div class="match-time">${formatDate(entree.date)}</div>
                
                <div class="match-players">
                    <div class="player">
                        <img src="${getAvatar(entree.attaquant)}" class="player-avatar" alt="${entree.attaquant}">
                        <span class="player-name">${entree.attaquant}</span>
                    </div>
                    
                    <div class="match-center">
                        <span class="result-text">${resultText}</span>
                        <span class="match-type">${LABELS_TRANCHE[entree.tranche] || 'Classé'}</span>
                    </div>
                    
                    <div class="player reverse">
                        <img src="${getAvatar(entree.defenseur)}" class="player-avatar" alt="${entree.defenseur}">
                        <span class="player-name">${entree.defenseur}</span>
                    </div>
                </div>

                <div class="match-action">
                    <span class="chevron">▼</span>
                </div>
            </div>
            <div class="detail-duel"><div style="text-align:center; padding: 20px; color: var(--text-main);">Analyse des données en cours...</div></div>
        `;
    }

    function rendreSlotItem(item) {
        if (!item || !item.nom) return `<div class="item-slot" title="Emplacement vide"></div>`;
        return `
            <div class="item-slot has-item" title="${item.nom}">
                ${item.nom.substring(0, 3).toUpperCase()}
                ${item.niveau > 0 ? `<div class="item-level">+${item.niveau}</div>` : ''}
            </div>
        `;
    }

    function rendreDetail(entree, detail) {
        const buildA = detail.build_attaquant || {};
        const buildB = detail.build_defenseur || {};

        return `
            <div class="scoreboard">
                <!-- Stats Attaquant -->
                <div class="team-stats">
                    <div class="team-title">${entree.attaquant}</div>
                    <div class="stat-row"><span class="stat-label">PowerLevel</span><span class="stat-value">${Math.round(detail.power_attaquant || 0)}</span></div>
                    <div class="stat-row"><span class="stat-label">Dégâts infligés</span><span class="stat-value">${detail.degats_infliges_attaquant || 0}</span></div>
                    <div class="stat-row"><span class="stat-label">Coup Critique Max</span><span class="stat-value" style="color: var(--loss-color);">${detail.plus_gros_coup_attaquant || 0}</span></div>
                    
                    <div class="build-container">
                        ${rendreSlotItem(buildA.arme)}
                        ${rendreSlotItem(buildA.offhand)}
                        ${rendreSlotItem(buildA.torso)}
                        ${rendreSlotItem(buildA.strategeme)}
                    </div>
                </div>

                <!-- Stats Défenseur -->
                <div class="team-stats">
                    <div class="team-title">${entree.defenseur}</div>
                    <div class="stat-row"><span class="stat-label">PowerLevel</span><span class="stat-value">${Math.round(detail.power_defenseur || 0)}</span></div>
                    <div class="stat-row"><span class="stat-label">Dégâts infligés</span><span class="stat-value">${detail.degats_infliges_defenseur || 0}</span></div>
                    <div class="stat-row"><span class="stat-label">Coup Critique Max</span><span class="stat-value" style="color: var(--loss-color);">${detail.plus_gros_coup_defenseur || 0}</span></div>
                    
                    <div class="build-container">
                        ${rendreSlotItem(buildB.arme)}
                        ${rendreSlotItem(buildB.offhand)}
                        ${rendreSlotItem(buildB.torso)}
                        ${rendreSlotItem(buildB.strategeme)}
                    </div>
                </div>
            </div>
            
            <div style="text-align: center; color: var(--text-main); font-size: 12px; margin-bottom: 10px;">
                Durée du combat : ${entree.rounds || '—'} Rounds
            </div>
            
            <button class="bouton-replay" data-id="${entree.id}">Lancer le Replay</button>
        `;
    }

    // Gestion de la modale
    const modaleReplay = document.getElementById('modaleReplay');
    const iframeReplay = document.getElementById('iframeReplay');
    
    function ouvrirReplay(id) {
        iframeReplay.src = `duel_overlay.html?replay=${encodeURIComponent(id)}`;
        modaleReplay.classList.add('ouverte');
    }
    
    function fermerReplay() {
        modaleReplay.classList.remove('ouverte');
        iframeReplay.src = '';
    }
    
    document.getElementById('fermerModaleReplay').addEventListener('click', fermerReplay);
    modaleReplay.addEventListener('click', (e) => { if (e.target === modaleReplay) fermerReplay(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermerReplay(); });
    
    document.getElementById('listeDuels').addEventListener('click', (e) => {
        const bouton = e.target.closest('.bouton-replay');
        if (bouton) { e.stopPropagation(); ouvrirReplay(bouton.dataset.id); }
    });

    // Accordéon
    function basculerDuel(carte, entree) {
        const dejaOuvert = carte.classList.contains('ouvert');
        if (dejaOuvert) { carte.classList.remove('ouvert'); return; }
        
        carte.classList.add('ouvert');
        const zoneDetail = carte.querySelector('.detail-duel');
        
        if (detailsCache[entree.id]) {
            zoneDetail.innerHTML = rendreDetail(entree, detailsCache[entree.id]);
            return;
        }
        
        fetch(`duels/${encodeURIComponent(entree.id)}.json?v=${Date.now()}`)
            .then(r => r.json())
            .then(detail => {
                detailsCache[entree.id] = detail;
                zoneDetail.innerHTML = rendreDetail(entree, detail);
            })
            .catch(() => {
                zoneDetail.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--loss-color);">Rapport de combat corrompu.</div>';
            });
    }

    // Pagination & Affichage
    function afficherLot() {
        const zone = document.getElementById('listeDuels');
        const lot = indexFiltre.slice(nbAffiches, nbAffiches + PAGE_TAILLE);
        
        lot.forEach(entree => {
            const carte = document.createElement('div');
            carte.className = `carte-duel ${classeCarte(entree)}`;
            carte.innerHTML = rendreResume(entree);
            carte.querySelector('.ligne-resume').addEventListener('click', () => basculerDuel(carte, entree));
            zone.appendChild(carte);
            if (idCible && entree.id === idCible) basculerDuel(carte, entree);
        });
        
        nbAffiches += lot.length;
        document.getElementById('boutonPlus').style.display = nbAffiches < indexFiltre.length ? 'block' : 'none';
    }

    function appliquerRecherche() {
        const terme = document.getElementById('rechercheJoueur').value.trim().toLowerCase();
        indexFiltre = terme
            ? indexComplet.filter(e => (e.attaquant || '').toLowerCase().includes(terme) || (e.defenseur || '').toLowerCase().includes(terme))
            : indexComplet;
        nbAffiches = 0;
        document.getElementById('listeDuels').innerHTML = '';
        
        if (indexFiltre.length === 0) {
            document.getElementById('listeDuels').innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-main);">Aucun affrontement trouvé dans les archives.</div>';
            document.getElementById('boutonPlus').style.display = 'none';
            return;
        }
        afficherLot();
    }

    // Init
    document.getElementById('rechercheJoueur').value = joueurInitial;
    document.getElementById('rechercheJoueur').addEventListener('input', appliquerRecherche);
    document.getElementById('boutonPlus').addEventListener('click', afficherLot);

    fetch('duels_index.json?v=' + Date.now())
        .then(r => r.json())
        .then(index => {
            indexComplet = index.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
            appliquerRecherche();
        })
        .catch(() => {
            document.getElementById('listeDuels').innerHTML = '<div style="text-align:center; padding: 30px; color: var(--loss-color);">Erreur de connexion aux archives de l\'Arène.</div>';
        });
</script>
</body>
</html>
