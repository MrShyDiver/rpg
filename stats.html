<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes statistiques</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0;
    --commun: #8d8d8d; --normal: #5ddd7a; --rare: #4a9fd8; --legendaire: #f2c230; --line: #2c2c2e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 40px 20px; }
h1, h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
.page { max-width: 980px; margin: 0 auto; }

.entete { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 3px solid var(--yellow); margin-bottom: 26px; }
.entete img.avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--yellow); flex-shrink: 0; }
.entete-texte h1 { font-size: 26px; font-weight: 700; }
.entete-texte h1 span { color: var(--yellow); }
.entete-texte p { color: var(--paper-dim); font-size: 13.5px; margin-top: 4px; }

.titre-section {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--paper-dim); margin: 24px 0 10px;
}
.titre-section:first-of-type { margin-top: 0; }
.titre-section-petit { margin-top: 16px; font-size: 11px; }

.emplacements { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 10px; }
.emplacement { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; text-align: center; position: relative; }
.emplacement-niveau {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    font-size: 11px; font-weight: 900; color: var(--yellow);
    border: 1.5px solid var(--yellow); border-radius: 4px; padding: 1px 5px;
    background: rgba(242,194,48,0.12);
}
.emplacement .label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px; color: var(--paper-dim); text-transform: uppercase; margin-bottom: 8px; }
.emplacement .icone { font-size: 28px; margin-bottom: 6px; }
.icone-img { width: 44px; height: 44px; object-fit: contain; }
.emplacement .nom { font-size: 12.5px; font-weight: 600; }
.emplacement.vide .nom { color: var(--paper-dim); font-style: italic; }

.stats-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 6px; }
.stat-carte {
    background: var(--bg-panel); border: 1px solid var(--line); border-left: 3px solid var(--yellow);
    border-radius: 6px; padding: 10px 12px;
}
.stat-valeur { font-size: 22px; font-weight: 800; color: var(--paper); line-height: 1.2; margin-top: 4px; }
.stat-valeur-texte { font-size: 15px; font-weight: 700; color: var(--paper); line-height: 1.3; margin-top: 4px; }
.stat-sous { font-size: 12px; font-weight: 500; color: var(--paper-dim); }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--paper-dim); }
.stat-victoire { border-left-color: #5ddd7a; }
.stat-defaite { border-left-color: #ff6b6b; }
.stat-type-bully { border-left-color: #ff6b6b; }
.stat-type-fairplay { border-left-color: #3b82f6; }
.stat-type-valeureux { border-left-color: #5ddd7a; }
.stat-type-neutre { border-left-color: #555; }
.stat-type-bully .stat-valeur-texte { color: #ff6b6b; }
.stat-type-fairplay .stat-valeur-texte { color: #3b82f6; }
.stat-type-valeureux .stat-valeur-texte { color: #5ddd7a; }
/* Couleurs propres à chaque stat de personnage */
.stat-atk { border-left-color: #ff5e3a; }
.stat-atk .stat-valeur { color: #ff5e3a; }
.stat-pv { border-left-color: #ca2972; }
.stat-pv .stat-valeur { color: #ca2972; }
.stat-def { border-left-color: #3b82f6; }
.stat-def .stat-valeur { color: #3b82f6; }
.stat-luck { border-left-color: #00ffaa; }
.stat-luck .stat-valeur { color: #00ffaa; }
.stat-spd { border-left-color: #FFCC00; }
.stat-spd .stat-valeur { color: #FFCC00; }
.stat-protection { border-left-color: #f2c230; }
.info-bulle { position: relative; display: inline-block; margin-left: 4px; }
.info-icone {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--paper-dim);
    color: var(--paper-dim); font-size: 11px; font-style: italic; font-weight: 700;
    cursor: help; vertical-align: middle;
}
.info-texte {
    display: none; position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    background: #1a1a1c; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    font-size: 12px; font-weight: 500; color: var(--paper); line-height: 1.4;
    width: 190px; max-width: 70vw; text-align: left; z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    text-transform: none; letter-spacing: normal;
}
.info-texte.visible { display: block; }

.vide-message { color: var(--paper-dim); font-style: italic; padding: 20px 0; }

@media (max-width: 640px) {
    body { padding: 20px 12px; }
    .entete img.avatar { width: 44px; height: 44px; }
    .entete-texte p { font-size: 12px; }
    .emplacements { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .emplacement { padding: 10px; }
    .stats-grille { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="page">
    <div class="entete">
        <img class="avatar" id="avatarViewer" src="" alt="" style="display:none;">
        <div class="entete-texte">
            <h1 id="titreInventaire">STATISTIQUES</h1>
            <p>PowerLevel, stats de combat et objets préférés — pour l'inventaire complet, utilise <span style="color:var(--yellow)">!inventaire</span>. Mis à jour toutes les 5-10 minutes.</p>
        </div>
    </div>
    <div id="zoneStatistiques"></div>
    <div class="titre-section">Loadout actuel</div>
    <div id="emplacements" class="emplacements"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const pseudo = params.get('user');
    const LABELS_SLOT = { arme: "Arme", offhand: "Off-hand", armure: "Armure", strategeme: "Stratagème" };

    const iconeOuImage = (ref, classeImg) => ref.image
        ? `<img src="${ref.image}" alt="" class="${classeImg}">`
        : `<span class="${classeImg}-emoji">${ref.icone}</span>`;

    // Dégradé de couleur par percentile — convention Warcraft Logs / Wowhead, reconnue et très
    // lisible d'un coup d'œil : gris (bas du classement) -> vert -> bleu -> violet -> orange ->
    // rose (top 1%) -> or (1er).
    function couleurPercentile(percentile) {
        if (percentile >= 100) return '#e5cc80'; // Or — 1er
        if (percentile >= 99) return '#e268a8';  // Rose — top 1%
        if (percentile >= 95) return '#ff8000';  // Orange — top 5%
        if (percentile >= 75) return '#a335ee';  // Violet — top 25%
        if (percentile >= 50) return '#0070ff';  // Bleu — top 50%
        if (percentile >= 25) return '#1eff00';  // Vert — top 75%
        return '#9d9d9d';                        // Gris — le reste
    }

    // rang=1 (le meilleur) -> percentile 100 ; rang=total (le dernier) -> percentile 0.
    function percentileDepuisRang(rang, total) {
        if (total <= 1) return 100;
        return ((total - rang) / (total - 1)) * 100;
    }

    function typeCombattant(auDessus, dansTranche, enDessous) {
        const total = auDessus + dansTranche + enDessous;
        if (total < 3) return { texte: 'Pas assez de duels', classe: 'neutre' };
        if (enDessous > dansTranche && enDessous > auDessus) return { texte: 'Bully', classe: 'bully' };
        if (auDessus > dansTranche && auDessus > enDessous) return { texte: 'Valeureux', classe: 'valeureux' };
        return { texte: 'Fairplay', classe: 'fairplay' };
    }

    function nomObjetPrefere(numero) {
        if (!numero) return '—';
        const s = STATS[numero];
        return s ? s.nom : '—';
    }

    function afficherStatistiques(joueur) {
        const sp = joueur.stats, cl = joueur.classement, co = joueur.combat, cat = co.categories;
        const totalDuels = co.victoires + co.defaites + co.egalites;
        const pct = (v) => totalDuels > 0 ? ((v / totalDuels) * 100).toFixed(1) : '0.0';
        const type = typeCombattant(co.attaquesAuDessus, co.attaquesDansTranche, co.attaquesEnDessous);
        const ratioDegats = co.degatsSubis > 0 ? (co.degatsInfliges / co.degatsSubis).toFixed(2) : co.degatsInfliges > 0 ? '∞' : '0.00';
        const couleurPower = couleurPercentile(percentileDepuisRang(cl.rangPower, cl.totalPower));
        const couleurPoints = couleurPercentile(percentileDepuisRang(cl.rangPoints, cl.totalPoints));
        const pvAffiche = Math.round(sp.pvBase / 10);

        document.getElementById('zoneStatistiques').innerHTML = `
            <div class="titre-section">Statistiques</div>
            <div class="stats-grille">
                <div class="stat-carte" style="border-left-color:${couleurPower}"><div class="stat-label">PowerLevel</div><div class="stat-valeur" style="color:${couleurPower}">${Math.round(sp.powerLevel)} <span class="stat-sous">(#${cl.rangPower}/${cl.totalPower})</span></div></div>
                <div class="stat-carte stat-atk"><div class="stat-label">ATK</div><div class="stat-valeur">${Math.round(sp.atk)}</div></div>
                <div class="stat-carte stat-pv"><div class="stat-label">PV</div><div class="stat-valeur">${pvAffiche} <span class="stat-sous">(${Math.round(sp.pvPool)} PDV)</span></div></div>
                <div class="stat-carte stat-def"><div class="stat-label">DEF</div><div class="stat-valeur">${Math.round(sp.def)} <span class="stat-sous">(${sp.mitigation}% mitig.)</span></div></div>
                <div class="stat-carte stat-protection"><div class="stat-label">Protections actives</div><div class="stat-valeur">${co.protectionsActives} <span class="info-bulle" tabindex="0"><span class="info-icone">i</span><span class="info-texte">Réduit les dégâts de 20% pour un combat et consomme une protection</span></span></div></div>
                <div class="stat-carte stat-luck"><div class="stat-label">LUCK</div><div class="stat-valeur">${Math.round(sp.luck) + 10} <span class="stat-sous">(${sp.crit}% crit)</span></div></div>
                <div class="stat-carte stat-spd"><div class="stat-label">Speed</div><div class="stat-valeur">${Math.round(sp.spd)}</div></div>
            </div>
            <div class="titre-section titre-section-petit">Classement</div>
            <div class="stats-grille">
                <div class="stat-carte" style="border-left-color:${couleurPower}"><div class="stat-label">Rang PowerLevel</div><div class="stat-valeur" style="color:${couleurPower}">#${cl.rangPower} <span class="stat-sous">/ ${cl.totalPower}</span></div></div>
                <div class="stat-carte" style="border-left-color:${couleurPoints}"><div class="stat-label">Points de duel</div><div class="stat-valeur" style="color:${couleurPoints}">${cl.points}</div></div>
                <div class="stat-carte" style="border-left-color:${couleurPoints}"><div class="stat-label">Rang points</div><div class="stat-valeur" style="color:${couleurPoints}">#${cl.rangPoints} <span class="stat-sous">/ ${cl.totalPoints}</span></div></div>
            </div>
            <div class="titre-section titre-section-petit">Historique de combat</div>
            <div class="stats-grille">
                <div class="stat-carte stat-victoire"><div class="stat-label">Victoires</div><div class="stat-valeur">${co.victoires} <span class="stat-sous">(${pct(co.victoires)}%)</span></div></div>
                <div class="stat-carte stat-defaite"><div class="stat-label">Défaites</div><div class="stat-valeur">${co.defaites} <span class="stat-sous">(${pct(co.defaites)}%)</span></div></div>
                <div class="stat-carte"><div class="stat-label">Égalités</div><div class="stat-valeur">${co.egalites} <span class="stat-sous">(${pct(co.egalites)}%)</span></div></div>
                <div class="stat-carte"><div class="stat-label">Dégâts infligés</div><div class="stat-valeur">${co.degatsInfliges}</div></div>
                <div class="stat-carte"><div class="stat-label">Dégâts subis</div><div class="stat-valeur">${co.degatsSubis}</div></div>
                <div class="stat-carte"><div class="stat-label">Ratio dégâts</div><div class="stat-valeur">${ratioDegats}</div></div>
                <div class="stat-carte"><div class="stat-label">Plus gros coup</div><div class="stat-valeur">${co.plusGrosCoup}</div></div>
                <div class="stat-carte"><div class="stat-label">Série actuelle</div><div class="stat-valeur">${co.serieActuelle}</div></div>
                <div class="stat-carte"><div class="stat-label">Record personnel</div><div class="stat-valeur">${co.serieRecord}</div></div>
                <div class="stat-carte stat-texte stat-type-${type.classe}"><div class="stat-label">Type de combattant</div><div class="stat-valeur-texte">${type.texte} <span class="info-bulle" tabindex="0"><span class="info-icone">i</span><span class="info-texte">Calculé sur tes duels CIBLÉS uniquement (hors Auto Battle) : Bully si tu attaques surtout plus faible que toi, Valeureux si tu vises surtout plus fort, Fairplay sinon.</span></span></div></div>
            </div>
            <div class="titre-section titre-section-petit">Détail des victoires, défenses et égalités</div>
            <div class="stats-grille">
                <div class="stat-carte stat-victoire"><div class="stat-label">Victoire valeureuse</div><div class="stat-valeur">${cat.victoireValeureuse}</div></div>
                <div class="stat-carte stat-victoire"><div class="stat-label">Victoire équitable</div><div class="stat-valeur">${cat.victoireEquitable}</div></div>
                <div class="stat-carte stat-victoire"><div class="stat-label">Victoire déshonorable</div><div class="stat-valeur">${cat.victoireDeshonorable}</div></div>
                <div class="stat-carte stat-defaite"><div class="stat-label">Défense exceptionnelle</div><div class="stat-valeur">${cat.defenseExceptionnelle}</div></div>
                <div class="stat-carte stat-defaite"><div class="stat-label">Défense équitable</div><div class="stat-valeur">${cat.defenseEquitable}</div></div>
                <div class="stat-carte stat-defaite"><div class="stat-label">Défense déshonorable</div><div class="stat-valeur">${cat.defenseDeshonorable}</div></div>
                <div class="stat-carte"><div class="stat-label">Égalité valeureuse</div><div class="stat-valeur">${cat.egaliteValeureuse}</div></div>
                <div class="stat-carte"><div class="stat-label">Égalité équitable</div><div class="stat-valeur">${cat.egaliteEquitable}</div></div>
                <div class="stat-carte"><div class="stat-label">Égalité déshonorable</div><div class="stat-valeur">${cat.egaliteDeshonorable}</div></div>
                <div class="stat-carte stat-defaite"><div class="stat-label">Défaite valeureuse</div><div class="stat-valeur">${cat.defaiteValeureuse}</div></div>
                <div class="stat-carte stat-defaite"><div class="stat-label">Défaite équitable</div><div class="stat-valeur">${cat.defaiteEquitable}</div></div>
                <div class="stat-carte stat-defaite"><div class="stat-label">Défaite déshonorable</div><div class="stat-valeur">${cat.defaiteDeshonorable}</div></div>
            </div>
            <div class="titre-section titre-section-petit">Équipements préférés</div>
            <div class="stats-grille">
                <div class="stat-carte stat-texte"><div class="stat-label">Arme préférée</div><div class="stat-valeur-texte">${nomObjetPrefere(joueur.equipementPrefere.arme)}</div></div>
                <div class="stat-carte stat-texte"><div class="stat-label">Off-hand préféré</div><div class="stat-valeur-texte">${nomObjetPrefere(joueur.equipementPrefere.offhand)}</div></div>
                <div class="stat-carte stat-texte"><div class="stat-label">Armure préférée</div><div class="stat-valeur-texte">${nomObjetPrefere(joueur.equipementPrefere.armure)}</div></div>
                <div class="stat-carte stat-texte"><div class="stat-label">Stratagème préféré</div><div class="stat-valeur-texte">${nomObjetPrefere(joueur.equipementPrefere.strategeme)}</div></div>
            </div>
        `;
    }

    // Gestion de l'infobulle "i" (protections actives, type de combattant...) — souris (survol)
    // ET tactile (tap), avec repositionnement automatique si elle déborderait de l'écran.
    function repositionnerInfobulle(icone) {
        const bulle = icone.parentElement.querySelector('.info-texte');
        if (!bulle) return;
        bulle.style.transform = 'translateX(-50%)';
        const marge = 8;
        const rect = bulle.getBoundingClientRect();
        if (rect.left < marge) {
            bulle.style.transform = `translateX(calc(-50% + ${marge - rect.left}px))`;
        } else if (rect.right > window.innerWidth - marge) {
            bulle.style.transform = `translateX(calc(-50% - ${rect.right - (window.innerWidth - marge)}px))`;
        }
    }
    function ouvrirInfobulle(icone) {
        document.querySelectorAll('.info-texte.visible').forEach(b => {
            if (b !== icone.parentElement.querySelector('.info-texte')) b.classList.remove('visible');
        });
        const bulle = icone.parentElement.querySelector('.info-texte');
        bulle.classList.add('visible');
        repositionnerInfobulle(icone);
    }
    document.addEventListener('mouseover', (e) => {
        const icone = e.target.closest('.info-icone');
        if (icone) ouvrirInfobulle(icone);
    });
    document.addEventListener('mouseout', (e) => {
        const icone = e.target.closest('.info-icone');
        if (icone) icone.parentElement.querySelector('.info-texte').classList.remove('visible');
    });
    document.addEventListener('focusin', (e) => {
        const icone = e.target.closest('.info-icone');
        if (icone) ouvrirInfobulle(icone);
    });
    document.addEventListener('click', (e) => {
        const icone = e.target.closest('.info-icone');
        if (icone) { ouvrirInfobulle(icone); e.stopPropagation(); return; }
        document.querySelectorAll('.info-texte.visible').forEach(b => b.classList.remove('visible'));
    });

    function afficherLoadout(joueur) {
        const emplacementsEl = document.getElementById('emplacements');
        emplacementsEl.innerHTML = '';
        Object.keys(LABELS_SLOT).forEach(slot => {
            const numero = joueur.loadout[slot];
            const ref = numero > 0 ? STATS[numero] : null;
            const possede = ref ? (joueur.inventaire || []).find(p => p.numero === numero) : null;
            const niveau = possede ? possede.niveau : 0;
            const div = document.createElement('div');
            div.className = 'emplacement' + (ref ? '' : ' vide');
            div.innerHTML = `${niveau > 0 ? `<span class="emplacement-niveau">+${niveau}</span>` : ''}
                              <div class="label">${LABELS_SLOT[slot]}</div>
                              <div class="icone">${ref ? iconeOuImage(ref, 'icone-img') : '—'}</div>
                              <div class="nom">${ref ? ref.nom : 'Aucun'}</div>`;
            emplacementsEl.appendChild(div);
        });
    }

    function afficherJoueurIntrouvable() {
        document.getElementById('titreInventaire').innerHTML = pseudo ? `<span>${pseudo}</span> — STATISTIQUES` : 'STATISTIQUES';
        document.getElementById('zoneStatistiques').innerHTML =
            '<div class="vide-message">Pas encore de données pour ce joueur — la prochaine synchronisation (toutes les 5 à 10 minutes) les fera apparaître après un premier achat de stat ou un premier combat.</div>';
    }

    let STATS = {};
    if (!pseudo) {
        afficherJoueurIntrouvable();
    } else {
        Promise.all([
            fetch('catalogue_stats.json?v=' + Date.now()).then(r => r.json()),
            fetch('players.json?v=' + Date.now()).then(r => r.json()),
        ]).then(([catalogue, joueurs]) => {
            STATS = catalogue;
            const joueur = joueurs[pseudo];
            if (!joueur) { afficherJoueurIntrouvable(); return; }

            document.getElementById('titreInventaire').innerHTML = `<span>${joueur.nomAffichage}</span> — STATISTIQUES`;
            if (joueur.avatar) {
                const img = document.getElementById('avatarViewer');
                img.src = joueur.avatar;
                img.style.display = 'block';
            }

            try {
                afficherStatistiques(joueur);
                afficherLoadout(joueur);
            } catch (erreurAffichage) {
                console.error('Erreur pendant l\'affichage des statistiques :', erreurAffichage);
                document.getElementById('zoneStatistiques').innerHTML =
                    '<div class="vide-message">Données chargées, mais une erreur est survenue pendant l\'affichage : '
                    + erreurAffichage.message + ' (détail complet dans la console du navigateur, F12).</div>';
            }
        }).catch((erreurChargement) => {
            console.error('Erreur de chargement :', erreurChargement);
            document.getElementById('zoneStatistiques').innerHTML =
                '<div class="vide-message">Impossible de charger catalogue_stats.json ou players.json — vérifie qu\'ils sont bien présents à côté de cette page.</div>';
        });
    }
</script>
</body>
</html>
