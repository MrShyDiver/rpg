<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes statistiques</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0;
    --commun: #8d8d8d; --normal: #5ddd7a; --rare: #4a9fd8; --legendaire: #f2c230; --line: #2c2c2e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 40px 20px; }
h1, h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
.page { max-width: 980px; margin: 0 auto; }

.entete { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 3px solid var(--yellow); margin-bottom: 26px; }
.entete img.avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--yellow); flex-shrink: 0; }
.entete-texte h1 { font-size: 26px; font-weight: 700; }
.entete-texte h1 span { color: var(--yellow); }
.entete-texte p { color: var(--paper-dim); font-size: 13.5px; margin-top: 4px; }

.titre-section {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--paper-dim); margin: 24px 0 10px;
}
.titre-section:first-of-type { margin-top: 0; }
.titre-section-petit { margin-top: 16px; font-size: 11px; }

.emplacements { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 10px; }
.emplacement { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; text-align: center; }
.emplacement .label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px; color: var(--paper-dim); text-transform: uppercase; margin-bottom: 8px; }
.emplacement .icone { font-size: 28px; margin-bottom: 6px; }
.icone-img { width: 44px; height: 44px; object-fit: contain; }
.emplacement .nom { font-size: 12.5px; font-weight: 600; }
.emplacement.vide .nom { color: var(--paper-dim); font-style: italic; }

.stats-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 6px; }
.stat-carte {
    background: var(--bg-panel); border: 1px solid var(--line); border-left: 3px solid var(--yellow);
    border-radius: 6px; padding: 10px 12px;
}
.stat-valeur { font-size: 22px; font-weight: 800; color: var(--paper); line-height: 1.2; margin-top: 4px; }
.stat-valeur-texte { font-size: 15px; font-weight: 700; color: var(--paper); line-height: 1.3; margin-top: 4px; }
.stat-sous { font-size: 12px; font-weight: 500; color: var(--paper-dim); }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--paper-dim); }
.stat-victoire { border-left-color: #5ddd7a; }
.stat-defaite { border-left-color: #ff6b6b; }
.stat-type-bully { border-left-color: #ff6b6b; }
.stat-type-fairplay { border-left-color: #3b82f6; }
.stat-type-valeureux { border-left-color: #5ddd7a; }
.stat-type-neutre { border-left-color: #555; }
.stat-type-bully .stat-valeur-texte { color: #ff6b6b; }
.stat-type-fairplay .stat-valeur-texte { color: #3b82f6; }
.stat-type-valeureux .stat-valeur-texte { color: #5ddd7a; }
/* Couleurs propres à chaque stat de personnage */
.stat-atk { border-left-color: #ff5e3a; }
.stat-atk .stat-valeur { color: #ff5e3a; }
.stat-pv { border-left-color: #ca2972; }
.stat-pv .stat-valeur { color: #ca2972; }
.stat-def { border-left-color: #3b82f6; }
.stat-def .stat-valeur { color: #3b82f6; }
.stat-luck { border-left-color: #00ffaa; }
.stat-luck .stat-valeur { color: #00ffaa; }
.stat-spd { border-left-color: #FFCC00; }
.stat-spd .stat-valeur { color: #FFCC00; }
.stat-protection { border-left-color: #f2c230; }
.info-bulle { position: relative; display: inline-block; margin-left: 4px; }
.info-icone {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--paper-dim);
    color: var(--paper-dim); font-size: 11px; font-style: italic; font-weight: 700;
    cursor: help; vertical-align: middle;
}
.info-texte {
    display: none; position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    background: #1a1a1c; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    font-size: 12px; font-weight: 500; color: var(--paper); line-height: 1.4;
    width: 190px; max-width: 70vw; text-align: left; z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    text-transform: none; letter-spacing: normal;
}
.info-texte.visible { display: block; }
/* PowerLevel/rang et points/rang de points utilisent désormais un dégradé DYNAMIQUE par
   percentile (voir couleurPercentile en JS) plutôt qu'une couleur fixe — plus de classe CSS ici. */

.vide-message { color: var(--paper-dim); font-style: italic; padding: 20px 0; }

@media (max-width: 640px) {
    body { padding: 20px 12px; }
    .entete img.avatar { width: 44px; height: 44px; }
    .entete-texte p { font-size: 12px; }
    .emplacements { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .emplacement { padding: 10px; }
    .stats-grille { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="page">
    <div class="entete">
        <img class="avatar" id="avatarViewer" src="" alt="" style="display:none;">
        <div class="entete-texte">
            <h1 id="titreInventaire">MES <span>STATISTIQUES</span></h1>
            <p>PowerLevel, stats de combat et objets préférés — pour l'inventaire complet, utilise <span style="color:var(--yellow)">!inventaire</span>.</p>
        </div>
    </div>
    <div id="zoneStatistiques"></div>
    <div class="titre-section">Loadout actuel</div>
    <div id="emplacements" class="emplacements"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const depuisBase36 = (str) => parseInt(str, 36) || 0;

    const nomViewer = params.get('n') ? decodeURIComponent(params.get('n')) : null;
    const fragmentPhoto = params.get('p') ? decodeURIComponent(params.get('p')) : '';
    // Le C# retire 3 segments FIXES avant transmission pour raccourcir le lien : le domaine,
    // "jtv_user_pictures/" et "profile_image-" — les 3 sont systématiquement présents dans une
    // URL de photo de profil Twitch par défaut. On les reconstitue ici à l'identique.
    let photoViewer = '';
    if (fragmentPhoto) {
        const avecProfileImage = fragmentPhoto.length > 37
            ? fragmentPhoto.slice(0, 37) + 'profile_image-' + fragmentPhoto.slice(37)
            : fragmentPhoto;
        photoViewer = 'https://static-cdn.jtvnw.net/jtv_user_pictures/' + avecProfileImage;
    }
    if (nomViewer) {
        document.getElementById('titreInventaire').innerHTML = `<span>${nomViewer}</span> — STATISTIQUES`;
    }
    if (photoViewer) {
        const img = document.getElementById('avatarViewer');
        img.src = photoViewer;
        img.style.display = 'block';
    }

    const equipStr = params.get('e') || '00000000';
    const numEquipArme = depuisBase36(equipStr.slice(0, 2));
    const numEquipOffhand = depuisBase36(equipStr.slice(2, 4));
    const numEquipTorso = depuisBase36(equipStr.slice(4, 6));
    const numEquipStrat = depuisBase36(equipStr.slice(6, 8));
    const equipeParSlot = { weapon: numEquipArme, offhand: numEquipOffhand, torso: numEquipTorso, strategeme: numEquipStrat };
    const LABELS_SLOT = { weapon: "Arme", offhand: "Off-hand", torso: "Armure", strategeme: "Stratagème" };

    // Décodage du bloc compact "st" : stats à croissance BORNÉE, empaquetées en base36 à largeur
    // fixe côté C# — l'ORDRE et les LARGEURS ci-dessous doivent rester identiques à
    // 29_Stats_Lien.cs (EnBase36Largeur), sinon le décodage lit n'importe quoi.
    const stPack = params.get('st') || '';
    let stPos = 0;
    function lireChamp(largeur) {
        const v = depuisBase36(stPack.slice(stPos, stPos + largeur));
        stPos += largeur;
        return v;
    }
    const statsPerso = {
        powerLevel: lireChamp(3),
        atk: lireChamp(3),
        def: lireChamp(3),
        luck: lireChamp(3),
        spd: lireChamp(3),
        pvBase: lireChamp(3),
        pvPool: lireChamp(3),
        mitigation: lireChamp(2) / 10,
        crit: lireChamp(2) / 10,
    };
    const statsCombat = {
        victoires: lireChamp(3),
        defaites: lireChamp(3),
        egalites: lireChamp(3),
        serieActuelle: lireChamp(3),
        serieRecord: lireChamp(3),
        armePreferee: lireChamp(2),
        offhandPrefere: lireChamp(2),
        armurePreferee: lireChamp(2),
        strategemePrefere: lireChamp(2),
        attaquesAuDessus: lireChamp(3),
        attaquesDansTranche: lireChamp(3),
        attaquesEnDessous: lireChamp(3),
        rangPower: lireChamp(3),
        totalPower: lireChamp(3),
        rangPoints: lireChamp(3),
        totalPoints: lireChamp(3),
        protectionsActives: lireChamp(2),
        // Ceux-ci restent NON compressés — cumulatifs, sans plafond raisonnable dans le temps
        // (et les points peuvent être négatifs).
        degatsInfliges: parseInt(params.get('dgi')) || 0,
        degatsSubis: parseInt(params.get('dgs')) || 0,
        plusGrosCoup: parseInt(params.get('pgc')) || 0,
        points: parseInt(params.get('pts')) || 0,
    };

    const iconeOuImage = (ref, classeImg) => ref.image
        ? `<img src="${ref.image}" alt="" class="${classeImg}">`
        : `<span class="${classeImg}-emoji">${ref.icone}</span>`;

    // Dégradé de couleur par percentile — convention Warcraft Logs / Wowhead, reconnue et très
    // lisible d'un coup d'œil : gris (bas du classement) -> vert -> bleu -> violet -> orange ->
    // rose (top 1%) -> or (1er).
    function couleurPercentile(percentile) {
        if (percentile >= 100) return '#e5cc80'; // Or — 1er
        if (percentile >= 99) return '#e268a8';  // Rose — top 1%
        if (percentile >= 95) return '#ff8000';  // Orange — top 5%
        if (percentile >= 75) return '#a335ee';  // Violet — top 25%
        if (percentile >= 50) return '#0070ff';  // Bleu — top 50%
        if (percentile >= 25) return '#1eff00';  // Vert — top 75%
        return '#9d9d9d';                        // Gris — le reste
    }

    // rang=1 (le meilleur) -> percentile 100 ; rang=total (le dernier) -> percentile 0.
    function percentileDepuisRang(rang, total) {
        if (total <= 1) return 100;
        return ((total - rang) / (total - 1)) * 100;
    }

    function typeCombattant(auDessus, dansTranche, enDessous) {
        const total = auDessus + dansTranche + enDessous;
        if (total < 3) return { texte: 'Pas assez de duels', classe: 'neutre' };
        if (enDessous > dansTranche && enDessous > auDessus) return { texte: 'Bully', classe: 'bully' };
        if (auDessus > dansTranche && auDessus > enDessous) return { texte: 'Valeureux', classe: 'valeureux' };
        return { texte: 'Fairplay', classe: 'fairplay' };
    }

    function nomObjetPrefere(numero) {
        if (!numero) return '—';
        const s = STATS[numero];
        return s ? s.nom : '—';
    }

    function afficherStatistiques() {
        const sp = statsPerso, sc = statsCombat;
        const totalDuels = sc.victoires + sc.defaites + sc.egalites;
        const pct = (v) => totalDuels > 0 ? ((v / totalDuels) * 100).toFixed(1) : '0.0';
        const type = typeCombattant(sc.attaquesAuDessus, sc.attaquesDansTranche, sc.attaquesEnDessous);
        const ratioDegats = sc.degatsSubis > 0 ? (sc.degatsInfliges / sc.degatsSubis).toFixed(2) : sc.degatsInfliges > 0 ? '∞' : '0.00';
        const couleurPower = couleurPercentile(percentileDepuisRang(sc.rangPower, sc.totalPower));
        const couleurPoints = couleurPercentile(percentileDepuisRang(sc.rangPoints, sc.totalPoints));
        // PV : la base brute (100 avant tout stack) est 10x plus grande que celle des autres
        // stats (ATK/DEF/SPD partent toutes de 10) — on la divise par 10 pour l'affichage
        // PRINCIPAL uniquement, afin de rester visuellement cohérent. Le vrai pool de vie
        // (avec bonus d'objets), lui, reste affiché tel quel entre parenthèses.
        const pvAffiche = Math.round(sp.pvBase / 10);

        document.getElementById('zoneStatistiques').innerHTML = `
            <div class="titre-section">Statistiques</div>
            <div class="stats-grille">
                <div class="stat-carte" style="border-left-color:${couleurPower}"><div class="stat-label">PowerLevel</div><div class="stat-valeur" style="color:${couleurPower}">${Math.round(sp.powerLevel)} <span class="stat-sous">(#${sc.rangPower}/${sc.totalPower})</span></div></div>
                <div class="stat-carte stat-atk"><div class="stat-label">ATK</div><div class="stat-valeur">${Math.round(sp.atk)}</div></div>
                <div class="stat-carte stat-pv"><div class="stat-label">PV</div><div class="stat-valeur">${pvAffiche} <span class="stat-sous">(${Math.round(sp.pvPool)} PDV)</span></div></div>
                <div class="stat-carte stat-def"><div class="stat-label">DEF</div><div class="stat-valeur">${Math.round(sp.def)} <span class="stat-sous">(${sp.mitigation}% mitig.)</span></div></div>
                <div class="stat-carte stat-protection"><div class="stat-label">Protections actives</div><div class="stat-valeur">${sc.protectionsActives} <span class="info-bulle" tabindex="0"><span class="info-icone">i</span><span class="info-texte">Réduit les dégâts de 20% pour un combat et consomme une protection</span></span></div></div>
                <div class="stat-carte stat-luck"><div class="stat-label">LUCK</div><div class="stat-valeur">${Math.round(sp.luck) + 10} <span class="stat-sous">(${sp.crit}% crit)</span></div></div>
                <div class="stat-carte stat-spd"><div class="stat-label">Speed</div><div class="stat-valeur">${Math.round(sp.spd)}</div></div>
            </div>
            <div class="titre-section titre-section-petit">Classement</div>
            <div class="stats-grille">
                <div class="stat-carte" style="border-left-color:${couleurPower}"><div class="stat-label">Rang PowerLevel</div><div class="stat-valeur" style="color:${couleurPower}">#${sc.rangPower} <span class="stat-sous">/ ${sc.totalPower}</span></div></div>
                <div class="stat-carte" style="border-left-color:${couleurPoints}"><div class="stat-label">Points de duel</div><div class="stat-valeur" style="color:${couleurPoints}">${sc.points}</div></div>
                <div class="stat-carte" style="border-left-color:${couleurPoints}"><div class="stat-label">Rang points</div><div class="stat-valeur" style="color:${couleurPoints}">#${sc.rangPoints} <span class="stat-sous">/ ${sc.totalPoints}</span></div></div>
            </div>
            <div class="titre-section titre-section-petit">Historique de combat</div>
            <div class="stats-grille">
                <div class="stat-carte stat-victoire"><div class="stat-label">Victoires</div><div class="stat-valeur">${sc.victoires} <span class="stat-sous">(${pct(sc.victoires)}%)</span></div></div>
                <div class="stat-carte stat-defaite"><div class="stat-label">Défaites</div><div class="stat-valeur">${sc.defaites} <span class="stat-sous">(${pct(sc.defaites)}%)</span></div></div>
                <div class="stat-carte"><div class="stat-label">Égalités</div><div class="stat-valeur">${sc.egalites} <span class="stat-sous">(${pct(sc.egalites)}%)</span></div></div>
                <div class="stat-carte"><div class="stat-label">Dégâts infligés</div><div class="stat-valeur">${sc.degatsInfliges}</div></div>
                <div class="stat-carte"><div class="stat-label">Dégâts subis</div><div class="stat-valeur">${sc.degatsSubis}</div></div>
                <div class="stat-carte"><div class="stat-label">Ratio dégâts</div><div class="stat-valeur">${ratioDegats}</div></div>
                <div class="stat-carte"><div class="stat-label">Plus gros coup</div><div class="stat-valeur">${sc.plusGrosCoup}</div></div>
                <div class="stat-carte"><div class="stat-label">Série actuelle</div><div class="stat-valeur">${sc.serieActuelle}</div></div>
                <div class="stat-carte"><div class="stat-label">Record personnel</div><div class="stat-valeur">${sc.serieRecord}</div></div>
                <div class="stat-carte stat-texte stat-type-${type.classe}"><div class="stat-label">Type de combattant</div><div class="stat-valeur-texte">${type.texte}</div></div>
            </div>
            <div class="titre-section titre-section-petit">Équipements préférés</div>
            <div class="stats-grille">
                <div class="stat-carte stat-texte"><div class="stat-label">Arme préférée</div><div class="stat-valeur-texte">${nomObjetPrefere(sc.armePreferee)}</div></div>
                <div class="stat-carte stat-texte"><div class="stat-label">Off-hand préféré</div><div class="stat-valeur-texte">${nomObjetPrefere(sc.offhandPrefere)}</div></div>
                <div class="stat-carte stat-texte"><div class="stat-label">Armure préférée</div><div class="stat-valeur-texte">${nomObjetPrefere(sc.armurePreferee)}</div></div>
                <div class="stat-carte stat-texte"><div class="stat-label">Stratagème préféré</div><div class="stat-valeur-texte">${nomObjetPrefere(sc.strategemePrefere)}</div></div>
            </div>
        `;
    }

    // Gestion de l'infobulle "i" (protections actives, etc.) — souris (survol) ET tactile (tap),
    // avec repositionnement automatique si elle déborderait de l'écran (surtout sur mobile, où
    // les cases sont étroites et proches du bord).
    function repositionnerInfobulle(icone) {
        const bulle = icone.parentElement.querySelector('.info-texte');
        if (!bulle) return;
        bulle.style.transform = 'translateX(-50%)';
        const marge = 8;
        const rect = bulle.getBoundingClientRect();
        if (rect.left < marge) {
            bulle.style.transform = `translateX(calc(-50% + ${marge - rect.left}px))`;
        } else if (rect.right > window.innerWidth - marge) {
            bulle.style.transform = `translateX(calc(-50% - ${rect.right - (window.innerWidth - marge)}px))`;
        }
    }
    function ouvrirInfobulle(icone) {
        document.querySelectorAll('.info-texte.visible').forEach(b => {
            if (b !== icone.parentElement.querySelector('.info-texte')) b.classList.remove('visible');
        });
        const bulle = icone.parentElement.querySelector('.info-texte');
        bulle.classList.add('visible');
        repositionnerInfobulle(icone);
    }
    document.addEventListener('mouseover', (e) => {
        const icone = e.target.closest('.info-icone');
        if (icone) ouvrirInfobulle(icone);
    });
    document.addEventListener('mouseout', (e) => {
        const icone = e.target.closest('.info-icone');
        if (icone) icone.parentElement.querySelector('.info-texte').classList.remove('visible');
    });
    document.addEventListener('focusin', (e) => {
        const icone = e.target.closest('.info-icone');
        if (icone) ouvrirInfobulle(icone);
    });
    document.addEventListener('click', (e) => {
        const icone = e.target.closest('.info-icone');
        if (icone) { ouvrirInfobulle(icone); e.stopPropagation(); return; }
        // Un tap n'importe où ailleurs referme les infobulles ouvertes (utile au tactile,
        // qui n'a pas d'équivalent de "mouseout" quand on touche autre chose).
        document.querySelectorAll('.info-texte.visible').forEach(b => b.classList.remove('visible'));
    });

    function afficherLoadout() {
        const emplacementsEl = document.getElementById('emplacements');
        Object.keys(LABELS_SLOT).forEach(slot => {
            const numero = equipeParSlot[slot];
            const ref = numero > 0 ? STATS[numero] : null;
            const div = document.createElement('div');
            div.className = 'emplacement' + (ref ? '' : ' vide');
            div.innerHTML = `<div class="label">${LABELS_SLOT[slot]}</div>
                              <div class="icone">${ref ? iconeOuImage(ref, 'icone-img') : '—'}</div>
                              <div class="nom">${ref ? ref.nom : 'Aucun'}</div>`;
            emplacementsEl.appendChild(div);
        });
    }

    let STATS = {};
    fetch('catalogue_stats.json?v=' + Date.now())
        .then(r => r.json())
        .then(data => {
            STATS = data;
            try {
                afficherStatistiques();
                afficherLoadout();
            } catch (erreurAffichage) {
                console.error('Erreur pendant l\'affichage des statistiques :', erreurAffichage);
                document.getElementById('zoneStatistiques').innerHTML =
                    '<div class="vide-message">catalogue_stats.json a bien été chargé, mais une erreur est survenue pendant l\'affichage : '
                    + erreurAffichage.message + ' (détail complet dans la console du navigateur, F12).</div>';
            }
        })
        .catch((erreurChargement) => {
            console.error('Erreur de chargement de catalogue_stats.json :', erreurChargement);
            document.getElementById('zoneStatistiques').innerHTML =
                '<div class="vide-message">Impossible de charger catalogue_stats.json — vérifie qu\'il est bien présent à côté de cette page.</div>';
        });
</script>
</body>
</html>
