<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex des objets</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0d; --bg-panel: #141416; --yellow: #f2c230; --red: #a8271f;
    --paper: #e9e3d2; --paper-dim: #b8b2a0; --line: #2c2c2e;
    --commun: #8d8d8d; --normal: #5ddd7a; --rare: #4a9fd8; --epique: #a855f7; --legendaire: #f2c230;
    --set: #2dd4bf;
    /* Code couleur par stat — identique à calculateur.html/stats.html, pour reconnaître une stat
       d'un coup d'œil sur tout le site. */
    --atk: #ff5e3a; --def: #3b82f6; --pv: #ca2972; --spd: #FFCC00; --luck: #00ffaa; --esquive: #22d3ee;
    --negatif: #ff6b6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 30px 20px 60px; }
h1, h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
.page { max-width: 1100px; margin: 0 auto; }

.entete { padding-bottom: 18px; border-bottom: 3px solid var(--yellow); margin-bottom: 22px; }
.entete h1 { font-size: 26px; font-weight: 700; }
.entete h1 span { color: var(--yellow); }
.entete p { color: var(--paper-dim); font-size: 13.5px; margin-top: 6px; }

/* ============ BARRE DE RECHERCHE ET FILTRES ============ */
.barre-controles { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: center; }
.champ-recherche {
    flex: 1; min-width: 220px; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 14px; color: var(--paper); font-size: 14px; font-family: 'Barlow', sans-serif;
}
.champ-recherche::placeholder { color: var(--paper-dim); }
.champ-recherche:focus { outline: none; border-color: var(--yellow); }

.filtres-rangee { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.filtre-pilule {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12.5px; font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--paper-dim); background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; cursor: pointer; transition: all 0.15s ease;
}
.filtre-pilule:hover { border-color: #444; color: var(--paper); }
.filtre-pilule.actif { background: var(--yellow); color: #000; border-color: var(--yellow); }
.filtre-pilule.actif.r-normal { background: var(--normal); border-color: var(--normal); }
.filtre-pilule.actif.r-rare { background: var(--rare); border-color: var(--rare); }
.filtre-pilule.actif.r-epique { background: var(--epique); border-color: var(--epique); }
.filtre-pilule.actif.r-legendaire { background: var(--legendaire); border-color: var(--legendaire); }
.filtre-pilule.actif.r-commun { background: var(--commun); border-color: var(--commun); color: #000; }

.compteur-resultats { font-size: 12.5px; color: var(--paper-dim); margin-bottom: 18px; }

.legende-stats { display: flex; flex-wrap: wrap; gap: 14px 20px; margin-bottom: 20px; font-size: 12px; color: var(--paper-dim); }
.legende-stats span { display: inline-flex; align-items: center; gap: 6px; }
.legende-stats .pastille { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.legende-stats .pastille-malus { width: 14px; height: 10px; border-radius: 3px; border: 1px solid var(--negatif); background: rgba(255,107,107,0.1); display: inline-block; }

/* ============ CATÉGORIES + GRILLE (repris d'inventaire.html) ============ */
.categorie { margin-bottom: 34px; }
.categorie-titre { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.categorie-titre h2 { font-size: 18px; font-weight: 600; }
.categorie-titre .compte { font-size: 12.5px; color: var(--paper-dim); font-weight: 400; text-transform: none; font-family: 'Barlow', sans-serif; }
.categorie-titre::after { content: ''; flex: 1; height: 1px; background: var(--line); }
/* Grille : chaque carte réserve TOUJOURS 6 pistes de ligne (portrait, en-tête, scaling, modes de
   tir, bonus, passif) via CSS subgrid — même vide pour un objet donné, la piste existe quand même
   et prend la hauteur imposée par ses voisines de la même rangée visuelle. C'est ce qui aligne
   "Scaling"/"Bonus"/"Passif" au même niveau d'une carte à l'autre, peu importe la longueur du
   contenu de chacune (alignement demandé sur la carte la plus grande de la rangée). */
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); grid-auto-rows: minmax(0, min-content); gap: 16px; align-items: start; }

.carte {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative;
    display: grid; grid-template-rows: subgrid; grid-row: span 5; row-gap: 0;
}
.carte.normal { border-color: rgba(93,221,122,0.35); }
.carte.rare { border-color: rgba(74,159,216,0.35); }
.carte.epique { border-color: rgba(168,85,247,0.4); }
.carte.legendaire { border-color: rgba(242,194,48,0.45); }

/* ============ PORTRAIT (haut de carte façon "carte à collectionner") ============ */
/* Fond PLEIN (couleur de rareté, sans dégradé ni rayons ni halo) — l'icône posée directement dessus,
   plus de médaillon circulaire. Portrait plus haut que la version condensée précédente pour mettre
   l'image/icône de l'objet en valeur. */
.carte-portrait {
    position: relative; height: 132px; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}
.carte.commun .carte-portrait { background: color-mix(in srgb, var(--commun) 55%, #101012); }
.carte.normal .carte-portrait { background: color-mix(in srgb, var(--normal) 45%, #101012); }
.carte.rare .carte-portrait { background: color-mix(in srgb, var(--rare) 48%, #101012); }
.carte.epique .carte-portrait { background: color-mix(in srgb, var(--epique) 50%, #101012); }
.carte.legendaire .carte-portrait { background: color-mix(in srgb, var(--legendaire) 55%, #101012); }
/* Effet "holo" façon Pokémon, réservé aux légendaires : un reflet diagonal discret qui balaie
   TOUTE la carte (portrait + corps) — inchangé par le passage à un fond plein ci-dessus. */
.carte.legendaire::after {
    content: ''; position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.09) 47%, rgba(242,194,48,0.15) 50%, rgba(255,255,255,0.09) 53%, transparent 62%);
    background-size: 260% 260%;
    animation: carteHoloVague 7s ease-in-out infinite;
}
@keyframes carteHoloVague {
    0%, 100% { background-position: 15% 0%; }
    50% { background-position: 85% 100%; }
}

/* Label de rareté en toutes lettres (au lieu d'une seule lettre) — même famille visuelle que le
   badge Base/MAX en face, à l'autre coin du portrait. */
.carte-badge-rarete {
    position: absolute; top: 8px; left: 8px; z-index: 3; font-family: 'Barlow Condensed', sans-serif;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: #000; border-radius: 4px; padding: 2px 8px; border: 1px solid rgba(0,0,0,0.35);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}
.carte.commun .carte-badge-rarete { background: var(--commun); }
.carte.normal .carte-badge-rarete { background: var(--normal); }
.carte.rare .carte-badge-rarete { background: var(--rare); color: #fff; }
.carte.epique .carte-badge-rarete { background: var(--epique); color: #fff; }
.carte.legendaire .carte-badge-rarete { background: var(--legendaire); }

/* Le numéro de catalogue n'a aucun intérêt pour les viewers — remplacé par un indicateur d'état
   "Base" (valeurs de départ) / "MAX" (bascule "Voir au niveau max"), ce dernier mis en valeur pour
   qu'il saute aux yeux quand on parcourt le catalogue en mode "niveau max". */
.carte-etat-niveau {
    position: absolute; top: 8px; right: 8px; z-index: 3; font-family: 'Barlow Condensed', sans-serif;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--paper-dim); background: rgba(0,0,0,0.4); border-radius: 4px; padding: 2px 8px;
}
.carte-etat-niveau.etat-max {
    color: #000; background: var(--yellow); font-weight: 800; font-size: 11px;
    box-shadow: 0 1px 6px rgba(242,194,48,0.55);
}

.carte-icone-zone { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.carte-icone-zone .carte-icon { max-width: 78%; max-height: 84%; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45)); }
.carte-icone-zone .carte-icon-emoji { font-size: 54px; line-height: 1; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45)); }

/* .carte-corps n'est plus une sous-grille imbriquée : un niveau de subgrid supplémentaire
   (.carte > .carte-corps > pistes) laisse un résidu de ~16px sur une piste pourtant vide dans
   Chromium (l'espacement par défaut d'une ligne de texte, même sans aucun contenu). display:contents
   fait disparaître la boîte de .carte-corps — ses enfants (les pistes) deviennent directement des
   items de la grille de .carte, sur UN SEUL niveau de subgrid, ce qui élimine le résidu. Le padding
   qu'assurait .carte-corps est redistribué sur chaque piste individuellement ci-dessous. */
.carte-corps { display: contents; }
/* grid-column explicite : sur les cartes à stance, deux éléments (stance 1 / stance 2) partagent
   la même piste — sans ça, le placement automatique leur trouverait chacun leur propre colonne au
   lieu de les superposer (le CSS de survol .stance-vue-1/2 s'occupe déjà de n'en montrer qu'un).
   Numérotation directement dans le référentiel de .carte (portrait = ligne 1). */
.fila-header { grid-row: 2; grid-column: 1; min-height: 0; padding: 10px 14px 0; }
.fila-scaling { grid-row: 3; grid-column: 1; min-height: 0; padding-left: 14px; padding-right: 14px; }
.fila-bonus { grid-row: 4; grid-column: 1; min-height: 0; padding-left: 14px; padding-right: 14px; }
.fila-passif { grid-row: 5; grid-column: 1; min-height: 0; padding-left: 14px; padding-right: 14px; padding-bottom: 14px; }
.carte-nom { font-size: 15px; font-weight: 600; text-align: center; margin-bottom: 6px; }
.carte-nom .carte-contributeur { font-size: 10px; font-weight: 400; color: var(--paper-dim); font-style: italic; }
/* Nom de l'objet + titres de section ("Bonus"/"Passif") dans la couleur PURE de la rareté (pas la
   version atténuée du fond du portrait) — pour que la rareté se lise aussi dans le corps de la
   carte. Les couleurs de STAT (ATK/DEF/...) restent indépendantes, inchangées. */
.carte.commun .carte-nom, .carte.commun .section-titre { color: var(--commun); }
.carte.normal .carte-nom, .carte.normal .section-titre { color: var(--normal); }
.carte.rare .carte-nom, .carte.rare .section-titre { color: var(--rare); }
.carte.epique .carte-nom, .carte.epique .section-titre { color: var(--epique); }
.carte.legendaire .carte-nom, .carte.legendaire .section-titre { color: var(--legendaire); }

/* ============ SET + TYPE DE DÉGÂTS (regroupés sur une seule ligne condensée) ============ */
.carte-badges-ligne { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 0 0 6px; }
/* Set thématique (ex: "Sekiro") — pilule verte, même esprit que stance-etiquette. Purement
   identificatif pour l'instant (pas encore de bonus de set). */
.carte-set-tag {
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: #000; background: var(--set); border-radius: 4px; padding: 1px 7px;
}
/* Type(s) de dégâts : pilules auto-dérivées des mécaniques déjà présentes sur l'objet (jamais
   saisies à la main) — physique (Tranchant/Contondant/Perforant/Explosif selon l'animation, ou
   "Physique" générique si l'animation n'est pas reconnue) + éléments (Poison/Feu/Saignement). */
.tag-degat {
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; border-radius: 4px; padding: 2px 7px;
}
.tag-degat.physique { background: rgba(184,178,160,0.15); color: var(--paper-dim); }
.tag-degat.poison { background: rgba(140,255,90,0.15); color: #8cff5a; }
.tag-degat.feu { background: rgba(255,138,61,0.15); color: #ff8a3d; }
.tag-degat.saignement { background: rgba(224,90,90,0.15); color: #e05a5a; }

.stat-ligne { font-size: 13px; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stat-ligne .gauche { display: flex; align-items: baseline; gap: 6px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
.stat-ligne .label { color: var(--paper-dim); font-weight: 600; }
.stat-ligne .valeur-neutre { color: var(--paper); font-weight: 700; }
/* Bonus de stat : coloré par la stat elle-même (reconnaissable d'un coup d'œil, cohérent avec le
   reste du site) — un négatif reste ÉVIDENT grâce au badge à bordure rouge, pas seulement à la
   teinte, pour rester lisible même en cas de daltonisme. */
.stat-valeur-badge { font-weight: 700; }
.stat-valeur-badge.malus {
    border: 1px solid var(--negatif); border-radius: 4px; padding: 0px 6px;
    background: rgba(255,107,107,0.1);
}
/* Progression par niveau : une PASTILLE à part, dans le même style que les badges "niveau" déjà
   utilisés ailleurs sur le site (inventaire/boutique/calculateur) — pour que l'œil associe
   immédiatement ce jaune-là à "évolue par doublon possédé", et jamais confondu avec la valeur
   elle-même. Toujours casée à droite de sa ligne (flex space-between) plutôt que collée en texte
   après la valeur, pour ne pas alourdir la lecture. */
.pilule-scaling {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px; margin-left: auto;
    font-family: 'Oswald', sans-serif; font-size: 10.5px; font-weight: 800; letter-spacing: .02em;
    color: var(--yellow); border: 1.5px solid var(--yellow); border-radius: 5px;
    padding: 1px 7px; background: rgba(242,194,48,0.12); white-space: nowrap; cursor: help;
}
.pilule-scaling .fleche { font-size: 9px; }
.pilule-scaling .unite { font-weight: 500; opacity: .8; }
.bloc-passif { display: flex; flex-direction: column; gap: 4px; }
.passif-ligne { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--paper-dim); line-height: 1.4; }
.passif-ligne .texte { flex: 1 1 auto; min-width: 0; }
.passif-ligne b { color: var(--paper); font-weight: 600; }

/* :empty = piste réservée par la sous-grille mais sans contenu pour CET objet (ex: scaling sur un
   Stratagème) — pas de bordure flottante ni de padding, l'espace vide s'aligne quand même sur la
   hauteur imposée par les autres cartes de la rangée. */
.bloc-section { margin-top: 6px; padding-top: 6px; border-top: 1px solid #2a2a2a; }
/* height:0 explicite : sans ça, un item de grille vide "étiré" (align-self:stretch, par défaut)
   sur une piste de sous-grille pourtant dimensionnée à 0px garde quand même ~16px de hauteur
   affichée dans Chromium (comportement observé, indépendant du padding/bordure déjà à zéro) — d'où
   l'espace résiduel signalé sur les objets sans scaling/bonus/passif à afficher. */
.bloc-section:empty { margin-top: 0; padding-top: 0; border-top: none; height: 0; }
.section-titre {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    color: var(--yellow); opacity: 0.85; margin-bottom: 3px;
}
/* Grille des 5 stats scalables (ATK/DEF/PV/SPD/CRIT), une lettre ou "—" si non concernée — plus
   lisible en un coup d'œil que la version condensée sur une ligne (retour arrière demandé). */
.scaling-grille { display: flex; flex-wrap: wrap; gap: 4px; }
.scaling-item { display: flex; flex-direction: column; align-items: center; min-width: 26px; }
.scaling-item .scaling-label { font-size: 9px; color: var(--paper-dim); margin-bottom: 2px; }
.scaling-item .scaling-lettre { font-size: 15px; font-weight: 800; }
/* Tiret cadratin collé ("12–16", pas "12 - 16") pour que la ligne de dégâts ne casse jamais au
   milieu du nombre si la carte est étroite. */
.scaling-degats { font-size: 13px; color: var(--paper-dim); margin-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.scaling-degats b { color: var(--paper); font-weight: 700; }

/* ============ CARTE À CHANGEMENT DE STANCE ============ */
.carte-stance { position: relative; cursor: pointer; }
.stance-indicateur {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
    color: #000; background: var(--yellow); border-radius: 999px; padding: 4px 40px; z-index: 3;
}
@keyframes stancePulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; transform: translateX(-50%) scale(1.05); } }
.stance-vue-2 { display: none; }
.carte-stance:hover .stance-vue-1 { display: none; }
.carte-stance:hover .stance-vue-2 { display: block; }
/* La zone d'icône (portrait) doit basculer en display:flex pour rester centrée — les règles
   génériques ci-dessus (display:block) suffisent au panneau d'infos texte, pas à l'icône. */
.carte-icone-zone .stance-vue { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.carte-icone-zone .stance-vue-2 { display: none; }
.carte-stance:hover .carte-icone-zone .stance-vue-1 { display: none; }
.carte-stance:hover .carte-icone-zone .stance-vue-2 { display: flex; }
.carte-stance:hover { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow); }
.carte-stance:hover .stance-indicateur { background: var(--paper); }
.stance-etiquette {
    display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; color: #000; background: var(--rare);
    border-radius: 4px; padding: 1px 6px; vertical-align: middle; margin-left: 4px;
}
.stance-etiquette-2 { background: var(--legendaire); }

.vide-message { text-align: center; padding: 60px 20px; color: var(--paper-dim); }

@media (max-width: 640px) {
    body { padding: 20px 12px 50px; }
    .entete h1 { font-size: 20px; }
    .grille { grid-template-columns: 1fr; }
    .categorie-titre h2 { font-size: 15px; }
}
</style>
</head>
<body>
<div class="page">
    <div class="entete">
        <h1>LE <span>CODEX</span></h1>
        <p>Tout l'arsenal disponible dans le jeu, armes, protections et Stratagèmes — indépendamment de ce que tu possèdes.</p>
    </div>

    <div class="legende-stats">
        <span><span class="pastille" style="background:var(--atk)"></span>Attaque</span>
        <span><span class="pastille" style="background:var(--def)"></span>Défense</span>
        <span><span class="pastille" style="background:var(--pv)"></span>Points de vie</span>
        <span><span class="pastille" style="background:var(--spd)"></span>Vitesse</span>
        <span><span class="pastille" style="background:var(--luck)"></span>Chance</span>
        <span><span class="pastille" style="background:var(--esquive)"></span>Esquive</span>
        <span><span class="pastille-malus"></span>Valeur négative (malus)</span>
        <span><span class="pilule-scaling"><span class="fleche">▲</span>+2<span class="unite">/niv.</span></span> = gain à chaque exemplaire supplémentaire possédé</span>
    </div>

    <div class="barre-controles">
        <input type="text" class="champ-recherche" id="champRecherche" placeholder="Rechercher un objet par son nom...">
        <button type="button" class="filtre-pilule" id="toggleNiveauMax" title="Affiche chaque objet entièrement amélioré (plafond de niveau selon sa rareté), doublons compris">Voir au niveau max</button>
    </div>
    <div class="filtres-rangee" id="filtresRarete"></div>
    <div class="compteur-resultats" id="compteurResultats"></div>

    <div id="grillePrincipale"></div>
</div>

<script>
    const LABELS_CATEGORIE = {
        weapon_1h: "Armes à une main", weapon_2h: "Armes à deux mains",
        offhand: "Off-hand", torso: "Armure", strategeme: "Stratagème",
    };
    function categorieAffichage(item) {
        if (item.slot === "weapon") return item.hand === "two_handed" ? "weapon_2h" : "weapon_1h";
        return item.slot;
    }
    const LABELS_STAT = { atk: "ATK", def: "DEF", pv: "PDV", esquive: "Esquive", spd: "Vitesse", luck: "LUCK" };
    const SUFFIXE_STAT = { esquive: "%" };
    const suffixeStat = (stat) => SUFFIXE_STAT[stat] || "";
    const LABELS_RARETE = { commun: "Commun", normal: "Normal", rare: "Rare", epique: "Épique", legendaire: "Légendaire" };
    // Type de dégâts physique dérivé de l'animation de l'objet (arme ou Stratagème) — "Physique"
    // générique en repli si l'animation n'est pas reconnue (ex: objet sans Anim renseigné).
    const LABELS_TYPE_PHYSIQUE = { slash: "Tranchant", smash: "Contondant", tir: "Perforant", explosion: "Explosif", bombardement: "Explosif" };
    // Types de dégâts affichés sous forme de pilules — TOUJOURS dérivés des champs déjà présents
    // sur l'objet, jamais d'une nouvelle donnée saisie à la main (reste synchronisé sans effort).
    function typesDegats(s) {
        const types = [];
        const faitDegatsDirects = (s.baseDegatsMin > 0 || s.baseDegatsMax > 0 || s.degatsDirects > 0);
        if (faitDegatsDirects) types.push({ classe: "physique", label: LABELS_TYPE_PHYSIQUE[s.anim] || "Physique" });
        if (s.poisonDegats > 0) types.push({ classe: "poison", label: "Poison" });
        if (s.brulureDegats > 0 || s.bruleeReflectionDegats > 0) types.push({ classe: "feu", label: "Feu" });
        if (s.saignementDegats > 0) types.push({ classe: "saignement", label: "Saignement" });
        return types;
    }
    function rendreTagsDegats(s) {
        // Ne renvoie plus sa propre div englobante — regroupé avec le tag de set dans
        // .carte-badges-ligne par l'appelant, pour condenser en une seule ligne.
        return typesDegats(s).map(t => `<span class="tag-degat ${t.classe}">${t.label}</span>`).join('');
    }
    // Set + type(s) de dégâts sur UNE seule ligne condensée (au lieu de deux blocs empilés).
    function construireBadgesLigne(item) {
        const set = item.set ? `<span class="carte-set-tag">Set ${item.set}</span>` : '';
        const tags = rendreTagsDegats(item);
        return (set || tags) ? `<div class="carte-badges-ligne">${set}${tags}</div>` : '';
    }
    // Nom + contributeur fusionnés sur une seule ligne (au lieu d'une ligne dédiée en dessous).
    function construireNomLigne(item, suffixeHtml) {
        const credit = item.contributeur ? ` <span class="carte-contributeur">— ${item.contributeur}</span>` : '';
        return `<div class="carte-nom">${item.nom}${suffixeHtml || ''}${credit}</div>`;
    }
    // Couleur associée à chaque stat pour les lignes de "Bonus" — voir la légende dans l'entête.
    const COULEUR_STAT = { atk: "var(--atk)", def: "var(--def)", pv: "var(--pv)", spd: "var(--spd)", luck: "var(--luck)", esquive: "var(--esquive)" };

    // Formate un nombre en tronquant les décimales inutiles (0.16 reste "0.16", 10.0 devient "10").
    function formatNombre(v) {
        return (Math.round(v * 100) / 100).toString();
    }
    // Pastille "progression par niveau" — même esprit que les badges "niveau" déjà utilisés
    // ailleurs sur le site (jaune, contour, coin arrondi), pour que l'œil reconnaisse tout de
    // suite "ça évolue par doublon" sans avoir à lire du texte entre parenthèses. Absente si le
    // taux est nul. Le survol (title) rappelle explicitement ce que représente le nombre.
    function pilluleIncrement(valeurIncrement) {
        if (!valeurIncrement) return "";
        const signe = valeurIncrement >= 0 ? "+" : "";
        return `<span class="pilule-scaling" title="Gagné à chaque exemplaire supplémentaire possédé de cet objet"><span class="fleche">▲</span>${signe}${formatNombre(valeurIncrement)}<span class="unite">/niv.</span></span>`;
    }

    const COULEUR_LETTRE_SCALING = { S: "#f2c230", A: "#e8934a", B: "#d65f5f", C: "#a878c9", D: "#6a9bc3", E: "#8d8d8d" };
    const STATS_SCALABLES = ["atk", "def", "pv", "spd", "crit"];
    const LABELS_SCALING = { atk: "ATK", def: "DEF", pv: "PV", spd: "SPD", crit: "CRIT" };

    const GABARITS_PASSIF = {
        Lifesteal: (v, s) => `Vol de vie : <b>${v}%</b> des dégâts infligés sont rendus en PV.`,
        PoisonDegats: (v, s) => `Poison : inflige <b>${v}</b> dégâts au tour suivant, puis <b>${Math.max(0, v - 1)}</b>, <b>${Math.max(0, v - 2)}</b>... jusqu'à 0 (s'additionne si réappliqué).`,
        // EXTENSION "PANOPLIE SEKIRO" : durée personnalisable (Hache Chargée, 2 tours) au lieu du
        // classique "saute 1 action" — etourdissementDureeTours absent/1 pour tout le reste du
        // catalogue donne exactement l'ancien texte, comportement inchangé.
        EtourdissementChance: (v, s) => {
            const duree = s.etourdissementDureeTours && s.etourdissementDureeTours > 1 ? s.etourdissementDureeTours : 1;
            return duree > 1
                ? `<b>${v}%</b> de chance d'étourdir la cible (saute ses <b>${duree}</b> prochains tours).`
                : `<b>${v}%</b> de chance d'étourdir la cible (saute son tour suivant).`;
        },
        ExecutionBonus: (v, s) => `Sous <b>${s.executionSeuil}%</b> de PV, inflige <b>+${v}%</b> de dégâts.`,
        Precision: (v, s) => `<b>+${v}</b> précision — réduit l'esquive adverse.`,
        Blocage: (v, s) => `<b>${v}%</b> de chance de bloquer, réduit alors les dégâts de <b>${s.blocageReduction}%</b>.`,
        Reflection: (v, s) => `Renvoie <b>${v}%</b> des dégâts subis à l'attaquant.`,
        ResistancePoison: (v, s) => `<b>${v}%</b> de résistance au poison.`,
        ResistanceFeu: (v, s) => `Réduit de <b>${v}%</b> les dégâts subis de type feu (Brûlure).`,
        Regeneration: (v, s) => `Régénère <b>${v}%</b> des PV max à chaque tour.`,
        ResistanceCrit: (v, s) => `<b>-${v}</b>% de chance d'être touché par un critique.`,
        ReductionDegatsTir: (v, s) => `Réduit de -<b>${v}%</b> les dégâts subis d'une arme de tir à une ou deux mains.`,
        SoinDirect: (v, s) => `Soigne <b>${v} PV</b>, <b>${s.usagesParCombat}</b> usages/combat (recharge ${s.cooldownTours} tours), si des PV manquent.`,
        SaignementDegats: (v, s) => `Saignement : <b>${v}</b> dégâts/stack par tour (perd 1 stack/tour).`,
        BrulureDegats: (v, s) => `Brûlure : inflige <b>${v}</b> dégâts par tour pendant <b>${s.brulureDuree}</b> tours, ignore l'armure adverse.`,
        AntiHealPourcentage: (v, s) => `Réduit les soins reçus par la cible de <b>${v}%</b> pendant <b>${s.antiHealDuree}</b> tours.`,
        ShieldMontant: (v, s) => `Accorde un bouclier de <b>${v} PV</b> en début de combat.`,
        RageBonusMax: (v, s) => `Dégâts jusqu'à <b>+${v}%</b> quand tes PV descendent vers <b>${s.rageSeuilMin}%</b>.`,
        MarqueDegatsPourcentage: (v, s) => `Marque la cible touchée : <b>+${v}%</b> dégâts reçus pendant <b>${s.marqueDuree}</b> tours.`,
        ParadeChance: (v, s) => `<b>${v}%</b> de chance d'annuler un coup reçu et de riposter immédiatement.`,
        TenaciteChance: (v, s) => `<b>${v}%</b> de chance de résister à un étourdissement.`,
        Penetration: (v, s) => `Pénétration : Ignore <b>${v}%</b> de l'armure adverse.`,
        // EXTENSION "PANOPLIE SEKIRO" (Manteau du Loup) : quand DernierSouffleFractionPv est
        // renseigné, le dernier souffle relève à une FRACTION des PV max plutôt qu'à 1 PV fixe —
        // le taux de progression par niveau (IncrementParNiveau sur DernierSouffleFractionPv, qui
        // n'a pas d'entrée dédiée dans CHAMP_PAR_STAT_PRINCIPALE puisqu'il ne s'affiche jamais
        // seul) est mentionné directement dans la phrase plutôt que via la pastille automatique.
        DernierSouffleActif: (v, s) => {
            if (s.dernierSouffleFractionPv > 0) {
                const pct = Math.round(s.dernierSouffleFractionPv * 10000) / 100;
                const tauxNiveau = (s.statPrincipale === "DernierSouffleFractionPv" && s.incrementPassif > 0)
                    ? ` (<b>+${Math.round(s.incrementPassif * 10000) / 100}%</b>/niveau)` : '';
                return `Une fois par combat, survit avec <b>${pct}%</b> de tes PV max au lieu de mourir${tauxNiveau} (au lieu d'1 PV).`;
            }
            return `Une fois par combat, survit à <b>1 PV</b> au lieu de mourir.`;
        },
        FrenesieBonusSpd: (v, s) => `Un critique accorde <b>+${v}</b> Vitesse pendant <b>${s.frenesieDuree}</b> tours.`,
        // ==========================================================
        // EXTENSION "PANOPLIE SEKIRO" (17 nouveaux objets, patch en cours) — nouveaux passifs.
        // ==========================================================
        RechargeSacrificePourcentage: (v, s) => `Tous les <b>${s.rechargeTousLesCoups}</b> coups portés, sacrifie <b>${v}%</b> de tes PV actuels pour recharger immédiatement une charge de Stratagème ou de soin actif en recharge.`,
        ReductionPvMaxPourcentage: (v, s) => {
            const contrepartie = s.autoDegatsPourcentageDesDegats > 0
                ? ` Contrepartie : tu subis <b>${s.autoDegatsPourcentageDesDegats}%</b> de tes propres dégâts infligés.`
                : '';
            return `Chaque coup porté réduit les PV MAX de la cible de <b>${v}%</b> (multiplicatif, jusqu'à -90%).${contrepartie}`;
        },
        AmplificationSoinsPourcentage: (v, s) => `Amplifie de <b>${v}%</b> les soins que tu reçois de toi-même (régénération, soin actif).`,
        EsquiveParadeBuffPourcentage: (v, s) => `Quand tu es touché : gagne <b>${v}%</b> d'esquive (ou de parade si elle est plus élevée) pendant <b>${s.esquiveParadeBuffDuree}</b> tours.`,
        BriseDefPoints: (v, s) => {
            const duree = s.briseDefDuree >= 999 ? `jusqu'à la fin du combat` : `pendant <b>${s.briseDefDuree}</b> tours`;
            return `Chaque coup porté réduit la DEF de la cible de <b>${v}</b> points, ${duree}.`;
        },
        BruleeReflectionDegats: (v, s) => `Quand tu es touché : brûle l'attaquant pour <b>${v}</b> dégâts par tour pendant <b>${s.bruleeReflectionDuree}</b> tours.`,
        AmplificationDegatsFeuPourcentage: (v, s) => `Amplifie tes dégâts de Brûlure infligés de <b>${v}%</b>.`,
        SaignementChanceParCoup: (v, s) => `Chaque projectile a <b>${v}%</b> de chance d'infliger un stack de Saignement.`,
        ParalysieChance: (v, s) => `<b>${v}%</b> de chance de paralyser la cible pendant <b>${s.paralysieDuree}</b> tour${s.paralysieDuree > 1 ? 's' : ''} (ne peut plus agir, mais peut toujours utiliser Stratagème/soin).`,
        RiposteEtourdissementTousLesCoups: (v, s) => `Tous les <b>${v}</b> coups reçus, étourdit l'attaquant à son prochain tour.`,
    };
    const CHAMP_PAR_STAT_PRINCIPALE = {
        Lifesteal: "lifesteal", PoisonDegats: "poisonDegats", EtourdissementChance: "etourdissementChance", Penetration: "penetration",
        ExecutionBonus: "executionBonus", Precision: "precision", Blocage: "blocage", Reflection: "reflection",
        ResistancePoison: "resistancePoison", ResistanceFeu: "resistanceFeu", Regeneration: "regeneration", ResistanceCrit: "resistanceCrit", ReductionDegatsTir: "reductionDegatsTir",
        SoinDirect: "soinDirect", SaignementDegats: "saignementDegats", BrulureDegats: "brulureDegats",
        AntiHealPourcentage: "antiHealPourcentage", ShieldMontant: "shieldMontant", RageBonusMax: "rageBonusMax",
        MarqueDegatsPourcentage: "marqueDegatsPourcentage", ParadeChance: "paradeChance", TenaciteChance: "tenaciteChance",
        DernierSouffleActif: "dernierSouffleActif", FrenesieBonusSpd: "frenesieBonusSpd",
        // EXTENSION "PANOPLIE SEKIRO" -- mêmes principe, nouveaux champs. DernierSouffleFractionPv
        // et AutoDegatsPourcentageDesDegats n'ont volontairement PAS d'entrée ici : ce sont des
        // champs de CONTEXTE lus depuis GABARITS_PASSIF.DernierSouffleActif/ReductionPvMaxPourcentage
        // (comme s.executionSeuil pour ExecutionBonus), jamais affichés comme leur propre ligne.
        RechargeSacrificePourcentage: "rechargeSacrificePourcentage",
        ReductionPvMaxPourcentage: "reductionPvMaxPourcentage",
        AmplificationSoinsPourcentage: "amplificationSoinsPourcentage",
        EsquiveParadeBuffPourcentage: "esquiveParadeBuffPourcentage",
        BriseDefPoints: "briseDefPoints",
        BruleeReflectionDegats: "bruleeReflectionDegats",
        AmplificationDegatsFeuPourcentage: "amplificationDegatsFeuPourcentage",
        SaignementChanceParCoup: "saignementChanceParCoup",
        ParalysieChance: "paralysieChance",
        RiposteEtourdissementTousLesCoups: "riposteEtourdissementTousLesCoups",
    };

    // ==========================================================
    // "VOIR AU NIVEAU MAX" — porte fidèlement AppliquerAmelioration (moteur-combat.cs) + son
    // plafond de niveau par rareté (NIVEAU_MAX_PAR_RARETE, ajouté le 25/09) en JS pur, en autonome
    // (le Codex ne dépend d'aucun autre script que nav.js) : même principe que le mirror JS déjà
    // embarqué dans moteur-combat.cs pour calculateur.html/simulation.html, mais recopié ici pour
    // ne pas dépendre d'un fetch supplémentaire vers formule-combat.js. ⚠️ Garder synchronisé si la
    // formule change côté moteur.
    const NIVEAU_MAX_PAR_RARETE = { commun: 25, normal: 20, rare: 15, epique: 10, legendaire: 5 };
    function niveauMaxPourRarete(rarete) {
        return NIVEAU_MAX_PAR_RARETE[rarete] !== undefined ? NIVEAU_MAX_PAR_RARETE[rarete] : NIVEAU_MAX_PAR_RARETE.commun;
    }
    // Table COMPLÈTE (distincte de CHAMP_PAR_STAT_PRINCIPALE ci-dessus, qui ne sert qu'à l'AFFICHAGE
    // des lignes de passif) : toutes les cibles possibles de StatPrincipale/PassifsExtra rencontrées
    // dans le catalogue, y compris DegatsDirects/SaignementDegats qui sont exclus de l'affichage
    // générique (déjà montrés via leur propre ligne "Dégâts"/scaling) mais doivent quand même monter
    // correctement quand on calcule la version au niveau max d'un objet.
    const CHAMP_STAT_PRINCIPALE_NIVELAGE = {
        Lifesteal: "lifesteal", PoisonDegats: "poisonDegats", Precision: "precision", CritBonus: "critBonus",
        Penetration: "penetration", EtourdissementChance: "etourdissementChance", ExecutionBonus: "executionBonus",
        Blocage: "blocage", BlocageReduction: "blocageReduction", Reflection: "reflection",
        ResistancePoison: "resistancePoison", ResistanceFeu: "resistanceFeu", Regeneration: "regeneration", ResistanceCrit: "resistanceCrit",
        ReductionDegatsTir: "reductionDegatsTir", DegatsDirects: "degatsDirects", SoinDirect: "soinDirect",
        SaignementDegats: "saignementDegats", BrulureDegats: "brulureDegats", AntiHealPourcentage: "antiHealPourcentage",
        ShieldMontant: "shieldMontant", RageBonusMax: "rageBonusMax", MarqueDegatsPourcentage: "marqueDegatsPourcentage",
        ParadeChance: "paradeChance", TenaciteChance: "tenaciteChance", DernierSouffleActif: "dernierSouffleActif",
        FrenesieBonusSpd: "frenesieBonusSpd",
        // EXTENSION "PANOPLIE SEKIRO"
        RechargeSacrificePourcentage: "rechargeSacrificePourcentage", ReductionPvMaxPourcentage: "reductionPvMaxPourcentage",
        AutoDegatsPourcentageDesDegats: "autoDegatsPourcentageDesDegats", AmplificationSoinsPourcentage: "amplificationSoinsPourcentage",
        EsquiveParadeBuffPourcentage: "esquiveParadeBuffPourcentage", BriseDefPoints: "briseDefPoints",
        DernierSouffleFractionPv: "dernierSouffleFractionPv", BruleeReflectionDegats: "bruleeReflectionDegats",
        AmplificationDegatsFeuPourcentage: "amplificationDegatsFeuPourcentage", SaignementChanceParCoup: "saignementChanceParCoup",
        RiposteEtourdissementTousLesCoups: "riposteEtourdissementTousLesCoups", ParalysieChance: "paralysieChance",
    };
    function appliquerAmelioration(original, niveau) {
        if (!original || !niveau || niveau <= 0) return original;
        niveau = Math.min(niveau, niveauMaxPourRarete(original.rarete));
        const c = { ...original };
        if (original.statsExtra) c.statsExtra = original.statsExtra.map(sl => ({ ...sl }));
        if (original.passifsExtra) c.passifsExtra = original.passifsExtra.map(p => ({ ...p }));

        if (c.stat) c.bonus = (c.bonus || 0) + niveau * (c.increment || 0);
        if (c.stat2) c.bonus2 = (c.bonus2 || 0) + niveau * (c.increment2 || 0);
        if (c.stat3) c.bonus3 = (c.bonus3 || 0) + niveau * (c.increment3 || 0);
        if (c.statsExtra) c.statsExtra.forEach(slot => { slot.bonus = (slot.bonus || 0) + niveau * (slot.increment || 0); });

        if (c.scaling1Stat && c.incrementBaseDegats) {
            c.baseDegatsMin = (c.baseDegatsMin || 0) + niveau * c.incrementBaseDegats;
            c.baseDegatsMax = (c.baseDegatsMax || 0) + niveau * c.incrementBaseDegats;
        }
        if ((c.degatsDirects || 0) > 0 && c.incrementDegatsDirects) {
            c.degatsDirects = c.degatsDirects + niveau * c.incrementDegatsDirects;
        }

        if (c.dureeStance) {
            if (c.stance2Stat) c.stance2Bonus = (c.stance2Bonus || 0) + niveau * (c.stance2IncrementBonus || 0);
            if (c.stance2Stat2) c.stance2Bonus2 = (c.stance2Bonus2 || 0) + niveau * (c.stance2IncrementBonus2 || 0);
            if (c.stance2Stat3) c.stance2Bonus3 = (c.stance2Bonus3 || 0) + niveau * (c.stance2IncrementBonus3 || 0);
            if (c.stance2Scaling1Stat && c.stance2IncrementBaseDegats) {
                c.stance2BaseDegatsMin = (c.stance2BaseDegatsMin || 0) + niveau * c.stance2IncrementBaseDegats;
                c.stance2BaseDegatsMax = (c.stance2BaseDegatsMax || 0) + niveau * c.stance2IncrementBaseDegats;
            }
        }

        if (c.statPrincipale) {
            const champ = CHAMP_STAT_PRINCIPALE_NIVELAGE[c.statPrincipale];
            if (champ) c[champ] = (c[champ] || 0) + niveau * c.incrementPassif;
        }
        if (c.passifsExtra) {
            c.passifsExtra.forEach(passif => {
                const champ = CHAMP_STAT_PRINCIPALE_NIVELAGE[passif.champ];
                if (champ) c[champ] = (c[champ] || 0) + niveau * passif.incrementPassif;
            });
        }
        return c;
    }
    // Version "niveau max" d'un objet du catalogue, PRÊTE À AFFICHER : au-delà du nivelage
    // ci-dessus, remet à zéro tous les champs "increment*" de la copie — les pastilles de
    // progression (pilluleIncrement) n'ont plus de sens une fois la valeur finale déjà atteinte,
    // et se masquent déjà automatiquement quand leur valeur est à 0 (aucune logique d'affichage
    // séparée à maintenir).
    function construireVersionNiveauMax(original) {
        const niveau = niveauMaxPourRarete(original.rarete);
        const c = appliquerAmelioration(original, niveau);
        if (c === original) return original; // niveau 0 (ne devrait pas arriver, tous les paliers sont > 0)
        c.increment = 0; c.increment2 = 0; c.increment3 = 0; c.incrementBaseDegats = 0;
        c.incrementDegatsDirects = 0; c.incrementPassif = 0;
        c.stance2IncrementBonus = 0; c.stance2IncrementBonus2 = 0; c.stance2IncrementBonus3 = 0; c.stance2IncrementBaseDegats = 0;
        if (c.statsExtra) c.statsExtra = c.statsExtra.map(sl => ({ ...sl, increment: 0 }));
        if (c.passifsExtra) c.passifsExtra = c.passifsExtra.map(p => ({ ...p, incrementPassif: 0 }));
        return c;
    }

    const iconeOuImage = (ref, classeImg) => ref.image
        ? `<img src="${ref.image}" alt="" class="${classeImg}">`
        : `<span class="${classeImg}-emoji">${ref.icone}</span>`;

    // Ces fonctions de construction de carte sont dérivées de inventaire.html — le Codex affiche
    // les valeurs à l'état de BASE (niveau 0, puisqu'il ne s'agit pas d'un inventaire personnel),
    // mais rend désormais PUBLIC le taux de progression par doublon de chaque valeur qui évolue
    // (voir pilluleIncrement/formatNombre plus haut) : dégâts de base, stats de "Bonus", et passifs
    // spéciaux pilotés par StatPrincipale. Ce taux est purement informatif ici, jamais appliqué à
    // un niveau réellement possédé — pour ça, voir calculateur.html/inventaire.html.
    // ⚠️ EXTENSION : cherche si "nomStat" est le champ ciblé par une entrée de passifsExtra (2e,
    // 3e passif...), symétrique à statPrincipale/incrementPassif ci-dessus mais répétable.
    function trouverIncrementPassifExtra(s, nomStat) {
        if (!s.passifsExtra) return 0;
        const entree = s.passifsExtra.find(p => p.champ === nomStat);
        return entree ? entree.incrementPassif : 0;
    }

    function construirePassifs(s, exclureChamp, exclusionsSupplementaires) {
        const passifs = [];
        const exclusions = new Set([exclureChamp, ...(exclusionsSupplementaires || [])]);
        for (const nomStat in CHAMP_PAR_STAT_PRINCIPALE) {
            if (exclusions.has(nomStat)) continue;
            const champ = CHAMP_PAR_STAT_PRINCIPALE[nomStat];
            const valeur = s[champ];
            const estActif = typeof valeur === 'boolean' ? valeur : valeur > 0;
            if (!estActif) continue;
            const texte = GABARITS_PASSIF[nomStat](valeur, s);
            // Ce passif est-il CELUI que fait progresser statPrincipale OU une entrée de
            // passifsExtra sur cet objet ? Si oui, rend public son taux de progression par
            // doublon dans sa propre pastille à droite plutôt que noyé dans la phrase.
            const incrementPrincipal = (s.statPrincipale === nomStat && s.incrementPassif > 0) ? s.incrementPassif : 0;
            const incrementExtra = trouverIncrementPassifExtra(s, nomStat);
            const incrementTotal = incrementPrincipal || incrementExtra;
            const pilule = incrementTotal > 0 ? pilluleIncrement(incrementTotal) : '';
            passifs.push(`<div class="passif-ligne"><span class="texte">${texte}</span>${pilule}</div>`);
        }
        return passifs;
    }

    // incrementDegats : rendue publique ici — c'est le rythme auquel la fourchette de dégâts de
    // base progresse par doublon possédé (IncrementBaseDegats côté moteur), affichée même sans
    // aucun objet en inventaire puisque le Codex décrit l'objet indépendamment de qui le possède.
    // Ne s'affiche que si un scaling est renseigné (mêmes conditions que AppliquerAmelioration).
    // Condensé sur une seule ligne : seules les stats réellement scalées apparaissent (fini la
    // grille à 5 colonnes avec des tirets pour ATK/DEF/PV/SPD/CRIT non concernées).
    // ⚠️ EXTENSION "scaling illimité" : scalingExtra est une liste de { stat, lettre }, symétrique
    // à StatsExtra/PassifsExtra plus haut. On construit d'abord la liste COMPLÈTE des scalings
    // configurés (scaling1 + scaling2 + scalingExtra) puis on boucle sur STATS_SCALABLES en
    // cherchant dans cette liste — absent/vide pour tout objet existant, comportement strictement
    // identique à avant son ajout (scaling1/scaling2 restent trouvés en priorité, même ordre).
    function blocScalingUnique(scaling1Stat, scaling1Lettre, scaling2Stat, scaling2Lettre, scalingExtra, degatsMin, degatsMax, incrementDegats) {
        const listeScalings = [
            { stat: scaling1Stat, lettre: scaling1Lettre },
            { stat: scaling2Stat, lettre: scaling2Lettre },
            ...(scalingExtra || []),
        ].filter(sc => sc.stat);
        // Grille des 5 stats scalables (une lettre ou "—" pour celles non concernées) + ligne de
        // dégâts séparée — plus lisible que la version condensée sur une seule ligne.
        const badges = STATS_SCALABLES.map(stat => {
            const trouve = listeScalings.find(sc => sc.stat === stat);
            const lettre = trouve ? trouve.lettre : null;
            const couleur = lettre ? (COULEUR_LETTRE_SCALING[lettre] || "#8d8d8d") : "#555";
            return `<div class="scaling-item"><span class="scaling-label">${LABELS_SCALING[stat]}</span><span class="scaling-lettre" style="color:${couleur}">${lettre || "—"}</span></div>`;
        }).join("");
        const pilule = scaling1Stat ? pilluleIncrement(incrementDegats) : "";
        // Tiret cadratin collé ("12–16") plutôt que " - " espacé, pour ne jamais casser au milieu
        // du nombre sur une carte étroite.
        const ligneDegats = `<div class="scaling-degats"><span class="gauche">Dégâts : <b>${Math.round(degatsMin)}–${Math.round(degatsMax)}</b></span>${pilule}</div>`;
        return `<div class="scaling-grille">${badges}</div>${ligneDegats}`;
    }

    function construireScaling(s) {
        if (!s.scaling1Stat) return null;
        return blocScalingUnique(s.scaling1Stat, s.scaling1Lettre, s.scaling2Stat, s.scaling2Lettre, s.scalingExtra, s.baseDegatsMin, s.baseDegatsMax, s.incrementBaseDegats);
    }

    // EXTENSION "PANOPLIE SEKIRO" (Arc de Genichiro) : rendu dédié pour les armes à modes de tir
    // multiples (modesTir), qui alternent à CHAQUE usage plutôt que d'être un simple passif
    // scalaire — absent/vide pour tout le reste du catalogue, donc n'affecte que cet objet.
    // Rattaché à la section Passif (piste "fila-passif") plutôt qu'à sa propre piste dédiée — un
    // mode de tir alterné est un comportement du porteur comme un autre, pas une catégorie à part,
    // et une piste réservée sur TOUTE carte pour un seul objet du catalogue (Arc de Genichiro)
    // n'avait pas de sens. Renvoie directement des .passif-ligne, concaténables avec les autres.
    function construireModesTir(modesTir) {
        if (!modesTir || modesTir.length === 0) return '';
        return modesTir.map((m, i) => {
            const details = [];
            if (m.coupsParUsage > 1) details.push(`${m.coupsParUsage} coups`);
            if (m.penetration > 0) details.push(`Pénétration ${m.penetration}%`);
            if (m.etourdissementChance > 0) details.push(`${m.etourdissementChance}% étourdissement`);
            if (m.saignementDegats > 0) details.push(`${m.saignementDegats} saignement/stack`);
            details.push(`x${m.multiplicateurDegats} dégâts`);
            return `<div class="passif-ligne"><span class="texte">Mode ${i + 1} (cycle à chaque attaque) : ${details.join(', ')}</span></div>`;
        }).join('');
    }

    function construireDetails(s, estStrategeme) {
        if (s.soinDirect > 0) {
            // SoinDirect ne progresse que via StatPrincipale (pas de champ increment dédié).
            const piluleSoin = s.statPrincipale === "SoinDirect" ? pilluleIncrement(s.incrementPassif) : "";
            const lignesStat = [{ label: "Montant soigné", valeur: s.soinDirect, pilule: piluleSoin, colorer: false }];
            if (s.usagesParCombat > 0) lignesStat.push({ label: "Utilisations", valeur: s.usagesParCombat, colorer: false });
            if (s.cooldownTours > 0) lignesStat.push({ label: "Cooldown", valeur: s.cooldownTours + " tours", colorer: false });
            return { scalingHtml: null, lignesStat, passifTexte: construirePassifs(s, "SoinDirect").join("") };
        }

        if (estStrategeme) {
            const lignesStat = [];
            if (s.degatsDirects > 0) {
                const coups = s.coupsParUsage > 1 ? ` x ${s.coupsParUsage}` : "";
                // Cas particulier : DegatsDirects peut progresser par DEUX voies indépendantes et
                // cumulables (voir duel.cs) — IncrementDegatsDirects (dédié) ET/OU StatPrincipale =
                // "DegatsDirects" (IncrementPassif). On additionne les deux s'ils coexistent.
                const tauxDegatsDirects = (s.incrementDegatsDirects || 0) + (s.statPrincipale === "DegatsDirects" ? (s.incrementPassif || 0) : 0);
                lignesStat.push({ label: "Dégâts", valeur: s.degatsDirects + coups, pilule: pilluleIncrement(tauxDegatsDirects), colorer: false });
            }
            if (s.poisonDegats > 0) {
                const pilulePoison = s.statPrincipale === "PoisonDegats" ? pilluleIncrement(s.incrementPassif) : "";
                lignesStat.push({ label: "Poison", valeur: s.poisonDegats + " stacks", pilule: pilulePoison, colorer: false });
            }
            if (s.brulureDegats > 0) {
                const piluleBrulure = s.statPrincipale === "BrulureDegats" ? pilluleIncrement(s.incrementPassif) : "";
                lignesStat.push({ label: "Brûlure", valeur: s.brulureDegats + "/tour", pilule: piluleBrulure, colorer: false });
            }
            if (s.shieldMontant > 0) {
                const piluleBouclier = s.statPrincipale === "ShieldMontant" ? pilluleIncrement(s.incrementPassif) : "";
                lignesStat.push({ label: "Bouclier", valeur: s.shieldMontant, pilule: piluleBouclier, colorer: false });
            }
            if (s.usagesParCombat > 0) lignesStat.push({ label: "Utilisations", valeur: s.usagesParCombat, colorer: false });
            if (s.cooldownTours > 0) lignesStat.push({ label: "Cooldown", valeur: s.cooldownTours + " tours", colorer: false });

            const passifs = construirePassifs(s, "DegatsDirects", ["ShieldMontant"]);
            if (s.delaiTours > 0) passifs.push(`<div class="passif-ligne"><span class="texte">Lancé immédiatement, atterrit après <b>${s.delaiTours}</b> tour${s.delaiTours > 1 ? "s" : ""}.</span></div>`);
            return { scalingHtml: null, lignesStat, passifTexte: passifs.join("") };
        }

        const lignesStat = construireLignesStatGenerique(s.stat, s.bonus, s.increment, s.stat2, s.bonus2, s.increment2, s.stat3, s.bonus3, s.increment3, s.statsExtra);
        const passifTexte = construirePassifs(s, "Bonus").join("");
        return { scalingHtml: construireScaling(s), lignesStat, passifTexte };
    }

    // colorer=true -> ligne de "Bonus" de stat (ATK/DEF/PV/SPD/LUCK/Esquive) : teintée de la
    // couleur propre à cette stat, avec un badge à bordure rouge pour les valeurs négatives — le
    // badge reste visible même en cas de daltonisme, la teinte seule ne suffirait pas. La pastille
    // de progression (si présente) est toujours casée à droite, jamais mélangée à la valeur.
    function rendreLigneStat({ label, valeur, colorer, stat, negatif, pilule }) {
        const piluleHtml = pilule || '';
        if (!colorer) return `<div class="stat-ligne"><span class="gauche"><span class="label">${label}</span><span class="valeur-neutre">${valeur}</span></span>${piluleHtml}</div>`;
        const couleur = COULEUR_STAT[stat] || 'var(--paper)';
        const classeBadge = negatif ? 'stat-valeur-badge malus' : 'stat-valeur-badge';
        return `<div class="stat-ligne"><span class="gauche"><span class="label">${label}</span><span class="${classeBadge}" style="color:${couleur}">${valeur}</span></span>${piluleHtml}</div>`;
    }

    // incrementN : rendu public ici — le taux de progression par doublon de chaque stat de bonus
    // (Increment/Increment2/Increment3 côté moteur), affiché dans sa propre pastille à droite.
    function construireLignesStatGenerique(stat, bonus, increment, stat2, bonus2, increment2, stat3, bonus3, increment3, statsExtra) {
        const lignes = [];
        const ligne = (st, b, inc) => {
            if (!st) return;
            const formatteur = (v) => (v >= 0 ? "+" : "") + v + suffixeStat(st);
            lignes.push({ label: LABELS_STAT[st] || st, valeur: formatteur(b), pilule: pilluleIncrement(inc), colorer: true, stat: st, negatif: b < 0 });
        };
        ligne(stat, bonus, increment);
        ligne(stat2, bonus2, increment2);
        ligne(stat3, bonus3, increment3);
        // ⚠️ EXTENSION : 4e stat, 5e stat... -- statsExtra absent (tous les objets existants) ne
        // change rien à l'affichage par rapport à l'ancien comportement.
        (statsExtra || []).forEach(slot => ligne(slot.nom, slot.bonus, slot.increment));
        return lignes;
    }

    // Carte dédiée aux armes à changement de stance : affiche la stance 1 par défaut, bascule
    // vers la stance 2 (image, scaling ET bonus différents) au survol — pur CSS, voir .carte-stance
    // dans le <style>. Le passif générique décrit le mécanisme lui-même, indépendant de la stance.
    function construireCarteStance(numero, item) {
        const rarete = item.rarete || 'commun';
        const imageStance1 = iconeOuImage(item, 'carte-icon');
        const imageStance2 = iconeOuImage({ image: item.stance2ImageUrl || item.image, icone: item.icone }, 'carte-icon');
        const scaling1 = blocScalingUnique(item.scaling1Stat, item.scaling1Lettre, item.scaling2Stat, item.scaling2Lettre, item.scalingExtra, item.baseDegatsMin, item.baseDegatsMax, item.incrementBaseDegats);
        const scaling2 = blocScalingUnique(item.stance2Scaling1Stat, item.stance2Scaling1Lettre, item.stance2Scaling2Stat, item.stance2Scaling2Lettre, item.stance2ScalingExtra, item.stance2BaseDegatsMin, item.stance2BaseDegatsMax, item.stance2IncrementBaseDegats);
        const stats1 = construireLignesStatGenerique(item.stat, item.bonus, item.increment, item.stat2, item.bonus2, item.increment2, item.stat3, item.bonus3, item.increment3, item.statsExtra).map(rendreLigneStat).join('');
        const stats2 = construireLignesStatGenerique(item.stance2Stat, item.stance2Bonus, item.stance2IncrementBonus, item.stance2Stat2, item.stance2Bonus2, item.stance2IncrementBonus2, item.stance2Stat3, item.stance2Bonus3, item.stance2IncrementBonus3).map(rendreLigneStat).join('');

        // Chaque piste de la sous-grille (en-tête, scaling, bonus) accueille les DEUX vues stance1/
        // stance2 superposées à la même ligne (bascule au survol déjà gérée par .stance-vue-1/2 en
        // CSS) — c'est ce qui permet à ces pistes de s'aligner avec celles des cartes classiques de
        // la même rangée, quelle que soit la vue active.
        return `
            <div class="carte ${rarete} carte-stance" data-nom="${item.nom.toLowerCase()}" data-rarete="${rarete}">
                <div class="carte-portrait">
                    <span class="carte-badge-rarete">${LABELS_RARETE[rarete] || rarete}</span>
                    <span class="carte-etat-niveau${afficherNiveauMax ? ' etat-max' : ''}">${afficherNiveauMax ? 'MAX' : 'Base'}</span>
                    <div class="stance-indicateur">⇄</div>
                    <div class="carte-icone-zone">
                        <div class="stance-vue stance-vue-1">${imageStance1}</div>
                        <div class="stance-vue stance-vue-2">${imageStance2}</div>
                    </div>
                </div>
                <div class="carte-corps">
                    <div class="carte-cabecera fila-header stance-vue stance-vue-1">${construireNomLigne(item, ' <span class="stance-etiquette">Stance 1</span>')}${construireBadgesLigne(item)}</div>
                    <div class="carte-cabecera fila-header stance-vue stance-vue-2">${construireNomLigne(item, ' <span class="stance-etiquette stance-etiquette-2">Stance 2</span>')}</div>

                    <div class="bloc-section fila-scaling stance-vue stance-vue-1">${scaling1 ? `<div class="section-titre">Scaling</div>${scaling1}` : ''}</div>
                    <div class="bloc-section fila-scaling stance-vue stance-vue-2">${scaling2 ? `<div class="section-titre">Scaling</div>${scaling2}` : ''}</div>

                    <div class="bloc-section fila-bonus stance-vue stance-vue-1">${stats1 ? `<div class="section-titre">Bonus</div>${stats1}` : ''}</div>
                    <div class="bloc-section fila-bonus stance-vue stance-vue-2">${stats2 ? `<div class="section-titre">Bonus</div>${stats2}` : ''}</div>

                    <div class="bloc-section fila-passif"><div class="section-titre">Passif</div><div class="bloc-passif">
                        Alterne de stance toutes les <b>${item.dureeStance}</b> tours du porteur. Le retour à la Stance 1 purge le poison et la brûlure sur le porteur lui-même.
                    </div></div>
                </div>
            </div>
        `;
    }

    function construireCarte(numero, item) {
        if (item.dureeStance > 0) return construireCarteStance(numero, item);

        const rarete = item.rarete || 'commun';
        const estStrategeme = item.slot === 'strategeme';
        const { scalingHtml, lignesStat, passifTexte } = construireDetails(item, estStrategeme);
        // Modes de tir fusionnés dans le passif (voir construireModesTir) — vide pour tout le
        // catalogue sauf l'Arc de Genichiro, placé avant les éventuelles autres lignes de passif.
        const passifComplet = construireModesTir(item.modesTir) + passifTexte;
        return `
            <div class="carte ${rarete}" data-nom="${item.nom.toLowerCase()}" data-rarete="${rarete}">
                <div class="carte-portrait">
                    <span class="carte-badge-rarete">${LABELS_RARETE[rarete] || rarete}</span>
                    <span class="carte-etat-niveau${afficherNiveauMax ? ' etat-max' : ''}">${afficherNiveauMax ? 'MAX' : 'Base'}</span>
                    <div class="carte-icone-zone">${iconeOuImage(item, 'carte-icon')}</div>
                </div>
                <div class="carte-corps">
                    <div class="carte-cabecera fila-header">${construireNomLigne(item)}${construireBadgesLigne(item)}</div>
                    <div class="bloc-section fila-scaling">${scalingHtml ? `<div class="section-titre">Scaling</div>${scalingHtml}` : ''}</div>
                    <div class="bloc-section fila-bonus">${lignesStat.length > 0 ? `<div class="section-titre">${estStrategeme ? 'Statistiques' : 'Bonus'}</div>${lignesStat.map(rendreLigneStat).join('')}` : ''}</div>
                    <div class="bloc-section fila-passif">${passifComplet ? `<div class="section-titre">Passif</div><div class="bloc-passif">${passifComplet}</div>` : ''}</div>
                </div>
            </div>
        `;
    }

    let STATS = {};
    let raretesDisponibles = [];
    let raretesActives = new Set();
    let texteRecherche = '';
    let afficherNiveauMax = false;

    function appliquerFiltres() {
        document.querySelectorAll('.carte').forEach(carte => {
            const correspondNom = carte.dataset.nom.includes(texteRecherche);
            const correspondRarete = raretesActives.size === 0 || raretesActives.has(carte.dataset.rarete);
            carte.style.display = (correspondNom && correspondRarete) ? '' : 'none';
        });
        document.querySelectorAll('.categorie').forEach(cat => {
            const aUneCarteVisible = Array.from(cat.querySelectorAll('.carte')).some(c => c.style.display !== 'none');
            cat.style.display = aUneCarteVisible ? '' : 'none';
        });
        const totalVisible = Array.from(document.querySelectorAll('.carte')).filter(c => c.style.display !== 'none').length;
        const totalGeneral = document.querySelectorAll('.carte').length;
        document.getElementById('compteurResultats').textContent = `${totalVisible} / ${totalGeneral} objet(s) affiché(s)`;
    }

    function construirePage() {
        const parCategorie = { weapon_1h: [], weapon_2h: [], offhand: [], torso: [], strategeme: [] };
        raretesDisponibles = [];
        for (const numero in STATS) {
            const item = afficherNiveauMax ? construireVersionNiveauMax(STATS[numero]) : STATS[numero];
            const cat = categorieAffichage(item);
            if (!parCategorie[cat]) continue;
            parCategorie[cat].push({ numero, item });
            const rarete = item.rarete || 'commun';
            if (!raretesDisponibles.includes(rarete)) raretesDisponibles.push(rarete);
        }

        const ordreRarete = ['commun', 'normal', 'rare', 'epique', 'legendaire'];
        raretesDisponibles.sort((a, b) => ordreRarete.indexOf(a) - ordreRarete.indexOf(b));

        // ⚠️ raretesActives (le filtre choisi) survit à un reconstruirePage() (ex: bascule "niveau
        // max", qui reconstruit toute la grille sans repartir de zéro) — les pastilles régénérées
        // doivent donc refléter son état ACTUEL, pas retomber sur "Toutes les raretés" par défaut.
        const filtresEl = document.getElementById('filtresRarete');
        filtresEl.innerHTML = `<div class="filtre-pilule${raretesActives.size === 0 ? ' actif' : ''}" data-rarete="tous">Toutes les raretés</div>`
            + raretesDisponibles.map(r => `<div class="filtre-pilule r-${r}${raretesActives.has(r) ? ' actif' : ''}" data-rarete="${r}">${LABELS_RARETE[r] || r}</div>`).join('');

        filtresEl.querySelectorAll('.filtre-pilule').forEach(pilule => {
            pilule.addEventListener('click', () => {
                const rarete = pilule.dataset.rarete;
                if (rarete === 'tous') {
                    raretesActives.clear();
                    filtresEl.querySelectorAll('.filtre-pilule').forEach(p => p.classList.remove('actif'));
                    pilule.classList.add('actif');
                } else {
                    filtresEl.querySelector('[data-rarete="tous"]').classList.remove('actif');
                    if (raretesActives.has(rarete)) { raretesActives.delete(rarete); pilule.classList.remove('actif'); }
                    else { raretesActives.add(rarete); pilule.classList.add('actif'); }
                    if (raretesActives.size === 0) filtresEl.querySelector('[data-rarete="tous"]').classList.add('actif');
                }
                appliquerFiltres();
            });
        });

        const conteneur = document.getElementById('grillePrincipale');
        let html = '';
        Object.keys(LABELS_CATEGORIE).forEach(cat => {
            const items = parCategorie[cat];
            if (items.length === 0) return;
            const ordreRarete = ['commun', 'normal', 'rare', 'epique', 'legendaire'];
            items.sort((a, b) => {
                const indexA = ordreRarete.indexOf(a.item.rarete || 'commun');
                const indexB = ordreRarete.indexOf(b.item.rarete || 'commun');

                if (indexA !== indexB) {
                    return indexA - indexB;
                }
                return parseInt(a.numero) - parseInt(b.numero);
            });
            html += `
                <div class="categorie">
                    <div class="categorie-titre"><h2>${LABELS_CATEGORIE[cat]}</h2><span class="compte">${items.length}</span></div>
                    <div class="grille">${items.map(({ numero, item }) => construireCarte(numero, item)).join('')}</div>
                </div>
            `;
        });
        conteneur.innerHTML = html || '<div class="vide-message">Aucun objet dans le catalogue pour le moment.</div>';
        appliquerFiltres();
    }

    document.getElementById('champRecherche').addEventListener('input', (e) => {
        texteRecherche = e.target.value.trim().toLowerCase();
        appliquerFiltres();
    });

    // "Voir au niveau max" : bascule globale, reconstruit toute la page (les objets affichés
    // viennent alors de construireVersionNiveauMax au lieu des données brutes du catalogue) — pas
    // besoin de recharger catalogue_stats.json, tout se recalcule côté client.
    document.getElementById('toggleNiveauMax').addEventListener('click', (e) => {
        afficherNiveauMax = !afficherNiveauMax;
        e.currentTarget.classList.toggle('actif', afficherNiveauMax);
        construirePage();
    });

    fetch('catalogue_stats.json?v=' + Date.now())
        .then(r => r.json())
        .then(data => {
            STATS = data;
            try {
                construirePage();
            } catch (erreur) {
                console.error('Erreur pendant la construction du codex :', erreur);
                document.getElementById('grillePrincipale').innerHTML =
                    '<div class="vide-message">catalogue_stats.json a bien été chargé, mais une erreur est survenue pendant l\'affichage : ' + erreur.message + ' (détail dans la console, F12).</div>';
            }
        })
        .catch((erreur) => {
            console.error('Erreur de chargement de catalogue_stats.json :', erreur);
            document.getElementById('grillePrincipale').innerHTML =
                '<div class="vide-message">Impossible de charger catalogue_stats.json — vérifie qu\'il est bien présent à côté de cette page.</div>';
        });
</script>
<script src="nav.js" defer></script>
</body>
</html>
